<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Viola Desmond</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>

<footer>Unquit Journeys. Prototype. Historical details drawn from the public record, the Nova Scotia court file, Carrie Best's reporting in The Clarion and the 2010 pardon documents.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "desmond", "title": "Viola Desmond", "subtitle": "November 9, 1946. New Glasgow, Nova Scotia. The morning after the Roseland.", "object": "The ticket", "sticker": "The ticket.", "footer": "Historical details drawn from the public record, the Nova Scotia court file, Carrie Best's reporting in The Clarion and the 2010 pardon documents.", "arrive": {"heading": "You are standing where Viola Desmond stood.", "paragraphs": ["Viola Desmond is thirty-two. She owns a beauty parlour on Gottingen Street in Halifax, a school that trains Black women as beauticians because no school in Nova Scotia will take them, and a line of hair products with her own name on the label. She trained in Montreal and Atlantic City because Halifax would not train her either. She is a businesswoman in a province that has never quite decided whether she is allowed to be one.", "Yesterday she was driving to Sydney on business when her car broke down in New Glasgow. The repair would take the night. To pass the evening she went to the Roseland Theatre and asked for a ticket on the main floor. The cashier sold her a balcony ticket. She did not know that in this theatre the main floor was for white patrons and the balcony for everyone else, because no sign said so. She sat downstairs. The manager told her to move. She offered to pay the difference. He refused. A policeman was called. The two men dragged her from her seat and out of the theatre, injuring her hip and knee, and she spent the night in a cell with the door open, sitting upright, wearing her white gloves.", "This morning she was charged. Not with sitting in the wrong seat, because no law in Nova Scotia says where a Black woman may sit. With defrauding the province of one cent: the difference in amusement tax between a balcony ticket and a main floor one. She had no lawyer and was not told she could have one. She was convicted and fined twenty dollars, plus six dollars in costs. She paid it. She is free to go home.", "Tonight Viola steps aside and you step in. The one-cent conviction, the bruised hip, the gloves, the business in Halifax and the husband who will tell you to let it go are hers. Every decision from here is yours. She is not asking you to become her. She is asking you to sit on a train back to Halifax with a receipt for twenty-six dollars in your handbag and a decision to make about what it was for.", "You have paid the fine. Nothing further is required of you. You could go back to the parlour on Monday and never say the word Roseland again. Most people would. No Black Nova Scotian has ever taken a case like this to a court, and there is no law on your side, because the law was careful not to exist."], "button": "Step onto the train"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The train to Halifax. Your hip aches when the carriage sways. The receipt is in your bag. You have not yet told Jack what happened.", "question": "What are you feeling right now?", "placeholder": "Write it plainly. No one else will read this.", "helper": {"who": "Carrie Best, publisher of The Clarion, who was thrown out of the same theatre five years ago", "says": "You do not have to give me a quote. Tell me what you actually feel.", "options": ["I feel humiliated in my good coat and my white gloves, and I hate that the gloves matter to me.", "I feel a cold anger that they charged me with one cent when everyone in that room knew what I was charged with.", "I feel afraid for the business. A woman with a record does not get customers in Halifax."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before you decide anything about tomorrow, take an inventory of tonight. Not of the case. Of yourself.", "question": "What have you already done, in your own life, that proves you know how to continue when the door has been closed and no rule says so?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Pearleen Oliver, of the Nova Scotia Association for the Advancement of Coloured People", "says": "I know what you carry, Viola. Halifax would not train you, so you went to Montreal and Atlantic City and came back and opened a school. You put your own name on a product and sold it. Now tell me what you carry. Finish one of these.", "options": ["A time a door was shut in my face without a sign on it and I built my own door: ", "A time I was told to accept a small injustice and found it was not small: ", "A time I did business in a place that had not decided I was allowed to: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "Tonight one sentence is trying to become true: it was one cent, and I have a business to protect. It sounds like sense. If you let it settle on this train, it becomes the story of every room you are ever asked to leave. You do not have to argue with it. You only have to refuse to decide it tonight.", "question": "What is the one reason you will not let tonight decide anything?", "placeholder": "Not a plan. One reason to wait until the light changes.", "helper": {"who": "Jack Desmond, your husband, who will meet you at the station", "says": "He is going to tell you to take it on the chin and go back to work. Do not answer him tonight. Why will you wait?", "options": ["Because a decision made with a bruised hip on a moving train is the theatre deciding, not me.", "Because they wrote one cent on the charge sheet so that no one would ever have to write the real word. I want to know what happens if someone writes it.", "Because I have never once been asked to be quiet about a thing that was fair."]}}, {"n": 4, "name": "One step", "prompt": "Monday morning in Halifax. The parlour opens at nine. The bruise has gone yellow. You need one step. Not a legal strategy. One step small enough that you cannot fail it today.", "question": "What is it?", "placeholder": "Something you can finish before the first customer.", "helper": {"who": "Carrie Best", "says": "Whatever you do first, this province will do next. What will you do first?", "options": ["I will see a doctor about the hip and have him write down what he sees. If this goes anywhere, the injury will need a witness who is not me.", "I will go to Carrie Best and tell her the whole thing, plainly, for the front page. If the province will not name what happened, the paper can.", "I will find a lawyer and ask one question: is there any court in Nova Scotia that will hear this?"]}}, {"n": 5, "name": "What you feel now", "prompt": "You did it. The doctor's note is written, or the story is in the paper, or a lawyer has your file. Nothing about your situation has changed. The conviction stands. The theatre is still seating people by colour.", "question": "What has changed in you?", "placeholder": "Compare it to the train.", "helper": {"who": "Pearleen Oliver", "says": "I heard what you did this morning. Do you want to know what I see?", "options": ["The humiliation is still here, but it has become a record. A record can be answered.", "I have stopped asking whether I will win. I am asking whether it will be written down.", "I am still afraid for the business. I find the fear is smaller than the receipt."]}}, {"n": 6, "name": "Time passes", "montage": ["The Clarion puts the story on its front page. The Black communities of Nova Scotia raise money for a lawyer. You hire Frederick Bishop, a white lawyer in Halifax, and you go to court, the first Black Nova Scotian woman to challenge segregation before a judge.", "The case is lost. Twice. The magistrate's conviction is upheld because the appeal was filed on the wrong grounds and a few days late. One judge writes that the case looks like a surreptitious attempt to enforce a Jim Crow rule by misuse of a tax statute, and rules against you anyway, on procedure. The conviction stands.", "The marriage does not survive the case. You close the parlour and the school, move to Montreal, then to New York, where you work as an agent for entertainers. On February 7, 1965, you die there of a stomach haemorrhage, aged fifty. You are buried in Halifax.", "April 15, 2010. Sixty-four years after the Roseland, the Lieutenant Governor of Nova Scotia, Mayann Francis, herself a Black woman, grants you a free pardon, the first posthumous pardon in Canadian history. A free pardon means the conviction should never have happened. The premier apologises to your sister Wanda, who is in the room.", "2018. Your face is on the Canadian ten-dollar bill, the first Canadian woman on a banknote who is not a queen. A ferry in Halifax harbour carries your name. So does a stamp, and a star on the Canada Walk of Fame."], "question": "The evidence arrived sixty-four years late, on a banknote. Here is the question the pardon cannot answer. On which day was the unquitter made?", "choices": [{"label": "April 15, 2010. The day of the free pardon.", "short": "the day of the free pardon", "reply": "Look again. The pardon was the province catching up, sixty-four years late. It answered a decision made in November 1946, on a train, with a receipt in a handbag and no law in sight. Recognition does not make an unquitter. It finds one."}, {"label": "November 8, 1946. The night you would not move from your seat.", "short": "the night you would not move from your seat", "reply": "A brave night, and the one the history books show. But a refusal in a moment is not the decision. The decision came the next morning, after you had paid the fine and were free to go home and be quiet."}, {"label": "The Monday morning you went to the doctor, the paper and the lawyer instead of back to work.", "short": "the Monday morning you did not go quietly back to work", "reply": "Yes. There was no pardon, no banknote, no precedent. There was a twenty-six dollar receipt, a bruised hip, a business at risk and a husband saying let it go. Unquitters are not made when the province apologises. They are made the Monday after. Tonight, on the same train, you made yours."}, {"label": "The year Halifax would not train you and you went to Montreal and Atlantic City instead.", "short": "the year you went to Montreal and Atlantic City", "reply": "Even earlier. Which means Viola Desmond was already an unquitter before the Roseland. The theatre did not make her one. It found one. That is what your own evidence in step two was for. It was there before tonight."}]}, {"n": 7, "name": "Lock it in", "prompt": "You will be asked to go quietly again. Different theatre. Write one sentence you want to be able to read on that day. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Carrie Best", "says": "I will print whatever you give me. What is the line?", "options": ["I did not go quietly back to work on the Monday.", "I did make them write down what happened, even when the court would not read it.", "I did fight a case I could not win so that the next one could be won."]}, "ice": {"question": "One more line, and this one is yours. Where is the one-cent charge in your own life right now?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, on Viola Desmond's train", "sub": "Your decisions, beside hers", "stepOverlap": ["She made the same choice. She saw a doctor in Halifax for the injuries to her hip and knee, and the medical account became part of the record.", "She made the same choice. Carrie Best put the story on the front page of The Clarion, and the case was funded by Black communities across the province.", "She made the same choice. She retained Frederick Bishop and took the case to the Nova Scotia Supreme Court. It was lost on procedure, and it was written down."], "stepOverlapFree": "Her first step was different. She saw a doctor, told the story to The Clarion, and took the case to court, and lost, and the record remained. A different choice on the same train is still a choice made.", "help": {"zero": "You did not ask for help on this journey. Viola did. A publisher, a minister's wife, a lawyer, and communities who raised the money. Next time, try the door. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You asked for help {n} on this journey. Viola had a publisher, a minister's wife, a lawyer, and communities who raised the money. Asking is not the opposite of continuing. It is how continuing is done."}, "closing": "The theatre is gone. The face is on the money. What you carry off the train is not the pardon and it is not Viola. It is the evidence that you did not go quietly back to work on the Monday.", "paragraphs": ["November 9, 1946. A train to Halifax, a receipt in your handbag for twenty-six dollars. You stood where Viola Desmond sat, and the morning after asked you what it asked her. With your hip aching, you wrote: {1} Her own account, given later to the paper, is factual and unhurried. What was said, what was done, and by whom.", "Before you decided anything, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Hers was a beauty school she built because no school in the province would train her.", "You refused to let the first night decide. Your reason: {3} That refusal has a name in the Unquit vocabulary. The deferral. Not tonight. Monday's light will be different.", "Your first step: {4} {overlap}", "After the step, nothing outside had changed. Inside, you noticed this: {5}", "Then time did what time does. A front page. A court case lost on procedure. A marriage ended, a city left, a death at fifty. And in 2010, a free pardon, and in 2018, a face on a banknote.", "Asked on which day the unquitter was made, you chose {choice}. {reply}", "{help}"], "lockLabel": "The evidence you are taking with you", "iceLine": "And the one-cent charge in your own life, as you named it tonight: {ice}", "stickerLines": ["Walked with Viola Desmond.", "November 1946."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The ticket\"><g transform=\"rotate(-12 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M70,150 L330,150 L330,178 a14,14 0 0 0 0,28 L330,250 L70,250 L70,206 a14,14 0 0 0 0,-28 Z\" stroke-width=\"3.5\"/><path d=\"M250,150 L250,250\" stroke-width=\"1.8\" stroke-dasharray=\"5 6\"/><path d=\"M100,186 L216,186 M100,206 L190,206 M100,226 L216,226\" stroke-width=\"1.6\"/><circle cx=\"290\" cy=\"200\" r=\"16\" stroke-width=\"2\"/><path d=\"M290,192 L290,208\" stroke-width=\"2\"/></g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
    '1':{text:A[1],red:true},'2':{text:A[2],red:true},'3':{text:A[3],red:true},'4':{text:A[4],red:true},'5':{text:A[5],red:true},
    overlap:{text:overlap}, choice:{text:c.short,red:true}, reply:{text:c.reply}, help:{text:help}, ice:{text:state.ice,red:true},
    '1b':{text:A['1b'],red:true},'2b':{text:A['2b'],red:true},'3b':{text:A['3b'],red:true},'4b':{text:A['4b'],red:true},'5b':{text:A['5b'],red:true}
  };
  try{ const key='unquit-ledger'; const cur=JSON.parse(localStorage.getItem(key)||'[]'); cur.push({slug:D.slug,title:D.title,object:D.sticker,lock:A[7]+(A['7b']?('  /  '+A['7b']):''),ice:state.ice||'',day:c.short,date:new Date().toISOString().slice(0,10)}); localStorage.setItem(key,JSON.stringify(cur)); }catch(e){}
  const wrap = el('div',{class:'story'});
  wrap.append(el('h1',{text:S.heading}), el('p',{class:'sub',text:S.sub}));
  S.paragraphs.forEach(t=>wrap.append(render(t,vars)));
  wrap.append(el('p',{class:'stepname',text:S.lockLabel}));
  wrap.append(el('div',{class:'lock you',text:A[7]}));
  if(D.two && A['7b']) wrap.append(el('div',{class:'lock you',style:'margin-top:-20px',text:A['7b']}));
  if(state.ice) wrap.append(render(S.iceLine,vars));
  wrap.append(el('p',{text:S.closing}));
  if(S.personalNote){ wrap.append(el('div',{class:'note'}, el('p',{class:'from',text:S.personalNote.from}), el('p',{text:S.personalNote.text}))); }
  const art = el('div',{html:D.stickerSvg||''}); const st = el('div',{class:'sticker'}, art, el('div',{class:'big',text:D.sticker}), el('div',{class:'small',html:S.stickerLines.join('<br>')}));
  wrap.append(st);
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:'Print or save',onclick:()=>window.print()}), el('button',{class:'link',text:'Walk it again',onclick:()=>{Object.assign(state,{answers:{},help:{},day:null,ice:'',stepMode:{}}); arrive();}}), el('a',{class:'link',href:'../ledger.html',text:'Your evidence',style:'font-size:17px'}), el('a',{class:'link',href:'../index.html',text:'All journeys',style:'font-size:17px'})));
  show(wrap);
}
arrive();
</script>
