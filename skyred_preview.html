<!DOCTYPE html>
<html lang="en">
<head>

<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>

const D = {"series": "Unquit Journeys", "slug": "skyred", "title": "Arjun Sen, the red sky", "subtitle": "Kolkata. A boy of about ten. The afternoon at the art school.", "object": "The brush", "sticker": "The sky, red.", "footer": "Unquit Journeys. Prototype. From the life of Arjun Sen, drawn from the Arjun Sen Story Library. Some childhood details are given approximately and are flagged in the script.", "arrive": {"heading": "You are standing where Arjun Sen stood.", "paragraphs": ["You are about ten years old. Your grandmother, the one who named you Arjun after the archer on the Kurukshetra field, the one who paused in the middle of the war to ask a question, has brought you to an art school in Kolkata. She believes there is something in you worth a teacher's time. She has spent money she counts carefully to be here.", "The teacher has asked each child to paint something, to place them, to see what is there. You painted the sky red. Triangular mountains underneath it. A sunset. You did not paint the sky the colour the sky is supposed to be. You painted it the colour it felt like. You were pleased with it.", "Your grandmother has come to collect you. The teacher is speaking to her now, a few feet away, in the voice adults use when they think a child is not listening. He is telling her she is wasting her money. That there is no art in this child.", "Here is the thing you cannot see yet, standing in this room at ten. The crack was already there before he spoke. A quiet doubt about whether you were allowed to make things, whether what you saw counted, whether the red sky was a mistake or a gift. His sentence did not make the crack. It gave it a name. And a named crack is one you can live inside for a very long time.", "Tonight Arjun steps aside and you step in. The red sky, the grandmother who believed, the teacher's sentence and the crack it just named are his. Every decision from here is yours. He is not asking you to become him. He is asking you to stand in an art room at ten years old and decide what you will do with a name a stranger has just handed you."], "button": "Step into the room"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The teacher is still talking to your grandmother. You heard the words. No art in this child. You are holding the painting of the red sky. It was good a minute ago. It is still the same painting.", "question": "What are you feeling right now?", "placeholder": "Write it plainly. No one else will read this.", "helper": {"who": "Your grandmother, who named you for the one who asks", "says": "You do not have to be brave for me. Tell me what you feel.", "options": ["I feel a door closing that I did not know was open until it closed.", "I feel that he has said out loud a thing I was already afraid of, and now it is true because someone else said it.", "I feel the red sky becoming a mistake in front of my eyes, when a minute ago it was mine."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before you decide anything about this sentence, take an inventory of what is in your hands. Not of the teacher's opinion. Of yourself.", "question": "What have you already done, in your own life, that proves you already make things, whatever anyone calls it?", "placeholder": "One thing you made. Not one thing you were taught.", "helper": {"who": "Your grandmother", "says": "He measured your skill in one afternoon. I have watched you longer. You did not paint the sky the colour of the sky. You painted it the colour you felt. That is not nothing. That is the whole thing. Now tell me what you carry. Finish one of these.", "options": ["A time I made something the way it felt, not the way it was supposed to be: ", "A time I saw a thing differently from everyone in the room, and I was not wrong, only early: ", "A time I expressed something before anyone taught me how: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "Right now one sentence is trying to become true, and become permanent: there is no art in me. It will not announce itself. It will just quietly settle, and you will stop painting, and nobody will mark the day, because a quit like this has no event. It feels like nothing. That is exactly why it is dangerous.", "question": "What is the one reason you will not let this afternoon decide who you are?", "placeholder": "Not a plan. One reason not to hand him the last word.", "helper": {"who": "Oni, your younger brother, who has seen everything you make", "says": "Do not decide today that you cannot draw. He said it. That does not make it yours. Why will you wait?", "options": ["Because a crack that gets named in one afternoon does not have to become the shape of my whole life.", "Because he saw one painting. My grandmother has seen all of them.", "Because the quietest quits are the ones that feel free of consequence, and I do not trust a thing that costs nothing to give up."]}}, {"n": 4, "name": "One step", "prompt": "You need one step. Not a decision about whether you are an artist. Not lessons. One step small enough that you cannot fail it, and that keeps the red sky yours.", "question": "What is it?", "placeholder": "Something you can do before you leave the room.", "helper": {"who": "Your grandmother", "says": "Whatever you do first will tell you what you have decided. What will you do first?", "options": ["I will keep the painting. Not hide it, not tear it. Fold it and take it home, so the red sky leaves the room with me and not with him.", "I will tell my grandmother, out loud, that I like it, before his words become the only words in the room.", "I will decide that I do not need his permission to make the next one. He can keep his sentence. I will keep the brush."]}}, {"n": 5, "name": "What you feel now", "prompt": "You did it. The painting is folded in your hand, or the words are said, or the decision is made. Nothing about the room has changed. The teacher still thinks what he thinks. You are still ten. The crack is still there.", "question": "What has changed in you?", "placeholder": "Compare it to the first minute.", "helper": {"who": "Oni", "says": "I watched you decide something just now. Do you want to know what I saw?", "options": ["The crack is still there. But I have not let him carve his sentence into it. That is different.", "I have stopped waiting for him to be wrong. I am walking out with the red sky either way.", "I am not sure I believe I can draw. But I have decided not to let his one afternoon be the proof that I cannot."]}}, {"n": 6, "name": "Time passes", "montage": ["You stop painting. Not that day, not with a decision, just slowly, the way a light dims without anyone flipping a switch. In art classes at school you draw only stick figures. It feels like nothing. It costs nothing, you think. Thirty years pass this way, uneventful.", "But the crack was never only about art. A hairline crack in a foundation is not felt in the room where it started. It is felt in every room. Quietly, for thirty years, some part of you defers to other people's taste, hesitates before making the thing only you can see, assumes certain gifts simply were not given to you. You cannot trace any of it back to a red sky. That is what a named crack does. It goes underground and touches everything.", "Then your younger brother, Oni, who has watched you your whole life, does the one thing that repairs it. He does not send you to lessons. He does not teach you technique. He believes you can draw, plainly, without doubt, and he makes you pick up a brush and look at what comes out. Evidence, not instruction. Look. You already do this. It was never gone.", "You borrow his belief. A little cautiously at first, on loan, not yet trusting it. You paint the sky red again. And then there is no stopping you. You do not take a single art lesson. You simply let yourself express again, the thing the crack had stood in the way of all along.", "The repair, like the crack, shows up everywhere. When your book was published you took it back to that same art school, meaning to confront the teacher, and realized as you walked in that it was not even the same man. You handed him the book. He looked at it and said one word. Wow. He did not remember you at all. And you understood that the sentence had only ever held the power you handed it."], "question": "The crack is repaired, and the repair reached your whole life. Here is the question the thirty years cannot answer. On which day was the unquitter made?", "choices": [{"label": "The day you took the book back to the school.", "short": "the day you took the book back", "reply": "Look again. That day was the evidence arriving, thirty years late. You walked in to confront a sentence and found it had never had any author but you. Returning was the proof of a repair already made, not the making of it."}, {"label": "The day Oni made you pick up the brush and paint the sky red again.", "short": "the day Oni made you paint again", "reply": "Close, and it is the day the repair began. But Oni handing you the belief was not yet the decision. The decision was yours: whether to borrow the belief he offered, cautiously, and let it catch."}, {"label": "The afternoon at ten, when you decided not to let his one sentence be the proof that you could not.", "short": "the afternoon you kept the red sky", "reply": "Yes. There was no book yet, no thirty years, no repair. There was a room, a stranger's sentence, and a crack it had just named. The unquitter was made the moment you refused to hand him the last word, even though the crack stayed and the light still dimmed. The repair, decades later, only found what you protected here. Tonight, in the same room, you made that choice."}, {"label": "The moment you borrowed Oni's belief, a little cautiously, and then could not be stopped.", "short": "the moment you borrowed the belief", "reply": "That is where the repair became unstoppable. But borrowing a belief is only possible if there is still something in you to lend it to. What you kept at ten is what made the borrowing possible thirty years later. The unquitter was made first, in the room, and found again on the brush."}]}, {"n": 7, "name": "Lock it in", "prompt": "Somewhere a quiet quit is trying to name a crack in you, and to do it without an event, so you never mark the cost. Write one sentence you want to be able to read on that day. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Oni", "says": "I always knew you could. I just held it until you could borrow it. What should the line say?", "options": ["I did keep the red sky when a stranger tried to make it a mistake.", "I did borrow the belief someone offered me, cautiously, until it became my own and could not be stopped.", "I did learn that the quiet quits, the ones with no event, are the ones that crack the foundation, so I stopped calling them free."]}, "ice": {"question": "One more line, and this one is yours. Where is the quiet crack in your own life right now, the one that feels like it costs nothing?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in Arjun Sen's art room", "sub": "Your decisions, beside his", "stepOverlap": ["He made the same choice, in the end. He kept the red sky, though it took him thirty years to unfold it. The painting outlasted the sentence.", "He made a choice in the same spirit. When his brother told him plainly that he could draw, he let himself say what he had always felt, that the way he saw was worth something.", "He made the same choice. He kept the brush, though he set it down for a long time. He never needed the teacher's permission to pick it up again."], "stepOverlapFree": "His first step was different. He set the brush down for thirty years, and then a younger brother's belief let him pick it up. A different choice in the same room is still a choice made.", "help": {"zero": "You did not ask for help on this journey. Arjun did, though it took thirty years. His brother Oni held a belief steady until Arjun could borrow it. That is what the door is for. Next time, try it sooner. Borrowing someone's belief is not weakness. It is how a crack gets repaired.", "some": "You asked for help {n} on this journey. Arjun's help was his brother Oni, who held a belief steady until Arjun could borrow it. Borrowing someone's belief is not weakness. It is how a crack gets repaired."}, "closing": "The red sky is still red. The crack is repaired, and the repair reached every room. What you carry out of the art room is not the teacher's sentence and it is not Arjun. It is the evidence that a quiet quit is never free, and that a borrowed belief can close a crack thirty years wide.", "paragraphs": ["Kolkata. An art room. A boy of about ten holding a painting of a red sky. You stood where Arjun Sen stood, and the teacher's sentence asked you what it asked him. With the painting still in your hand, you wrote: {1} His own telling is plain about it: the crack was there before the words. The words only gave it a name.", "Before you decided anything, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was a sky painted the colour it felt rather than the colour it was, made by a child before anyone taught him how.", "You refused to let the afternoon decide. Your reason: {3} That refusal has a name in the Unquit vocabulary. The deferral. Not today. A stranger's one afternoon does not get to be the proof.", "Your first step: {4} {overlap}", "After the step, nothing outside had changed. Inside, you noticed this: {5}", "Then time did what time does. Thirty quiet years with the brush set down, a crack that touched every room without ever announcing itself, and a younger brother named Oni who believed, plainly, until the belief could be borrowed. Arjun borrowed it, cautiously, and then could not be stopped. The teacher, met again decades later, said only wow, and did not remember him at all.", "Asked on which day the unquitter was made, you chose {choice}. {reply}", "{help}"], "lockLabel": "The evidence you are taking with you", "iceLine": "And the quiet crack in your own life, as you named it tonight: {ice}", "stickerLines": ["Walked with Arjun Sen.", "The red sky."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The brush and the red sky\"><g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M96,300 L200,150 L248,220 L300,120 L352,300 Z\" stroke-width=\"3\"/><circle cx=\"300\" cy=\"96\" r=\"26\" stroke-width=\"3\"/><path d=\"M300,54 L300,40 M300,152 L300,138 M342,96 L356,96 M244,96 L258,96 M330,66 L340,56 M270,126 L260,136 M330,126 L340,136 M270,66 L260,56\" stroke-width=\"2\"/></g><g transform=\"rotate(38 200 260)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M195,120 L195,300 M205,120 L205,300\" stroke-width=\"3\"/><path d=\"M195,120 Q200,112 205,120\" stroke-width=\"3\"/><path d=\"M188,300 L212,300 L212,332 L188,332 Z\" stroke-width=\"3\"/><path d=\"M188,332 Q186,384 200,404 Q214,384 212,332\" stroke-width=\"3\"/><path d=\"M194,340 L192,388 M200,342 L200,394 M206,340 L208,388\" stroke-width=\"1.4\"/></g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });

    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });

}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
    '1':{text:A[1],red:true},'2':{text:A[2],red:true},'3':{text:A[3],red:true},'4':{text:A[4],red:true},'5':{text:A[5],red:true},
    overlap:{text:overlap}, choice:{text:c.short,red:true}, reply:{text:c.reply}, help:{text:help}, ice:{text:state.ice,red:true},
    '1b':{text:A['1b'],red:true},'2b':{text:A['2b'],red:true},'3b':{text:A['3b'],red:true},'4b':{text:A['4b'],red:true},'5b':{text:A['5b'],red:true}
  };
  try{ const key='unquit-ledger'; const cur=JSON.parse(localStorage.getItem(key)||'[]'); cur.push({slug:D.slug,title:D.title,object:D.sticker,lock:A[7]+(A['7b']?('  /  '+A['7b']):''),ice:state.ice||'',day:c.short,date:new Date().toISOString().slice(0,10)}); localStorage.setItem(key,JSON.stringify(cur)); }catch(e){}
  const wrap = el('div',{class:'story'});
  wrap.append(el('h1',{text:S.heading}), el('p',{class:'sub',text:S.sub}));
  S.paragraphs.forEach(t=>wrap.append(render(t,vars)));
  wrap.append(el('p',{class:'stepname',text:S.lockLabel}));
  wrap.append(el('div',{class:'lock you',text:A[7]}));
  if(D.two && A['7b']) wrap.append(el('div',{class:'lock you',style:'margin-top:-20px',text:A['7b']}));
  if(state.ice) wrap.append(render(S.iceLine,vars));
  wrap.append(el('p',{text:S.closing}));
  if(S.personalNote){ wrap.append(el('div',{class:'note'}, el('p',{class:'from',text:S.personalNote.from}), el('p',{text:S.personalNote.text}))); }
  const art = el('div',{html:D.stickerSvg||''}); const st = el('div',{class:'sticker'}, art, el('div',{class:'big',text:D.sticker}), el('div',{class:'small',html:S.stickerLines.join('<br>')}));
  wrap.append(st);
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:'Print or save',onclick:()=>window.print()}), el('button',{class:'link',text:'Walk it again',onclick:()=>{Object.assign(state,{answers:{},help:{},day:null,ice:'',stepMode:{}}); arrive();}}), el('a',{class:'link',href:'../ledger.html',text:'Your evidence',style:'font-size:17px'}), el('a',{class:'link',href:'../index.html',text:'All journeys',style:'font-size:17px'})));
  show(wrap);
}
arrive();
</script>
