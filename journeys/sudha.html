<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Sudha Murty, the postcard</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from Sudha Murty's own telling, paraphrased, and from the India list. Consent track: launch requires her written consent and her reading of this script.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "sudha", "title": "Sudha Murty, the postcard", "subtitle": "A hostel notice board in Bangalore. 1974. A job notice that says men only.", "object": "The postcard", "sticker": "The postcard.", "footer": "Drawn from Sudha Murty's own telling, paraphrased, and from the India list. Consent track: launch requires her written consent and her reading of this script.", "arrive": {"heading": "You are standing where a young engineer stood in front of a notice board.", "paragraphs": ["She is the only woman in her engineering class and finished first in her state. She has a master's degree in computer science and a job offer from a good company. On the hostel notice board is another one: the country's largest automobile company is hiring young engineers. At the bottom, in small type: lady candidates need not apply.", "She has not planned to apply. The line has made her angry in a way that surprises her. It is 1974. The man who runs the company's parent group is one of the most respected men in the country, and no one writes to him about hostel notice boards.", "She has a postcard.", "Now Sudha steps aside and you step in. The notice, the small type, the good offer already in hand and the blank postcard are hers. Whether it gets written is yours."], "button": "Stand at the notice board"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The notice is at eye level. The line is at the bottom. The postcard is in your bag because you always carry one.", "question": "What are you feeling right now?", "placeholder": "Say it as a twenty-three-year-old in a hostel corridor, not as a chairperson.", "helper": {"who": "Your hostel roommate, who has read the notice too", "says": "You have a job already. This is not about the job. Before you tell me what you are going to do, tell me what you feel.", "options": ["I feel that I came first in the state and a line of small type has told me I am not a candidate for anything.", "I feel angry, and I am not usually angry, and I am interested in why this one did it.", "I feel that no one writes to that man about a notice board, and that this is exactly why someone should."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the postcard, take an inventory. Not of the notice, and not of Sudha. Of yourself.", "question": "What have you already done, in your own life, that proves you can walk into a room that was not built for you?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Your roommate", "says": "I can tell you what the woman in front of that board carries. The only woman in her class and first in the state. A master's degree in a field that barely exists here yet. A postcard in her bag at all times, which is a fact about a person who intends to say things. Now you tell me what you carry. Finish one of these.", "options": ["A time I walked into a room that was not built for me: ", "A time I wrote to someone no one writes to: ", "A time a line of small type made me angry enough to act: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the corridor is: it is a notice, it is 1974, and I have a job anyway, so let it go. It sounds like sense. It is the small type asking to be left alone. You do not have to change a company today. You only have to refuse to let the line decide that it is not worth a postcard.", "question": "What is the one reason you will not let it go?", "placeholder": "Not a campaign. One reason the small type does not get the vote.", "helper": {"who": "Your roommate", "says": "You have every reason to let it go. Tell me the one reason you will not.", "options": ["Because the line is not about me. I have a job. It is about every woman who will read this board after me and not have one.", "Because a postcard costs almost nothing, and the man it is addressed to is known for reading his mail.", "Because I am angry and the anger is correct, and correct anger left in a corridor goes to waste."]}}, {"n": 4, "name": "One step", "prompt": "Not a company changed. Not a career. One step, small enough to finish before the post office closes.", "question": "What is it?", "placeholder": "Something you can do with a postcard and a stamp.", "helper": {"who": "Your roommate", "says": "You have a postcard. What is the smallest thing you can write on it?", "options": ["I will write to the chairman of the group, plainly: your company says it stands for progress and its notice says lady candidates need not apply. Which is true?", "I will write three lines. Who I am. What the notice says. That I am asking him, not the personnel department.", "I will write it and post it today, before I read it twice and decide it is not my place."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The postcard is in the box. The notice is still on the board. The good job offer is still in your hand.", "question": "What has changed in you?", "placeholder": "Compare it to the corridor.", "helper": {"who": "Your roommate", "says": "The notice is still up. What changed?", "options": ["The postcard is gone. Whatever he does, the line has been answered once.", "I asked the man at the top instead of the department that wrote the line. That is the whole of it. Go to where the decision is.", "I have not let go of a thing that everyone told me to let go of, and I feel better than I have all week."]}}, {"n": 6, "name": "Time passes", "montage": ["The postcard reaches the chairman. The company calls her for an interview. She is asked, in the interview, why a woman would want to work on a factory floor, and she answers. She becomes the first woman engineer hired on the shop floor of the company, in Pune.", "She later leaves to build, with her husband, the family and the philanthropy that make her one of the most recognized women in the country. The chairman who read the postcard becomes a friend. She tells the story in every version of her life, and always begins with the notice board.", "The postcard did not change a country. It changed one notice. Then the notice changed the company, and the company was the country's largest."], "question": "A line of small type and a postcard. Here is the question the career cannot answer for you: what did the postcard do?", "choices": [{"label": "Got her a job.", "short": "got her a job", "reply": "It did, and she already had one. The job was never what the postcard was for."}, {"label": "Changed a company's hiring.", "short": "changed a company's hiring", "reply": "It did that too, eventually, and the company was the largest in the country. But the postcard did not argue policy. It asked a question."}, {"label": "Took correct anger out of a corridor and put it where the decision was.", "short": "took correct anger out of a corridor and put it where the decision was", "reply": "Yes. Everyone told her to let it go, and letting it go was reasonable, and she had a job. She wrote to the man at the top instead of the department that wrote the line, on a postcard, for almost nothing, before she could read it twice. Arrival, in this series, sometimes costs one stamp. It always costs not letting go of the thing everyone said to let go of."}, {"label": "Nothing. He would have changed the policy anyway.", "short": "nothing, he would have changed the policy anyway", "reply": "He read the postcard. That is documented. Whether he would have noticed a hostel notice board in Bangalore without it is not."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another line of small type. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Your roommate", "says": "One line for the next notice board. Start with I did.", "options": ["I did write to the person the decision belonged to.", "I did not let go of the thing everyone said to let go of.", "I did post it before I could read it twice."]}, "ice": {"question": "One more line, and this one is yours. What line of small type have you let go of, and where is the postcard?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, at the notice board", "sub": "Your postcard, beside hers", "paragraphs": ["A hostel corridor in Bangalore, 1974, a notice with a line at the bottom. You stood where Sudha Murty stood, with a good job already in hand and a postcard in your bag, and the corridor asked you what it asked her. You wrote: {1}", "Before the postcard, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Hers was first in the state, the only woman in the room, and a postcard carried at all times.", "You refused to let the small type decide it was not worth a stamp. Your reason: {3} That refusal is the deferral. Not today. Not on the notice's terms.", "Your first step: {4} {overlap}", "After the step, the notice was still on the board. Inside, you noticed this: {5}", "Then the post did what the post does when the right person reads it. An interview, a question about factory floors answered, a first, and a friendship with the man who read the card.", "Asked what the postcard did, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["This is close to what she wrote, by her own telling.", "Three lines to the top, not the department, is the whole method. A different first step in the same place is still a first step.", "She posted it the same day, she says. A different first step in the same place is still a first step."], "stepOverlapFree": "Her first step was a postcard to the chairman. A different first step in the same place is still a first step.", "help": {"zero": "You did not turn to your roommate. Sudha has never named one, and the postcard was hers alone. But someone was in that corridor. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to your roommate {n} on this journey. Corridors are where most postcards get talked out of. This one was not. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the line of small type in your own life, as you named it: {ice}", "closing": "The notice board is gone and the company hires women on every floor. What you carry out of the corridor is not a career, and it is not Sudha. It is the evidence that you know where the decision lives and own a stamp.", "stickerLines": ["Walked with Sudha Murty.", "A hostel corridor, Bangalore, 1974."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The postcard\">\n<g transform=\"rotate(-6 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M70,130 L330,130 L330,270 L70,270 Z\" stroke-width=\"4\"/><path d=\"M200,150 L200,250\" stroke-width=\"2\"/><path d=\"M90,160 L180,160 M90,184 L170,184 M90,208 L180,208 M90,232 L150,232\" stroke-width=\"1.6\"/><path d=\"M220,200 L310,200 M220,224 L290,224 M220,248 L310,248\" stroke-width=\"1.4\"/><path d=\"M276,148 L312,148 L312,178 L276,178 Z\" stroke-width=\"1.6\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
    '1':{text:A[1],red:true},'2':{text:A[2],red:true},'3':{text:A[3],red:true},'4':{text:A[4],red:true},'5':{text:A[5],red:true},
    overlap:{text:overlap}, choice:{text:c.short,red:true}, reply:{text:c.reply}, help:{text:help}, ice:{text:state.ice,red:true},
