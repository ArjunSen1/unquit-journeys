<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Harriet Tubman, Philadelphia</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from the documented record, including her own words as recorded by Sarah Bradford, paraphrased, and from Unquit: The Oldest Choice. The number of her return trips is disputed; the journey says so.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "tubman", "title": "Harriet Tubman, Philadelphia", "subtitle": "A boarding house kitchen. December 1850. Free for fourteen months.", "object": "The lantern", "sticker": "The lantern.", "footer": "Drawn from the documented record, including her own words as recorded by Sarah Bradford, paraphrased, and from Unquit: The Oldest Choice. The number of her return trips is disputed; the journey says so.", "arrive": {"heading": "You are standing where Harriet Tubman stood.", "paragraphs": ["In September 1849 she walked out of Dorchester County, Maryland, at night, alone. Her brothers had started with her and turned back. She did not. Ninety miles by the North Star, house to house, to the Pennsylvania line. She said later that when she crossed it she looked at her hands to see if she was the same person, and that the sun came through the trees like gold, and she felt she was in heaven.", "Then she said something else. She was a stranger in a strange land. Her home, after all, was down in Maryland, because her father and mother and brothers and sisters were there. She was free, and they were not.", "She has been free for fourteen months. She cooks and cleans in Philadelphia for wages, the first wages of her life, and she saves them. Three months ago Congress passed a law that lets any slave catcher in the North seize her on a stranger's word and carry her back. Philadelphia is no longer safe. Canada is.", "This week a message came down the line. Her niece Kessiah and Kessiah's two small children are to be sold at auction in Baltimore, in the courthouse yard, before Christmas.", "Now Harriet steps aside and you step in. The wages, the room, the new law and the message are hers. Whether you go north to safety or south to the auction is yours."], "button": "Sit down in the kitchen"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The kitchen is warm. Your wages for the month are in a tin under the bed. The message about Kessiah is on the table, and the newspaper next to it has the new law in it, and both of them are talking at once.", "question": "What are you feeling right now?", "placeholder": "Say it to the tin, not to the committee.", "helper": {"who": "William Still, of the Vigilance Committee, who keeps the records of everyone who comes through", "says": "You have been free fourteen months. Most people who reach this city never say what it actually feels like. Tell me.", "options": ["I feel free, and I feel that free is a smaller word than I thought it would be with everyone I love still in Maryland.", "I feel that the law just made the whole North a slave state with better manners, and I do not know where safe is anymore.", "I feel that if I go south I may never come back, and if I do not go, Kessiah will not come back, and only one of those I can live with."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before anything is decided about Baltimore, take an inventory. Not of the road, and not of Harriet. Of yourself.", "question": "What have you already done, in your own life, that proves you can go back into a hard place for someone else?", "placeholder": "One thing you did. Not one thing you believe.", "fillIn": true, "helper": {"who": "William Still", "says": "I can tell you what the woman at this table carries. She walked ninety miles at night with a price on her head after her brothers turned back. She has found the North Star from a hundred fields. She has never once been caught, and she has never once been anywhere she was not the one to decide. Now you tell me what you carry. Finish one of these.", "options": ["A time I went back into a hard place for someone who could not get out alone: ", "A time I kept going after the people beside me turned back: ", "A time I gave up a safe thing I had earned because it was not the point: "]}}, {"n": 3, "name": "The deferral", "prompt": "Two sentences are competing tonight. One says: you have arrived, and arriving is the whole of what you owe yourself. The other says: go tonight, now, before you think. Both of them are wrong about the same thing. Neither of them has looked at a map.", "question": "What is the one reason you will not decide tonight, in either direction?", "placeholder": "Not a plan for Baltimore. One reason to wait for a plan.", "helper": {"who": "William Still", "says": "The people who go south in a hurry are the ones I write down twice, once going and once when the news comes back. Tell me why you will wait for a plan.", "options": ["Because a rescue that fails costs Kessiah more than a rescue that is late, and I do not yet know the courthouse yard.", "Because arriving was never what I meant by free. But going tonight without a plan is not freedom either. It is fear moving fast.", "Because there are people in this city who know Baltimore, and I have not asked them yet."]}}, {"n": 4, "name": "One step", "prompt": "Not the rescue. Not the next nineteen years. One step, small enough to finish before the kitchen closes for the night.", "question": "What is it?", "placeholder": "Something you can do with a tin of wages and a city full of people who know the road.", "helper": {"who": "William Still", "says": "Kessiah has a husband, a free man, John Bowley. He can go where you cannot. What can you do from this side of the line before anyone goes south?", "options": ["I will get word to John Bowley in Baltimore that the money for the bid will be there, and that I will be waiting on the Pennsylvania side.", "I will count the tin, and go back to work tomorrow, and count it again at the end of the week. The road costs money.", "I will sit with someone who has come north from Baltimore this year and learn the courthouse yard from them, door by door."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. Word is on its way to Baltimore, or the tin has been counted and the wages are the plan, or you know the courthouse yard the way you know a field at night. The auction is still scheduled. The law is still the law.", "question": "What has changed in you?", "placeholder": "Compare it to the kitchen table with two pieces of paper on it.", "helper": {"who": "William Still", "says": "Nothing in Baltimore has changed. What changed here?", "options": ["I stopped asking whether I owe myself my freedom. I am asking what it is for.", "The fear is the same. It has a direction now, and the direction is south.", "I have been free fourteen months. I think tonight is the first night I have used it."]}}, {"n": 6, "name": "Time passes", "montage": ["In December 1850 John Bowley bids on his own wife and children at the Baltimore courthouse and, in the confusion of the lunch recess, walks them out before the money is asked for. That night he rows them across the Chesapeake to Bodkin Point. Harriet is waiting on the other side, and takes them north to Philadelphia.", "It is the first of the trips. She goes back for her brother Moses in the spring. She goes back again, and again, in winter mostly, when the nights are long. She carries a pistol for the ones who want to turn around and a lantern she rarely lights. She takes her parents out at seventy. The count is disputed, thirteen trips by careful modern reckoning, nineteen by the older telling, and somewhere near seventy people. She said she never lost a passenger.", "She could have stayed in Philadelphia, or gone to Canada, and been free for the rest of her life. The people she knew who did that were also free. She is the one whose name we know, and it is because she went back."], "question": "She reached freedom. Here is the question the record cannot answer for you: what did she do with it?", "choices": [{"label": "She kept it. She was never caught.", "short": "she kept it", "reply": "She did keep it, and that is not the answer. Keeping it was the one thing every free person in Philadelphia was already doing. If keeping it had been the point, the story would have ended in 1849."}, {"label": "She risked it, thirteen or nineteen times.", "short": "she risked it, thirteen or nineteen times", "reply": "She did, and each time she could have lost it forever. But risk is a description of the odds. It does not say what the risk was for."}, {"label": "She turned it into a door for other people.", "short": "she turned it into a door for other people", "reply": "Yes. This is the Return, the most demanding shape continuation takes. Not arriving. Arriving, and refusing to let arrival be the end of the story. Freedom that stops at your own door is not what she meant by free. She was a stranger in a strange land until the people she loved could stand in it too."}, {"label": "She spent it. There was almost nothing left at the end.", "short": "she spent it, and there was almost nothing left", "reply": "She died poor, in a home she had built for others, and this is half true. What she spent was money, health and years. What she did not spend was the thing itself. Seventy people carried it away with them, and it did not get smaller."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another arrival that tempts you to stop. Write one sentence for that night. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "William Still, writing it into the record", "says": "I write down everyone who comes through this kitchen. Give me a line to write for you. Start with I did.", "options": ["I did not let arriving be the end of the story.", "I did go back for the ones who could not get out alone.", "I did wait for a plan, and then I did not wait for anything."]}, "ice": {"question": "One more line, and this one is yours. Who is still in Maryland in your own life, and what does your arrival owe them?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, on the free side of the line", "sub": "Your fourteenth month, beside hers", "paragraphs": ["Philadelphia, December 1850, free for fourteen months. You sat where Harriet Tubman sat, with a tin of wages under the bed and two pieces of paper on the table, and the night asked you what it asked her. You wrote: {1}", "Before anything was decided, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Hers was ninety miles at night after her brothers turned back, and a North Star found from a hundred fields.", "You refused to decide in a hurry in either direction. Your reason: {3} That refusal is the deferral. Not tonight. Not without a map.", "Your first step: {4} {overlap}", "After the step, the auction was still scheduled and the law was still the law. Inside, you noticed this: {5}", "Then time did what it does when a free woman keeps going back. A husband bidding on his own family, a boat across the Chesapeake, a first trip, and then a dozen more, and somewhere near seventy people, and not one lost.", "Asked what she did with her freedom, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["She did this. The Kessiah rescue was John Bowley's bid and boat and Harriet's waiting on the Pennsylvania side. She did not go into the courthouse yard. She made the far side of the line certain.", "She did this for fourteen months and for the rest of her life. Every trip was paid for in wages from kitchens like this one.", "She did this constantly. Her routes were built from the knowledge of the people who had already walked them. A different first step in the same kitchen is still a first step."], "stepOverlapFree": "Her first step was to make the far side of the line certain and let John Bowley do what a free man could do in Baltimore. A different first step in the same kitchen is still a first step.", "help": {"zero": "You did not turn to William Still on this journey. Harriet did, constantly, and he wrote down the name of nearly everyone she brought through his door. Next time, try the door. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to William Still {n} on this journey. Harriet worked with him for a decade, and his ledger is how we know most of the names. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the ones still in Maryland in your own life, as you named them: {ice}", "closing": "The line is still there, and so is the courthouse yard. What you carry across is not freedom, because you already had that, and it is not Harriet. It is the evidence that having arrived, you asked what arriving was for.", "stickerLines": ["Walked with Harriet Tubman.", "Philadelphia, December 1850."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The lantern\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n\n  <path d=\"M150,140 L250,140 L262,300 L138,300 Z\" stroke-width=\"4\"/>\n  <path d=\"M160,140 L160,96 L240,96 L240,140\" stroke-width=\"3\"/>\n  <path d=\"M172,96 C172,70 228,70 228,96\" stroke-width=\"3\"/>\n  <path d=\"M200,70 C186,60 200,44 214,54 C222,62 210,72 200,70\" stroke-width=\"3\"/>\n  <path d=\"M138,300 L262,300 L270,326 L130,326 Z\" stroke-width=\"4\"/>\n  <path d=\"M200,278 C182,262 184,236 200,214 C216,236 218,262 200,278\" stroke-width=\"2.6\"/>\n  <path d=\"M200,278 L200,290\" stroke-width=\"2.6\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
