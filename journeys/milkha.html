<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Milkha Singh, 1947</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from Milkha Singh's own account of his life, paraphrased, and from the Unquit story lists. His parents' last words to him are as he reported them.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "milkha", "title": "Milkha Singh, 1947", "subtitle": "A refugee train into Delhi. Autumn 1947. Seventeen.", "object": "The spikes", "sticker": "The spikes.", "footer": "Drawn from Milkha Singh's own account of his life, paraphrased, and from the Unquit story lists. His parents' last words to him are as he reported them.", "arrive": {"heading": "You are standing where a seventeen-year-old stood.", "paragraphs": ["He is not the Flying Sikh yet. He is Milkha, seventeen, from a village called Govindpura that is now on the wrong side of a line drawn this summer. When the killing came to the village he watched his parents die. His father's last words to him were run, Milkha, run. He ran. He hid in the forest, then under the seats of a train to Delhi with the bodies of people who had not been so lucky, and arrived with nothing at the door of his married sister, Isher, in a refugee camp.", "It is autumn 1947. Delhi is full of people who have lost everything and are stealing to eat. He is one of them. He has been to jail for riding a train without a ticket. He has tried to join the army and been refused. He will be refused twice more.", "There is nothing in his hands and nothing behind him. The only thing his body knows how to do well is the thing his father told him to do.", "Now Milkha steps aside and you step in. The camp, the sister's door, the empty hands and the two words are his. What you do with the running is yours."], "button": "Sit down at the camp"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "Isher's tent is small and there is already too many in it. The camp smells of smoke and cooking oil. Someone is always crying and someone is always arguing. You have been here three weeks.", "question": "What are you feeling right now?", "placeholder": "Say it as a boy who has seen what he has seen, not as a champion.", "helper": {"who": "Isher, your sister, who has taken you in when she has nothing", "says": "You do not talk about the village. You do not have to. But tell me what you feel now, today, in this camp.", "options": ["I feel that everything I had is on the other side of a line someone drew in an office, and I did not even get to bury them.", "I feel that I am stealing to eat and going to jail and becoming exactly what the camp expects of me.", "I feel that the only thing I know how to do is run, and I have been running away for three months, and I do not know how to run toward anything."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before anything is decided about what comes next, take an inventory. Not of the camp, and not of Milkha. Of yourself.", "question": "What have you already done, in your own life, that proves you can keep moving when everything behind you is gone?", "placeholder": "One thing you did. Not one thing you believe.", "fillIn": true, "helper": {"who": "Isher", "says": "I can tell you what my brother carries. He did what our father told him with his last breath. He survived a forest and a train that most did not. He found my door in a city of a million strangers. He has been refused by the army and has not stopped going back. Now you tell me what you carry. Finish one of these.", "options": ["A time I kept moving when everything behind me was gone: ", "A time I was refused and went back to be refused again: ", "A time I did the one thing I knew how to do when I had lost everything else: "]}}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the camp is: this is what I am now. It sounds like realism. It is grief in the shape of realism. You do not have to decide who you are at seventeen in a refugee camp. You only have to refuse to let the camp decide it for you.", "question": "What is the one reason you will not decide this season?", "placeholder": "Not a plan. One reason the camp does not get the vote.", "helper": {"who": "Isher", "says": "The camp will tell you what you are every day. Tell me why you will not let it.", "options": ["Because our father said run, and he did not say run away. I have been hearing only half the word.", "Because a camp is a place, and I have already left one place I thought I would never leave.", "Because the army has said no three times, and no one who has said no three times has said never."]}}, {"n": 4, "name": "One step", "prompt": "The army recruitment is open again next month. Not a career. Not a medal. Not Rome, which does not exist yet. One step, small enough to finish this week.", "question": "What is it?", "placeholder": "Something a boy in a camp can do with his legs.", "helper": {"who": "Isher", "says": "You have legs and a month. What is the smallest thing you can do with both?", "options": ["I will go back to the recruitment a fourth time. The fourth no costs nothing I have not already paid.", "I will run every morning before the camp wakes, on the road toward the city, not away from anything.", "I will stop stealing. Not because I am caught. Because the man who goes to the army the fourth time cannot be the boy who steals."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The fourth application is in, or the road has been run before dawn for a week, or the stealing has stopped. The village is still gone. The camp is still the camp.", "question": "What has changed in you?", "placeholder": "Compare it to the tent three weeks ago.", "helper": {"who": "Isher", "says": "The camp is the same. What is different in you?", "options": ["I ran toward something this morning for the first time since the village. It was only the city. It was toward.", "The camp still says what I am. I have stopped repeating it.", "I am still a refugee. I have stopped being only that."]}}, {"n": 6, "name": "Time passes", "montage": ["The fourth application succeeds. In the army a coach notices a recruit who runs a cross-country race to win a glass of milk and comes sixth out of hundreds. He is put in training. He runs until he vomits blood and runs again the next day.", "In 1958 he wins gold at the Commonwealth Games in Cardiff, the first for independent India. In 1960 he goes back across the line, to Lahore, to race the Pakistani champion, and wins, and the President of Pakistan tells the crowd that he did not run, he flew. The Flying Sikh.", "Rome, 1960, the Olympic final, four hundred meters. He is leading at two hundred and fifty. He looks back. In the time it takes to look, three men pass him. He finishes fourth, a tenth of a second from a medal, in a time that stands as the Indian record for forty years. He says it is the one race he never stopped running in his head. He never looked back again."], "question": "Rome is the medal he did not win. Here is the question the tenth of a second cannot answer for you: what did he win?", "choices": [{"label": "Nothing in Rome. Fourth is fourth.", "short": "nothing in Rome, fourth is fourth", "reply": "Fourth is fourth, and he carried it for sixty years, and he would be the first to say so. He also said it was the race that taught him more than the ones he won. Loss inside an arrival is still an arrival."}, {"label": "The Commonwealth gold and the name.", "short": "the Commonwealth gold and the name", "reply": "He won those, and they matter, and the name was given by the president of the country that had killed his parents, in the city he had fled through, which is its own kind of return. But the medals are not what he won. They are what he was given."}, {"label": "A direction. Run toward, not away.", "short": "a direction, run toward, not away", "reply": "Yes. A father said run and a boy heard only run away, for three months in a forest and a train and a camp. Everything after was the other half of the word. Rome was lost by looking back, and he said so plainly, and he never did it again. The loss inside the arrival was the last lesson of the first word."}, {"label": "His parents' last words, kept.", "short": "his parents' last words, kept", "reply": "Also true. He ran because he was told to by someone who loved him and did not survive to see it. Every race was the same two words, and the man who said them never saw one of them finish. That is the loss inside every arrival in his life, and he carried it across every line."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another camp, another season that tells you what you are now. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Isher", "says": "One line for the next camp. Start with I did.", "options": ["I did go back a fourth time when three noes had said never.", "I did run toward something for the first time since everything was gone.", "I did not let the camp decide what I am."]}, "ice": {"question": "One more line, and this one is yours. What in your own life is telling you this is what you are now?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the camp", "sub": "Your autumn, beside his", "paragraphs": ["Delhi, autumn 1947, three weeks in a refugee camp at seventeen. You sat where Milkha Singh sat, with nothing in your hands and two words in your ears, and the camp asked you what it asked him. You wrote: {1}", "Before anything was decided, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was a forest, a train, a sister's door found in a city of strangers, and three refusals that did not become never.", "You refused to let the camp decide what you are. Your reason: {3} That refusal is the deferral. Not this season. Not from grief.", "Your first step: {4} {overlap}", "After the step, the village was still gone and the camp was still the camp. Inside, you noticed this: {5}", "Then time did what it does when a boy runs toward. A fourth application, a glass of milk, a coach, Cardiff, Lahore, a name, and Rome, where he looked back once and never again.", "Asked what he won, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this. The fourth application succeeded, and everything the world knows about him began there.", "He did this too, though first in army boots on army roads. Toward, not away, is his own description of the difference.", "He did this. He said the army saved him from becoming what the camp expected. A different first step in the same camp is still a first step."], "stepOverlapFree": "His first step was a fourth application to an army that had said no three times. A different first step in the same camp is still a first step.", "help": {"zero": "You did not turn to Isher on this journey. Milkha did. She took him in with nothing and, by his account, sold her earrings to get him out of jail. Next time, turn to the one who opened the door. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to Isher {n} on this journey. She took him in with nothing, and he said for the rest of his life that she was the reason there was a rest of his life. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the thing in your own life telling you what you are now, as you named it: {ice}", "closing": "The village is on the other side of a line. The camp is gone. What you carry out is not a medal, and it is not him. It is the evidence that when everything behind you was gone, you ran toward.", "stickerLines": ["Walked with Milkha Singh.", "Delhi, autumn 1947."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The spikes\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n\n  <path d=\"M60,250 L60,286 L240,286 C268,286 290,276 290,262 C290,248 272,242 250,236 L206,224 L182,200 L118,200 L104,250 Z\" stroke-width=\"4\"/>\n  <path d=\"M104,250 L250,236\" stroke-width=\"2\"/>\n  <path d=\"M126,214 L154,214 M122,230 L160,230\" stroke-width=\"2\"/>\n  <path d=\"M90,286 L88,300 M130,286 L128,300 M170,286 L168,300 M210,286 L208,300 M250,286 L248,300\" stroke-width=\"3\"/>\n  <path d=\"M160,224 C190,230 220,232 244,240\" stroke-width=\"1.6\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
