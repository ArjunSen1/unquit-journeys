<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Harriet Chen, what quitters know</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>

  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Harriet Chen is a composite from Chapter Nineteen of The Unquit Stories. This is the first journey in which the continuation is a leaving.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "harriet", "title": "Harriet Chen, what quitters know", "subtitle": "A university library carrel. Three years in.", "object": "The withdrawal form", "sticker": "The form.", "footer": "Harriet Chen is a composite from Chapter Nineteen of The Unquit Stories. This is the first journey in which the continuation is a leaving.", "arrive": {"heading": "You are standing where Harriet Chen stood.", "paragraphs": ["She has wanted this since she was nineteen. The research, the deep reading, the life of ideas inside a university. She is three years into a doctorate in art history. She is good at it. Her advisor likes her work. She has a clear path, funding for two more years, and a dissertation topic that was approved in the spring.", "She also has, in a drawer of the carrel, a withdrawal form she printed six weeks ago and has not signed.", "Here is what makes this journey different from every other one in the series. The impulse to quit, in Harriet's case, is going to turn out to be correct. Not because the work is too hard. Because the work, as it is structured, is not where her ideas want to go. She loves art. She does not love the architecture of academic knowledge production. She loves the question. She does not love the credential. She cannot see any of that yet. She can only see the loss, and the fact that quitting the right thing and quitting the wrong thing feel identical from the inside.", "Now Harriet steps aside and you step in. The carrel, the funding, the advisor and the unsigned form are hers. Whether the form gets signed, and for the right reason, is yours."], "button": "Sit down at the carrel"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The library is quiet in the way libraries are quiet at four in the afternoon. The chapter draft on the screen is good. Your advisor said so on Tuesday. The form is in the drawer. Both of those things are true at once.", "question": "What are you feeling right now?", "placeholder": "Say it without deciding whether it is weakness or wisdom.", "helper": {"who": "Dana, a friend who finished her doctorate two years ago and does not love what it got her", "says": "Do not tell me whether you should stay. Tell me what it feels like to sit there.", "options": ["I feel relief every time I imagine leaving, and I do not know if relief is wisdom or escape.", "I feel like the version of me who wanted this at nineteen is standing behind my chair, and I cannot turn around.", "I feel that I am about to disappoint everyone who believed in me, and that the belief has become the reason I stay."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the form is signed or shredded, take an inventory. Not of the program, and not of Harriet. Of yourself.", "question": "What have you already done, in your own life, that proves you can tell the difference between hard and hollow?", "placeholder": "One thing you did. Not one thing you believe.", "fillIn": true, "helper": {"who": "Dana", "says": "I can tell you what the woman at that carrel carries. She has wanted one thing since she was nineteen and has not stopped wanting it. She is three years into the hardest version of it and is still good at it. And she printed a form six weeks ago and did not sign it, which means she is not fleeing. She is thinking. Now you tell me what you carry. Finish one of these.", "options": ["A time I stayed with something hard long enough to know what it actually was: ", "A time I left something respectable because it was hollow, and was right: ", "A time I stopped confusing the container for the thing inside it: "]}}, {"n": 3, "name": "The deferral", "prompt": "Two sentences are competing at the carrel. One says: I cannot handle this. The other says: this is not where my ideas want to go. They feel identical. They are not. The first is about you. The second is about the form the work has taken. You do not have to sign anything at four in the afternoon. You only have to refuse to decide before you know which sentence is true.", "question": "What is the one reason you will not decide today?", "placeholder": "Not an argument for staying or leaving. One reason to wait until you know which sentence it is.", "helper": {"who": "Dana", "says": "The impulse to quit is data. It is not a verdict. Tell me why you will wait until you have read the data.", "options": ["Because relief and escape feel the same from inside, and I owe it to nineteen-year-old me to find out which this is.", "Because I have not yet asked what the quitting is telling me. I have only asked whether to do it.", "Because the form will still be in the drawer tomorrow, and the question will not have changed."]}}, {"n": 4, "name": "One step", "prompt": "Not a decision about the doctorate. Not a new career. One step, small enough to finish before the library closes, that would tell you which sentence is true.", "question": "What is it?", "placeholder": "Something that produces information, not a decision.", "helper": {"who": "Dana", "says": "Do not decide. Find out. What is one thing you can do tonight that would tell you whether it is you or the form?", "options": ["I will write down what I love about this work and what I do not, in two columns, and see which column is about art and which is about the university.", "I will spend one evening in the museum education wing, where the art meets people instead of footnotes, and notice what I feel.", "I will ask my advisor one honest question: if I finish this, what will my days actually look like?"]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The two columns are written, or you stood in the museum among people who were not writing about it, or your advisor answered honestly. The form is still in the drawer. The funding is still yours.", "question": "What has changed in you?", "placeholder": "Compare it to four in the afternoon.", "helper": {"who": "Dana", "says": "You have information now. What does it say?", "options": ["The left column is all art. The right column is all university. I did not know they could be separated until I wrote them down.", "I still love the question. I have stopped loving the credential. Those are different losses, and only one of them is a loss.", "It is not that I cannot handle the work. It is that the work is too small for what I want to do with it."]}}, {"n": 6, "name": "Time passes", "montage": ["She signs the form. It takes her a year to stop feeling like she failed. It takes a second year to understand what the quitting had been telling her: not that she could not handle the work, but that the work, as structured, was not where her ideas wanted to go.", "She becomes a museum educator. Then a curator. Then the director of a mid-sized art center in Portland, where she runs programs that bring contemporary art to communities that museums had never invited in. She publishes essays. She teaches. She sits on the panels the credential was supposed to get her onto.", "Quitting the doctorate, she says now, was not giving up on art. It was giving up on one particular path to art so she could find another. She could not see that when she signed. She could only see the loss. But some part of her knew something her thinking had not caught up to yet."], "question": "She quit, and she was right to. Here is the question the rest of this series has been building toward: what did Harriet Chen refuse to quit?", "choices": [{"label": "The doctorate.", "short": "the doctorate", "reply": "She quit the doctorate. Fully, on a form, with two years of funding left. If the doctorate had been the thing, she would be a quitter. It was not the thing."}, {"label": "Her advisor's belief in her.", "short": "her advisor's belief in her", "reply": "She let that go too, and it cost her a year of feeling like a failure. Belief that has become the reason you stay is a container, and she was already learning to see containers."}, {"label": "Art. The question underneath the credential.", "short": "art, the question underneath the credential", "reply": "Yes. She was loyal to the purpose and disloyal to the form, which is the whole of the Unquit discipline in one decision. Staying in the wrong thing is also a form of quitting. It is quitting on yourself. She refused to do that, and it looked, from outside, exactly like giving up."}, {"label": "Nothing. Quitting is quitting.", "short": "nothing, quitting is quitting", "reply": "This is the sentence the whole series exists to argue with. Don't quit is advice, and advice cannot tell the soldier who holds the line from the gambler who cannot leave the table. Unquit is discernment. She quit the container and kept the content. That is not nothing. It is the hardest form of continuing there is."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another form in another drawer, and the two sentences will feel identical again. Write one sentence for that afternoon. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Dana", "says": "One sentence for the next drawer. Start with I did.", "options": ["I did ask what the quitting was telling me before I asked whether to do it.", "I did separate the thing I loved from the container it came in.", "I did leave the form and keep the question."]}, "ice": {"question": "One more line, and this one is yours. Is there a form in your drawer right now, and do you yet know which sentence it is?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, at the carrel", "sub": "Your two sentences, beside hers", "paragraphs": ["A library carrel at four in the afternoon, three years in. You sat where Harriet Chen sat, with a good chapter on the screen and an unsigned form in the drawer, and the afternoon asked you what it asked her. You wrote: {1}", "Before the form was signed or shredded, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Hers was a want she had carried since nineteen, three years of being good at the hardest version of it, and a form she had printed and not signed, which is what thinking looks like.", "You refused to decide before you knew which sentence was true. Your reason: {3} That refusal is the deferral. Not today. Not before the data.", "Your first step: {4} {overlap}", "After the step, the form was still in the drawer and the funding was still yours. Inside, you noticed this: {5}", "Then time did what time does when someone leaves for the right reason. A year of feeling like a failure, a second year of understanding, a museum, a gallery, an art center in Portland, and the panels the credential was supposed to earn.", "Asked what Harriet Chen refused to quit, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["She did something like this, though it took her two years instead of one evening. Art in one column, the university in the other. The columns did not overlap as much as she had assumed.", "This is where she ended up, and where the answer was. The first job after the form was museum education, where the art met people. She stayed in that direction for the rest of her career.", "She had the clear path and the approving advisor. What she did not have was an honest picture of the days. A different first step at the same carrel is still a first step."], "stepOverlapFree": "Her first step was slower than yours. She signed the form, and it took two years for the reason to catch up. A different first step at the same carrel is still a first step.", "help": {"zero": "You did not turn to Dana on this journey. Harriet did not have a Dana either, and it cost her a year of believing she had failed. Next time, try the door. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to Dana {n} on this journey. Harriet did not have a Dana, and it cost her a year of believing she had failed. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the form in your own drawer, as you named it: {ice}", "closing": "The carrel belongs to someone else now. What you carry out of the library is not a credential, and it is not Harriet. It is the evidence that you can tell hard from hollow, and that leaving the form is sometimes how the question survives.", "stickerLines": ["Walked with Harriet Chen.", "Three years in, four in the afternoon."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The form\">\n<g transform=\"rotate(-6 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n\n  <path d=\"M120,50 L280,50 L280,350 L120,350 Z\" stroke-width=\"4\"/>\n  <path d=\"M148,92 L252,92 M148,118 L232,118 M148,144 L252,144 M148,170 L220,170 M148,196 L252,196\" stroke-width=\"2.2\"/>\n  <path d=\"M148,232 L252,232\" stroke-width=\"2.2\"/>\n  <path d=\"M148,300 L252,300\" stroke-width=\"3\"/>\n  <path d=\"M148,316 L196,316\" stroke-width=\"1.6\"/>\n  <path d=\"M156,282 C160,274 166,276 164,284\" stroke-width=\"2.2\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
