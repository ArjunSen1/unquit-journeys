<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. The seven women of Lijjat</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. From the documented history of Shri Mahila Griha Udyog Lijjat Papad. The seven never allowed one name to stand above the others, and this journey does not either.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "lijjat", "title": "The seven women of Lijjat", "subtitle": "A terrace in Girgaum, Bombay. June 1959. The first monsoon.", "object": "The rolling pin", "sticker": "The rolling pin.", "footer": "From the documented history of Shri Mahila Griha Udyog Lijjat Papad. The seven never allowed one name to stand above the others, and this journey does not either.", "arrive": {"heading": "You are standing where seven women stood.", "paragraphs": ["On March 15, 1959, seven women met on the terrace of a building in Girgaum, Bombay. Between them they had a rolling pin each and eighty rupees, borrowed from a social worker named Chhaganlal Parekh, whom everyone called Chhaganbapa. With the eighty rupees they bought the flour and the equipment of a papad business that had failed. That morning they rolled papad. That afternoon they sold four packets to a merchant in Bhuleshwar.", "Chhaganbapa set two rules. Never compromise on quality. Never accept charity. Borrow if you must, repay every paisa, and run it as a business or do not run it at all.", "It is June now. The monsoon has come. Papad dries in the sun, and there is no sun, and there will be none for four months. Production has stopped. The eighty rupees are not yet repaid. Everyone in the building has an opinion, and most of the opinions are the same: it was a nice thing to try.", "Now one of the seven steps aside and you step in. We will not say which one. They never let one name stand above the others, and neither will this. The terrace, the debt, the rain and the six other women are theirs. Whether papad gets rolled this month is yours."], "button": "Step onto the terrace"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The terrace is wet. The rolling boards are stacked against the wall under a sheet. Below, the street is running with water. The other six are looking at the sky and then at each other.", "question": "What are you feeling right now?", "placeholder": "Say it the way you would say it to one of the six, not to the neighbors.", "helper": {"who": "Jaswantiben, one of the six, sitting beside you on the wet step", "says": "The neighbors will talk whatever we do. Talk to me instead. What is it?", "options": ["I feel that the neighbors were right and I am the last one to know it.", "I feel that four months of nothing will undo three months of something.", "I feel we borrowed money we cannot repay, and that is a different kind of rain."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before anyone decides anything about the season, take an inventory. Not of the flour, and not of the seven. Of yourself.", "question": "What have you already done, in your own life, that proves you can keep going with less than it needs?", "placeholder": "One thing you did. Not one thing you believe.", "fillIn": true, "helper": {"who": "Chhaganbapa, who lent the eighty rupees", "says": "I can tell you what the seven carry. Three months ago you bought a failing business with eighty borrowed rupees and sold four packets on the first day. You have not taken one paisa of charity, and you were offered it. Now you tell me what you carry. Finish one of these.", "options": ["A time I started something with less than it needed: ", "A time I refused help that would have made me smaller: ", "A time I kept a promise to people who were counting on me: "]}}, {"n": 3, "name": "The deferral", "prompt": "The sentence this month is: the rain has decided. It sounds like weather. It is a feeling in the shape of weather. You do not have to argue with the sky. You only have to refuse to close the business in the first week of a season it was always going to face.", "question": "What is the one reason you will not decide this month?", "placeholder": "Not a plan for drying. One reason to wait.", "helper": {"who": "Chhaganbapa", "says": "Nobody closes a business in the first week of a season that comes every year. Tell me why you will wait.", "options": ["Because the rain is a season and the debt is not. Debts do not wait for October.", "Because we are seven. If I decide alone, I have already broken the only thing we own.", "Because Chhaganbapa did not lend eighty rupees to a season. He lent it to us."]}}, {"n": 4, "name": "One step", "prompt": "Morning. Still raining. Not a plan for the monsoon. Not a plan for repaying eighty rupees. One step, small enough that seven women can finish it before the afternoon rain.", "question": "What is it?", "placeholder": "Something that can be done with what is already on the terrace.", "helper": {"who": "Chhaganbapa", "says": "The sun is not coming. Is there anything else on this terrace that is hot?", "options": ["I will bring a cot and put a stove under it. The papad will dry over the stove instead of under the sun.", "I will roll today's papad anyway and find the drying later. Rolling is ours. The sun never was.", "I will go to the merchant in Bhuleshwar and tell him the truth. We will be late. We will not be gone."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. There is a cot on the terrace with a stove under it, or a board of rolled papad waiting for a way to dry, or a merchant who now knows. The rain has not stopped.", "question": "What has changed in you?", "placeholder": "Compare it to this morning on the wet step.", "helper": {"who": "Jaswantiben", "says": "The rain has not stopped. Tell me what has.", "options": ["The rain is the same. It has stopped being the decision.", "Seven women on a terrace with a stove under a cot looks foolish from the street. It does not feel foolish from here.", "We are behind. We are not closed. Those are different words."]}}, {"n": 6, "name": "Time passes", "montage": ["The cot and the stove work. Papad dries in the monsoon. Production never stops for a season again.", "By the end of the first year the seven have sold papad worth six thousand one hundred and ninety-six rupees. The eighty are repaid. Within three years the women of Girgaum are no longer seven. They are hundreds. Every one of them is a co-owner. Every one of them is called sister. Not one of them has ever accepted a donation.", "Sixty years on, some forty-five thousand women roll papad every morning in branches across India. Lijjat means taste. It is one of the largest women-owned enterprises in the world, and it has no owner."], "question": "Sixty years and forty-five thousand sisters. Who built Lijjat?", "choices": [{"label": "Chhaganbapa, who lent the eighty rupees.", "short": "Chhaganbapa, who lent the eighty rupees", "reply": "He lent money and two rules. He never rolled a papad. The eighty rupees were repaid, which is exactly what he wanted. A loan builds a debt. What built Lijjat came after the debt was gone."}, {"label": "The seven.", "short": "the seven", "reply": "They began it, and they refused to let their names stand above the rest. Ask any one of them who built it and she would have pointed at the terrace, and then at the street, and then at the next branch over."}, {"label": "Every woman who rolled on a morning she could have stayed home.", "short": "every woman who rolled on a morning she could have stayed home", "reply": "Yes. Lijjat was not built by a founder, a loan or a monsoon solved. It was built by tens of thousands of mornings, each one decided separately by a woman who could have said not today. That is what a collective is. Not one large decision. Thousands of small ones, made again."}, {"label": "The stove under the cot.", "short": "the stove under the cot", "reply": "A good answer, and half true. The stove solved one monsoon. The women solved every one after it. Tools end problems. People end seasons."}]}, {"n": 7, "name": "Lock it in", "prompt": "The rains will come next year, and every year. Write one sentence for the new sisters who will be on this terrace when they do. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Jaswantiben", "says": "When the rains come next year, what will you tell the new sisters you did this year? Start with I did.", "options": ["I did not let the season decide the business.", "I did roll papad on a day there was no sun.", "I did stay one of seven when it would have been easier to be one."]}, "ice": {"question": "One more line, and this one is yours. Where is the monsoon in your own life right now? The season that has arrived and is asking you to close.", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, on the terrace", "sub": "Your mornings, beside theirs", "paragraphs": ["Girgaum, June 1959, the first monsoon. You stood where seven women stood, with a rolling pin under a sheet and eighty rupees still owed, and the rain asked you what it asked them. You wrote: {1}", "Before anyone decided anything, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Theirs was three months old. A failing business bought with borrowed money, four packets sold on the first afternoon, and not one paisa of charity taken.", "You refused to let the first week of the season decide. Your reason: {3} That refusal is the deferral. Not this month. Not from the weather.", "Your first step: {4} {overlap}", "After the step, the rain had not stopped. Inside, you noticed this: {5}", "Then the mornings did what mornings do, forty-five thousand at a time. The eighty rupees were repaid. The seven became hundreds and the hundreds became a word that means taste.", "Asked who built Lijjat, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["The seven did this. Chhaganbapa suggested a cot and a stove, the papad dried over the heat, and production never stopped for a season again.", "They rolled too. The drying came later, from a stove under a cot, but the rolling never waited for the weather.", "That was not their step, but it was their principle. They never hid from a merchant or a lender. A different first step on the same terrace is still a first step."], "stepOverlapFree": "Their first step was a cot with a stove under it, suggested by the man who lent them the money and carried out by the women who owed it. A different first step on the same terrace is still a first step.", "help": {"zero": "You did not ask anyone on this journey. The seven asked Chhaganbapa twice, for eighty rupees and for a way to dry papad in the rain, and both times he answered with something they would have to do themselves. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You asked for help {n} on this journey. The seven asked Chhaganbapa twice, for eighty rupees and for a way to dry papad in the rain. Both times he answered with something they would have to do themselves. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the monsoon in your own life, as you named it: {ice}", "closing": "The terrace is still there. The rains still come. What you carry down the stairs is not a business, because it was never one person's, and it is not the seven. It is the evidence that on a morning with no sun you were one of the people who rolled.", "stickerLines": ["Walked with the seven women of Lijjat.", "Girgaum, the first monsoon."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The rolling pin\">\n<g transform=\"rotate(-28 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <circle cx=\"200\" cy=\"262\" r=\"70\" stroke-width=\"1.6\" stroke-dasharray=\"3 6\"/>\n    <path d=\"M110,176 C96,176 96,224 110,224\" stroke-width=\"4\"/>\n  <path d=\"M290,176 C304,176 304,224 290,224\" stroke-width=\"4\"/>\n  <path d=\"M110,176 L290,176 M110,224 L290,224\" stroke-width=\"4\"/>\n  <path d=\"M110,176 C60,172 40,180 34,190 C30,198 30,202 34,210 C40,220 60,228 110,224\" stroke-width=\"3\"/>\n  <path d=\"M290,176 C340,172 360,180 366,190 C370,198 370,202 366,210 C360,220 340,228 290,224\" stroke-width=\"3\"/>\n  <path d=\"M38,200 L64,200 M336,200 L362,200\" stroke-width=\"1.4\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
