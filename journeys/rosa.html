<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Rosa Espinoza, the rest of your life</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>

const D = {"series": "Unquit Journeys", "slug": "rosa", "title": "Rosa Espinoza, the rest of your life", "subtitle": "A closed restaurant kitchen in Austin. Sunday morning. Year two.", "object": "The wall", "sticker": "The wall.", "footer": "Rosa Espinoza is a composite from Chapter Twenty-Six of The Unquit Stories. The regular at the door was added for this journey. Restaurant vocabulary throughout: restaurant, guest, team member.", "arrive": {"heading": "You are standing where Rosa Espinoza stood.", "paragraphs": ["Thirty seats. Hand-painted walls. A menu that changes with the season and her grandmother's recipes running through all of it like a spine. She and her partner planned it for ten years and opened it two years ago. It was his job to handle the accounts. He said he would.", "This week he left. With him went the operating capital, and behind him came the debts she did not know existed and the accounts she had never looked at because he said he would handle it. All of it arrived at once.", "It is Sunday morning. The restaurant is closed. She is standing in the kitchen with the lights off and the walls she painted herself, and she understands, clearly, that the reasonable decision is to walk away.", "Now Rosa steps aside and you step in. The kitchen, the walls, the recipes and the debts are hers. Whether the restaurant opens Tuesday is yours."], "button": "Stand in the kitchen"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The walk-in hums. The prep list for Tuesday is still on the board in his handwriting. The walls are the color you mixed yourself.", "question": "What are you feeling right now?", "placeholder": "Say it to the kitchen, not to the bank.", "helper": {"who": "Mr. Salinas, a regular who eats here every Sunday and has knocked on the back door because the lights are off", "says": "I saw the lights off. I am not here to eat. Tell me what is going on, and tell me first how you are.", "options": ["I feel that I built the part people can see and trusted him with the part they cannot, and the part they cannot see just fell on me.", "I feel that the reasonable decision is to walk away, and that I have never made a reasonable decision about this place in my life.", "I feel my grandmother in the recipes and I do not know how to tell her I am closing."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before Tuesday, take an inventory. Not of the debts, and not of Rosa. Of yourself.", "question": "What have you already done, in your own life, that proves you can keep a thing open when the reasonable decision is to close it?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Mr. Salinas", "says": "I can tell you what the woman in this kitchen carries. Ten years of planning before a single wall was painted. Two years of thirty seats full on Sundays. A grandmother's recipes that taste, every time, like someone cooked them who cared what I ate. Now you tell me what you carry. Finish one of these.", "options": ["A time I kept a thing open when the reasonable decision was to close it: ", "A time I learned the part someone else was supposed to handle: ", "A time I cooked for people who came back because of how it was cooked: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the kitchen is: the reasonable decision is to walk away. It is reasonable. It is also Sunday morning, in the dark, with the debts one day old. You do not have to decide the restaurant's future today. You only have to refuse to let the worst week decide it.", "question": "What is the one reason you will not decide today?", "placeholder": "Not a business plan. One reason to wait until the lights are on.", "helper": {"who": "Mr. Salinas", "says": "Nobody closes a restaurant on a Sunday with the lights off. Tell me why you will wait.", "options": ["Because I learned about the debts this week and I have not yet read them. A decision made before reading is not a decision.", "Because Tuesday has reservations, and thirty people do not know anything happened, and they are not the ones who left.", "Because the reasonable decision is his kind of decision. He made it. I am not obliged to make the same one."]}}, {"n": 4, "name": "One step", "prompt": "Not the debts. Not the next four years. One step, small enough to finish before the walk-in cycles again.", "question": "What is it?", "placeholder": "Something you can do in a closed kitchen on a Sunday.", "helper": {"who": "Mr. Salinas", "says": "You do not have to save the restaurant this morning. What is the smallest thing you can do in this kitchen today?", "options": ["I will turn on the lights and read the accounts. All of them. Today. Whatever they say.", "I will erase his handwriting from the prep board and write Tuesday's list in mine.", "I will cook one thing from her recipes, for myself, at this stove, to find out if it still tastes like anything."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The accounts are read, or the board is in your handwriting, or something is on the stove that tastes the way it always did. The debts are the same size. He is still gone.", "question": "What has changed in you?", "placeholder": "Compare it to the dark kitchen.", "helper": {"who": "Mr. Salinas", "says": "The numbers did not change. What did?", "options": ["The debts are the same. I know what they are now, and a known number is a smaller number.", "It is my handwriting on the board. It was always my restaurant. It was only his to handle.", "It still tastes like her. Whatever else is true, that is true."]}}, {"n": 6, "name": "Time passes", "montage": ["She does not walk away. She spends four years keeping the restaurant open, which is not a heroic sentence and is meant not to be. Four years of reading accounts she had never read, of Tuesdays, of thirty seats, of a menu that kept changing with the season because her grandmother's recipes did.", "The book does not end at the moment the debts are paid. It ends in the ordinary life on the other side of the decision, the days that look like every other day from outside and feel different from inside because you are living them as someone who chose.", "The walls are still the color she mixed. The board is still in her handwriting."], "question": "Four years of keeping it open. Here is the question the paid-off debts cannot answer for you: what was Rosa deciding, that Sunday morning?", "choices": [{"label": "Whether the restaurant survived.", "short": "whether the restaurant survived", "reply": "That took four years and it was not decided on a Sunday. Sundays do not decide restaurants. Tuesdays do, one at a time."}, {"label": "Whether to trust anyone again.", "short": "whether to trust anyone again", "reply": "A real question, and hers, and the book does not pretend she answered it in a morning. It is not what the kitchen was asking."}, {"label": "Who she would be on the other side of the reasonable decision.", "short": "who she would be on the other side of the reasonable decision", "reply": "Yes. The book is called The Rest of Your Life for a reason. It is not about the arrival. It is about the ordinary days after the decision to continue, which look like every other day and are not, because you are living them as someone who chose. She chose in a dark kitchen. Then she lived it for four years of Tuesdays."}, {"label": "Nothing. She just kept cooking.", "short": "nothing, she just kept cooking", "reply": "She just kept cooking, and read accounts she had never read, and wrote the prep list in her own hand, and paid debts that were not hers. Just is a large word in that sentence."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another Sunday morning when the reasonable decision is to walk away. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Mr. Salinas", "says": "One line for the next dark kitchen. Start with I did.", "options": ["I did read the accounts before I let them decide.", "I did write Tuesday's list in my own handwriting.", "I did not make his kind of decision."]}, "ice": {"question": "One more line, and this one is yours. Where in your own life is the reasonable decision to walk away, and what is on the prep board?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the closed kitchen", "sub": "Your Sunday, beside hers", "paragraphs": ["Austin, a Sunday morning, year two, the lights off. You stood where Rosa Espinoza stood, with walls you painted and debts you did not know about, and the kitchen asked you what it asked her. You wrote: {1}", "Before Tuesday, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Hers was ten years of planning, two years of full Sundays, and a grandmother in every dish.", "You refused to let the worst week decide the restaurant. Your reason: {3} That refusal is the deferral. Not today. Not in the dark.", "Your first step: {4} {overlap}", "After the step, the debts were the same size. Inside, you noticed this: {5}", "Then four years did what four years do when a woman keeps cooking. Tuesdays, accounts, thirty seats, and the ordinary life on the other side of a decision.", "Asked what Rosa was deciding that Sunday, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["She did this, and kept doing it for four years, having never done it before.", "The board is in her handwriting in the book's last image. A different first step in the same place is still a first step.", "The recipes ran through everything like a spine, the book says. Whether she cooked that morning, it does not say. A different first step in the same place is still a first step."], "stepOverlapFree": "Her first step was to not walk away, and then to learn the accounts. A different first step in the same place is still a first step.", "help": {"zero": "You did not open the back door for Mr. Salinas. Rosa had guests who came back because of how the food was cooked, and they are why the four years were possible. Next time, open the door. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You opened the back door {n} on this journey. Rosa's regulars are the reason a thirty-seat restaurant survived four years of debts that were not hers. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the reasonable decision in your own life, as you named it: {ice}", "closing": "The restaurant is open Tuesday. What you carry out of the kitchen is not a balance sheet, and it is not Rosa. It is the evidence that in the dark, with the reasonable decision in front of you, you turned on the lights and read.", "stickerLines": ["Walked with Rosa Espinoza.", "Austin, a Sunday morning, year two."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The wall\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M70,80 L330,80 L330,320 L70,320 Z\" stroke-width=\"4\"/><path d=\"M90,110 C130,96 170,124 210,110 C250,96 290,124 310,110\" stroke-width=\"2.4\"/><path d=\"M96,170 C110,150 130,152 138,170 C146,190 124,196 116,182\" stroke-width=\"2.4\"/><path d=\"M250,200 C270,180 300,186 296,210 C292,232 262,234 254,214\" stroke-width=\"2.4\"/><path d=\"M150,260 L170,240 L190,262 L210,242 L230,262\" stroke-width=\"2.4\"/><path d=\"M110,290 L290,290\" stroke-width=\"1.6\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
