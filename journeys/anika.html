<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Anika Brennan, the permission you never needed</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>

<script>
const D = {"series": "Unquit Journeys", "slug": "anika", "title": "Anika Brennan, the permission you never needed", "subtitle": "A hotel room in Cincinnati. Tuesday night. A delayed flight and nothing to read.", "object": "The boarding pass", "sticker": "The boarding pass.", "footer": "Anika Brennan is a composite from Chapter Seventeen of The Unquit Stories.", "arrive": {"heading": "You are standing where Anika Brennan sat, waiting for permission.", "paragraphs": ["She grew up in a house where ambition was watched. Her father worked at one company for twenty-nine years and spoke about big dreams the way cautious people speak about weather. Her mother was warmer and had a phrase that became part of the furniture: let's be realistic.", "Anika was realistic. The safe job, not the risky one. The relationship that made sense, not the one that asked something bigger. Fifteen years inside the borders of realistic, and it was fine. Sustainable. The appropriate temperature for an interior life kept at a cautious distance from anything that might fail.", "She is thirty-seven, in a hotel room in Cincinnati on a Tuesday night, with a delayed flight and nothing to read. She has opened her laptop. She has started writing a story about a woman in a hotel room with a delayed flight who has spent fifteen years being realistic.", "Now Anika steps aside and you step in. The hotel room, the laptop, the fifteen years and the phrase are hers. Whether you keep writing past the boarding time is yours."], "button": "Sit down at the hotel desk"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The room is the color of every hotel room. The flight has been delayed twice. The story is four paragraphs long and the woman in it has just noticed her own life.", "question": "What are you feeling right now?", "placeholder": "Say it as a realistic person who has just written four paragraphs, not as a writer.", "helper": {"who": "Your mother's voice, which you carry, and which you are about to answer", "says": "Let's be realistic. You are not a writer. You have a flight. Before you argue with me, tell me what you feel with four paragraphs on the screen.", "options": ["I feel that I have never in my life wanted something this specific this fast, and it is nine o'clock on a Tuesday in Cincinnati.", "I feel fifteen years of realistic arriving all at once to tell me this is a phase, and I feel the four paragraphs disagreeing.", "I feel that I am waiting for someone to tell me I am allowed to keep typing, and I have just noticed that I have been waiting my whole life."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the fifth paragraph, take an inventory. Not of the story, and not of Anika. Of yourself.", "question": "What have you already done, in your own life, that proves you can begin something without anyone's permission?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Your mother's voice", "says": "I raised you to be realistic and you were. Before you tell me I was wrong, tell me what you have already done without asking me. Finish one of these.", "options": ["A time I began something without anyone's permission: ", "A time I wanted something large and did not wait to be told I could: ", "A time I failed at something that mattered and wanted to try again: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the hotel room is: I am not a writer, so this is a way of passing a delay. It sounds realistic. It is the furniture talking. You do not have to decide whether you are a writer tonight. You only have to refuse to let the phrase decide the fifth paragraph.", "question": "What is the one reason you will not close the laptop?", "placeholder": "Not a career plan. One reason let's be realistic does not get the vote.", "helper": {"who": "Your mother's voice", "says": "Let's be realistic. Tell me why not, this once.", "options": ["Because realistic has been the temperature of my whole interior life and it has been fine and I have just found out what a different temperature feels like.", "Because the permission to write was never anyone's to give, including yours, and I have been waiting for it for fifteen years anyway.", "Because the woman in the story has noticed her own life, and I am not going to stop her four paragraphs in."]}}, {"n": 4, "name": "One step", "prompt": "Not a novel. Not quitting the safe job. One step, small enough to finish before the flight boards.", "question": "What is it?", "placeholder": "Something you can do at a hotel desk with a laptop.", "helper": {"who": "Your mother's voice, softer", "says": "You are going to keep writing. What is the smallest version of that?", "options": ["I will write until the story is finished, and if the flight leaves without me, I will book another.", "I will finish the story and send it to one literary journal tonight, before I have time to be realistic about it.", "I will write one more paragraph, and then decide about the flight, and then one more."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The story is finished, or it is in a journal's inbox, or the flight has been reconsidered one paragraph at a time. The safe job is still the safe job. The phrase is still in the furniture.", "question": "What has changed in you?", "placeholder": "Compare it to four paragraphs.", "helper": {"who": "Your mother's voice", "says": "Nothing about your life changed tonight. What changed at the desk?", "options": ["The flight left without me. I looked up and it was gone and I did not mind and I have never once in my life not minded a missed flight.", "It is in someone's inbox. Whatever they say, I did not wait to be allowed to send it.", "I stopped waiting for permission. It was never anyone's to give. I knew that as a sentence. I know it now as three hours I did not notice passing."]}}, {"n": 6, "name": "Time passes", "montage": ["She writes for three hours and the flight leaves without her. She rewrites the story. She writes a second. She finds a journal online and sends one without quite believing she has. A form rejection arrives three weeks later and she is shocked to find she is not devastated. She is interested. She wants to try again.", "Seventeen stories in two years. Six published. One small prize. None of it changes her life dramatically. Same job, same rent. Something has changed that the external conditions cannot capture. She has stopped waiting for permission.", "The permission to write was always hers. The permission to want something large was never her parents' to grant or withhold. We build permission structures out of everything, credentials, timing, other people's assessments, and we wait, and the waiting becomes the life. She stopped waiting on a Tuesday in Cincinnati because a flight was late."], "question": "Fifteen years of realistic, then three hours in a hotel room. Here is the question the six published stories cannot answer for you: what was she waiting for?", "choices": [{"label": "The right time.", "short": "the right time", "reply": "There is never one. A delayed flight in Cincinnati is not the right time. It was the time there was."}, {"label": "Talent, confirmed by someone.", "short": "talent, confirmed by someone", "reply": "Six stories published and a prize confirmed it, later. She wrote seventeen before any of that. The confirmation came after the writing, as it always does."}, {"label": "Permission that was never anyone's to give.", "short": "permission that was never anyone's to give", "reply": "Yes. We turn the absence of permission into a reason to wait, and the waiting becomes the life. The permission to write was always hers. The permission to want something large was never her parents' to grant. She found that out not by deciding but by writing for three hours without noticing, and looking up to find the flight gone and herself not minding. Becoming is not a new self. It is the old one, finally not asking."}, {"label": "Nothing. She was happy being realistic.", "short": "nothing, she was happy being realistic", "reply": "She was fine. Sustainable. The chapter uses those words and means them, and then says what fine costs when it is the only temperature you have ever known."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another delayed flight, another phrase in the furniture. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Your mother's voice, which is now also yours", "says": "One line for the next hotel room. Start with I did.", "options": ["I did stop waiting for permission that was never anyone's to give.", "I did let the flight leave.", "I did send it before I could be realistic about it."]}, "ice": {"question": "One more line, and this one is yours. What are you waiting for permission to do, and whose permission do you imagine it is?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the hotel room", "sub": "Your Tuesday night, beside hers", "paragraphs": ["A hotel room in Cincinnati, a Tuesday, a delayed flight, four paragraphs. You sat where Anika Brennan sat, with fifteen years of realistic behind you and a woman in a story who had just noticed her own life, and the room asked you what it asked her. You wrote: {1}", "Before the fifth paragraph, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Hers was fifteen years of living inside a phrase, and four paragraphs that had already stepped outside it.", "You refused to let let's be realistic decide the fifth paragraph. Your reason: {3} That refusal is the deferral. Not tonight. Not from the furniture.", "Your first step: {4} {overlap}", "After the step, the safe job was still the safe job. Inside, you noticed this: {5}", "Then two years did what two years do when a woman stops asking. Seventeen stories, six published, one prize, a form rejection that did not devastate, and nothing about the rent changed.", "Asked what she was waiting for, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["She did this. Three hours, and the flight left without her, and she did not mind.", "She did this, a little later. Sent without quite believing she had, and was interested rather than devastated by the rejection. A different first step in the same place is still a first step.", "One more paragraph is how three hours happen. A different first step in the same place is still a first step."], "stepOverlapFree": "Her first step was to keep writing past the boarding time. A different first step in the same place is still a first step.", "help": {"zero": "You did not answer your mother's voice on this journey. Anika carried it for fifteen years without answering, and answering it is the chapter. Next time, answer the phrase in the furniture. It is only furniture.", "some": "You answered your mother's voice {n} on this journey. The phrase was never a wall. It was furniture, and you moved it."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the permission you are waiting for, as you named it: {ice}", "closing": "The hotel room in Cincinnati is the color of every hotel room. What you carry out of it is not a prize, and it is not Anika. It is the evidence that the permission was never anyone's to give, and that you have stopped waiting for it.", "stickerLines": ["Walked with Anika Brennan.", "Cincinnati, a Tuesday night."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The boarding pass\">\n<g transform=\"rotate(-10 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M70,150 L330,150 L330,250 L70,250 Z\" stroke-width=\"4\"/><path d=\"M240,150 L240,250\" stroke-width=\"2\" stroke-dasharray=\"6 6\"/><path d=\"M90,176 L200,176 M90,198 L180,198 M90,220 L210,220\" stroke-width=\"1.8\"/><path d=\"M256,176 L316,176 M256,200 L300,200\" stroke-width=\"1.8\"/><path d=\"M270,214 C290,204 310,214 300,228\" stroke-width=\"2\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
