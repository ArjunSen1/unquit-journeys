<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Toni Morrison at four in the morning</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>

<footer>Unquit Journeys. Prototype. Drawn from Toni Morrison's own accounts of how she wrote her first novel, paraphrased. Her estate should see the script as a courtesy.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "morrison", "title": "Toni Morrison at four in the morning", "subtitle": "A kitchen in Queens. Four in the morning. Two sons asleep. Work at nine.", "object": "The legal pad", "sticker": "The legal pad.", "footer": "Drawn from Toni Morrison's own accounts of how she wrote her first novel, paraphrased. Her estate should see the script as a courtesy.", "arrive": {"heading": "You are standing where a woman stood in a kitchen before dawn.", "paragraphs": ["She is thirty-five, divorced, raising two sons alone, and working as an editor at a publishing house in New York, where she is one of the few Black women in the building and the only one editing books. She commutes. She cooks. She reads other people's manuscripts for a living and is good at it.", "She has a story she started in a writers' group years ago, about a Black girl in Ohio who prays for blue eyes. No one is waiting for it. No one has asked. There is no time in a day that has two children and a nine o'clock job in it.", "So she has been getting up at four. Before the boys wake. Before the commute. At the kitchen table, with a pencil and a legal pad, in the only hour that is not already owed to someone. She has been doing this for months. The book is not finished. She does not know if it ever will be, or if anyone will publish it if it is.", "It is four in the morning. The kitchen is cold. Now she steps aside and you step in. The table, the pad, the two sleeping boys and the hour are hers. What the hour is for is yours."], "button": "Sit down at the kitchen table"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The kettle has not boiled. The house is silent in the way it is only silent at four. The legal pad is open to the middle of a chapter you left at a sentence you did not like.", "question": "What are you feeling right now?", "placeholder": "Say it as a tired editor with a pencil, not as the author on the book jacket.", "helper": {"who": "The first reader you will have, whoever they turn out to be, not yet born into the story", "says": "No one has asked for this book. I am asking. Before you write a word, tell me what you feel at this table.", "options": ["I feel that I read other people's books all day and this one has no one to read it, including, most mornings, me.", "I feel four o'clock in my bones and nine o'clock coming and two boys who need breakfast, and a girl in Ohio who needs me to finish a sentence.", "I feel that this is the only hour of my life that no one else owns, and I am spending it on something no one wants."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the pencil moves, take an inventory. Not of the manuscript, and not of the woman at the table. Of yourself.", "question": "What have you already done, in your own life, that proves you can keep a thing alive in the hour no one else wants?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "The first reader", "says": "I can tell you what the woman at this table carries. Two boys raised alone on an editor's salary. A job she is better at than the building admits. Months of four o'clocks with no one asking. And a girl in Ohio who has been alive on legal pads for years because one person kept getting up. Now you tell me what you carry. Finish one of these.", "options": ["A time I kept a thing alive in the hour no one else wanted: ", "A time I made something no one had asked for and kept making it: ", "A time I got up before the day was owed to anyone and used it: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence at the table is: no one is waiting for this, so it can wait. It sounds like priorities. It is exhaustion sounding responsible. You do not have to decide whether the book will ever be published. You only have to refuse to let a cold kitchen at four decide whether the sentence gets finished.", "question": "What is the one reason you will not decide this morning?", "placeholder": "Not a publishing plan. One reason the empty audience does not get the vote.", "helper": {"who": "The first reader", "says": "No one is waiting. That is true this morning. Tell me why it does not get to decide the sentence.", "options": ["Because the girl in Ohio has been waiting for years, and she is the only audience I owe anything to.", "Because the hour is mine whether I write or not. Writing is the only way I have found to keep it from becoming sleep.", "Because I have edited a hundred books no one was waiting for until they existed. Waiting comes after."]}}, {"n": 4, "name": "One step", "prompt": "Not the novel. Not a publisher. One step, small enough to finish before the boys wake.", "question": "What is it?", "placeholder": "Something you can do with a pencil in an hour.", "helper": {"who": "The first reader", "says": "The kettle is nearly boiled. What is the smallest thing you can do before the house wakes?", "options": ["I will finish the sentence I did not like, badly if necessary, so that tomorrow starts on a new one.", "I will write one paragraph in the girl's voice, not mine, and stop when the boys stir.", "I will reread yesterday's page before I write, to hear whether it is still alive."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The bad sentence is finished, or one paragraph exists in a child's voice, or yesterday's page has been read and found breathing. The kitchen is still cold. Nine o'clock is still coming.", "question": "What has changed in you?", "placeholder": "Compare it to the unboiled kettle.", "helper": {"who": "The first reader", "says": "No one is waiting yet. What changed at the table?", "options": ["The sentence is done and it is not good and tomorrow starts on a new one. That is what a book is made of.", "I wrote in her voice and forgot the time. That is the first hour in weeks I have not owed to anyone.", "Yesterday's page is alive. I did not know that until I read it as a stranger. The stranger is coming."]}}, {"n": 6, "name": "Time passes", "montage": ["She writes it at four in the morning for years. She sends it out. It is rejected, then accepted by a small imprint. It is published in 1970, when she is thirty-nine, as The Bluest Eye. It sells modestly. She keeps her job.", "Then there is another book, and another, still written in the hours before the day is owed. In 1993 she is awarded the Nobel Prize in Literature, the first Black woman to receive it. She said, of the four o'clock years, that she wrote the book she wanted to read and could not find.", "The girl in Ohio waited on legal pads for years because one exhausted woman kept getting up in the dark. No one was waiting for her. Everyone was, later."], "question": "Years of four o'clocks, no one waiting. Here is the question the Nobel cannot answer for you: what did the hour belong to?", "choices": [{"label": "The book.", "short": "the book", "reply": "The book got the hour, and the book got published, and then a Nobel. But the book did not exist yet when the hour was being spent. Something else was there first."}, {"label": "The girl in Ohio.", "short": "the girl in Ohio", "reply": "She was the only audience for years, and Morrison said so: she wrote the book she wanted to read and could not find. The hour was owed to a character no one had asked for."}, {"label": "Her. The only hour of the day not already owed to someone.", "short": "her, the only hour of the day not already owed to someone", "reply": "Yes. Two boys, a job, a commute and a house owned every hour but one, and she took the one and made something in it that no one had asked for. That is the Long Middle in its purest domestic form: the work done in the hour that is yours, for years, without an audience, because the alternative is to have no hour at all. The Nobel is what the world did later. The four o'clocks are what she did."}, {"label": "Nothing. It was just discipline.", "short": "nothing, it was just discipline", "reply": "It was discipline, and discipline is not nothing, and it is not the whole answer. Discipline gets a person to the table. What kept her there was a girl in Ohio and an hour that was finally hers."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another cold kitchen at four, another thing no one is waiting for. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "The first reader", "says": "One line for the next four o'clock. Start with I did.", "options": ["I did get up in the hour no one else owned and used it.", "I did finish the sentence badly so tomorrow could start on a new one.", "I did make the thing I wanted and could not find."]}, "ice": {"question": "One more line, and this one is yours. Which hour of your day is not owed to anyone, and what is on the legal pad?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, at the kitchen table", "sub": "Your four o'clock, beside hers", "paragraphs": ["A kitchen in Queens, four in the morning, two sons asleep. You sat where a tired editor sat, with a legal pad open to a sentence you did not like and a job at nine, and the hour asked you what it asked her. You wrote: {1}", "Before the pencil moved, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Hers was two boys raised alone, a job she was better at than the building admitted, and months of four o'clocks no one had asked for.", "You refused to let the empty audience decide the sentence. Your reason: {3} That refusal is the deferral. Not this morning. Not from a cold kitchen.", "Your first step: {4} {overlap}", "After the step, nine o'clock was still coming. Inside, you noticed this: {5}", "Then the years did what years do when a woman keeps getting up in the dark. A small imprint, a modest sale, a kept job, more books in the same hour, and in 1993 a prize no Black woman had ever been given.", "Asked what the hour belonged to, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["She did this, for years. Bad sentences finished so that the next morning could begin.", "This is how she described the writing: getting into the voice before the house woke. A different first step in the same place is still a first step.", "She was an editor. Rereading as a stranger was her day job, brought home to the table. A different first step in the same place is still a first step."], "stepOverlapFree": "Her first step, every morning, was to sit down before the house woke. A different first step in the same place is still a first step.", "help": {"zero": "You did not turn to the first reader. Morrison did not have one either, for years; she said she wrote the book she wanted to read. Everywhere you can, ask. Here, she was the reader. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to the first reader {n} on this journey. For years Morrison was her own first reader at four in the morning, and then everyone was. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the hour not owed to anyone in your own life, as you named it: {ice}", "closing": "The kitchen in Queens belongs to someone else now. What you carry out of it is not a prize, and it is not her. It is the evidence that in the one hour that was yours, you made the thing no one had asked for.", "stickerLines": ["Walked with Toni Morrison.", "Queens, four in the morning."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The legal pad\">\n<g transform=\"rotate(-4 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M110,70 L290,70 L290,330 L110,330 Z\" stroke-width=\"4\"/><path d=\"M110,100 L290,100\" stroke-width=\"3\"/><path d=\"M140,70 L140,330\" stroke-width=\"1.6\"/><path d=\"M156,140 L270,140 M156,168 L262,168 M156,196 L270,196 M156,224 L230,224 M156,252 L270,252 M156,280 L200,280\" stroke-width=\"1.8\"/><path d=\"M304,236 L336,180 M330,178 L344,186 M300,244 L296,256 L308,252\" stroke-width=\"2.4\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
