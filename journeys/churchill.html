<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Winston Churchill, the wilderness years</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from the record of Churchill's years out of office, paraphrased, and from Unquit: The Oldest Choice. His record is contested in ways this journey does not resolve; the script says so.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "churchill", "title": "Winston Churchill, the wilderness years", "subtitle": "A study at Chartwell, Kent. 1934. No office. No one listening.", "object": "The reading chair", "sticker": "The chair.", "footer": "Drawn from the record of Churchill's years out of office, paraphrased, and from Unquit: The Oldest Choice. His record is contested in ways this journey does not resolve; the script says so.", "arrive": {"heading": "You are standing where a man stood who had been finished, twice.", "paragraphs": ["He was First Lord of the Admiralty at thirty-six and the author of the Dardanelles disaster at forty, and he resigned and went to the trenches. He came back, held office again, changed parties twice, and was Chancellor. In 1929 his party lost, and in 1931 he broke with its leaders and walked into what everyone, including him, called the wilderness.", "He is fifty-nine. He has no office and no prospect of one. His party regards him as finished and slightly ridiculous. He speaks in the Commons about German rearmament and the benches empty. He writes books to pay for a house he cannot afford, lays bricks in its garden, paints, and reads the intelligence that a few frightened civil servants pass him privately about what is being built across the Channel.", "It is 1934. The wilderness will last five more years. He does not know that. He knows the House empties when he stands.", "Now the man steps aside and you step in. The empty benches, the bricks, the unread warnings and the study are his. What you do with years no one wants from you is yours."], "button": "Sit down in the study"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The study is warm. The manuscript on the desk is a life of an ancestor, written for money. The Commons emptied again this afternoon. The reports from Germany are in the drawer.", "question": "What are you feeling right now?", "placeholder": "Say it as a man of fifty-nine whom his own party considers finished.", "helper": {"who": "Clementine, your wife, who has watched every one of these years from close range", "says": "You are not going to be asked back this month. Tell me what you feel about that, and not what you will say at dinner.", "options": ["I feel that I am right about the one thing that matters and that being right in an empty room is indistinguishable from being wrong.", "I feel fifty-nine, and a career that people describe in the past tense while I am standing in the room.", "I feel that I am laying bricks and painting and writing for money because a man who cannot act must still do, and I do not know if doing is enough."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before another year in the wilderness, take an inventory. Not of the reports, and not of Churchill. Of yourself.", "question": "What have you already done, in your own life, that proves you can keep preparing for a moment no one believes is coming?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Clementine", "says": "I can tell you what the man in that chair carries. He has been finished before, after the Dardanelles, and went to the trenches instead of the country. He has changed his mind in public more than once and survived it. He has read every report from Germany that has come to this house and written back to every civil servant who sent one. Now you tell me what you carry. Finish one of these.", "options": ["A time I kept preparing for a moment no one believed was coming: ", "A time I was finished, by general agreement, and was not: ", "A time I did the unglamorous work in the years no one wanted from me: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the study is: no one is listening, so there is no point speaking. It sounds like realism. It is a full House empty of an afternoon. You do not have to decide whether you will ever hold office. You only have to refuse to let empty benches decide whether the warnings are given.", "question": "What is the one reason you will not decide this year?", "placeholder": "Not a political calculation. One reason the empty room does not get the vote.", "helper": {"who": "Clementine", "says": "The benches empty when you stand. Tell me why you stand anyway.", "options": ["Because the reports in the drawer are true whether or not anyone listens, and a true thing said to an empty room is on the record.", "Because I have been wrong about a great many things in public and I am not wrong about this, and the difference is worth the empty benches.", "Because the wilderness is where the work of the next thing is done, if there is a next thing, and I cannot know from here."]}}, {"n": 4, "name": "One step", "prompt": "Not office. Not the war. One step, small enough to finish before dinner.", "question": "What is it?", "placeholder": "Something a man can do in a study with reports and a pen.", "helper": {"who": "Clementine", "says": "You cannot make them listen. What is the smallest thing you can do this evening?", "options": ["I will write the next speech on rearmament as if the House were full, and give it to whoever is there.", "I will answer the civil servant who sent the latest figures, and ask for the next ones.", "I will lay a course of bricks in the garden wall before the light goes. A man who cannot act must still build."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. A speech is written for a full House that will be empty, or a letter is on its way to a frightened man in Whitehall, or a course of bricks is level. The benches will empty again. The party still thinks you are finished.", "question": "What has changed in you?", "placeholder": "Compare it to the emptied Commons.", "helper": {"who": "Clementine", "says": "No one in Westminster changed their mind tonight. What changed in you?", "options": ["The room is still empty. The speech is written for the room that will not be.", "I asked for the next figures. A man who is finished does not ask for the next figures.", "The wall is a course higher. That is what a year in the wilderness looks like up close: one course."]}}, {"n": 6, "name": "Time passes", "montage": ["The wilderness lasts until September 1939. Then the thing he had warned about in empty rooms arrives, and within nine months the country that had considered him finished puts him in charge of surviving it. The speeches he gave to empty benches for six years were the rehearsal for the ones a nation listened to on the radio.", "The years out of office were not a delay before the work. They were the work. He read what others would not read, said what others would not say, and built the arguments in years when no one wanted them, so that they were ready when everyone did.", "His record before and after is contested, and this journey does not settle it. It says only this: he prepared, for years, for a moment no one believed was coming, and it came."], "question": "Six years in the wilderness, then the war. Here is the question the radio speeches cannot answer for you: what were the wilderness years?", "choices": [{"label": "Exile.", "short": "exile", "reply": "That is what he called them, and it is how they felt, and it is what the party intended. But exile describes where he was. Not what he did there."}, {"label": "A delay before the moment.", "short": "a delay before the moment", "reply": "This is how the biographies draw it, and it gets the sequence right and the substance wrong. Nothing was waiting. He was working."}, {"label": "The preparation the future needed, done in years no one wanted.", "short": "the preparation the future needed, done in years no one wanted", "reply": "Yes. Every speech to an empty House was a draft of one a nation would hear. Every report read in a study no one visited was the intelligence a government would later need. The wilderness was not a gap in the story. It was where the man the moment required was made, in years the moment had not yet asked for."}, {"label": "Wasted, if the war had not come.", "short": "wasted, if the war had not come", "reply": "Perhaps. He did not know the war would come, and prepared anyway. That is the whole discipline. You cannot know from inside the wilderness whether the moment is coming. You prepare as if it is, and accept that you may never be needed."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another wilderness, another room that empties when you stand. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Clementine", "says": "One line for the next empty House. Start with I did.", "options": ["I did write the speech for the room that would not be there.", "I did prepare for a moment no one believed was coming.", "I did lay one more course."]}, "ice": {"question": "One more line, and this one is yours. What are you preparing in your own wilderness, and would you keep preparing if the moment never came?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the study", "sub": "Your wilderness, beside his", "paragraphs": ["Chartwell, 1934, the Commons emptied again that afternoon. You sat where a man sat whom his party considered finished, with reports from Germany in the drawer and a manuscript for money on the desk, and the study asked you what it asked him. You wrote: {1}", "Before another year, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was a first finishing survived in the trenches and every report from Germany answered.", "You refused to let empty benches decide whether the warnings were given. Your reason: {3} That refusal is the deferral. Not this year. Not from a room that emptied.", "Your first step: {4} {overlap}", "After the step, the party still thought you were finished. Inside, you noticed this: {5}", "Then six years did what six years do when a man keeps writing speeches for a room that is not there. September 1939. Nine months. A radio.", "Asked what the wilderness years were, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this, dozens of times, to benches that emptied.", "He did this constantly. The private intelligence network of the wilderness years is documented and was the basis of the speeches. A different first step in the same place is still a first step.", "He laid bricks at Chartwell for years and joined the bricklayers' union to do it. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step, most days, was to write for the room that was not there. A different first step in the same place is still a first step.", "help": {"zero": "You did not turn to Clementine. He did, for fifty years, and she was the one who watched the wilderness from close range and told him the truth in it. Next time, turn to the one who watched. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to Clementine {n} on this journey. She was in the house for every year of the wilderness and told him the truth about all of them. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the thing you are preparing in your own wilderness, as you named it: {ice}", "closing": "Chartwell is a museum with the wall he built. What you carry out of the study is not a premiership, and it is not him. It is the evidence that you can prepare for years for a moment no one believes is coming.", "stickerLines": ["Walked with Winston Churchill.", "Chartwell, 1934."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The chair\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M110,120 C110,96 130,90 150,90 L250,90 C270,90 290,96 290,120 L290,220 L110,220 Z\" stroke-width=\"4\"/><path d=\"M80,200 L110,200 M290,200 L320,200 M80,200 L80,290 L110,290 M320,200 L320,290 L290,290\" stroke-width=\"4\"/><path d=\"M110,290 L290,290 M110,220 L110,290 M290,220 L290,290\" stroke-width=\"4\"/><path d=\"M120,290 L120,340 M280,290 L280,340\" stroke-width=\"3\"/><path d=\"M130,130 L270,130\" stroke-width=\"1.4\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
