<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. The parent at three a.m.</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. From Unquit: The Oldest Choice. No name, on purpose. This one belongs to everyone who has stood in that hallway.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "parent", "title": "The parent at three a.m.", "subtitle": "A dark hallway. Three in the morning. A child who will not sleep. A presentation at nine.", "object": "The night light", "sticker": "The night light.", "footer": "From Unquit: The Oldest Choice. No name, on purpose. This one belongs to everyone who has stood in that hallway.", "arrive": {"heading": "You are standing where a parent stood in a hallway at three in the morning.", "paragraphs": ["There is no name in this journey because it does not need one. A child is crying in the next room for the third time tonight. Not ill. Not in danger. Awake, and refusing not to be, in the way of small children who have not yet agreed to the terms of night.", "You have a presentation at nine that you have prepared for a month. You have been asleep for a total of two hours, in pieces. Your partner is asleep in the bed you just left, and you have decided, for reasons that are not entirely fair to either of you, not to wake them.", "Nothing about this is heroic. Nothing about it will be remembered. It will not be in any book but this one. It is the Long Middle in its most ordinary and most universal form: a night that has to be gotten through, with no reward for getting through it except the morning.", "Now the parent steps aside and you step in. The hallway, the crying, the presentation and the sleeping partner are theirs. What you do with the third time tonight is yours."], "button": "Stand in the hallway"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The night light in the child's room throws a small warm circle on the floor. The crying has the specific pitch of a child who is not going to stop on their own. The clock says 3:07.", "question": "What are you feeling right now?", "placeholder": "Say it in the hallway, where no one can hear it but you.", "helper": {"who": "Your partner, asleep, whom you could wake", "says": "You could wake me. You have decided not to. Before you go in, say what you feel out here, to the version of me that is awake.", "options": ["I feel that I love this child completely and would give a great deal right now to be somewhere else, and both are true at 3:07.", "I feel nine o'clock coming and a month of work in it, and I feel this crying, and there is not enough of me for both.", "I feel that no one will ever know about this night, and that I am going to do it anyway, and I do not know what that makes me."]}, "helpLabel": "Wake them."}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the door, take an inventory. Not of the child, and not of the parent. Of yourself.", "question": "What have you already done, in your own life, that proves you can get through a night no one will thank you for?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Your partner, half awake now", "says": "You have done this before. Not this night. Nights like it. Tell yourself what you carry. Finish one of these.", "options": ["A time I got through a night no one thanked me for: ", "A time I showed up for something small and unrecorded that mattered: ", "A time I did the third time tonight the same as the first: "]}, "fillIn": true, "helpLabel": "Ask them."}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the hallway is: I cannot do this, and the presentation is ruined, and this is what my life is now. It sounds like 3:07. It is 3:07. You do not have to decide what your life is in a hallway at three. You only have to refuse to let the third time tonight decide the morning.", "question": "What is the one reason you will not decide anything tonight?", "placeholder": "Not a sleep plan. One reason 3:07 does not get the vote.", "helper": {"who": "Your partner", "says": "Nothing is decided at 3:07. Tell yourself why.", "options": ["Because 3:07 has never once been right about anything, and it has had many chances.", "Because the presentation is prepared. A month of work does not evaporate because of one night. It only feels like it does at three.", "Because the child will sleep eventually. They always do. This is the third time tonight, not the hundredth, and the count is in my head."]}, "helpLabel": "Say it to them."}, {"n": 4, "name": "One step", "prompt": "Not sleep. Not the presentation. One step, small enough to finish before the crying gets louder.", "question": "What is it?", "placeholder": "Something you can do in a hallway in the dark.", "helper": {"who": "Your partner", "says": "You are going to go in. What is the smallest thing you can do when you get there?", "options": ["I will go in, pick them up, and sit in the chair by the night light, and not look at the clock.", "I will go in and say nothing. Just be in the room. Sometimes that is the whole of it.", "I will go back and wake my partner and say: your turn, and mean it kindly."]}, "helpLabel": "Ask what they would do."}, {"n": 5, "name": "What you feel now", "prompt": "It is done. You are in the chair with a small warm weight against you, or in the room saying nothing, or back in the bed with someone else in the hallway. The clock is still going. Nine is still coming.", "question": "What has changed in you?", "placeholder": "Compare it to 3:07 in the hallway.", "helper": {"who": "Your partner", "says": "The night is the same night. What changed?", "options": ["The crying stopped. It always does. I never believe it will, and it always does.", "I am in the chair and not looking at the clock and the clock has stopped being the loudest thing in the room.", "I asked for my turn to end and someone took the next one. That is what the two of us are for."]}, "helpLabel": "Tell them."}, {"n": 6, "name": "Time passes", "montage": ["The child sleeps at 3:40. You do not, quite. You give the presentation at nine on two and a half hours of sleep in pieces and it is fine. Not your best. Fine. No one in the room knows about the hallway.", "The Desert Fathers had a word for the hardest part of the Long Middle: not the great temptation, but the small one, to leave, to be somewhere more comfortable. A hallway at three in the morning is a cell. You did not leave it.", "Nothing in this journey will be remembered by anyone but you. That is not a flaw in it. That is what most continuation is made of."], "question": "A night no one will remember. Here is the question the morning cannot answer for you: what was the hallway?", "choices": [{"label": "A bad night.", "short": "a bad night", "reply": "It was a bad night. Most of the important things are done on bad nights, and most of them are not recorded. That is not the whole answer."}, {"label": "Parenting.", "short": "parenting", "reply": "It was that, and parents will recognize every minute of it. But the hallway is not only for parents. It is for anyone who has stood outside a door at three with a nine o'clock coming."}, {"label": "The Long Middle, in its most ordinary form.", "short": "the Long Middle, in its most ordinary form", "reply": "Yes. No arrival, no medal, no witness. A night that had to be gotten through, and was, and left nothing behind but a slightly worse presentation and a child who slept. Almost all continuation looks like this. The journeys in this series with names are the exceptions. This is the rule."}, {"label": "Nothing. Everyone does it.", "short": "nothing, everyone does it", "reply": "Everyone does it, and no one records it, and that is exactly why this journey has no name. Everyone does it is the highest praise the Long Middle gets."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another 3:07. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Your partner", "says": "One line for the next hallway. Start with I did.", "options": ["I did go in the third time the same as the first.", "I did not let 3:07 decide the morning.", "I did sit in the chair and stop looking at the clock."]}, "ice": {"question": "One more line, and this one is yours. What is your own hallway at three, the thing no one will ever know you got through?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the hallway", "sub": "Your 3:07, beside theirs", "paragraphs": ["A dark hallway at 3:07, a child crying for the third time, a presentation at nine. You stood where a parent stood, with a partner asleep behind you and a small warm circle of light ahead, and the night asked you what it asked them. You wrote: {1}", "Before the door, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Theirs was every night like this one that no one had counted.", "You refused to let 3:07 decide the morning. Your reason: {3} That refusal is the deferral. Not tonight. Not from the clock.", "Your first step: {4} {overlap}", "After the step, nine was still coming. Inside, you noticed this: {5}", "Then the night did what nights do. The child slept at 3:40. The presentation was fine. No one in the room knew.", "Asked what the hallway was, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["This is what most parents do, most nights. The chair by the night light and not looking at the clock.", "This too. Being in the room is often the whole of what a child needs. A different first step in the same place is still a first step.", "This is the other half of the hallway, and the reason there are two of you. A different first step in the same place is still a first step."], "stepOverlapFree": "The first step was to go in. It always is. A different first step in the same place is still a first step.", "help": {"zero": "You did not wake your partner or even ask them in your head. Most parents do not, at 3:07, and it is the most common mistake in the Long Middle. Next time, at least ask. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to your partner {n} on this journey, even if only in your head. The hallway is easier with two, even when one of them is asleep. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And your own hallway at three, as you named it: {ice}", "closing": "The hallway is dark again and the night light is on. What you carry out of it is not sleep, and it is not the parent. It is the evidence that you know what most continuation is actually made of, and you did it anyway.", "stickerLines": ["Walked with the parent at three a.m.", "A hallway, 3:07."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The night light\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M150,300 L250,300 L240,330 L160,330 Z\" stroke-width=\"4\"/><path d=\"M160,300 L160,260 L240,260 L240,300\" stroke-width=\"3\"/><path d=\"M200,260 C160,250 150,200 200,170 C250,200 240,250 200,260 Z\" stroke-width=\"3\"/><path d=\"M200,120 L200,140 M150,150 L164,164 M250,150 L236,164 M120,200 L140,200 M280,200 L260,200\" stroke-width=\"2\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
    '1':{text:A[1],red:true},'2':{text:A[2],red:true},'3':{text:A[3],red:true},'4':{text:A[4],red:true},'5':{text:A[5],red:true},
