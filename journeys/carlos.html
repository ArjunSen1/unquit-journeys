<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Carlos Mendes, the good day redesigned</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Carlos Mendes and Dr. Fontes are composites from Chapter Fourteen of The Unquit Stories.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "carlos", "title": "Carlos Mendes, the good day redesigned", "subtitle": "A desk in Sao Paulo. Eight in the morning. Two hours staring at your own drawings.", "object": "The log", "sticker": "The log.", "footer": "Carlos Mendes and Dr. Fontes are composites from Chapter Fourteen of The Unquit Stories.", "arrive": {"heading": "You are standing where Carlos Mendes stood.", "paragraphs": ["For twenty years he measured his days by output. A structural engineer in Sao Paulo, twelve-hour days, how much designed, reviewed, approved, completed. He was efficient and prolific and he believed the twelve hours were evidence that he was serious.", "He is forty-four. This morning he arrived at his desk and could not begin. He has been sitting here for two hours looking at drawings he made himself and feeling nothing. Not resistance. Not fear. Nothing. The engine that ran for twenty years is making no sound.", "He will take medical leave. His doctor will call it exhaustion. His wife will call it predictable. A colleague will call twice and then stop calling. The first two weeks will be the worst, because without output he does not know who he is.", "Now Carlos steps aside and you step in. The desk, the drawings, the silence where the engine was and the twenty years are his. What a good day is, from here, is yours."], "button": "Sit down at the desk"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The drawings are good. You know they are good because you made them. The cursor is blinking. It has been blinking for two hours.", "question": "What are you feeling right now?", "placeholder": "Say it to the drawings. They cannot report you.", "helper": {"who": "Dr. Fontes, a therapist who says very little, at the first session", "says": "I am not going to ask what is wrong. I am going to ask what you feel when you sit at that desk. Take your time.", "options": ["I feel nothing, and I have been tired before, and this is not tired. Tired has a sound. This has none.", "I feel like a tool left on a shelf. Not broken. Not in use. Useless is a different word from tired and it is the right one.", "I feel that I built my whole sense of myself out of output, and the output has stopped, and I do not know what is left standing."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before anything is decided about the work, take an inventory. Not of the drawings, and not of Carlos. Of yourself.", "question": "What have you already done, in your own life, that proves you can be someone when you are not producing anything?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Dr. Fontes", "says": "I can tell you what the man in that chair carries, from the little he has said. Twenty years of building things that do not fall down. A wife who called this predictable, which means someone has been watching him carefully for a long time. And a morning where he sat for two hours and did not pretend. Now you tell me what you carry. Finish one of these.", "options": ["A time I was someone without producing anything: ", "A time I stopped and did not pretend I had not: ", "A time I noticed a good moment that was not an achievement: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence at the desk is: if I cannot produce, I am nothing. It sounds like a fact about you. It is a measuring instrument that has only ever had one scale. You do not have to redesign your life this morning. You only have to refuse to let a broken instrument take the reading.", "question": "What is the one reason you will not decide today?", "placeholder": "Not a return-to-work plan. One reason the instrument does not get the vote.", "helper": {"who": "Dr. Fontes", "says": "You have measured every day for twenty years with one instrument. It stopped. That does not mean the days stopped. Tell me why you will wait.", "options": ["Because the engine stopped this morning and I have not yet looked at anything but the engine.", "Because my wife called this predictable, which means it was coming for years, and a thing that was coming for years is not decided in a morning.", "Because I do not know what a good day is without output, and I should find out before I decide I cannot have one."]}}, {"n": 4, "name": "One step", "prompt": "Not a new career. Not a return date. One step, small enough to finish before you leave the desk.", "question": "What is it?", "placeholder": "Something that has nothing to do with output.", "helper": {"who": "Dr. Fontes", "says": "Tonight, before you sleep, write one sentence describing a moment that felt good. Not an achievement. A moment. Then do it tomorrow. What is the smallest version of that you can start today?", "options": ["I will write one sentence tonight about one moment that felt good, and I will not judge whether it counts.", "I will close the drawings, go home, and stand at the kitchen window for five minutes doing nothing at all.", "I will tell my wife she was right, and ask her what she saw coming, and when."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. One sentence is written, or five minutes have passed at a window, or your wife has told you what she saw. The engine is still silent. The drawings are still unfinished.", "question": "What has changed in you?", "placeholder": "Compare it to the blinking cursor.", "helper": {"who": "Dr. Fontes", "says": "Nothing about the work changed. What changed in you?", "options": ["The engine is still off. I noticed a bird from the kitchen window for five minutes and it was the first thing I have measured in a month that was not output.", "I wrote one sentence and it was not about work and it felt like the truest thing I had written in years.", "I am still useless by the old instrument. I have started building a second one."]}}, {"n": 6, "name": "Time passes", "montage": ["He keeps the log. Each evening, one sentence. The first one reads: watched a bird for five minutes from the kitchen window. He keeps it for thirty days before judging whether it is working. It is not measuring output. It is rebuilding the instrument he uses to measure a good day.", "He goes back to work, eventually, on different terms. Fewer hours. A different definition of serious. The colleague who stopped calling does not call again, and Carlos notices that he does not mind.", "He still keeps the log. Some evenings the sentence is about a bridge. Most evenings it is not."], "question": "Twenty years by one measure. Here is the question the log cannot answer for you: what was broken?", "choices": [{"label": "Carlos. He burned out.", "short": "Carlos, he burned out", "reply": "That is what the doctor called it, and it is true as far as it goes. But nothing in him was broken. Something he had been using on himself was."}, {"label": "The engine. Twenty years and it stopped.", "short": "the engine, twenty years and it stopped", "reply": "The engine stopped because it had been asked to run twelve hours a day for twenty years as proof of something. Engines do not break from that. Their owners do."}, {"label": "The instrument. He had only one way to measure a day.", "short": "the instrument, he had only one way to measure a day", "reply": "Yes. Willpower is a resource, not a river. It depletes. What does not deplete is a system you build once, and he built one: one sentence a night, a moment and not an achievement. The good day did not have to be redesigned. The measuring of it did. Most burnout is a scale problem wearing a person's clothes."}, {"label": "Nothing. He just needed rest.", "short": "nothing, he just needed rest", "reply": "Rest was the first two weeks, and they were the worst. Rest does not fix a man who does not know who he is without output. A new instrument does, and it takes thirty days, not two weeks."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another morning when the engine makes no sound. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Dr. Fontes", "says": "One line for the next silent morning. Start with I did.", "options": ["I did write one sentence about a moment that was not an achievement.", "I did not let a broken instrument take the reading.", "I did stand at the window for five minutes and let that count."]}, "ice": {"question": "One more line, and this one is yours. What instrument are you measuring your own days with, and does it have more than one scale?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, at the desk", "sub": "Your silent morning, beside his", "paragraphs": ["Sao Paulo, eight in the morning, two hours into nothing. You sat where Carlos Mendes sat, with good drawings on the screen and no engine to move them, and the desk asked you what it asked him. You wrote: {1}", "Before anything was decided, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was twenty years of things that do not fall down, and a morning where he did not pretend.", "You refused to let a broken instrument take the reading. Your reason: {3} That refusal is the deferral. Not today. Not on one scale.", "Your first step: {4} {overlap}", "After the step, the engine was still silent. Inside, you noticed this: {5}", "Then thirty days did what thirty days do when a man writes one sentence a night. A bird at a kitchen window, a second instrument, a return on different terms, and a log he still keeps.", "Asked what was broken, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this. The first entry in the Good Day Log was the bird at the kitchen window, five minutes. He kept it for thirty days before judging it.", "He did this, and it became the first sentence in the log. The window came before the writing.", "The chapter says his wife called it predictable. It does not say when he asked her what she saw. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step was one sentence a night about a moment that was not an achievement. A different first step in the same place is still a first step.", "help": {"zero": "You did not turn to Dr. Fontes on this journey. Carlos did, and she said almost nothing, and the almost nothing was the point. Next time, sit with someone who will not fill the silence. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to Dr. Fontes {n} on this journey. She said very little, and Carlos said it was the most useful quiet he had ever paid for. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the instrument you measure your own days with, as you named it: {ice}", "closing": "The desk belongs to someone else now. The log is on a shelf at home. What you carry out is not a return date, and it is not Carlos. It is the evidence that when the engine went silent you built a second instrument instead of blaming the first.", "stickerLines": ["Walked with Carlos Mendes.", "Sao Paulo, a morning with no engine."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The log\">\n<g transform=\"rotate(-5 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M120,70 L280,70 L290,80 L290,330 L120,330 Z\" stroke-width=\"4\"/><path d=\"M120,70 L120,330 M140,70 L140,330\" stroke-width=\"2\"/>\n  <path d=\"M164,130 L262,130 M164,160 L240,160 M164,190 L262,190 M164,220 L226,220 M164,250 L262,250\" stroke-width=\"1.8\"/>\n  <path d=\"M262,130 C270,124 276,130 268,136\" stroke-width=\"1.6\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
    '1':{text:A[1],red:true},'2':{text:A[2],red:true},'3':{text:A[3],red:true},'4':{text:A[4],red:true},'5':{text:A[5],red:true},
