<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. The man behind the truck</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. From the opening pages of The Unquit Stories. The man's name was never learned. The stranger with the coffee was the author.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "zero", "title": "The man behind the truck", "subtitle": "A parking lot in Texas. A Wednesday. Ten minutes to four.", "object": "The pelican", "sticker": "The pelican.", "footer": "From the opening pages of The Unquit Stories. The man's name was never learned. The stranger with the coffee was the author.", "arrive": {"heading": "You are standing where a man with no name stood.", "paragraphs": ["He rents this lot by the month. Four hundred dollars, plus the generator. The truck has a pelican painted on the side, holding a taco, and two Texas summers have faded it to something closer to a ghost. The sign in the service window says Closed. The lunch traffic, what there was of it, has been gone for hours.", "It is ten minutes to four on a Wednesday. He is sitting at the picnic table behind the truck with his phone in his hand. Then he is not looking at the phone anymore. He is looking at nothing in particular, in the specific way people look at nothing when they are deciding something large.", "We do not know what he owes or who he loves or how long he has been telling himself one more month. Neither will you. Nobody who saw him that afternoon learned his name. That is the point of this journey. It has no history and no ending. It has only the ten minutes.", "Two carts over, a stranger buying coffee has noticed. He has not walked over. He will think about that for years.", "Now the man steps aside and you step in. The truck, the lot, the faded pelican and the phone in your hand are his. Whether the sign says Open at four o'clock is yours."], "button": "Sit down at the table"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The bench is warm. The generator is off, so the lot is quiet in the way that costs money. Your thumb is resting on a message you have not sent yet.", "question": "What are you feeling right now?", "placeholder": "Say it the way you would never say it to a customer.", "helper": {"who": "The stranger with the coffee, two carts over. This time he walks over.", "says": "I am not going to ask what is wrong. I have a coffee and about ten minutes. Say it to a stranger. It is easier.", "options": ["I feel finished, and the strange part is how calm that feels.", "I feel like I am about to prove right everyone who said this was a bad idea.", "I feel that the message is already written and I only have to press send."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the message goes anywhere, take an inventory. Not of the truck, and not of the man who sat here before you. Of yourself.", "question": "What have you already done, in your own life, that proves you know how to open when there is no reason to open?", "placeholder": "One thing you did. Not one thing you believe.", "fillIn": true, "helper": {"who": "The stranger with the coffee", "says": "I do not know a single thing about you, so I cannot tell you what you carry. That is actually the good news. Nobody here can tell you who you are. You tell me. Finish one of these.", "options": ["A time I opened when there was no reason to open: ", "A time I stayed after everyone else had gone home: ", "A time I called someone instead of deciding alone: "]}}, {"n": 3, "name": "The deferral", "prompt": "The message is drafted. It ends two years in about forty words. It has not been sent. The ice this afternoon is a text message, and the ice is thin in one specific way: it can be sent in one second and cannot be unsent in a lifetime.", "question": "What is the one reason you will not send it at ten to four on a Wednesday?", "placeholder": "Not a business plan. One reason to wait for a different hour.", "helper": {"who": "The stranger with the coffee", "says": "Nobody closes two years of work by text at ten to four on a Wednesday. Whatever you decide, decide it on a Monday morning with coffee. Tell me why you will wait.", "options": ["Because four hours of no one is the worst possible hour to judge two years.", "Because a text message is how you end a date, not a business.", "Because the dinner crowd has not had its turn yet, and it is not their fault the lunch crowd did not come."]}}, {"n": 4, "name": "One step", "prompt": "Ten minutes to four. The phone is still in your hand. Not a turnaround plan. Not next month's rent. One step, small enough to finish before the hour changes.", "question": "What is it?", "placeholder": "Something you can do with what is already on the table.", "helper": {"who": "The stranger with the coffee", "says": "You picked that phone up to send something. Is there anything else it can do?", "options": ["I will make a call instead of sending the message. One person. Under a minute.", "I will flip the sign. Not for the day. For one hour.", "I will turn the generator on and wipe the counter. If one person comes, I will be ready."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. You hung up, or the sign says Open, or the generator is running and the counter is clean. The lot has not changed. No one has pulled in.", "question": "What has changed at the table?", "placeholder": "Compare it to ten minutes ago.", "helper": {"who": "The stranger with the coffee", "says": "Nothing in the lot moved. Something at this table did. What was it?", "options": ["The lot is the same. I am standing instead of sitting.", "It is three fifty-two and I am still in business. That is two minutes longer than I was going to be.", "I said it out loud to someone and it got smaller."]}}, {"n": 6, "name": "Time passes", "montage": ["Here is what happens next. We do not know.", "The man who stood here put the phone down, made a call that lasted less than a minute, walked to the service window and flipped the sign from Closed to Open. It was three fifty in the afternoon. The stranger with the coffee watched him do it, finished his coffee and drove away.", "He never learned the man's name. He does not know if the truck thrived or closed, if the call was to a wife or a bank or a friend, if the dinner crowd came. He has thought about him for years.", "That is the whole record. One flipped sign, one witness, no ending."], "question": "You will never know how this one ends. So here is the question: what did flipping the sign decide?", "choices": [{"label": "Whether the truck survived.", "short": "whether the truck survived", "reply": "No. One hour of dinner service decided nothing about the truck. Trucks are decided by rent, weather and a road that does or does not carry traffic. The sign was never a business decision."}, {"label": "Nothing. It was one more hour.", "short": "nothing, one more hour", "reply": "It was one more hour. Look at what the hour contained. A man who had decided at three forty was undecided at three fifty. That is not nothing. That is the entire game, played in ten minutes at a picnic table."}, {"label": "Who he was at three fifty on a Wednesday.", "short": "who he was at three fifty on a Wednesday", "reply": "Yes. Not whether the business lived. Whether he was a person who flipped the sign. Outcomes are decided by markets and weather. That one was decided by him, in a parking lot, with no one watching except a stranger who never forgot it."}, {"label": "Whether anyone noticed.", "short": "whether anyone noticed", "reply": "Someone did, and the man never knew it. Most unquit moments are witnessed by exactly one person who never says so. Assume that person is there. Assume they needed to see it."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another three fifty on another Wednesday. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "The stranger with the coffee", "says": "I am going to drive away in a minute and I will never know your name. Give me one sentence to carry. Start it with I did.", "options": ["I did not let ten minutes to four on a Wednesday decide two years.", "I did make the call instead of sending the message.", "I did flip the sign for one hour when there was no reason to."]}, "ice": {"question": "One more line, and this one is yours. Where is the Closed sign in your own life right now?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, behind the truck", "sub": "Your ten minutes, beside his", "paragraphs": ["A parking lot in Texas, ten minutes to four on a Wednesday. You sat where a man with no name sat, with a faded pelican over your shoulder and a phone in your hand, and the afternoon asked you what it asked him. You wrote: {1}", "Before anything was decided, you did what every unquitter does first. You looked for evidence, and it had to be your own, because no one here knows anything about you. You wrote: {2} His evidence we will never know. He carried it anyway. It got him to the window.", "You refused to let ten minutes to four decide. Your reason: {3} That refusal is the deferral. Not at this hour. Not by text.", "Your first step: {4} {overlap}", "After the step, nothing in the lot had changed. At the table, you noticed this: {5}", "Then time did what it does when no one is recording. The man flipped the sign at three fifty. A stranger watched, finished his coffee and drove away. Nobody knows the rest.", "Asked what the sign decided, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He made the same choice. He put the phone down, made a call that lasted less than a minute, and stood up.", "He did this too, at three fifty, with the lunch traffic gone for hours. Whether the Open sign stayed up for an hour or for the night, no one knows.", "He made a call and flipped the sign. He did not clean the counter first, as far as anyone saw. A different first step behind the same truck is still a first step."], "stepOverlapFree": "His first step was a call that lasted under a minute, and then the sign. A different first step behind the same truck is still a first step.", "help": {"zero": "You did not talk to the stranger, and neither did he. He made his call to someone else, someone the stranger never saw. Next time, try the door. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You talked to the stranger {n} on this journey. The man behind the truck made one call, under a minute, to someone no one else saw. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the Closed sign in your own life, as you named it: {ice}", "closing": "The truck may be gone. The pelican has faded further. What you carry out of the lot is not an outcome, because there is none, and it is not him. It is the evidence that at ten minutes to four you were still deciding, and then you decided.", "personalNote": {"from": "A note from Arjun", "text": "The stranger with the coffee was me. It was a Wednesday, and I stopped for coffee at the cart next to his truck, and I watched a man decide something large and then flip a sign. I did not walk over. I have thought about him for years, and about what I might have said. This journey is the walk I did not take. You just took it for me. Thank you for showing me, one more time, that there is always a way. I wish I had had you in my Unquit Circle that afternoon. In a way, now I do."}, "stickerLines": ["Walked with the man behind the truck.", "Ten minutes to four."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The pelican\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M150,250 C110,250 90,290 118,318 C150,350 230,350 262,318 C282,298 276,262 250,246\" stroke-width=\"4\"/>\n  <path d=\"M162,266 C202,258 238,272 256,300\" stroke-width=\"2.2\"/>\n  <path d=\"M262,318 L292,332 M258,326 L284,344\" stroke-width=\"3\"/>\n  <path d=\"M150,250 C150,200 158,150 176,122\" stroke-width=\"4\"/>\n  <path d=\"M176,122 C186,96 214,94 226,116\" stroke-width=\"4\"/>\n  <path d=\"M226,116 C230,124 232,134 226,142\" stroke-width=\"4\"/>\n  <circle cx=\"212\" cy=\"116\" r=\"3\" fill=\"#8e1b1b\" stroke=\"none\"/>\n  <path d=\"M226,142 L332,150\" stroke-width=\"4\"/>\n  <path d=\"M226,142 C214,170 228,196 260,192 C290,188 318,166 332,150\" stroke-width=\"3\"/>\n  <path d=\"M244,190 C244,212 248,230 250,246\" stroke-width=\"4\"/>\n  <path d=\"M252,174 A22,22 0 0 1 296,166 L300,172 L252,180 Z\" stroke-width=\"2.4\"/>\n  <path d=\"M258,168 L266,160 L274,167 L282,158 L290,166\" stroke-width=\"1.8\"/>\n  <path d=\"M170,346 L170,378 M210,350 L210,378\" stroke-width=\"3\"/>\n  <path d=\"M154,378 L188,378 M194,378 L228,378\" stroke-width=\"3\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
