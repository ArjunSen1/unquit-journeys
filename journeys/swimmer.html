<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. The swimmer in Indianapolis</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. From the opening pages of The Unquit Athlete. The author never learned her name. Nobody knows how her story ended.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "swimmer", "title": "The swimmer in Indianapolis", "subtitle": "A parking lot outside a natatorium. The meet is over. Three hundredths of a second.", "object": "The swim cap", "sticker": "The cap.", "footer": "From the opening pages of The Unquit Athlete. The author never learned her name. Nobody knows how her story ended.", "arrive": {"heading": "You are standing where a woman with no name sat.", "paragraphs": ["She missed qualifying for the Olympic trials by three hundredths of a second. A margin smaller than the human eye can perceive in real time. She had trained four years for this meet. She had reorganized her whole life around one qualification standard, one pool, one morning.", "The meet is over. There is no swim-off, no appeal, no next heat. The results are posted. She is in her car in the parking lot with her swim cap in her hands.", "We do not know her name or her event or what happened to her afterward. Someone saw her in the lot, and saw what she did next, and wrote a book because of it. That is the whole record.", "Now she steps aside and you step in. The car, the cap, the number and the closed building are hers. What you do in the next ten minutes is yours."], "button": "Sit in the car"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The cap is damp in your hands. Through the windshield, the natatorium doors are still open, and people who qualified are coming out with their bags. The number on the results sheet had two zeroes and a three in it.", "question": "What are you feeling right now?", "placeholder": "Say it to the cap. No one is in the car.", "helpLabel": "Look in the mirror.", "helper": {"who": "Your own face in the rearview mirror. There is no one else here.", "says": "Nobody is coming to the car. Say it to yourself and see if it is true.", "options": ["I feel that four years came down to a margin I cannot even see, and I do not know how to be angry at three hundredths of a second.", "I feel that everyone walking out of that building is carrying a bag and I am carrying a cap, and that is the whole difference, and it is enormous.", "I feel like I do not know what I do tomorrow morning, because for four years I knew, to the minute."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before anything is decided about what you are now, take an inventory. Not of the race, and not of her. Of yourself.", "question": "What have you already done, in your own life, that proves you can be who you are without the result confirming it?", "placeholder": "One thing you did. Not one thing you believe.", "fillIn": true, "helpLabel": "Look again.", "helper": {"who": "The mirror", "says": "No one knows anything about the woman in this car except that she trained four years and missed by three hundredths. So no one can tell you what you carry. You tell you. Finish one of these.", "options": ["A time I was who I am without the result confirming it: ", "A time I got up the morning after the number and did the thing anyway: ", "A time I lost by a margin no one could see, and kept my shape: "]}}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the car is: it is over. It is true about the meet. It is pretending to be true about you. You do not have to decide what you are in a parking lot with a damp cap. You only have to refuse to let the results sheet decide it.", "question": "What is the one reason you will not decide today?", "placeholder": "Not a training plan. One reason the number does not get the vote.", "helpLabel": "Ask the mirror.", "helper": {"who": "The mirror", "says": "The meet is over. That is a fact. Tell yourself why the fact does not get to decide the rest.", "options": ["Because three hundredths of a second is a measurement of a morning, and I am not a morning.", "Because the number knows how fast I swam. It does not know what I am. Those are different columns.", "Because I have not been in the water since the number, and I have never once made a decision about swimming from a parking lot."]}}, {"n": 4, "name": "One step", "prompt": "The natatorium doors are still open. Warm-down lanes are still wet. Not next season. Not what you do now. One step, small enough to finish before the building locks.", "question": "What is it?", "placeholder": "Something you can do with a cap and an open door.", "helpLabel": "One more look.", "helper": {"who": "The mirror", "says": "The building is open for twenty more minutes. What is the smallest thing you can do with a cap and an open door?", "options": ["I will put the cap back on, go back inside, and get in the water. Not to qualify. The meet is over. Because I am a swimmer and the water is where I belong.", "I will walk back in and shake the hand of the woman who beat me by three hundredths. She did not take anything from me.", "I will sit here five more minutes with the number, let it be exactly what it is, and then decide whether the doors are worth walking through."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. You are in the water, or a hand has been shaken, or the five minutes have passed and the number is exactly the size it was. Nothing about the results sheet has changed.", "question": "What has changed in you?", "placeholder": "Compare it to the cap in your hands.", "helpLabel": "Tell the mirror.", "helper": {"who": "The mirror", "says": "The number is the same number. What changed?", "options": ["The number is the same. I am in the water anyway. Apparently those two things do not depend on each other.", "I let it be what it was. It was three hundredths. It was not me.", "I do not know what I do tomorrow morning. I know what I did tonight. That is the first thing I have known since the results went up."]}}, {"n": 6, "name": "Time passes", "montage": ["Here is what the record says. She sat with the number for a few minutes and let it be what it was. Then she put her cap back on, went back inside, and got in the water. Not to qualify. Because some decisions about who you are do not wait for the results to be favorable before they ask to be made.", "That is all anyone knows. Whether she made the next trials, whether she swam again, what her name was. The person who saw her never learned it and never forgot her.", "One flipped cap, one witness, no ending."], "question": "You will never know how her story ended. Here is the question: what did getting back in the water decide?", "choices": [{"label": "Whether she made the next trials.", "short": "whether she made the next trials", "reply": "No. One warm-down swim after a lost meet decided nothing about the next four years. The water was not a training decision."}, {"label": "Nothing. The meet was over.", "short": "nothing, the meet was over", "reply": "The meet was over. Look at what the swim contained: a woman who had been defined by a number at four o'clock was, at four fifteen, a swimmer in a pool. That is not nothing. It is the entire game, played in one length of a warm-down lane."}, {"label": "Who she was at four fifteen on the worst afternoon of her career.", "short": "who she was at four fifteen on the worst afternoon", "reply": "Yes. Not whether she would qualify. Whether she was a person who got back in. Results are decided by three hundredths of a second and a hundred other things. That one was decided by her, in a parking lot, with a damp cap, and one stranger who never forgot it."}, {"label": "Whether anyone was watching.", "short": "whether anyone was watching", "reply": "Someone was, and she never knew, and a book exists because of it. Most unquit moments are witnessed by exactly one person who never says so. Assume that person is there."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another number with zeroes in it, another parking lot. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helpLabel": "Last look.", "helper": {"who": "The mirror", "says": "One line for the next results sheet. Start with I did.", "options": ["I did put the cap back on.", "I did let the number be exactly what it was, and not one thing more.", "I did get in the water when it could not change anything."]}, "ice": {"question": "One more line, and this one is yours. What is the number in your own life right now, and where is the water?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the parking lot", "sub": "Your ten minutes, beside hers", "paragraphs": ["A parking lot in Indianapolis, the meet over, three hundredths of a second. You sat where a woman with no name sat, with a damp cap in your hands and the natatorium doors still open, and the afternoon asked you what it asked her. You wrote: {1}", "Before anything was decided, you did what every unquitter does first. You looked for evidence, and it had to be your own, because no one knows anything about her but the number: {2}", "You refused to let the results sheet decide what you are. Your reason: {3} That refusal is the deferral. Not today. Not from a number.", "Your first step: {4} {overlap}", "After the step, the results sheet said what it said. Inside, you noticed this: {5}", "Then nothing more was recorded. She got in the water. Someone saw. That is all.", "Asked what getting back in the water decided, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["She did exactly this. Cap on, back inside, into the water, not to qualify. It is the reason the book exists.", "The record does not say. It says she went back into the building, and it does not say who she spoke to. A different first step in the same parking lot is still a first step.", "She did this first. A few minutes with the number, letting it be what it was. Then the cap. A different first step in the same parking lot is still a first step."], "stepOverlapFree": "Her first step was a few minutes with the number, and then the cap back on. A different first step in the same parking lot is still a first step.", "help": {"zero": "You did not look in the mirror. Neither, as far as anyone knows, did she. She had no one in that car and no one at the door. This is the second journey in the series where the help is only yourself, and you continued. Remember that.", "some": "You looked in the mirror {n} on this journey. She had no one in the car either. Some journeys are like that. The help was there anyway, in the one person who has been in every car you have ever sat in."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the number in your own life, as you named it: {ice}", "closing": "The natatorium locks at five. What you carry out of the lot is not a qualification, because there was none, and it is not her. It is the evidence that with the number on the wall and the meet over, you put the cap back on.", "stickerLines": ["Walked with the swimmer in Indianapolis.", "Three hundredths of a second."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The cap\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n\n  <path d=\"M96,232 C96,150 150,110 200,110 C250,110 304,150 304,232 L292,236 C270,224 240,218 200,218 C160,218 130,224 108,236 Z\" stroke-width=\"4\"/>\n  <path d=\"M120,200 C150,176 250,176 280,200\" stroke-width=\"1.6\"/>\n  <path d=\"M140,150 C170,134 230,134 260,150\" stroke-width=\"1.6\"/>\n  <path d=\"M108,236 C130,250 160,256 200,256 C240,256 270,250 292,236\" stroke-width=\"2.4\"/>\n  <path d=\"M170,300 C182,292 218,292 230,300\" stroke-width=\"1.4\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
    '1':{text:A[1],red:true},'2':{text:A[2],red:true},'3':{text:A[3],red:true},'4':{text:A[4],red:true},'5':{text:A[5],red:true},
