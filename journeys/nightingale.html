<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Florence Nightingale, Scutari</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from the record of the Crimean War hospitals and Nightingale's own reports, paraphrased, and from Unquit: The Oldest Choice. The lamp is the famous object. The ledger is the one that saved lives.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "nightingale", "title": "Florence Nightingale, Scutari", "subtitle": "A barrack hospital above the Bosphorus. November 1854. Week one.", "object": "The ledger", "sticker": "The ledger.", "footer": "Drawn from the record of the Crimean War hospitals and Nightingale's own reports, paraphrased, and from Unquit: The Oldest Choice. The lamp is the famous object. The ledger is the one that saved lives.", "arrive": {"heading": "You are standing where Florence Nightingale stood.", "paragraphs": ["She arrived on November 4, 1854, with thirty-eight nurses she had recruited and trained, at a Turkish army barracks the British were using as a hospital. It has four miles of corridors and no supplies. The sewers run under the wards. Men lie on the floor in their uniforms. The death rate is not from wounds. It is from what happens after the wounds, in this building.", "The army doctors do not want her. Women, and volunteers, and a woman with opinions. They have told her nurses to wait. For days she has waited, in a building where men die of waiting.", "Tomorrow the wounded from a battle called Inkerman will arrive by the shipload, more than the doctors can touch, and the door will open whether the doctors want it to or not. She does not know that tonight. Tonight she has a ledger, a candle, thirty-eight women, and a wall of men who have decided she is not needed.", "Now Florence steps aside and you step in. The corridors, the ledger, the closed door and the sewer under the ward are hers. What the door opens onto is yours."], "button": "Sit down with the ledger"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The candle is the only light in a room the size of a church. The ledger is open to a blank page. You can hear the wards through the wall and you are not allowed in them.", "question": "What are you feeling right now?", "placeholder": "Say it to the ledger, not to the doctors.", "helper": {"who": "Sidney Herbert, the Secretary at War, by letter, a fortnight away", "says": "I sent you. I cannot make them let you in. Tell me what you find, and tell me first what you feel.", "options": ["I feel that I have brought thirty-eight women four thousand miles to sit in a corridor while men die on the other side of a wall.", "I feel that the doctors are not cruel, they are frightened, and that frightened men guard doors.", "I feel that no one in this building is counting, and that whatever is killing these men is hiding in the absence of a count."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the door opens, take an inventory. Not of the hospital, and not of Florence. Of yourself.", "question": "What have you already done, in your own life, that proves you can be unwelcome where you are most needed and stay?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Sidney Herbert, by letter", "says": "I will tell you what I know of the woman I sent. She refused a marriage and a drawing room for ten years to learn a trade her family thought was beneath her. She ran a hospital in Harley Street and made it run. She has been unwelcome in every room that later needed her. Now you tell me what you carry. Finish one of these.", "options": ["A time I was unwelcome where I was most needed, and stayed: ", "A time I counted what no one else was counting, and the count changed everything: ", "A time I fixed the system instead of the symptom: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the corridor is: they will not let us in, so we cannot help. It sounds like a fact about the door. It is a fact about this week. You do not have to force the wards tonight. You only have to refuse to let the closed door decide the mission.", "question": "What is the one reason you will not decide this week?", "placeholder": "Not a plan for the doctors. One reason the door does not get the vote.", "helper": {"who": "Sidney Herbert, by letter", "says": "Doors in army hospitals open when the beds are full. Tell me why you will wait for that and not for permission.", "options": ["Because the wounded from the last battle have not arrived yet, and when they do there will not be enough doctors to keep a door shut.", "Because a week of waiting is a week of counting, and I can count from a corridor.", "Because they have not refused help. They have refused women. The wounded will settle that argument for me."]}}, {"n": 4, "name": "One step", "prompt": "Not the reform of army medicine. Not the lamp. One step, small enough to finish tonight, with a ledger, a candle and thirty-eight women in a corridor.", "question": "What is it?", "placeholder": "Something that can be done without permission.", "helper": {"who": "Sidney Herbert, by letter", "says": "You cannot enter the wards. What can you do with what you can reach?", "options": ["I will begin the count tonight: how many men, how many deaths, and of what, from the records the orderlies keep and no one reads.", "I will send the thirty-eight to the kitchens and the laundry, where no doctor has thought to stand guard, and begin there.", "I will write to you tonight, plainly, what this building is, so that the truth reaches London before the excuses do."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The count has begun, or the kitchens have thirty-eight women in them, or a letter is on its way to London. The wards are still closed to you. The sewer still runs under them.", "question": "What has changed in you?", "placeholder": "Compare it to the blank page.", "helper": {"who": "Sidney Herbert, by letter", "says": "The door has not opened. What has?", "options": ["The door is the same door. I am no longer waiting at it. I am working beside it.", "I have a number now. Nobody had a number. A number is a door that opens from the inside.", "We are unwelcome in the wards and welcome in the kitchen, and the kitchen feeds the wards. That is a beginning."]}}, {"n": 6, "name": "Time passes", "montage": ["The wounded from Inkerman arrive and the doctors have no time to guard doors. She and her nurses enter the wards. She works twenty-hour days, walks the corridors at night with a lamp, and is remembered for the lamp.", "She should be remembered for the ledger. She counts everything: admissions, deaths, causes. She discovers that most of the men are dying not of wounds but of cholera, typhus and dysentery, from the sewers and the overcrowding and the filth. She forces the sanitation. The death rate falls from forty percent to two.", "She goes home and invents a way of drawing the numbers so that Parliament cannot look away, a wedge diagram of deaths by cause and month. She reforms army medicine and then civilian nursing, mostly from a couch, mostly by letter, for fifty years. She was the first woman elected to the Royal Statistical Society."], "question": "The lamp is the object everyone remembers. Here is the question the lamp cannot answer for you: what saved the men at Scutari?", "choices": [{"label": "Nursing. The care, the presence, the lamp at night.", "short": "nursing, the care and the lamp", "reply": "It mattered to the men, and she never dismissed it, and it is the picture on the postage stamps. It did not move the death rate. Something else did."}, {"label": "Getting through the door.", "short": "getting through the door", "reply": "That took a battle to accomplish and it was necessary. But the door opened onto the same sewer. Being inside a building that kills people is not the same as changing the building."}, {"label": "The count. A ledger that showed what was actually killing them.", "short": "the count, a ledger that showed what was actually killing them", "reply": "Yes. She is remembered for a gesture and she saved lives with a system. Nobody had counted. When she counted, the killer had a name and an address, and the address was under the floor. Systems outlast willpower, and always have. The lamp is what a person does at night. The ledger is what a person builds so that the next night is different."}, {"label": "The battle of Inkerman.", "short": "the battle of Inkerman", "reply": "Grimly true. The wounded opened the door that the doctors would not. But a flood of wounded into an unchanged hospital would only have raised the count. The count is what changed the hospital."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another closed door and another room where no one is counting. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Sidney Herbert, by letter", "says": "One line for the next corridor. Start with I did.", "options": ["I did count what no one was counting.", "I did work beside the door I was not allowed through.", "I did fix the building, not only the night."]}, "ice": {"question": "One more line, and this one is yours. Where in your own life is no one counting, and what is hiding in the absence of the count?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the corridor", "sub": "Your first week, beside hers", "paragraphs": ["Scutari, November 1854, week one. You sat where Florence Nightingale sat, with a ledger open to a blank page and the wards on the other side of a wall you were not allowed through, and the building asked you what it asked her. You wrote: {1}", "Before the door opened, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Hers was ten years of refusing a drawing room to learn a trade, and every room she was ever unwelcome in.", "You refused to let a closed door decide the mission. Your reason: {3} That refusal is the deferral. Not this week. Not from a door.", "Your first step: {4} {overlap}", "After the step, the wards were still closed and the sewer still ran. Inside, you noticed this: {5}", "Then the wounded came, and the door opened on its own, and a woman with a ledger found the killer under the floor. Forty percent to two. A lamp on the stamps, a wedge diagram in Parliament, and fifty years of letters from a couch.", "Asked what saved the men at Scutari, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["She did this. The counting began at once and it is the reason she is remembered by statisticians as well as by nurses.", "She did this too. The nurses were set to work on food and linen before the doctors relented on the wards. A different first step in the same place is still a first step.", "She did this, relentlessly. Her letters to Herbert are how London learned what Scutari was. A different first step in the same place is still a first step."], "stepOverlapFree": "Her first step was to count, and to write to London, and to put thirty-eight women to work where no one had thought to stop them. A different first step in the same place is still a first step.", "help": {"zero": "You did not write to Sidney Herbert. Florence did, constantly, and he moved the government for her. Next time, write to the one who sent you. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You wrote to Sidney Herbert {n} on this journey. Nightingale's letters to him are a book in themselves, and they moved a government. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the uncounted thing in your own life, as you named it: {ice}", "closing": "The barracks at Scutari still stand. What you carry out of the corridor is not a lamp, and it is not Florence. It is the evidence that unwelcome where you were most needed, you counted what no one was counting.", "stickerLines": ["Walked with Florence Nightingale.", "Scutari, November 1854."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The ledger\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M100,80 L300,80 L300,320 L100,320 Z\" stroke-width=\"4\"/><path d=\"M200,80 L200,320\" stroke-width=\"2\"/>\n  <path d=\"M116,110 L184,110 M216,110 L284,110\" stroke-width=\"2.4\"/>\n  <path d=\"M116,140 L184,140 M116,165 L184,165 M116,190 L184,190 M116,215 L184,215 M116,240 L184,240 M116,265 L184,265 M116,290 L184,290\" stroke-width=\"1.2\"/>\n  <path d=\"M216,290 L216,160 L232,160 L232,290 M244,290 L244,200 L260,200 L260,290 M272,290 L272,250 L284,250 L284,290\" stroke-width=\"2.4\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
