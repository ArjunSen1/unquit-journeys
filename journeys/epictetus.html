<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Epictetus, the slave</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from the Discourses and the Enchiridion, as recorded by Arrian, paraphrased, and from Unquit: The Oldest Choice. The lamp is his own anecdote.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "epictetus", "title": "Epictetus, the slave", "subtitle": "A house in Rome. Around AD 70. A man who owns nothing, including himself.", "object": "The lamp", "sticker": "The clay lamp.", "footer": "Drawn from the Discourses and the Enchiridion, as recorded by Arrian, paraphrased, and from Unquit: The Oldest Choice. The lamp is his own anecdote.", "arrive": {"heading": "You are standing where a slave stood.", "paragraphs": ["He was born a slave in Hierapolis and brought to Rome as the property of a freedman of the emperor. He is lame in one leg. The stories disagree about why, and the one he preferred is that his master twisted it until it broke while he said, calmly, that it was going to break, and then, when it did, that he had said so.", "He has permission to study with a Stoic teacher named Musonius Rufus. That is the whole of what he has: a lesson, a body that belongs to someone else, and a leg that does not work. He will not be freed for years. He will later be banished from Rome with every other philosopher, and will teach for the rest of his life in a small town in Greece, and will own almost nothing, and one night a thief will steal his iron lamp, and he will replace it with a clay one and say the thief paid too much for it.", "None of that has happened. Tonight he is a slave in a house in Rome, and he has been told, by a master with the law behind him, that he is nothing.", "Now Epictetus steps aside and you step in. The leg, the lesson, the master and the word nothing are his. What is still in your control is yours."], "button": "Sit down in the slaves' quarters"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The quarters are dark. The leg aches the way it does in cold. Upstairs, the household is at dinner. You were told today, in front of others, what you are worth, and the number was zero.", "question": "What are you feeling right now?", "placeholder": "Say it as a man who owns nothing, not as a philosopher who owns a school.", "helper": {"who": "Musonius Rufus, your teacher, who has been a slave's teacher before", "says": "They have told you what you are. Before we discuss what is true, tell me what you feel.", "options": ["I feel that the law agrees with him. I am property, and property does not have a case.", "I feel the leg, and I feel that they can break the rest of me the same way, and that there is no part of me they cannot reach.", "I feel that I have been given a lesson and a broken leg by the same city, and I do not know which one is the true gift."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before anything is decided about what you are worth, take an inventory. Not of the household, and not of Epictetus. Of yourself.", "question": "What have you already done, in your own life, that proves you can keep something no one can take?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Musonius Rufus", "says": "I can tell you what the man in front of me carries, because I have watched him. He was told the leg would break and did not scream. He was told he was nothing and came to his lesson anyway, tonight, with the leg. He owns not one thing in this city and he has never once asked me for anything but the next idea. Now you tell me what you carry. Finish one of these.", "options": ["A time I kept something no one could take: ", "A time I was told I was nothing and came to the lesson anyway: ", "A time I chose my response when everything else was chosen for me: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the quarters is: they own everything, so there is nothing left that is mine. It sounds like law. It is the law of the house, and the house is not the whole of what exists. You do not have to solve slavery tonight. You only have to refuse to let the master's count of you be the final count.", "question": "What is the one reason you will not decide tonight?", "placeholder": "Not an argument with Rome. One reason the master's number does not get the vote.", "helper": {"who": "Musonius Rufus", "says": "He counted what he owns. Did he count everything? Tell me why you will not accept his arithmetic tonight.", "options": ["Because he can break the leg and he cannot make me scream. I noticed that today. It means there is a line, and the line is mine.", "Because the number was his, and I have not yet done my own count.", "Because I have a lesson to finish, and a man with a lesson is not nothing, whatever the deed says."]}}, {"n": 4, "name": "One step", "prompt": "Not freedom. Not a school in Greece. One step, small enough to finish tonight, in the dark, with a leg that does not work.", "question": "What is it?", "placeholder": "Something that is in your control.", "helper": {"who": "Musonius Rufus", "says": "Some things are in our control and some are not. Do not tell me the theory. Tell me the smallest thing you will do with the part that is yours.", "options": ["I will make the list tonight. Two columns. What is theirs: the body, the leg, the deed, the dinner upstairs. What is mine: what I make of every one of those.", "I will finish tonight's lesson before I sleep, exactly as if I were free, because the lesson does not know the difference.", "I will not hate him. Not for his sake. Because hatred would be one more thing in the house that is not mine."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The two columns are written, or the lesson is finished, or one thing has been refused entry to the only room you own. The deed still has your name on it as property. The leg still aches.", "question": "What has changed in you?", "placeholder": "Compare it to the number zero.", "helper": {"who": "Musonius Rufus", "says": "The house is the same house. What is different in you?", "options": ["The leg is the same. The list is short on my side and it is not empty. I have never been so sure of anything I own.", "He counted the body and the deed. He forgot to count the response. It turns out that is the only column that matters.", "I am still property under the law. I have found the one room in the house the law does not enter."]}}, {"n": 6, "name": "Time passes", "montage": ["He is freed, eventually, when his master dies or relents. He teaches in Rome until the emperor Domitian banishes every philosopher from the city. He walks to Nicopolis, in Greece, and opens a school, and teaches there for the rest of his life, lame, poor, and by every account content.", "He writes nothing down. A student named Arrian takes notes, and the notes become the Discourses and the Enchiridion, the handbook, which begins with the sentence he found in the slaves' quarters: some things are in our control and others are not. A thief steals his iron lamp. He buys a clay one and says the thief has paid too much for it. Emperors read his handbook. A second-century emperor keeps it by his bed.", "What he found as a slave, the one thing no one could take, became the thing he taught to free men for forty years, because they had not found it either."], "question": "He was told he was nothing and the law agreed. Here is the question the handbook cannot answer for you: what did he own?", "choices": [{"label": "Nothing. That was the point.", "short": "nothing, that was the point", "reply": "He owned nothing the deed could count, and he would tell you that was very nearly the point, and not quite. There was one thing off the deed."}, {"label": "His mind.", "short": "his mind", "reply": "Closer, and it is what people say. But a mind can be broken, and he knew it, and he watched them try with the leg. What he owned was smaller and harder than a mind."}, {"label": "His response. The only thing in the house the law did not reach.", "short": "his response, the only thing in the house the law did not reach", "reply": "Yes. Not the body, not the leg, not the freedom, not even the thought. What he made of each of those. The Stoic wall is one sentence long: some things are in our control and others are not, and the continuing is in the first column. He found it in the dark with a broken leg and taught it to emperors. It is the oldest form of Unquit there is, and it was discovered by a slave."}, {"label": "A clay lamp, eventually.", "short": "a clay lamp, eventually", "reply": "Also true, and it is the best joke in ancient philosophy. The thief took the iron one and paid for it with his character. Epictetus kept the clay one and lost nothing. He had already done the two columns. He knew which one the lamp was in."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another house where someone with the law behind them counts you and gets zero. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Musonius Rufus", "says": "One line for the next count. Start with I did.", "options": ["I did my own count and found one column that was mine.", "I did finish the lesson as if I were free.", "I did not let hatred into the only room I owned."]}, "ice": {"question": "One more line, and this one is yours. What in your own life is being counted by someone else, and what is in the column they forgot?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the slaves' quarters", "sub": "Your count, beside his", "paragraphs": ["A house in Rome, around AD 70. You sat where a slave sat, with a leg that did not work and a master's number for you, and the dark asked you what it asked him. You wrote: {1}", "Before anything was decided, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was a leg broken without a scream and a lesson attended the same night.", "You refused to let the master's count be the final count. Your reason: {3} That refusal is the deferral. Not tonight. Not on his arithmetic.", "Your first step: {4} {overlap}", "After the step, the deed still had your name on it. Inside, you noticed this: {5}", "Then time did what time does when a man has found the one column that is his. Freedom, banishment, a school in a small Greek town, a student taking notes, a stolen lamp, and an emperor with a handbook by his bed.", "Asked what he owned, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this. The two columns are the first sentence of the handbook, and everything else in it is commentary.", "He did this. He kept studying as a slave, which is how Musonius Rufus came to have him as a student at all. A different first step in the same place is still a first step.", "He taught this for forty years: that the wrong done to you is theirs, and the anger about it would be yours, and you need not take it. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step was two columns: what is theirs and what is mine. A different first step in the same place is still a first step.", "help": {"zero": "You did not turn to Musonius Rufus. Epictetus did, as a slave with permission to study, and said everything he knew came through that door. Next time, go to the lesson. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to Musonius Rufus {n} on this journey. Epictetus attended his lessons while owned by another man, which is a fact about both of them. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the thing being counted by someone else in your own life, as you named it: {ice}", "closing": "The house in Rome is gone. The handbook is in print. What you carry out of the quarters is not freedom, and it is not him. It is the evidence that when someone with the law behind them counted you and got zero, you did your own count and found one column they forgot.", "stickerLines": ["Walked with Epictetus.", "Rome, around AD 70."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The clay lamp\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M110,220 C110,180 150,160 200,160 C250,160 290,180 290,220 C290,250 250,262 200,262 C150,262 110,250 110,220 Z\" stroke-width=\"4\"/>\n  <path d=\"M290,220 L326,212 C336,210 336,226 326,226 L290,232\" stroke-width=\"3\"/>\n  <ellipse cx=\"180\" cy=\"192\" rx=\"18\" ry=\"8\" stroke-width=\"2\"/>\n  <path d=\"M300,214 C300,196 316,186 312,176 C310,170 304,168 304,162\" stroke-width=\"2.4\"/>\n  <path d=\"M130,290 L270,290\" stroke-width=\"2\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
