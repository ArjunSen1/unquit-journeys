<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Vincent van Gogh, the letters to Theo</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>

<footer>Unquit Journeys. Prototype. Drawn from the letters of Vincent to Theo van Gogh, paraphrased, and from the world lists. No painting is reproduced or described in detail.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "vangogh", "title": "Vincent van Gogh, the letters to Theo", "subtitle": "A rented room in Arles. 1888. One painting sold, and not yet.", "object": "The paint tube", "sticker": "The paint tube.", "footer": "Drawn from the letters of Vincent to Theo van Gogh, paraphrased, and from the world lists. No painting is reproduced or described in detail.", "arrive": {"heading": "You are standing where a painter stood who had sold nothing.", "paragraphs": ["He is thirty-five. He came to painting late, at twenty-seven, after failing as an art dealer, a teacher, a bookseller and a preacher. He has been painting for eight years and has sold, in that time, one painting, to a friend of his brother. He lives on money Theo sends every month from Paris, and he knows what that costs Theo, and he paints anyway.", "He is in the south of France in a yellow house he cannot afford, painting in a heat that other painters leave, and writing to Theo almost every day. The letters are the record: what he is trying, what has failed, what the color is doing, what he owes, what he is afraid of. He writes to Theo because Theo is the one person who has not asked him to stop.", "He does not know that he has two years left, or that he will never sell another painting in his life, or what will happen after. He knows that this month's money has come and that the canvases are stacked against the wall with their faces turned in.", "Now Vincent steps aside and you step in. The room, the stacked canvases, the one sale and the letter to Theo half written are his. Whether you paint tomorrow is yours."], "button": "Sit down at the table"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The room is hot even at night. The letter to Theo is half a page. Against the wall, this month's canvases face inward, because you cannot look at them and write at the same time.", "question": "What are you feeling right now?", "placeholder": "Say it to Theo, who has never once asked you to stop.", "helper": {"who": "Theo, by letter from Paris, who sends the money every month", "says": "You write to me every day and you have never once told me you are giving up. I am asking, this once. What do you feel in that room?", "options": ["I feel that I have painted for eight years on your money and sold one canvas, and I know what the arithmetic says, and I painted today anyway.", "I feel that the color is doing something no one has seen, and that no one has seen it, and that both of those are true at the same table.", "I feel that I am your burden and your brother and I do not know how to be only the second."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before tomorrow's canvas, take an inventory. Not of the sales, and not of Vincent. Of yourself.", "question": "What have you already done, in your own life, that proves you can keep working with no evidence from outside that the work is worth anything?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Theo, by letter", "says": "I can tell you what my brother carries. Four failed vocations before this one and a fifth he has not failed at, whatever the sales say. Eight years of canvases, hundreds of them, each one a decision to paint the next. And a letter to me nearly every day, which is a man reporting to the one person who has kept faith. Now you tell me what you carry. Finish one of these.", "options": ["A time I kept working with no evidence from outside that it was worth anything: ", "A time I wrote to the one person who had not asked me to stop: ", "A time I turned the canvases to the wall and painted the next one anyway: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the room is: one sale in eight years is the verdict. It sounds like the market. It is the market, and the market has not seen the canvases. You do not have to decide whether you are a painter tonight. You only have to refuse to let one sale decide the next canvas.", "question": "What is the one reason you will not decide tonight?", "placeholder": "Not a business plan. One reason the arithmetic does not get the vote.", "helper": {"who": "Theo, by letter", "says": "One sale. Tell me why it is not the verdict.", "options": ["Because the canvases are facing the wall. Whatever they are, they have not been judged. They have been unseen.", "Because you have sent the money every month and have not once asked me to stop, and I trust your eye more than the market's, because you have seen them.", "Because I do not paint for the sale. I found that out the hard way, four vocations ago. I paint because the color is doing something, and it is."]}}, {"n": 4, "name": "One step", "prompt": "Not a sale. Not the reputation, which is decades away and belongs to other people. One step, small enough to finish before the letter is posted.", "question": "What is it?", "placeholder": "Something a painter can do with a tube of paint and a brother.", "helper": {"who": "Theo, by letter", "says": "You will paint tomorrow. What is the smallest thing you can do tonight?", "options": ["I will finish the letter and tell you what the color did today, exactly, so that one person knows.", "I will turn one canvas back around, the best of the month, and look at it for as long as I can stand.", "I will squeeze the last of the yellow onto the palette for the morning, so that tomorrow begins already decided."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The letter tells one person what the color did, or one canvas is facing the room, or the palette is ready for morning. The sale is still one. The money is still Theo's.", "question": "What has changed in you?", "placeholder": "Compare it to the canvases facing the wall.", "helper": {"who": "Theo, by letter", "says": "Nothing about the market changed tonight. What changed at the table?", "options": ["One person knows what the color did today. That is not a sale. It is the thing the sale would have been for.", "I turned it around and looked. It is not nothing. Whatever it is, it is not nothing.", "The palette is ready. Tomorrow is decided. I have never once been able to decide about the whole life, and I can always decide about the morning."]}}, {"n": 6, "name": "Time passes", "montage": ["He paints for two more years. He sells nothing else. He is ill and hospitalized and paints from the hospital. He dies in July 1890. Theo dies six months later.", "Theo's widow keeps the paintings and the letters, six hundred and fifty of them, and spends the rest of her life getting both into the world. The paintings that faced the wall in Arles are now the most visited in existence. He never knew. There is no version of this story in which he knows.", "The Long Middle does not always resolve. Sometimes the arrival is for other people, and the person who did the work is not in the room. The letters are the record of a man who kept working anyway, one morning at a time, reporting to the one brother who kept faith."], "question": "Eight years, one sale, two more years, nothing. Here is the question the museums cannot answer for him: what kept him painting?", "choices": [{"label": "Hope that the work would sell.", "short": "hope that the work would sell", "reply": "The letters do not read that way. He hoped, and he doubted, and he painted on the days of both. Hope was not the engine."}, {"label": "Theo's money.", "short": "Theo's money", "reply": "It kept him alive, and he knew what it cost, and the letters are full of the shame of it. It made the painting possible. It did not make him paint."}, {"label": "The work itself, and one person who kept faith.", "short": "the work itself, and one person who kept faith", "reply": "Yes. He found out, four vocations in, that he did not work for the outcome, and then he was tested on it for eight years without relief. What the letters show is a man reporting each day's work to the one person who had not asked him to stop. That is the Long Middle, unresolved, in its most exposed form: the continuation is real, the arrival is for others, and the record exists because a brother kept the letters."}, {"label": "Illness.", "short": "illness", "reply": "He was ill, and the illness is part of the record, and he painted through it and sometimes because of it. The illness is not why the canvases exist. The mornings are."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another room with the canvases turned to the wall. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Theo, by letter", "says": "One line for the next unsold year. Start with I did.", "options": ["I did tell one person what the color did today.", "I did decide about the morning when I could not decide about the life.", "I did keep working with no evidence from outside."]}, "ice": {"question": "One more line, and this one is yours. What are you working on with no evidence from outside, and who is your Theo?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the yellow house", "sub": "Your unsold year, beside his", "paragraphs": ["A rented room in Arles, 1888, the canvases facing the wall. You sat where Vincent sat, with one sale in eight years and a letter to Theo half written, and the room asked you what it asked him. You wrote: {1}", "Before tomorrow's canvas, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was four failed vocations, hundreds of canvases, and a letter nearly every day to the one person who kept faith.", "You refused to let one sale decide the next canvas. Your reason: {3} That refusal is the deferral. Not tonight. Not on the market's count of what it has not seen.", "Your first step: {4} {overlap}", "After the step, the money was still Theo's. Inside, you noticed this: {5}", "Then two years did what two years did. Nothing sold. A hospital. A death in July and a brother's in January. A widow with six hundred and fifty letters, and canvases that face the world now.", "Asked what kept him painting, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this, nearly every day, for years. The letters are the record.", "The letters have him assessing his own canvases with a dealer's eye. A different first step in the same place is still a first step.", "He wrote about preparing the palette and the light for the next morning. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step, every day, was the letter to Theo and the next canvas. A different first step in the same place is still a first step.", "help": {"zero": "You did not write to Theo. Vincent did, six hundred and fifty times, and it is the reason we know anything at all about the room. Next time, write to the one who has not asked you to stop. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You wrote to Theo {n} on this journey. Theo kept faith and his widow kept the letters, and that is the whole of why the story exists. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And your own unwitnessed work, as you named it: {ice}", "closing": "The yellow house was bombed in 1944 and is gone. What you carry out of it is not a museum, and it is not him. It is the evidence that you can keep working with no evidence from outside, and report the color to one person who kept faith.", "stickerLines": ["Walked with Vincent van Gogh.", "Arles, 1888."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The paint tube\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M110,150 L110,320 C110,332 130,338 200,338 C270,338 290,332 290,320 L290,150 Z\" stroke-width=\"4\"/><path d=\"M110,150 C110,128 150,116 200,116 C250,116 290,128 290,150\" stroke-width=\"4\"/><path d=\"M176,116 L176,90 L224,90 L224,116\" stroke-width=\"3\"/><path d=\"M182,78 L218,78\" stroke-width=\"4\"/><path d=\"M130,200 L270,200 M130,260 L270,260\" stroke-width=\"1.4\"/><path d=\"M120,330 C160,318 240,318 280,330\" stroke-width=\"1.4\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
