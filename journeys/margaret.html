<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Margaret Lin, the quiet quit</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>

<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>

<footer>Unquit Journeys. Prototype. Margaret Lin, Kevin and Sophie are composites from Chapter Twenty of The Unquit Stories.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "margaret", "title": "Margaret Lin, the quiet quit", "subtitle": "A Saturday morning. A friend's invitation on the phone. An opinion you have not had in a year.", "object": "The invitation", "sticker": "The invitation.", "footer": "Margaret Lin, Kevin and Sophie are composites from Chapter Twenty of The Unquit Stories.", "arrive": {"heading": "You are standing where Margaret Lin stood, without having quit anything.", "paragraphs": ["She has not quit anything dramatically. No door slammed, no declaration. She is thirty-eight, a senior software engineer at a company that builds financial infrastructure for banks, and her reviews are excellent. She delivers on time. She answers every message within the hour. Her manager calls her reliable and strategic. None of this is false. None of it is her.", "She noticed it first in a small way: she had stopped having opinions about architecture decisions. She used to have them the way some people have convictions. Now she says whatever will produce agreement. Then she noticed it at home. Kevin asks where she wants to eat and she says wherever you want, and he looks at her with a careful attention that says he has noticed something.", "This morning her friend Sophie called to invite her to a Saturday running group. She ran in her twenties, seriously, for reasons that had nothing to do with racing. She said she would think about it. She knows she is going to say no. She does not know why.", "Now Margaret steps aside and you step in. The excellent reviews, the missing opinions, the invitation and the not-knowing are hers. Whether you find out why is yours."], "button": "Sit down with the phone"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The kitchen is quiet. Sophie's message is still on the screen. Kevin is in the next room, not asking, which is its own kind of asking.", "question": "What are you feeling right now?", "placeholder": "Say it as the person who used to argue forty-five minutes for a Vietnamese restaurant, not the one who says wherever.", "helper": {"who": "Kevin, who has noticed for a year and has not said what", "says": "I am not going to ask about the running group. I am going to ask something I should have asked months ago. What do you feel, right now, about anything?", "options": ["I feel that I have been excellent at everything for a year and have not wanted any of it, and no one can tell from the outside, including me until this morning.", "I feel that I am about to say no to Sophie and I do not have a reason, and not having a reason is the first thing I have felt in months.", "I feel that I used to be someone with opinions and I miss having been her more than I miss her opinions."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the no, take an inventory. Not of the reviews, and not of Margaret. Of yourself.", "question": "What have you already done, in your own life, that proves you can notice a quiet withdrawal and turn it around?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Kevin", "says": "I can tell you what the woman at this table carries. Opinions so specific she once argued forty-five minutes about a restaurant and was right. Ten years of running for reasons that had nothing to do with racing. A husband who has been watching her carefully for a year, which means someone still sees the person she is missing. Now you tell me what you carry. Finish one of these.", "options": ["A time I noticed I had gone quiet and turned it around: ", "A time I had an opinion that was inconvenient and defended it anyway: ", "A time I was right about something small, and the being right was the point: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the kitchen is: I will say no, and I do not need to know why. It sounds like a preference. It is the quiet quit protecting itself. You do not have to join a running group this morning. You only have to refuse to say no before you know what the no is made of.", "question": "What is the one reason you will not answer Sophie today?", "placeholder": "Not a fitness plan. One reason the reflex does not get the vote.", "helper": {"who": "Kevin", "says": "You know you are going to say no. You do not know why. Tell me why that is a reason to wait.", "options": ["Because I have been saying no to things for a long time and calling it preference, and this is the first no I have looked at.", "Because a no without a reason is not a decision. It is a habit, and I want to know when the habit started.", "Because Kevin has been watching me with that look for a year and I have not once asked him what he sees."]}}, {"n": 4, "name": "One step", "prompt": "Not the running group. Not a new job. One step, small enough to finish before Sophie expects an answer.", "question": "What is it?", "placeholder": "Something you can do at a kitchen table with a husband in the next room.", "helper": {"who": "Kevin", "says": "You do not have to decide about Saturday. What is the smallest thing you can do this weekend?", "options": ["I will ask Kevin what he has been noticing for a year, and listen to the whole answer.", "I will pick the restaurant tonight. Not wherever. A specific place, argued for.", "I will write down the last opinion I had at work that I did not say, and say it on Monday."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. Kevin has told you what he saw, or a restaurant has been chosen and defended, or an opinion is written down for Monday. Sophie is still waiting. The reviews are still excellent.", "question": "What has changed in you?", "placeholder": "Compare it to wherever you want.", "helper": {"who": "Kevin", "says": "Nothing about work changed this weekend. What changed at the table?", "options": ["He told me. He has been watching me disappear for a year and did not know how to say it. I did not know how to hear it. Now we both do.", "I chose the restaurant and argued for it and I was right. I had forgotten that being right about small things is how a person stays in her own life.", "There is an opinion on a piece of paper for Monday. It is inconvenient. It is mine."]}}, {"n": 6, "name": "Time passes", "montage": ["It takes several weeks and one very late conversation with Kevin to arrive at the honest answer: she has been saying no to things for a long time. Not to anything in particular. To the version of herself who wanted things and defended them and was sometimes inconveniently right.", "She joins the running group. Not because running is the answer. Because saying yes to one thing she used to want is how she finds out whether the wanting is still there. It is. It comes back slowly, the way opinions do, one inconvenient position at a time.", "The quiet quit is the most common quit there is, and the hardest to notice, because nothing fails. The reviews stay excellent. Only the person leaves."], "question": "Nothing failed, and she had quit. Here is the question the excellent reviews cannot answer for you: what had Margaret quit?", "choices": [{"label": "Her job.", "short": "her job", "reply": "She kept it, and was excellent at it, and that is the point. The job was fine. The quiet quit does not show up at work."}, {"label": "Running.", "short": "running", "reply": "She stopped running years ago and it was a symptom, not the thing. The running group was a test, not a cure."}, {"label": "Having opinions. Being a person who wanted things and defended them.", "short": "having opinions, being a person who wanted things and defended them", "reply": "Yes. She had not left anything. She had left herself, gradually, so that no one could say when. The evidence was not failure. It was agreement: saying whatever produced it, at work and at dinner, until there was no position left to defend. The quiet quit is quitting on yourself while everything else continues. She noticed on a Saturday morning, because a friend asked and she could not say why she would refuse."}, {"label": "Nothing. She was tired.", "short": "nothing, she was tired", "reply": "Tired people still have opinions about restaurants. She had stopped. That is a different thing from tired, and the chapter spends a chapter telling them apart."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another year of excellent reviews and wherever you want. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Kevin", "says": "One line for the next quiet year. Start with I did.", "options": ["I did look at the no before I said it.", "I did choose the restaurant and argue for it.", "I did say the inconvenient opinion on Monday."]}, "ice": {"question": "One more line, and this one is yours. What have you stopped having opinions about, and when did you last argue for a restaurant?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, at the kitchen table", "sub": "Your Saturday, beside hers", "paragraphs": ["A kitchen on a Saturday morning, an invitation on the phone. You sat where Margaret Lin sat, excellent at everything and about to say no without knowing why, and the morning asked you what it asked her. You wrote: {1}", "Before the no, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Hers was a forty-five-minute argument for a Vietnamese restaurant, won, and a husband who had not stopped watching.", "You refused to say no before you knew what the no was made of. Your reason: {3} That refusal is the deferral. Not today. Not on reflex.", "Your first step: {4} {overlap}", "After the step, the reviews were still excellent. Inside, you noticed this: {5}", "Then several weeks did what weeks do when a woman starts asking why. One very late conversation, an honest answer, a running group, and opinions coming back one inconvenient position at a time.", "Asked what Margaret had quit, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["She did this. The late-night conversation with Kevin is where the honest answer arrived.", "The chapter has her missing the woman who argued for the Vietnamese place. Choosing a restaurant is that woman's first step back. A different first step in the same place is still a first step.", "The chapter has her opinions return at work, slowly. A different first step in the same place is still a first step."], "stepOverlapFree": "Her first step was to sit with the not-knowing until it told her, and to talk to Kevin. A different first step in the same place is still a first step.", "help": {"zero": "You did not ask Kevin what he saw. Margaret did, eventually, and it took a very late night, and it was where the answer was. Next time, ask the one who has been watching. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You asked Kevin {n} on this journey. He had been watching for a year and needed to be asked. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the thing you have stopped having opinions about, as you named it: {ice}", "closing": "The reviews are still excellent. What you carry out of the kitchen is not a running group, and it is not Margaret. It is the evidence that you can notice a quiet quit before anyone else does, and argue for a restaurant.", "stickerLines": ["Walked with Margaret Lin.", "A Saturday morning, an invitation."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The invitation\">\n<g transform=\"rotate(-5 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M110,110 L290,110 L290,290 L110,290 Z\" stroke-width=\"4\"/><path d=\"M110,110 L200,190 L290,110\" stroke-width=\"3\"/><path d=\"M110,290 L176,224 M290,290 L224,224\" stroke-width=\"1.6\"/><path d=\"M164,150 C176,138 190,148 200,140\" stroke-width=\"1.6\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
    '1':{text:A[1],red:true},'2':{text:A[2],red:true},'3':{text:A[3],red:true},'4':{text:A[4],red:true},'5':{text:A[5],red:true},
