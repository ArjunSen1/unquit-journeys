<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Domingo, four years of a quiet concept</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Domingo is a composite from The Unquit Entrepreneur. His brother-in-law was added for this journey.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "domingo", "title": "Domingo, four years of a quiet concept", "subtitle": "A kitchen table. Christmas Eve. The notebook is four years old.", "object": "The napkin", "sticker": "The napkin.", "footer": "Domingo is a composite from The Unquit Entrepreneur. His brother-in-law was added for this journey.", "arrive": {"heading": "You are standing where a man sat with a business that had never started.", "paragraphs": ["He has had the idea for four years. It is a good one. He knows it is good because he has checked it from every side, in a notebook that is now four notebooks, with the margins, the supplier costs, the name, the second name, the third. He has told almost no one. He calls it, when he calls it anything, a quiet concept.", "He has a job that is fine. He has a family that is fine. He has a notebook that has been ready for at least two of the four years, and a list of reasons the timing is not right that he rewrites each January and does not notice is the same list.", "It is Christmas Eve. His brother-in-law, who has asked about the concept every Christmas for four years, has just asked again, in front of the table, and the table has gone quiet in the specific way of people who have all heard about the notebook.", "Now Domingo steps aside and you step in. The four notebooks, the fine job, the January list and the quiet table are his. Whether the concept stays quiet is yours."], "button": "Sit down at the table"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The plates are cleared. The question is still on the table. Your brother-in-law is not being unkind. He is being the only person who has asked four years running.", "question": "What are you feeling right now?", "placeholder": "Say it as a man with four notebooks, not as a man with a plan.", "helper": {"who": "Your brother-in-law, who has asked every Christmas", "says": "I ask because I think it is good. I am asking again. Before you tell me about timing, tell me what you feel when I ask.", "options": ["I feel that four years of readiness is not preparation anymore. It is a place I live.", "I feel that the notebook is better than anything I could actually start, because the notebook has never been tested and everything I start would be.", "I feel that everyone at this table knows about the concept and none of them has seen it, and that is exactly how I have arranged it."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the January list, take an inventory. Not of the concept, and not of Domingo. Of yourself.", "question": "What have you already done, in your own life, that proves you can move from ready to started?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Your brother-in-law", "says": "I can tell you what the man at this table carries. Four years of a concept checked from every side, which is more diligence than most businesses ever get. A fine job held down while thinking about a better one. A notebook that has been right for two years. Now you tell me what you carry. Finish one of these.", "options": ["A time I moved from ready to started: ", "A time I let a thing be tested instead of keeping it perfect and untested: ", "A time I noticed the list of reasons was the same list as last year: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence at the table is: the timing is not right, and it will be, and I will know when. It sounds like patience. It is the fourth January in a row. You do not have to start the business tonight. You only have to refuse to let the notebook decide that it is the business.", "question": "What is the one reason you will not rewrite the January list this year?", "placeholder": "Not a launch plan. One reason the list does not get the vote.", "helper": {"who": "Your brother-in-law", "says": "The timing has not been right for four years. Tell me why that is not a fact about timing.", "options": ["Because the list of reasons is the same list. I checked. Four years of the same list is not a reading of the conditions. It is a reading of me.", "Because the notebook has been ready for two years and I have been rewriting the reasons for four. The arithmetic says the reasons are the project.", "Because a quiet concept is a concept no one can tell me is wrong, and I have been protecting it from that, not from the market."]}}, {"n": 4, "name": "One step", "prompt": "Not the launch. Not the company. One step, small enough to finish before the table clears.", "question": "What is it?", "placeholder": "Something you can do at Christmas with a napkin and a brother-in-law.", "helper": {"who": "Your brother-in-law", "says": "You do not have to start it tonight. What is the smallest thing you can do before I leave?", "options": ["I will draw it on this napkin, right now, for you. The whole concept, in one drawing, out loud.", "I will name one person I will show the notebook to in January, and give you the name so you can ask.", "I will call one supplier on the second of January and ask for a price. Not commit. Ask."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The concept is on a napkin in front of one person, or a name is in the room, or a phone call is on the calendar for the second. The job is still the job. The notebooks are still four.", "question": "What has changed in you?", "placeholder": "Compare it to the quiet table.", "helper": {"who": "Your brother-in-law", "says": "The business does not exist yet. What changed at the table?", "options": ["It is on a napkin and someone has seen it. It has been quiet for four years and it took ninety seconds to say.", "You have a name to ask me about. That is the first time anyone has had anything to ask me about that was not the timing.", "There is a call on the calendar. A concept with a call on the calendar is a different species from a concept in a notebook."]}}, {"n": 6, "name": "Time passes", "montage": ["He shows the napkin to two people in January. One of them asks a question the four notebooks had not. He makes the call to the supplier. The price is not what the notebook said. He adjusts. He starts, small, in the spring, four years and three months after the first notebook.", "The book is careful about what happened next. It was not immediate. The first year was harder than the notebook and better than the list of reasons. What the book says is that the four years were not wasted, and were not necessary, and that the difference between a quiet concept and a business is not readiness. It is the first person who sees it.", "He still has the notebooks. He does not open them."], "question": "Four years of a quiet concept, then a napkin. Here is the question the spring cannot answer for you: what had been stopping him?", "choices": [{"label": "Timing.", "short": "timing", "reply": "That was the January list, and it was the same list four years running, and the same list is not a reading of conditions. It is a reading of the man."}, {"label": "Money.", "short": "money", "reply": "He had a fine job and the notebook had the costs. Money was on the list every year. It was not the reason the list existed."}, {"label": "A concept kept quiet so that no one could tell him it was wrong.", "short": "a concept kept quiet so that no one could tell him it was wrong", "reply": "Yes. The notebook was perfect because it had never been tested. The four years were not preparation. They were protection. The difference between a concept and a business is not readiness, which he had had for two years. It is the first person who sees it and asks the question the notebook did not. A napkin at Christmas did what four years of readiness could not."}, {"label": "Nothing. Four years is a reasonable time to prepare.", "short": "nothing, four years is a reasonable time", "reply": "Two of them were. The notebook was ready in year two. The next two were something else, and he knew it every January."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another quiet concept and another January list. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Your brother-in-law", "says": "One line for the next four years. Start with I did.", "options": ["I did draw it on a napkin for one person.", "I did notice the list was the same list.", "I did make the call on the second."]}, "ice": {"question": "One more line, and this one is yours. What quiet concept of yours has been ready for two years, and who has not seen it?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, at the Christmas table", "sub": "Your napkin, beside his", "paragraphs": ["A kitchen table on Christmas Eve, four years of notebooks in a drawer. You sat where Domingo sat, with the same question asked for the fourth year and the table gone quiet, and the evening asked you what it asked him. You wrote: {1}", "Before the January list, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was four years of diligence and a notebook that had been right for two of them.", "You refused to let the notebook decide that it was the business. Your reason: {3} That refusal is the deferral. Not this January. Not on the same list.", "Your first step: {4} {overlap}", "After the step, the job was still the job. Inside, you noticed this: {5}", "Then January did what Januaries do when a napkin has been drawn. Two people, one question the notebooks had missed, a supplier's real price, and a start in the spring.", "Asked what had been stopping him, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this, or near it. The first person to see the concept saw it in the week after Christmas. A different first step in the same place is still a first step.", "He showed it to two people in January. A different first step in the same place is still a first step.", "He made the call. The price was not what the notebook said, and he adjusted, which is what a business does and a notebook cannot. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step was to let one person see it. A different first step in the same place is still a first step.", "help": {"zero": "You did not answer your brother-in-law. Domingo's asked every Christmas for four years, and the fourth time is when it worked. Next time, answer the one who keeps asking. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You answered your brother-in-law {n} on this journey. He asked four Christmases running. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And your own quiet concept, as you named it: {ice}", "closing": "The notebooks are in a drawer, unopened. What you carry out of Christmas is not a business, and it is not Domingo. It is the evidence that you know the difference between readiness and protection, and can draw it on a napkin.", "stickerLines": ["Walked with Domingo.", "Christmas Eve, year four."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The napkin\">\n<g transform=\"rotate(6 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M100,100 L300,100 L300,300 L100,300 Z\" stroke-width=\"3\"/><path d=\"M100,100 L300,300\" stroke-width=\"1\" stroke-dasharray=\"4 6\"/><path d=\"M140,190 C160,160 200,150 230,170 C260,190 250,230 210,236 C170,242 140,220 140,190 Z\" stroke-width=\"2.4\"/><path d=\"M170,200 L200,200 M170,216 L190,216\" stroke-width=\"1.6\"/><path d=\"M230,170 L262,150\" stroke-width=\"2\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
