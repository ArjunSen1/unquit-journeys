<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Thomas Edison, the notebook</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from the Menlo Park notebooks and the record of the lamp experiments, paraphrased, and from Unquit: The Oldest Choice. The famous ten thousand failures quotation is legend and is not used.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "edison", "title": "Thomas Edison, the notebook", "subtitle": "A laboratory at Menlo Park. October 1879. Filament test number too many.", "object": "The notebook", "sticker": "The notebook.", "footer": "Drawn from the Menlo Park notebooks and the record of the lamp experiments, paraphrased, and from Unquit: The Oldest Choice. The famous ten thousand failures quotation is legend and is not used.", "arrive": {"heading": "You are standing where an inventor stood at a bench.", "paragraphs": ["He is thirty-two and already famous for the phonograph, which is why the newspapers have been printing for a year that he will light the world with electricity any day now. He said so himself. It has been a year. The lamp does not work.", "The problem is the filament. It needs to glow white without burning out, in a vacuum, for hours. Platinum melts. Carbonized paper lasts minutes. He and his team have tested hundreds of materials, and every test is written in a notebook in a hand that does not editorialize: material, resistance, duration, result. The results are mostly one word.", "It is October 1879. The money from the investors is running down. The newspapers have moved from any day now to skepticism. On the bench is a length of cotton thread that Charles Batchelor has carbonized in a furnace, and it is so fragile it has broken twice before it could be mounted.", "Now the inventor steps aside and you step in. The bench, the notebook, the year of one-word results and the fragile thread are his. What a failed experiment is yours."], "button": "Stand at the bench"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The lab smells of ozone and coal gas. The notebook is open to a page of results that all say the same thing. Batchelor is trying, for the third time, to get a carbonized thread into the clamp without breaking it.", "question": "What are you feeling right now?", "placeholder": "Say it as a man a year past his own promise, not as a name on a lightbulb.", "helper": {"who": "Charles Batchelor, your chief assistant, not looking up from the clamp", "says": "I have broken two of these. Before I try a third, tell me what you feel, because I know what I feel and it is not helpful.", "options": ["I feel a year of promises in the newspapers and a notebook full of one-word results.", "I feel that every material on earth has been in this clamp and none of them has stayed lit, and I am running out of earth.", "I feel that the money is nearly gone and the newspapers have turned, and that neither of those things has ever once made a filament work."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the third try, take an inventory. Not of the lamp, and not of Edison. Of yourself.", "question": "What have you already done, in your own life, that proves you can treat a failed attempt as data rather than verdict?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Batchelor", "says": "I can tell you what the man at this bench carries. Hundreds of materials tested and every one written down without a single complaint in the margin. A phonograph that took a year of the same. A notebook that has never once recorded a failure as anything but the next line. Now you tell me what you carry. Finish one of these.", "options": ["A time I treated a failed attempt as data rather than a verdict: ", "A time I wrote down the result without editorializing and moved to the next line: ", "A time I kept testing after the money and the audience had turned: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence at the bench is: a year and hundreds of materials with no lamp means there is no lamp. It sounds like the notebook. It is not what the notebook says. The notebook says: not this one. You do not have to decide about electric light tonight. You only have to refuse to let the count of failures be read as a conclusion.", "question": "What is the one reason you will not decide tonight?", "placeholder": "Not a business plan. One reason the count does not get the vote.", "helper": {"who": "Batchelor", "says": "Hundreds of materials did not work. Tell me why that is not a result about the lamp.", "options": ["Because each of those results is one word about one material, and none of them is a word about the next material.", "Because the notebook does not have a column for verdict. It has a column for result. I built it that way on purpose.", "Because we have not tested this thread yet, and a thing that has not been tested has not failed."]}}, {"n": 4, "name": "One step", "prompt": "Not electric light. Not the world. One step, small enough to finish before Batchelor's third attempt.", "question": "What is it?", "placeholder": "Something you can do with a notebook and a clamp.", "helper": {"who": "Batchelor", "says": "The thread is in. What is the smallest thing you can do now?", "options": ["I will write the material and the time in the notebook before we switch it on, so that whatever it does, the line is already begun.", "I will pump the vacuum down further than we have before. If the thread fails, it fails in a cleaner vacuum, and that is a different result.", "I will sit down and watch it. If it lasts an hour, I will not go home. If it lasts thirteen, I will still be here."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The line is begun in the notebook, or the vacuum is deeper than ever, or you are in a chair in front of a clamp. The thread is glowing. It has been glowing for a while now.", "question": "What has changed in you?", "placeholder": "Compare it to the page of one-word results.", "helper": {"who": "Batchelor", "says": "It is still lit. What changed in you while it burned?", "options": ["It is still lit. I have not written the result yet because there is not one yet. That is the best line in the notebook.", "Hundreds of one-word results and this one is going to need a number. That is what all the words were for.", "I am in a chair at two in the morning watching a piece of cotton thread, and I have never been more certain of anything I could not yet write down."]}}, {"n": 6, "name": "Time passes", "montage": ["The carbonized cotton thread burns for thirteen and a half hours before it fails. It is October 22, 1879. Within weeks they have a filament that lasts forty, then hundreds. Within a year, carbonized bamboo lasts twelve hundred. The notebooks fill with numbers where the words had been.", "The famous line about ten thousand failures was never said in those words. What is documented is the notebooks: thousands of pages, each entry a material, a result and no adjective. He did not experience failure as failure. He experienced it as one more line.", "The lamp is the least of what the method produced. The method produced the laboratory, and the laboratory produced the century."], "question": "A year of one-word results, then thirteen and a half hours. Here is the question the lightbulb cannot answer for you: what was in the notebook?", "choices": [{"label": "Failures. Hundreds of them.", "short": "failures, hundreds of them", "reply": "That is what the newspapers called them. The notebook has no such column. It has material, resistance, duration, result. Failure is a word for a verdict, and the notebook did not record verdicts."}, {"label": "The answer, eventually.", "short": "the answer, eventually", "reply": "The thread was one line among hundreds, and it was not the final answer either. Bamboo replaced it within a year. There is never a last line in that kind of notebook."}, {"label": "Data. Not this one, written down, without an adjective, until one of them stayed lit.", "short": "data, not this one, written down without an adjective", "reply": "Yes. Arrival by data. He did not endure a year of failure. He recorded a year of results and let the recording carry the weight the emotions would have. Systems outlast willpower. A notebook with no column for despair is a system, and it is the reason there was a thirteenth hour."}, {"label": "Persistence.", "short": "persistence", "reply": "That is what it looks like from outside. From inside it was a method: write it down, no adjective, next material. Persistence is an emotion. The notebook was a machine for not needing one."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another year of one-word results. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Batchelor", "says": "One line for the next notebook. Start with I did.", "options": ["I did write the result without an adjective and move to the next line.", "I did not let the count of results be read as a conclusion.", "I did stay in the chair while it burned."]}, "ice": {"question": "One more line, and this one is yours. What are you calling failures that your notebook would call results?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, at the bench", "sub": "Your notebook, beside his", "paragraphs": ["Menlo Park, October 1879, a year past a promise. You stood where an inventor stood, with a notebook of one-word results and a thread too fragile to clamp, and the bench asked you what it asked him. You wrote: {1}", "Before the third try, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was hundreds of materials tested and not one complaint in a margin.", "You refused to let the count of results be read as a verdict. Your reason: {3} That refusal is the deferral. Not tonight. Not from a column the notebook does not have.", "Your first step: {4} {overlap}", "After the step, the thread was glowing. Inside, you noticed this: {5}", "Then thirteen and a half hours did what they did, and the notebooks filled with numbers where the words had been. Forty hours, then hundreds, then twelve hundred, and a century.", "Asked what was in the notebook, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this. The entry for October 22 begins as every entry began, before the result was known.", "They pumped the vacuum harder that month than before, and it was part of why the thread lasted. A different first step in the same place is still a first step.", "He did this. The accounts have him and Batchelor watching through the night. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step was the next line in the notebook, begun before the result. A different first step in the same place is still a first step.", "help": {"zero": "You did not turn to Batchelor. Edison did for twenty years, and Batchelor's hands are in most of the notebooks. Next time, turn to the one holding the clamp. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to Batchelor {n} on this journey. He carbonized the thread and mounted it on the third try. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the failures your notebook would call results, as you named them: {ice}", "closing": "The lab is a museum in Michigan now. What you carry out of it is not a lamp, and it is not him. It is the evidence that you can write down not this one without an adjective, and start the next line.", "stickerLines": ["Walked with Thomas Edison.", "Menlo Park, October 1879."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The notebook\">\n<g transform=\"rotate(-4 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M110,70 L290,70 L290,330 L110,330 Z\" stroke-width=\"4\"/><path d=\"M130,70 L130,330\" stroke-width=\"2\"/><path d=\"M150,110 L270,110 M150,140 L270,140 M150,170 L270,170 M150,200 L270,200 M150,230 L270,230 M150,260 L270,260 M150,290 L270,290\" stroke-width=\"1\"/><path d=\"M158,128 L198,128 M158,158 L212,158 M158,188 L190,188 M158,218 L206,218 M158,248 L196,248 M158,278 L236,278\" stroke-width=\"1.6\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
