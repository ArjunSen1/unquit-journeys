<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Walter Nkemelu</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Walter Nkemelu is a composite from The Unquit Stories. Priscilla Ann is from the same chapter. Mrs. Hayes, her grandmother, was added for this journey.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "walter", "title": "Walter Nkemelu", "subtitle": "Fifth and Chestnut. A Tuesday in January. Eleven degrees.", "object": "The sign", "sticker": "The sign.", "footer": "Walter Nkemelu is a composite from The Unquit Stories. Priscilla Ann is from the same chapter. Mrs. Hayes, her grandmother, was added for this journey.", "arrive": {"heading": "You are standing where Walter Nkemelu stood.", "paragraphs": ["Nine years ago Walter took a job as a crossing guard at the corner of Fifth and Chestnut. He was forty-one and between other jobs, and he meant to keep it for a season. He is fifty now. In nine years he has not been promoted, because there is nothing to be promoted to. He stands on the corner in the cold and the heat and holds up a sign that says STOP, and children cross, and he goes home.", "Two years ago his wife left, quietly, the way some marriages end, with more relief than anger on either side. He lives in a small apartment above a hardware store. He has not told anyone at the school. There is no one at the school to tell.", "This morning the thermometer outside the hardware store read eleven degrees. His knees, which have never given him trouble, have been giving him trouble since he stood up, and they are not saying anything new. He is on the corner twenty minutes before the first children, because he always is, and a thought has arrived with a clarity that frightens him. No one would notice if he did not come back tomorrow. The district would find another guard within the week. The children would learn a new face. That is not self-pity. It is arithmetic.", "Now Walter steps aside and you step in. The corner, the sign, the knees and the nine years are his. Whether there is someone standing on this corner tomorrow is yours. The first bell rings in twenty minutes."], "button": "Step onto the corner"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "Ten past seven. The street is empty. The sign is under your arm and the cold is finding the places your coat does not cover. The thought is still there, sitting quietly, like a fact.", "question": "What are you feeling right now?", "placeholder": "Write it plainly. No one else will read this.", "helper": {"who": "Priscilla Ann, seven, the first one here as usual", "says": "Mr. Walter, you look sad. Are you sad?", "options": ["I feel like arithmetic. Replaceable. A number the district can fill by Monday.", "I feel tired in a way that sleep did not fix, and I do not know how long it has been like this.", "I feel like no one would notice, and the worst part is that the thought does not even hurt. It just sits there."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before you decide anything about tomorrow, take an inventory of this morning. Not of the corner, and not of Walter. Of yourself.", "question": "What have you already done, in your own life, that proves you know how to keep showing up when no one is counting?", "placeholder": "One thing you did. Not one thing you believe.", "fillIn": true, "helper": {"who": "Mrs. Hayes, Priscilla Ann's grandmother, who walks her to the corner", "says": "Nine winters I have walked that child to this corner, Walter, and nine winters you were here before us. I can tell you what I have seen. A man who came back the morning after his wife left and did not say a word about it. A man who learned every name. Now you tell me what you carry. Finish one of these.", "options": ["A time I kept showing up when no one was counting: ", "A time I lost something quietly and got up the next morning anyway: ", "A time I did the plain thing right, for years, without applause: "]}}, {"n": 3, "name": "The deferral", "prompt": "The sentence this morning is: no one would notice. It sounds like a fact. It is a feeling in the shape of a fact. You do not have to disprove it. You only have to refuse to decide anything at eleven degrees.", "question": "What is the one reason you will not decide today?", "placeholder": "Not a plan. One reason to wait for a warmer morning.", "helper": {"who": "Mrs. Hayes", "says": "Nobody quits in January, Walter. Not on a Tuesday. Not at eleven degrees. Tell me why you will wait.", "options": ["Because a decision made at eleven degrees is the cold talking, not me.", "Because the bell rings in fifteen minutes, and if I go now there is a corner with no one on it.", "Because I said a season, nine years ago, and I am still here. The season does not get to judge the man. I do."]}}, {"n": 4, "name": "One step", "prompt": "The first children are coming down Chestnut. Not a plan for eighteen more winters. You do not know that number. One step, something you can finish before the bell.", "question": "What is it?", "placeholder": "Something smaller than a decision.", "helper": {"who": "Priscilla Ann", "says": "Can I walk next to you today? Not in front. Next to.", "options": ["I will raise the sign for this crossing. Just this one. The rest of the morning can decide itself.", "I will let Priscilla Ann walk beside me instead of telling her to go ahead with the others.", "I will learn one more name today. There is a boy in a green coat I have never asked."]}}, {"n": 5, "name": "What you feel now", "prompt": "The first crossing is done. Fourteen children. Nothing has changed. Your knees still hurt. The district would still replace you by Monday.", "question": "What has changed in you?", "placeholder": "Compare it to ten past seven.", "helper": {"who": "Priscilla Ann", "says": "Mr. Walter. You're not sad anymore, right?", "options": ["The arithmetic is still true. It has stopped being the whole truth.", "I noticed that when I picture leaving, I do not picture the corner. I picture her arriving at a corner with no one on it.", "Nothing has changed, and I am still here. That might be the thing."]}}, {"n": 6, "name": "Time passes", "montage": ["You come back the next morning. And the one after.", "Eighteen more winters. Priscilla Ann moves to a school across town when she is eleven and you never see her again. You do not know what she does now. You assume, reasonably, that she does not remember you.", "There is no promotion, because there is nothing to be promoted to. A reporter photographs you once for a story about the intersection and uses a different corner's guard in the final piece. No one writes a book. No one gives a speech.", "You are sixty-seven. There is a modest pension, a body that aches in the cold, and a stack of mornings that no one has compiled into a story. This is the ending most continuing actually has."], "question": "Nothing arrived. No reward, no recognition, no twist. So here is the question: what did twenty-six years build?", "choices": [{"label": "Nothing that can be measured.", "short": "nothing that can be measured", "reply": "Correct, and it is the hard half of the truth. Another guard would have stood here within the week. The accident rate would not have moved. If continuing only counts when it leads somewhere, this corner counts for nothing. Now look at the other half."}, {"label": "A corner that had someone on it.", "short": "a corner that had someone on it", "reply": "Yes. Every morning a specific set of children arrived at a specific corner, and someone was there. The twenty-six years were not building toward a thing. They were the thing. Walter stopped checking the mail for the outcome a long time ago. That is not resignation. It is the realest kind of continuing there is."}, {"label": "Priscilla Ann's memory of you.", "short": "Priscilla Ann's memory of you", "reply": "You do not know that, and neither does Walter. He assumes she has forgotten. Unquit is not a bet on being remembered. If the continuing needs her memory to justify it, the continuing is fragile. This one stood without it."}, {"label": "A person who can get up at eleven degrees.", "short": "a person who can get up at eleven degrees", "reply": "Also true, and the quietest answer. Every morning you came back added one line to a file that no one reads but you. Eighteen years of lines. That file is what you carry to the next cold morning. It is called evidence."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another eleven-degree morning. Not this corner, maybe, but the same cold and the same arithmetic. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Priscilla Ann", "says": "Mr. Walter, what do you want to remember about today?", "options": ["I did come back when nothing was waiting for me except a corner and a child.", "I did not let the cold decide.", "I did the plain thing right, again, with no one measuring it. That was the whole story, and it was enough."]}, "ice": {"question": "One more line, and this one is yours. Where is the corner in your life right now? The plain thing no one is measuring.", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, at Fifth and Chestnut", "sub": "Your mornings, beside his", "paragraphs": ["A Tuesday in January. Eleven degrees. You stood where Walter Nkemelu stood, twenty minutes before the first bell, and the corner asked you what it asked him. With the sign under your arm, you wrote: {1} Walter would recognize that. He said the thought did not feel dramatic. It felt like arithmetic.", "Before you decided anything, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was nine winters of being on the corner before anyone else, and one morning in particular, the one after his wife left, when he came back and said nothing.", "You refused to let the cold decide. Your reason: {3} That refusal has a name in the Unquit vocabulary. The deferral. Not at eleven degrees. Not from this feeling.", "Your first step: {4} {overlap}", "After the step, nothing had changed. The knees, the district, the arithmetic. Inside, you noticed this: {5}", "Then the mornings did what mornings do. Eighteen more winters. No promotion, no profile, no twist. A pension, a body that aches in the cold, and a stack of mornings no one compiled into a story except this one.", "Asked what twenty-six years built, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["Walter did this. He raised the sign for the first crossing and went home and came back the next morning. The book records nothing more heroic than that, which is the point.", "This one was Walter's. When he pictured not coming back, what he saw was not the corner or the sign. It was Priscilla Ann arriving at a corner with no one on it. That picture is why he came back.", "Walter never says whether he learned a name that morning. Twenty-six years of mornings suggest he learned all of them."], "stepOverlapFree": "Walter's first step was smaller than most. He raised the sign for the first crossing, went home, and came back the next morning. A different first step on the same corner is still a first step.", "help": {"zero": "You did not ask anyone on this journey. Walter did not either, not in words. He let a seven-year-old walk beside him instead of ahead, and it turned out to be the reason he came back. Next time, try the door. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You asked for help {n} on this journey. Walter's help came as a child who chose to walk beside him instead of ahead. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the corner in your own life, as you named it: {ice}", "closing": "The corner is still there. Someone is on it most mornings. What you carry away is not an outcome, because there was none, and it is not Walter. It is the evidence that you came back when nothing was measuring whether you did.", "stickerLines": ["Walked with Walter Nkemelu.", "Fifth and Chestnut, eleven degrees."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The sign\">\n<g transform=\"rotate(-9 200 260)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <polygon points=\"288.7,176.7 236.7,228.7 163.3,228.7 111.3,176.7 111.3,103.3 163.3,51.3 236.7,51.3 288.7,103.3\" stroke-width=\"4\"/>\n  <text x=\"200\" y=\"156\" text-anchor=\"middle\" font-family=\"Calibri, Carlito, Arial, sans-serif\" font-weight=\"700\" font-size=\"50\" letter-spacing=\"5\" fill=\"#8e1b1b\" stroke=\"none\">STOP</text>\n  <path d=\"M200,229 L200,392\" stroke-width=\"4\"/>\n  <path d=\"M188,392 L212,392\" stroke-width=\"3\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
