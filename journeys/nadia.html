<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Nadia Petrescu, three a.m.</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>

<footer>Unquit Journeys. Prototype. Nadia Petrescu is a composite from Chapter Seven of The Unquit Stories. The chapter ends without a decision, and so does this journey. That is the design.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "nadia", "title": "Nadia Petrescu, three a.m.", "subtitle": "A bedroom in the dark. Three fifteen. Sixteen years in pediatric oncology.", "object": "The night shift badge", "sticker": "The badge.", "footer": "Nadia Petrescu is a composite from Chapter Seven of The Unquit Stories. The chapter ends without a decision, and so does this journey. That is the design.", "arrive": {"heading": "You are standing where Nadia Petrescu lay awake.", "paragraphs": ["She is forty-seven, a nurse practitioner, sixteen years on a pediatric oncology unit. She is good at it in the specific way people are good at things they were built for: the difficulty is exactly the right difficulty. She has protocols for the grief, a therapist she sees monthly, a colleague she has eaten lunch with every Thursday for eleven years, two grown children, a mortgage and a cat named after a jazz musician.", "For seven months she has been waking between three and three-thirty and lying in the dark thinking one thought in variations: I cannot do this anymore. During the day she can move past it. Children need specific things at specific moments, and specificity is a kind of mercy. At night the thought comes back, patient and consistent, like water finding its level.", "What she cannot do anymore is not the nursing. It is the grief. Not the sharp grief of personal loss. The sustained, low-frequency grief of witnessing suffering that can be eased and rarely resolved, carried for sixteen years. Her body is telling her it needs to put something down.", "It is three fifteen. Now Nadia steps aside and you step in. The dark, the thought, the sixteen years and the weight are hers. What the three a.m. question is actually asking is yours."], "button": "Lie down in the dark"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The house is silent. The cat is somewhere. The ceiling is the same ceiling as seven months of three fifteens. The thought has arrived on schedule.", "question": "What are you feeling right now?", "placeholder": "Say it in the dark, where the daytime version of you cannot hear it.", "helper": {"who": "Teresa, your Thursday lunch colleague of eleven years, in your head, because it is three a.m. and no one is awake", "says": "I am not awake. But you know exactly what I would say, and the first thing I would say is: tell me what it feels like at three.", "options": ["I feel that I have carried something heavy for a very long time and my body has started saying so before my mind has permission to.", "I feel that during the day I am good at this and at night I cannot do it, and both are true, and I do not know which one is me.", "I feel the grief of sixteen years of children, not sharp, low, constant, like a sound I have stopped being able to not hear."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the question is answered, take an inventory. Not of the unit, and not of Nadia. Of yourself.", "question": "What have you already done, in your own life, that proves you can sit with a real question until it tells you what it is asking?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Teresa, in your head", "says": "I can tell you what the woman lying in this dark carries. Sixteen years on a unit most people cannot visit for an afternoon. Protocols for grief she built herself. A therapist, a Thursday lunch, two children raised, a marathon walked. And seven months of waking at three and not once pretending she did not. Now you tell me what you carry. Finish one of these.", "options": ["A time I sat with a real question until it told me what it was actually asking: ", "A time I carried something heavy for a long time and was honest when my body said so: ", "A time I did the right difficulty for years, the kind that grows you without breaking you: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The question at three a.m. is: what would it mean to stop? It sounds like a question about resignation. It is usually not the question it appears to be. You do not have to answer it tonight. You only have to refuse to answer the daytime version of it in the dark, or dismiss the nighttime version in the morning.", "question": "What is the one reason you will not decide tonight?", "placeholder": "Not a career decision. One reason three a.m. does not get to answer for nine a.m., or the other way round.", "helper": {"who": "Teresa, in your head", "says": "The daytime question is can I continue. You know that answer. The nighttime question is something else. Tell me why you will sit with it instead of answering it.", "options": ["Because the question I ask during the day has a fixed answer. Of course I can continue. The question I ask at three has a different one, and I have not heard it yet.", "Because rushing to answer it would be rationalizing it into something manageable, and it has not been manageable for seven months.", "Because my body is asking to put something down, and I have not yet asked what. Not the work. Something inside the work."]}}, {"n": 4, "name": "One step", "prompt": "Not resignation. Not a new unit. One step, small enough to take at three a.m. in the dark.", "question": "What is it?", "placeholder": "Something that can be done lying down.", "helper": {"who": "Teresa, in your head", "says": "You do not have to do anything tonight. What is the smallest thing you can do with the question?", "options": ["I will let the question be fully present, without dismissing it or making it smaller, for as long as it takes to hear what it is actually asking.", "I will ask it differently: not can I continue, but can I continue in a way that does not ask me to give more than I actually have.", "I will decide to raise it with the department head. Once. Carefully. Not tonight. Tuesday."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The question has been allowed to be present, or it has been asked differently, or Tuesday has a conversation in it. It is still three a.m. The weight is still the weight.", "question": "What has changed in you?", "placeholder": "Compare it to the thought arriving on schedule.", "helper": {"who": "Teresa, in your head", "says": "Nothing about the unit changed. What changed in the dark?", "options": ["The question sat there and finally said what it was asking. It was never about whether. It was about how much.", "I asked it the other way and the answer was different. Can I continue: yes. Can I continue like this: that one has a different answer.", "I am still awake at three. For the first time in seven months I am not fighting the thought. I am listening to it."]}}, {"n": 6, "name": "Time passes", "montage": ["She sits with the question for several nights. She does not get out of bed and make changes. She lets it be present until it tells her what it is asking, and what it is asking is: can I do this work in a way that does not take more than I actually have? That is a different question from the daytime one, and it needs a different response.", "She raises it with her department head, once, carefully, and again a month later, less carefully. They talk about a different version of the job, one that uses the same capacity and distributes the emotional weight differently. Nothing is decided in that conversation. Nothing has been decided since. As of this writing, she is still having it.", "She still wakes at three sometimes. The thought comes. She knows now what it is asking, and that is not the same as an answer, and it is not nothing."], "question": "Sixteen years, seven months of three a.m., and no decision yet. Here is the question the chapter deliberately does not answer: what was the three a.m. question asking?", "choices": [{"label": "Whether to resign.", "short": "whether to resign", "reply": "That is what it sounded like. The chapter says the three a.m. question is usually not the question it appears to be, and this one was not."}, {"label": "Whether she could continue.", "short": "whether she could continue", "reply": "That was the daytime question, and it had a fixed answer. Of course she could. She was skilled and needed and had reasons. The night was asking something the day did not."}, {"label": "Whether she could continue in a way that did not ask more than she had.", "short": "whether she could continue in a way that did not ask more than she had", "reply": "Yes. Not whether. How much. The three a.m. question was about limits, relief and the difference between the capacity she brought to the work and the cost it was extracting from reserves meant for the rest of her life. This journey ends without a decision because the chapter does. Sitting with the real question until it tells you what it is asking is an undervalued practice, and she is still doing it."}, {"label": "Nothing. It was insomnia.", "short": "nothing, it was insomnia", "reply": "Seven months of the same thought at the same hour is not insomnia. It is a message being delivered when the daytime cannot intercept it."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another three a.m. and another thought that arrives on schedule. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Teresa, in your head", "says": "One line for the next three fifteen. Start with I did.", "options": ["I did sit with the real question until it told me what it was asking.", "I did not answer the day's question in the dark.", "I did ask how much, not whether."]}, "ice": {"question": "One more line, and this one is yours. What is your own three a.m. thought, and have you asked it what it is actually asking?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the dark", "sub": "Your three a.m., beside hers", "paragraphs": ["A bedroom at three fifteen, seven months into the same thought. You lay where Nadia Petrescu lay, with sixteen years of low-frequency grief and a cat somewhere in the house, and the dark asked you what it asked her. You wrote: {1}", "Before the question was answered, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Hers was sixteen years of exactly the right difficulty, and seven months of not pretending.", "You refused to let three a.m. answer for nine a.m., or the reverse. Your reason: {3} That refusal is the deferral. Not tonight. Not until the question says what it is asking.", "Your first step: {4} {overlap}", "After the step, it was still three a.m. Inside, you noticed this: {5}", "Then several nights did what several nights do when a question is allowed to be present. It said what it was asking. A conversation, once, carefully, and again. Nothing decided. Still being had.", "Asked what the three a.m. question was asking, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["She did this. Several nights, letting it be present without rushing to dismiss or rationalize it.", "She did this. The reframed question is the one the chapter says she eventually heard. A different first step in the same place is still a first step.", "She did this, once carefully and a month later less carefully. A different first step in the same place is still a first step."], "stepOverlapFree": "Her first step was to let the question be fully present. A different first step in the same place is still a first step.", "help": {"zero": "You did not let Teresa into the dark. Nadia has eaten lunch with her every Thursday for eleven years, and the conversation with the department head came after. Next time, let the Thursday person in, even at three. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You let Teresa into the dark {n} on this journey. Eleven years of Thursdays is how a person survives sixteen years of that unit. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And your own three a.m. thought, as you named it: {ice}", "closing": "The ceiling is the same ceiling. What you carry out of the dark is not a decision, because there was none, and it is not Nadia. It is the evidence that you can sit with a real question until it tells you what it is asking.", "stickerLines": ["Walked with Nadia Petrescu.", "Three fifteen, month seven."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The badge\">\n<g transform=\"rotate(4 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M130,110 L270,110 L270,300 L130,300 Z\" stroke-width=\"4\"/><path d=\"M180,110 L180,84 C180,72 220,72 220,84 L220,110\" stroke-width=\"3\"/><circle cx=\"200\" cy=\"160\" r=\"22\" stroke-width=\"2.4\"/><path d=\"M150,206 L250,206 M150,232 L230,232 M150,258 L250,258\" stroke-width=\"1.6\"/><path d=\"M256,126 L262,126\" stroke-width=\"2\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
