<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Swami Vivekananda, Chicago, September 1893</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from Vivekananda's letters and the accounts of his hosts, paraphrased, and from the India story list. Tradition reader before launch.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "vivekananda", "title": "Swami Vivekananda, Chicago, September 1893", "subtitle": "A rail yard in Chicago. Dawn. The address is lost.", "object": "The robe", "sticker": "The robe.", "footer": "Drawn from Vivekananda's letters and the accounts of his hosts, paraphrased, and from the India story list. Tradition reader before launch.", "arrive": {"heading": "You are standing where a monk stood in a rail yard.", "paragraphs": ["He is thirty. He came from India with money raised by students in Madras, to speak at a Parliament of Religions he had heard about, and arrived to learn it did not open for two months and required credentials he did not have. A stranger on a train to Boston took him in. A Harvard professor wrote him a letter saying that to ask this man for credentials was like asking the sun about its right to shine.", "He came back to Chicago with the letter and the address of the committee. On the train he lost the address. He arrived at night with no money for a hotel, in a city where he knew no one, and slept in an empty boxcar in the rail yard.", "It is morning. He has walked into a neighborhood of large houses and asked at door after door for directions or food, in a saffron robe and a turban, and been refused at every one. He has sat down on the curb, exhausted, on Dearborn Avenue.", "Now the monk steps aside and you step in. The lost address, the empty stomach, the robe that gets doors shut and the curb are his. Whether the doors decide is yours."], "button": "Sit down on the curb"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The curb is cold. The houses across the street have their curtains drawn. You have a letter in your pocket from a Harvard professor and no one to give it to.", "question": "What are you feeling right now?", "placeholder": "Say it as a monk on a curb, not as the man on the platform two weeks from now.", "helper": {"who": "Mrs. George Hale, across the street, who has been watching from a window and is about to open her door", "says": "I have been watching you at my neighbors' doors. Before I ask what you need, tell me what you feel, sitting there.", "options": ["I feel that I crossed an ocean on other people's money to speak, and I cannot get a door open to ask for bread.", "I feel the robe. Every door that shut, shut at the robe before it saw the man.", "I feel that I have a letter from Harvard in my pocket and I slept in a boxcar, and both are true, and neither one has fed me."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before another door, take an inventory. Not of the letter, and not of the monk. Of yourself.", "question": "What have you already done, in your own life, that proves you can arrive with nothing but conviction and stay?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Mrs. Hale", "says": "I can tell you what the man on that curb carries, from what I have watched. He knocked at a dozen doors and was refused at every one and did not raise his voice. He is in a strange country in clothes that get him refused and has not changed them. Now you tell me what you carry. Finish one of these.", "options": ["A time I arrived with nothing but conviction and stayed: ", "A time I was refused at a dozen doors and did not change who I was to open the thirteenth: ", "A time a stranger opened a door when I had stopped expecting one: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence on the curb is: this country has shut its doors, and I should go home. It sounds like reading the evidence. It is one neighborhood on one morning. You do not have to decide whether America will hear you. You only have to refuse to let a dozen shut doors decide the thirteenth.", "question": "What is the one reason you will not decide this morning?", "placeholder": "Not a plan for the Parliament. One reason the shut doors do not get the vote.", "helper": {"who": "Mrs. Hale", "says": "A dozen doors is a dozen households. Tell me why it is not a country.", "options": ["Because a professor at Harvard opened his door, and a woman on a train opened hers, and I have not yet run out of doors.", "Because I lost the address, not the reason. The reason is in my pocket in a letter.", "Because I did not come here to be fed by this street. I came to speak, and the Parliament has not heard me yet."]}}, {"n": 4, "name": "One step", "prompt": "Not the Parliament. Not the speech. One step, small enough to finish before the sun is fully up.", "question": "What is it?", "placeholder": "Something a man on a curb can do.", "helper": {"who": "Mrs. Hale, opening her door", "says": "I am going to cross the street. What is the smallest thing you can do before I get there?", "options": ["I will stand up when she reaches me. A man asking for help should be standing.", "I will show her the letter, and let Harvard speak for me for one minute.", "I will tell her the truth in one sentence: I am a delegate to the Parliament and I have lost the address and slept in a boxcar. Then I will let her decide."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. You are standing, or the letter is in her hands, or the truth has been said in one sentence. The neighbors' doors are still shut. The address is still lost.", "question": "What has changed in you?", "placeholder": "Compare it to the curb.", "helper": {"who": "Mrs. Hale", "says": "The street is the same street. What changed?", "options": ["The doors are the same doors. One of them opened, and I have stopped counting the others.", "I said the truth in one sentence to a stranger and she did not shut the door. That is the whole of what I needed this morning.", "I am still a man in a robe who slept in a boxcar. I am also a man who has been asked in."]}}, {"n": 6, "name": "Time passes", "montage": ["Mrs. Hale takes him in, feeds him, and walks him to the Parliament committee herself. On September 11, 1893, in the Hall of Columbus, he stands to speak and begins with five words: Sisters and brothers of America. The hall of seven thousand rises and applauds for two minutes before he can continue. He speaks for a few minutes. It is enough.", "For four years he lectures across America and England. He founds a mission in India. He dies at thirty-nine. The Hale house on Dearborn Avenue, whose curtains were the only ones that opened, is where he wrote his letters home for years afterward.", "He had a letter from Harvard in his pocket the whole time. It was a woman looking out a window who read it."], "question": "A boxcar, a dozen shut doors, one open one, and a hall of seven thousand. Here is the question the applause cannot answer for you: what carried him from the curb to the platform?", "choices": [{"label": "The letter from Harvard.", "short": "the letter from Harvard", "reply": "It was in his pocket the whole time he was being refused. Credentials do not open doors. People do, and then they read the credentials."}, {"label": "The speech.", "short": "the speech", "reply": "Five words, and a hall stood up. But the speech was two weeks after the curb, and he would not have been in the hall without a woman who opened a window."}, {"label": "A stranger who opened a door when he had stopped expecting one.", "short": "a stranger who opened a door when he had stopped expecting one", "reply": "Yes. He arrived with nothing but conviction, and conviction got him refused at every door on Dearborn Avenue. The helper who always comes came from across the street, having watched the refusals. The story is remembered for five words to seven thousand people. It happened because of one woman, one window, and a man who was still sitting on the curb when she crossed."}, {"label": "Conviction.", "short": "conviction", "reply": "He had it on the curb and it did not feed him. Conviction is what you arrive with. It is not what opens the door. It is why you are still there when someone does."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another curb, another dozen shut doors. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Mrs. Hale", "says": "One line for the next street. Start with I did.", "options": ["I did not let a dozen shut doors decide the thirteenth.", "I did stand up when the door opened.", "I did tell the truth in one sentence and let a stranger decide."]}, "ice": {"question": "One more line, and this one is yours. What curb are you sitting on, and which window has not been checked?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, on the curb", "sub": "Your morning, beside his", "paragraphs": ["Dearborn Avenue, Chicago, September 1893, dawn. You sat where a monk sat, with a lost address, a letter from Harvard and a dozen shut doors behind you, and the street asked you what it asked him. You wrote: {1}", "Before another door, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was an ocean crossed on students' money and a dozen refusals taken without raising his voice.", "You refused to let a dozen doors decide the thirteenth. Your reason: {3} That refusal is the deferral. Not this morning. Not from one street.", "Your first step: {4} {overlap}", "After the step, the address was still lost. Inside, you noticed this: {5}", "Then a door did what one door does. A meal, a walk to the committee, and on September 11 five words to a hall of seven thousand that stood up before he could finish.", "Asked what carried him from the curb to the platform, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this. The accounts have him rise and bow when she reached him.", "He showed the letter, and it did what letters do once someone is willing to read them. A different first step in the same place is still a first step.", "He told her exactly that, by his own account, and she took him in. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step was to tell one stranger the truth in a sentence. A different first step in the same place is still a first step.", "help": {"zero": "You did not let Mrs. Hale cross the street. He did, and wrote letters from her house for years. Next time, stay on the curb long enough for the window to open. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You let Mrs. Hale cross the street {n} on this journey. He called her house his home in America. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the curb you are sitting on, as you named it: {ice}", "closing": "Dearborn Avenue is still there and so is the house. What you carry off the curb is not a platform, and it is not him. It is the evidence that you can be refused at a dozen doors and still be sitting there when the thirteenth opens.", "stickerLines": ["Walked with Swami Vivekananda.", "Chicago, September 1893."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The robe\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M150,80 C170,100 230,100 250,80 L300,120 L280,150 L270,140 L270,330 L130,330 L130,140 L120,150 L100,120 Z\" stroke-width=\"4\"/><path d=\"M200,100 L200,330\" stroke-width=\"2\"/><path d=\"M150,80 L200,110 L250,80\" stroke-width=\"2.4\"/><path d=\"M146,300 C170,292 230,292 254,300\" stroke-width=\"1.6\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
