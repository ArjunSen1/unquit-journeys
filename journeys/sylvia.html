<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Sylvia Oduya, the first inch</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>

<footer>Unquit Journeys. Prototype. Sylvia Oduya is a composite from Chapter Eleven of The Unquit Stories. The man with the coffee mug is from the same chapter.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "sylvia", "title": "Sylvia Oduya, the first inch", "subtitle": "A hallway in Memphis. Two months after the funeral. Shoes by the door.", "object": "The laces", "sticker": "The laces.", "footer": "Sylvia Oduya is a composite from Chapter Eleven of The Unquit Stories. The man with the coffee mug is from the same chapter.", "arrive": {"heading": "You are standing where Sylvia Oduya stood.", "paragraphs": ["She used to run. Three mornings a week through her neighborhood in Memphis, past the same houses and the same dogs and the same man who always waved from his porch with a coffee mug. Nothing competitive. She ran because it was hers.", "Then Michael was diagnosed, and the mornings disappeared into medication schedules and appointments and the slow arithmetic of watching someone you love diminish. She stopped running because there was no room for anything that was only hers. She told herself she would start again when things settled. Things did not settle for four years.", "Michael died on a Tuesday in November. People brought food and said the right things and went back to their lives. She went back to hers and found that she had organized it so completely around his illness that the space it occupied was now simply empty. Her daughter suggested counseling. Her sister suggested a trip. She has done neither.", "It is two months later. Her running shoes are by the door where they have been for four years. Now Sylvia steps aside and you step in. The hallway, the shoes, the empty mornings and the four years are hers. Whether the shoes go on is yours."], "button": "Stand in the hallway"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The house is quiet in the way it has been quiet for two months. The shoes have a layer of dust. Through the front window, across the street, the man with the coffee mug is on his porch, as he has been every morning for eight years.", "question": "What are you feeling right now?", "placeholder": "Say it to the shoes. They have been waiting four years.", "helper": {"who": "Your sister, who suggested a trip and has called anyway", "says": "I know you did not take the trip. I am not calling about the trip. Tell me what the mornings feel like.", "options": ["I feel that I organized my whole life around his illness and now the illness is gone and so is the shape of my life.", "I feel like someone who used to run. Not a runner. A person carrying the memory of motion and the weight of having quit.", "I feel that everything only mine was put away for four years, and I do not know if any of it is still there."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the shoes go on, take an inventory. Not of the grief, and not of Sylvia. Of yourself.", "question": "What have you already done, in your own life, that proves you can begin again with the smallest possible action?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Your sister", "says": "I can tell you what my sister carries. Four years of caregiving without one day off, which no one gives medals for. A body that ran three mornings a week for a decade and remembers. A man across the street who has waved at her every morning for eight years, including the four when she did not run past. Now you tell me what you carry. Finish one of these.", "options": ["A time I began again with the smallest possible action: ", "A time I kept something alive by putting it away carefully instead of throwing it out: ", "A time I did the unmeasured work for years and no one gave a medal: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the hallway is: I am someone who used to run. It sounds like an accurate description. It is grief describing a woman by her last four years and not her last ten. You do not have to decide whether you are a runner. You only have to refuse to let two empty months decide it.", "question": "What is the one reason you will not decide today?", "placeholder": "Not a training plan. One reason the dust does not get the vote.", "helper": {"who": "Your sister", "says": "You have not run in four years. That is a fact about four years. Tell me why it is not yet a fact about you.", "options": ["Because I stopped for a reason, and the reason was love, and love is not the same as quitting even when it looks identical from the hallway.", "Because the shoes are still by the door. I did not throw them out. Something in me kept them where I would see them.", "Because the man with the mug is still on his porch, and he did not stop waving when I stopped running, which means the route is still there."]}}, {"n": 4, "name": "One step", "prompt": "Not a run. Not three mornings a week. One step, small enough that its failure would cost almost nothing.", "question": "What is it?", "placeholder": "Something you can do with a pair of shoes and a hallway.", "helper": {"who": "Your sister", "says": "Do not run. What is the smallest thing you can do with those shoes today, so small it cannot fail?", "options": ["I will put them on and tie them. That is all. I will sit on the step in the hallway with my shoes tied.", "I will put them on and walk to the corner and back. Not run. Walk. Past the man with the mug, and wave.", "I will take them off the mat, wipe the dust off, and put them back. Tomorrow they will be clean when I see them."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The laces are tied, or you have been to the corner and back and a man with a mug waved, or the shoes are clean on the mat. Michael is still gone. The mornings are still empty.", "question": "What has changed in you?", "placeholder": "Compare it to the dusty shoes.", "helper": {"who": "Your sister", "says": "The house is the same. What is different?", "options": ["The shoes are on. I have not moved. Something has.", "I walked to the corner and he waved. He did not ask where I had been for four years. The route remembered me.", "The shoes are clean. Tomorrow when I see them they will not say four years. They will say tomorrow."]}}, {"n": 6, "name": "Time passes", "montage": ["She walks to the corner. Then, some days later, to the next one. Then, one morning, a hundred yards of something that is not quite running and is not walking. The man with the coffee mug waves every time as if nothing had been interrupted.", "The chapter calls it the first inch: the smallest possible action that begins a return, so small that its failure would cost almost nothing, and so its completion becomes repeatable. She does not train for anything. She runs three mornings a week again, eventually, past the same houses and the same dogs, because it is hers.", "The space Michael's illness occupied does not fill. It stays. But there is a shape to the mornings again, and the shape is hers."], "question": "Four years, then a walk to the corner. Here is the question the shoes cannot answer for you: what was the first inch?", "choices": [{"label": "Running again.", "short": "running again", "reply": "That came weeks later and it was not the first thing. If the first thing had been running, it would not have happened. Running was too large to fail safely."}, {"label": "Tying the shoes.", "short": "tying the shoes", "reply": "Yes, or close to it. Something so small that its failure would have cost nothing, which is exactly why it could be repeated the next day. The First Inch is not a compromise on the way to a real beginning. It is the beginning, designed so that the woman in the hallway cannot lose. The rest of the return is the first inch, repeated, until the route remembers you."}, {"label": "Grief counseling, or the trip.", "short": "grief counseling, or the trip", "reply": "Her daughter and sister suggested both, and both were reasonable, and she did neither. The first inch is never the reasonable suggestion from outside. It is the smallest thing that is only yours."}, {"label": "The man with the mug, waving.", "short": "the man with the mug, waving", "reply": "Also true, and it is the helper at the door in its quietest form. He never came over. He never asked. He waved for eight years, including the four she did not pass, and the route was still there because he was."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another hallway, another pair of shoes with dust on them. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Your sister", "says": "One line for the next dusty pair. Start with I did.", "options": ["I did tie the shoes and let that be the whole of the day.", "I did walk to the corner and wave.", "I did begin with something too small to fail."]}, "ice": {"question": "One more line, and this one is yours. What is by your own door with dust on it, and what is the inch?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the hallway", "sub": "Your first inch, beside hers", "paragraphs": ["Memphis, two months after the funeral, shoes by the door. You stood where Sylvia Oduya stood, with four years of dust on the laces and a man across the street with a coffee mug, and the hallway asked you what it asked her. You wrote: {1}", "Before the shoes went on, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Hers was four years of unmeasured care and a body that remembered a route.", "You refused to let two empty months decide who you are. Your reason: {3} That refusal is the deferral. Not today. Not from the dust.", "Your first step: {4} {overlap}", "After the step, the mornings were still empty. Inside, you noticed this: {5}", "Then the corners did what corners do when a woman walks to one and then the next. A hundred yards. Three mornings a week. The same dogs, the same houses, a man who never stopped waving.", "Asked what the first inch was, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["This is the chapter's first inch, or within a lace of it. Small enough to fail without cost, and so, repeatable.", "She did this. The corner and back, and the wave, is where the return began. A different first step in the same place is still a first step.", "The chapter does not say. It says the shoes were by the door for four years and then were not. A different first step in the same place is still a first step."], "stepOverlapFree": "Her first inch was the shoes on and a walk to the corner. A different first step in the same place is still a first step.", "help": {"zero": "You did not pick up for your sister. Sylvia's sister and daughter both called, and she did not take their suggestions, and they kept calling. Next time, pick up. The inch can still be yours. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You picked up for your sister {n} on this journey. She suggested a trip; Sylvia took a walk to the corner; the calls were the help anyway. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the thing by your own door with dust on it, as you named it: {ice}", "closing": "The porch across the street still has a man on it with a mug. What you carry out of the hallway is not a race, and it is not Sylvia. It is the evidence that you know how to begin with something too small to fail.", "stickerLines": ["Walked with Sylvia Oduya.", "Memphis, two months after."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The laces\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M70,240 L70,282 L240,282 C268,282 290,270 290,256 C290,244 274,238 250,232 L206,220 L176,196 L120,196 L110,240 Z\" stroke-width=\"4\"/><path d=\"M110,240 L250,232\" stroke-width=\"2\"/><path d=\"M130,208 L158,208 M126,224 L160,224\" stroke-width=\"2\"/><path d=\"M144,204 C160,180 190,178 200,196 M148,220 C168,240 196,246 214,232\" stroke-width=\"2.4\"/><path d=\"M214,232 C226,236 234,248 226,258 M200,196 C212,190 222,196 216,208\" stroke-width=\"2\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
