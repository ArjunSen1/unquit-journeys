<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Srinivasa Ramanujan, January 1913</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from the correspondence between Ramanujan and G. H. Hardy and the biographical record, paraphrased, and from the India story list.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "ramanujan", "title": "Srinivasa Ramanujan, January 1913", "subtitle": "A clerk's desk at the Madras Port Trust. A third letter to England. Two have gone unanswered.", "object": "The envelope", "sticker": "The envelope.", "footer": "Drawn from the correspondence between Ramanujan and G. H. Hardy and the biographical record, paraphrased, and from the India story list.", "arrive": {"heading": "You are standing where a clerk stood.", "paragraphs": ["He is twenty-five. He failed out of two colleges because he would study nothing but mathematics. He has no degree, a wife, a mother, and a job as a clerk at the port for twenty rupees a month, which he got because a man in the accounts office noticed what he was doing in the margins of the ledgers.", "The margins are full. Notebooks are full. Theorems no one in Madras can check, arrived at by methods he cannot always explain, some of them known in Europe for a century and some of them known to no one. He has written to two Cambridge mathematicians. Neither has replied. He is writing a third letter, to a man named Hardy, nine pages of results with no proofs, and a first sentence that says he has had no university education.", "The men around him say to stop. Cambridge does not answer clerks. Two silences are an answer.", "Now Ramanujan steps aside and you step in. The ledger, the notebooks, the two silences and the third envelope are his. Whether it is posted is yours."], "button": "Sit down at the clerk's desk"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The office is hot. The ledger is open to the day's cargo. Under it, nine pages in your handwriting, and an envelope addressed to a man you have never met in a country you have never seen.", "question": "What are you feeling right now?", "placeholder": "Say it as a clerk, not as the name in the textbooks.", "helper": {"who": "Narayana Iyer, your supervisor in the accounts office, who noticed the margins", "says": "I hired you for the margins, not the columns. Before you post it or do not, tell me what you feel.", "options": ["I feel that two men in England looked at what is in me and did not think it worth a reply, and I am about to ask a third.", "I feel that the theorems are true and I cannot always say why, and that a man who cannot say why is not believed by men who can.", "I feel twenty rupees a month and nine pages that I know are worth more than that, and no way to prove either."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the envelope is posted, take an inventory. Not of the theorems, and not of Ramanujan. Of yourself.", "question": "What have you already done, in your own life, that proves you can keep offering the thing no one around you can see?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Narayana Iyer", "says": "I can tell you what the clerk at that desk carries. He filled notebooks for seven years with no one to check them. He failed two colleges rather than stop. He has rediscovered, alone, things that took Europe a century, and found things Europe does not have. Now you tell me what you carry. Finish one of these.", "options": ["A time I kept offering something no one around me could see: ", "A time I was refused twice and made a third attempt anyway: ", "A time I knew a thing was true before I could prove it, and kept working: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence at the desk is: two silences are an answer. It sounds like realism. It is discouragement doing arithmetic. You do not have to decide whether England will ever reply. You only have to refuse to let two men who did not answer decide the third.", "question": "What is the one reason you will not decide today?", "placeholder": "Not an argument about mathematics. One reason the silences do not get the vote.", "helper": {"who": "Narayana Iyer", "says": "Two men did not reply. That is two facts about two men. Tell me why it is not a fact about the pages.", "options": ["Because the theorems do not know they were ignored. They are as true this morning as they were before the first letter.", "Because two silences are two men. Hardy is a third man. I have not asked him.", "Because the men who did not reply may not have read past the first sentence, and the first sentence says I have no degree, and the ninth page says something else."]}}, {"n": 4, "name": "One step", "prompt": "Not Cambridge. Not the proofs. One step, small enough to finish before the office closes.", "question": "What is it?", "placeholder": "Something a clerk can do with nine pages and a stamp.", "helper": {"who": "Narayana Iyer", "says": "You have written it. What is the smallest thing you can do with it today?", "options": ["I will post it. Today. Before I read it again and decide it is not good enough.", "I will copy the nine pages into the notebook first, so that whatever England does, the work exists in two places.", "I will add one line at the end asking only that he tell me whether the results are of value. Not for a position. For a judgment."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The envelope is in the post, or the copy is in the notebook, or one honest line has been added. The two silences are still silences. The ledger still says twenty rupees.", "question": "What has changed in you?", "placeholder": "Compare it to the hot office an hour ago.", "helper": {"who": "Narayana Iyer", "says": "England has not replied. What changed here?", "options": ["The letter is gone. For the first time in seven years the work is somewhere other than my own hands.", "I asked for a judgment, not a favor. A man who asks for a judgment has already decided the work can bear one.", "Two silences and one envelope in the post. The arithmetic is different now."]}}, {"n": 6, "name": "Time passes", "montage": ["Hardy receives the letter in Cambridge and nearly throws it away. Nine pages of theorems from an Indian clerk with no proofs. He reads it again that evening with his colleague Littlewood. Some results are known. Some are wrong. Some, Hardy writes later, defeated him completely; he had never seen anything like them, and they must be true, because if they were not true no one would have had the imagination to invent them.", "Hardy replies on February 8, 1913. Ramanujan sails for England in 1914. In five years at Cambridge he publishes work that mathematicians are still mining a century later. He is elected a Fellow of the Royal Society in 1918, one of the youngest ever and the second Indian. He is ill through most of it, and dies in India in 1920, at thirty-two.", "The notebooks he left behind kept producing results for the next hundred years. The third letter is in the Cambridge library."], "question": "Two silences, a third letter, five years and a short life. Here is the question the notebooks cannot answer for you: what did the third letter carry?", "choices": [{"label": "Nine pages of theorems.", "short": "nine pages of theorems", "reply": "It carried those, and Hardy said some of them defeated him completely. But the same theorems had been in the first two letters, in a sense. What the third letter carried that the first two did not was not on the page."}, {"label": "A request for a position.", "short": "a request for a position", "reply": "It carried the opposite. It asked only whether the results were of value. A clerk asked one of the great mathematicians of Europe for a judgment, not a job, and that is why it was read twice."}, {"label": "A refusal to let two silences be the answer.", "short": "a refusal to let two silences be the answer", "reply": "Yes. Two men had already decided, by not answering, that a clerk in Madras was not worth a reply. The third envelope is the whole of the Unquit decision in a stamp: the work is as true as it was before the silence, so ask a third man. Everything the world has of Ramanujan came through that envelope, and it was very nearly not sent."}, {"label": "Genius.", "short": "genius", "reply": "Hardy said the results must be true because no one could have invented them. But genius had been sitting in Madras for seven years unposted. The letter carried it, and the letter was the act."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another desk, another two silences, another third envelope. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Narayana Iyer", "says": "One line for the next unanswered letter. Start with I did.", "options": ["I did post the third letter after two silences.", "I did ask for a judgment and not a favor.", "I did not let two men who did not answer decide the work."]}, "ice": {"question": "One more line, and this one is yours. What have you sent twice into silence, and is there a third address?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, at the clerk's desk", "sub": "Your third letter, beside his", "paragraphs": ["Madras, January 1913, a clerk's desk with nine pages under the ledger. You sat where Ramanujan sat, with two silences from England and a third envelope addressed, and the desk asked you what it asked him. You wrote: {1}", "Before the envelope was posted, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was seven years of notebooks no one could check, and two colleges failed rather than stop.", "You refused to let two silences decide the third letter. Your reason: {3} That refusal is the deferral. Not today. Not on their arithmetic.", "Your first step: {4} {overlap}", "After the step, the silences were still silences. Inside, you noticed this: {5}", "Then a letter did what letters sometimes do. Nearly thrown away, read twice, answered on February 8, and everything after: Cambridge, the Royal Society, a short life, and notebooks still yielding results a century on.", "Asked what the third letter carried, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this. The letter is dated January 16, 1913, and it was the one that was answered.", "He kept notebooks all his life, and they are why the work survived him. A different first step in the same place is still a first step.", "He did this. The letter asks Hardy only whether the results have value, and says he is poor and would like them published if they do. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step was to post the third letter. A different first step in the same place is still a first step.", "help": {"zero": "You did not turn to Narayana Iyer. Ramanujan did; Iyer hired him for the margins, encouraged the letters, and was the first man in Madras to say his work mattered. Next time, turn to the one who noticed the margins. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to Narayana Iyer {n} on this journey. He hired a failed student for what he wrote in the margins of a ledger, and pushed him to write to England. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the thing you have sent twice into silence, as you named it: {ice}", "closing": "The Port Trust still stands in Madras. The letter is in Cambridge. What you carry out of the office is not a theorem, and it is not him. It is the evidence that after two silences you posted the third.", "stickerLines": ["Walked with Srinivasa Ramanujan.", "Madras, January 1913."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The envelope\">\n<g transform=\"rotate(-6 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M80,130 L320,130 L320,280 L80,280 Z\" stroke-width=\"4\"/><path d=\"M80,130 L200,220 L320,130\" stroke-width=\"3\"/><path d=\"M80,280 L170,200 M320,280 L230,200\" stroke-width=\"1.8\"/><path d=\"M262,148 L302,148 L302,176 L262,176 Z\" stroke-width=\"1.6\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
