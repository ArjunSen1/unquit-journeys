<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Rumi</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Historical details drawn from the public record, the accounts of Sultan Walad and Aflaki, and modern biographies. The year of Shams of Tabriz's disappearance is given variously as 1247 or 1248 and is flagged in the script.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "rumi", "title": "Rumi", "subtitle": "1248. Konya, Anatolia. The second return from Damascus.", "object": "The reed", "sticker": "The reed.", "footer": "Historical details drawn from the public record, the accounts of Sultan Walad and Aflaki, and modern biographies. The year of Shams of Tabriz's disappearance is given variously as 1247 or 1248 and is flagged in the script.", "arrive": {"heading": "You are standing where Rumi stood.", "paragraphs": ["Jalal al-Din Muhammad is forty-one. He was born in Balkh, on the edge of the known world, and carried west as a child ahead of the Mongol armies, through Baghdad and Mecca and Damascus, until his family settled in Konya under the Seljuk sultans. He became what his father was: a jurist, a preacher, a teacher of law with students who wrote down what he said. A respected man. A finished man, in the way that respected men are finished.", "Four years ago a wandering dervish named Shams of Tabriz stopped him in the street with a question, and everything he had built went quiet. He left the classroom. He left the students. For months at a time he sat with Shams in a locked room, and the town talked. His students hated Shams. His younger son hated Shams. Once, Shams left for Damascus to escape them, and Rumi sent his elder son to bring him back, and he came.", "Then, a year ago, on a winter night, someone called Shams to the door. He went out. He did not come back. Some say he was killed and the body hidden in a well. Some say his son knew. Rumi has been to Damascus twice since, searching every street where a dervish might sleep. He has just returned from the second journey. Shams is not in Damascus. Shams is not anywhere.", "Tonight Jalal al-Din steps aside and you step in. The empty room, the silent students, the son you cannot look at and the friend you cannot find are his. Every decision from here is yours. He is not asking you to become him. He is asking you to stand in the courtyard of a house in Konya with the dust of Damascus still on your shoes and nothing to show for it.", "Grief has two doors in this courtyard. One leads back to the classroom and the respected life, as though the four years did not happen. The other leads to a third journey, and a fourth, searching until you die. You are being asked whether there is a third door."], "button": "Step into the courtyard"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "Evening. Your elder son has taken your travelling cloak. The students are waiting in the next room to see which man has come home. The reed flute Shams liked is where he left it.", "question": "What are you feeling right now?", "placeholder": "Write it plainly. No one else will read this.", "helper": {"who": "Sultan Walad, your elder son, who brought Shams back once", "says": "Father, you do not have to be the teacher tonight. Tell me.", "options": ["I feel that the best of me left with him, and I am carrying the rest around like a coat.", "I feel rage at this town, and at my own house, and I cannot say it aloud.", "I feel that I have been searching for a man when the thing I lost is not a man."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before you decide anything about tomorrow, take an inventory of tonight. Not of Shams. Of yourself.", "question": "What have you already done, in your own life, that proves you know how to continue after the person who changed you is gone?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Salah al-Din Zarkub, the goldsmith, who has said little and stayed close", "says": "I know what you carry. You lost a country at five and a father at twenty-four and made a life in a city that was not yours. You gave up the classroom for a stranger and were not destroyed. Now tell me what you carry. Finish one of these.", "options": ["A time I lost the person who woke me up and did not go back to sleep: ", "A time I left a respected life for something I could not explain, and survived the explaining: ", "A time I searched, and stopped searching, and found the thing had moved inside me: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "Tonight one sentence is trying to become true: it is over, and I should go back to being who I was. If you let it settle, the four years become a fever you recovered from. You do not have to argue with it. You only have to refuse to decide it tonight.", "question": "What is the one reason you will not let tonight decide anything?", "placeholder": "Not a plan. One reason to wait until the light changes.", "helper": {"who": "Husam al-Din Chalabi, your young student, who has stayed when others left", "says": "Do not go into the classroom tonight and do not saddle the horse. Sit. Why wait?", "options": ["Because a man who has just come back from Damascus with nothing is not the man to decide what nothing means.", "Because the students in the next room will believe whatever my face says tomorrow, and my face is not ready.", "Because he stopped me in the street once with a question, and the question is still unanswered. The question did not disappear when he did."]}}, {"n": 4, "name": "One step", "prompt": "Morning. The house is awake. You need one step. Not a doctrine. Not a third journey. One step small enough that you cannot fail it today.", "question": "What is it?", "placeholder": "Something you can finish before the noon prayer.", "helper": {"who": "Sultan Walad", "says": "Whatever you do first, this house and this town will do next. What will you do first?", "options": ["I will say it out loud to the students: I will not go to Damascus again. What I was looking for there, I have found in myself. Then I will let them decide whether to stay.", "I will ask Salah al-Din the goldsmith to sit where Shams sat. Not to replace him. To keep the seat from being empty.", "I will pick up the reed and say the first lines that come, and I will let Husam write them down."]}}, {"n": 5, "name": "What you feel now", "prompt": "You did it. The sentence is said, or the goldsmith is in the seat, or the first lines are on paper. Nothing about your situation has changed. Shams is still gone. The town still talks.", "question": "What has changed in you?", "placeholder": "Compare it to last night.", "helper": {"who": "Husam al-Din Chalabi", "says": "I wrote down what you said. Do you want to know what I heard?", "options": ["The grief is the same size, but it has turned. It was a wall. It is a door.", "I am still searching, but I have stopped searching Damascus. I am searching the next line.", "I am afraid the students will leave. I find I do not need them to stay."]}}, {"n": 6, "name": "Time passes", "montage": ["You never go to Damascus again. When they ask, you say that you and Shams were never two, so there is no one to look for. The students who stay will hear you say it many ways over the next twenty-five years.", "The poems come in the years after. Tens of thousands of lines, most of them spoken while you turn in place, written down by whoever is near. You call the collection by his name, not yours. The Divan of Shams of Tabriz.", "Salah al-Din the goldsmith sits in the seat for ten years, until he dies. Then Husam al-Din, the young student who stayed, asks you for a book that can teach. You begin the Masnavi. Six volumes. Twenty-five thousand couplets. The first line is about a reed flute cut from its bed, singing about separation.", "December 17, 1273. You die in Konya. Muslims, Christians and Jews follow the body. Your followers call the night your wedding night, the night the separated are joined.", "Seven and a half centuries later you are read in languages that did not exist when you spoke. Your tomb in Konya receives more visitors than any other in the country. Almost none of them know the name Shams. All of them are reading the grief he left behind."], "question": "The evidence has arrived, and it filled a language. Here is the question the poems cannot answer. On which day was the unquitter made?", "choices": [{"label": "The day Husam al-Din asked for a teaching book, and the Masnavi began.", "short": "the day the Masnavi began", "reply": "Look again. The Masnavi was the last fruit of a decision made a decade earlier in a courtyard. It was possible because the searching had already stopped and the singing had already begun. A great book does not make an unquitter. It is written by one."}, {"label": "The day in 1244 when Shams stopped you in the street.", "short": "the day Shams stopped you in the street", "reply": "The day everything opened. But an opening is not a decision. The decision came when the door closed again, and you chose not to go back through the old one."}, {"label": "The morning you said, I will not go to Damascus again. What I sought there, I have found in myself.", "short": "the morning you stopped searching", "reply": "Yes. There were no poems yet. There was a courtyard, a dead friend, a silent son and a choice about what grief would be allowed to become. Unquitters are not made when the work is admired. They are made in the morning the searching stops. Tonight, in the same courtyard, you made yours."}, {"label": "The years of the road west from Balkh, when you were a child ahead of the Mongols.", "short": "the road west from Balkh", "reply": "Even earlier. Which means Rumi was already an unquitter before he was Rumi. The courtyard did not make him one. It found one. That is what your own evidence in step two was for. It was there before tonight."}]}, {"n": 7, "name": "Lock it in", "prompt": "You will lose someone who changed you. Different courtyard. Write one sentence you want to be able to read on that day. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Husam al-Din Chalabi", "says": "I have the pen. Give me the line.", "options": ["I did stop searching the city and started searching the next line.", "I did keep the seat filled so the grief would have somewhere to sit that was not me.", "I did let what he left in me speak, instead of going back to who I was before he came."]}, "ice": {"question": "One more line, and this one is yours. Where is the empty room in your own life right now?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in Rumi's courtyard", "sub": "Your decisions, beside his", "stepOverlap": ["He made the same choice, in almost the same words. After the second journey he told those around him that there was no reason to search again, because he and Shams were one, and he never went back to Damascus.", "He made the same choice. Salah al-Din Zarkub, the goldsmith, became his companion for the next ten years. The town disliked it almost as much as it had disliked Shams.", "He made the same choice. The poems came in the years after the searching stopped, and they came by voice, taken down by whoever was near. Husam al-Din was near most often."], "stepOverlapFree": "His first step was different. He stopped searching, said so, and let the grief become a voice instead of a journey. A different choice in the same courtyard is still a choice made.", "help": {"zero": "You did not ask for help on this journey. Rumi did, constantly. The goldsmith, the son, the student with the pen. Next time, try the door. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You asked for help {n} on this journey. Rumi asked constantly: the goldsmith, the son, the student with the pen. Asking is not the opposite of continuing. It is how continuing is done."}, "closing": "The room is still empty. The poems are still spoken. What you carry out of the courtyard is not the Masnavi and it is not Rumi. It is the evidence that you let grief become a door when it wanted to be a wall.", "paragraphs": ["1248. A courtyard in Konya, the dust of Damascus on your shoes. You stood where Rumi stood, and the empty room asked you what it asked him. With the reed flute where Shams left it, you wrote: {1} His own words from those months survive in his son's account. Grief, and then a turning.", "Before you decided anything, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was a road west from Balkh at five years old, and a city that was never his made into a home.", "You refused to let the first night decide. Your reason: {3} That refusal has a name in the Unquit vocabulary. The deferral. Not tonight. Tomorrow's light will be different.", "Your first step: {4} {overlap}", "After the step, nothing outside had changed. Inside, you noticed this: {5}", "Then time did what time does. Tens of thousands of lines under another man's name. The Masnavi. A wedding night in December 1273. Seven and a half centuries of readers who never heard of Shams.", "Asked on which day the unquitter was made, you chose {choice}. {reply}", "{help}"], "lockLabel": "The evidence you are taking with you", "iceLine": "And the empty room in your own life, as you named it tonight: {ice}", "stickerLines": ["Walked with Rumi.", "Konya, 1248."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The reed\"><g transform=\"rotate(28 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M188,40 L190,360 M212,40 L210,360\" stroke-width=\"3\"/><path d=\"M188,40 Q200,30 212,40\" stroke-width=\"3\"/><path d=\"M190,360 Q200,368 210,360\" stroke-width=\"3\"/><path d=\"M189,80 L211,80 M189,126 L211,126 M189,172 L211,172 M189,218 L211,218 M189,264 L211,264 M189,310 L211,310\" stroke-width=\"1.4\"/><circle cx=\"200\" cy=\"103\" r=\"4\" stroke-width=\"2\"/><circle cx=\"200\" cy=\"149\" r=\"4\" stroke-width=\"2\"/><circle cx=\"200\" cy=\"195\" r=\"4\" stroke-width=\"2\"/><circle cx=\"200\" cy=\"241\" r=\"4\" stroke-width=\"2\"/><circle cx=\"200\" cy=\"287\" r=\"4\" stroke-width=\"2\"/><circle cx=\"200\" cy=\"333\" r=\"4\" stroke-width=\"2\"/></g><g fill=\"none\" stroke=\"#8e1b1b\" stroke-width=\"1.6\"><path d=\"M60,330 q30,-40 60,0 q30,40 60,0\"/><path d=\"M60,350 q30,-40 60,0 q30,40 60,0\"/></g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
    '1':{text:A[1],red:true},'2':{text:A[2],red:true},'3':{text:A[3],red:true},'4':{text:A[4],red:true},'5':{text:A[5],red:true},
    overlap:{text:overlap}, choice:{text:c.short,red:true}, reply:{text:c.reply}, help:{text:help}, ice:{text:state.ice,red:true},
    '1b':{text:A['1b'],red:true},'2b':{text:A['2b'],red:true},'3b':{text:A['3b'],red:true},'4b':{text:A['4b'],red:true},'5b':{text:A['5b'],red:true}
  };
  try{ const key='unquit-ledger'; const cur=JSON.parse(localStorage.getItem(key)||'[]'); cur.push({slug:D.slug,title:D.title,object:D.sticker,lock:A[7]+(A['7b']?('  /  '+A['7b']):''),ice:state.ice||'',day:c.short,date:new Date().toISOString().slice(0,10)}); localStorage.setItem(key,JSON.stringify(cur)); }catch(e){}
  const wrap = el('div',{class:'story'});
  wrap.append(el('h1',{text:S.heading}), el('p',{class:'sub',text:S.sub}));
  S.paragraphs.forEach(t=>wrap.append(render(t,vars)));
  wrap.append(el('p',{class:'stepname',text:S.lockLabel}));
  wrap.append(el('div',{class:'lock you',text:A[7]}));
  if(D.two && A['7b']) wrap.append(el('div',{class:'lock you',style:'margin-top:-20px',text:A['7b']}));
  if(state.ice) wrap.append(render(S.iceLine,vars));
  wrap.append(el('p',{text:S.closing}));
  if(S.personalNote){ wrap.append(el('div',{class:'note'}, el('p',{class:'from',text:S.personalNote.from}), el('p',{text:S.personalNote.text}))); }
  const art = el('div',{html:D.stickerSvg||''}); const st = el('div',{class:'sticker'}, art, el('div',{class:'big',text:D.sticker}), el('div',{class:'small',html:S.stickerLines.join('<br>')}));
  wrap.append(st);
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:'Print or save',onclick:()=>window.print()}), el('button',{class:'link',text:'Walk it again',onclick:()=>{Object.assign(state,{answers:{},help:{},day:null,ice:'',stepMode:{}}); arrive();}}), el('a',{class:'link',href:'../ledger.html',text:'Your evidence',style:'font-size:17px'}), el('a',{class:'link',href:'../index.html',text:'All journeys',style:'font-size:17px'})));
  show(wrap);
}
arrive();
</script>
