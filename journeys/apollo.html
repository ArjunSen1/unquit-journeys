<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Apollo 13, from the ground</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from the NASA record and the accounts of the flight controllers, paraphrased, and from Unquit: The Oldest Choice. You play an unnamed controller. The famous line from the film is not used; it is not what was said.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "apollo", "title": "Apollo 13, from the ground", "subtitle": "Mission Control, Houston. April 13, 1970. Nine in the evening. Two hundred thousand miles.", "object": "The headset", "sticker": "The headset.", "footer": "Drawn from the NASA record and the accounts of the flight controllers, paraphrased, and from Unquit: The Oldest Choice. You play an unnamed controller. The famous line from the film is not used; it is not what was said.", "arrive": {"heading": "You are standing where a flight controller sat.", "paragraphs": ["Fifty-six hours into the flight, an oxygen tank in the service module explodes. Two hundred thousand miles away, three men are in a spacecraft that is losing oxygen, power and water, and the mission that was to land on the moon has become, in the space of one sentence from the commander, a problem in bringing them home alive.", "You are at a console in Mission Control. You are one of several dozen people in the room, most of them under thirty, with a headset and a screen and a flight director named Gene Kranz who has just said that they are going to work the problem, and that nobody in the room is going to guess.", "Nothing in the flight plan covers this. The lunar module was built to keep two men alive for two days. It will need to keep three alive for four. The carbon dioxide filters in it are round. The ones in the command module are square. The math for getting home is being done on slide rules.", "Now the controller steps aside and you step in. The console, the headset, the numbers that do not work and the room are theirs. What you do at your station in the next hour is yours."], "button": "Put on the headset"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The room has gone quiet in the way rooms do when everyone has understood at once. Your screen shows a number that should not be falling. Kranz is standing at the front, not raising his voice.", "question": "What are you feeling right now?", "placeholder": "Say it as a controller in the second hour, not as a documentary.", "helper": {"who": "Gene Kranz, flight director, on the loop", "says": "Nobody panics on my loop. But I want to know what my controllers are feeling before I ask them to think. Tell me.", "options": ["I feel three men two hundred thousand miles away and a number on my screen that is the only thing I can do for them.", "I feel that nothing in any procedure we have written covers this, and I have never worked without a procedure.", "I feel twenty-seven years old and that the entire country is about to watch whether people my age can think."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the next number, take an inventory. Not of the spacecraft, and not of the controller. Of yourself.", "question": "What have you already done, in your own life, that proves you can work a problem no procedure covers, alongside other people?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Kranz", "says": "I can tell you what this room carries. Every person here has run hundreds of simulations in which we failed on purpose, so that failing would be familiar. Every person here knows their system better than the people who built it. And every person here has one job and knows exactly which it is. Now you tell me what you carry. Finish one of these.", "options": ["A time I worked a problem no procedure covered: ", "A time I failed in practice so that failing for real would be familiar: ", "A time I did my one job in a room where everyone was doing theirs: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the room is: the numbers do not close, so they are not coming home. It sounds like engineering. It is the first pass of the numbers speaking as if it were the last. You do not have to solve the return tonight. You only have to refuse to let the first pass decide the crew.", "question": "What is the one reason you will not accept the first numbers?", "placeholder": "Not a trajectory. One reason the first pass does not get the vote.", "helper": {"who": "Kranz", "says": "The first pass says we do not have the power. Tell me why the first pass does not get to decide.", "options": ["Because the first pass assumed the command module. We have a lunar module. The numbers were run on the wrong ship.", "Because there are three hundred people in this building and the first pass was done by one desk.", "Because the crew has not stopped working, and the ground does not stop before the crew does."]}}, {"n": 4, "name": "One step", "prompt": "Not the return. Not the re-entry. One step, small enough to finish at your console in the next hour.", "question": "What is it?", "placeholder": "Something you can do with your one system and a headset.", "helper": {"who": "Kranz", "says": "Work the problem. Your problem, at your desk. What is the smallest thing you can do in the next hour?", "options": ["I will run my system's power budget for the lunar module, not the command module, and put the number on the loop whatever it says.", "I will call the contractor who built my system and get the one engineer who knows what it does below its rated minimum.", "I will take the list of what is on board, all of it, and start finding out what a round filter and a square filter and a sock and a flight manual cover can be made into."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. A number is on the loop, or an engineer in California is awake and thinking, or a list of objects on board is being turned into a machine. The crew is still two hundred thousand miles away. The oxygen is still falling.", "question": "What has changed in you?", "placeholder": "Compare it to the room going quiet.", "helper": {"who": "Kranz", "says": "The spacecraft did not fix itself in the last hour. What changed at your desk?", "options": ["The number is on the loop. It is not good. It is mine, and it is true, and someone else is already building on it.", "I have stopped waiting for the procedure. We are writing it, tonight, on the loop, one desk at a time.", "The room is working. Not one person in it is guessing. That is the first thing I have felt since the number started falling."]}}, {"n": 6, "name": "Time passes", "montage": ["The lunar module becomes the lifeboat. The carbon dioxide adapter is built on a table in Houston from a flight manual cover, plastic bags, a sock and duct tape, and the instructions are read up to the crew step by step. The power-up sequence for re-entry, which had never been done from a cold spacecraft, is written in two days by a controller named John Aaron and rehearsed in a simulator by the astronaut who had been bumped from the flight.", "On April 17 the command module splashes down in the Pacific with three men alive inside it. The mission failed. Everyone who worked it calls it the finest hours of the program.", "No one in that room did it alone, and no one in it was told to be a hero. They were told to work the problem, one system each, and not guess."], "question": "A failed mission, three men home. Here is the question the splashdown cannot answer for you: what brought them back?", "choices": [{"label": "The astronauts.", "short": "the astronauts", "reply": "They flew a dying ship for four days with their hands and did not panic, and no one on the ground would take a word of credit from them. They also could not have written a power-up sequence from a cold spacecraft. No one had."}, {"label": "Gene Kranz.", "short": "Gene Kranz", "reply": "He held the room, and the room needed holding. He would tell you, and did for fifty years, that he did not fly the mission. He kept several dozen people from guessing."}, {"label": "A room full of people who each worked their one problem and did not guess.", "short": "a room full of people who each worked their one problem and did not guess", "reply": "Yes. The collective Unquit at its clearest. Not one person deciding to bring them home. Several dozen people, each responsible for one system, each refusing the first pass of the numbers, each building on what the next desk put on the loop. The adapter was a sock and duct tape. The sequence was two days of one man's arithmetic. The rescue was the room."}, {"label": "Luck.", "short": "luck", "reply": "There was some, and the controllers said so. The explosion happened after the lunar module was attached and before it was used. Luck gave them a lifeboat. It did not build the adapter."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another number falling on another screen, and no procedure. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Kranz", "says": "One line for the next problem no procedure covers. Start with I did.", "options": ["I did work my one problem and put the true number on the loop.", "I did not accept the first pass.", "I did not guess."]}, "ice": {"question": "One more line, and this one is yours. What is falling on your own screen, and what is your one system?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, at the console", "sub": "Your hour, beside theirs", "paragraphs": ["Mission Control, April 13, 1970, nine in the evening. You sat where a controller sat, with a headset and a number that should not have been falling, and the room asked you what it asked them. You wrote: {1}", "Before the next number, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Theirs was hundreds of simulations failed on purpose and one job each, known exactly.", "You refused to let the first pass decide the crew. Your reason: {3} That refusal is the deferral. Not tonight. Not on numbers run for the wrong ship.", "Your first step: {4} {overlap}", "After the step, the crew was still two hundred thousand miles away. Inside, you noticed this: {5}", "Then four days did what four days do in a room where nobody guesses. A lifeboat, a sock and duct tape, a sequence written from nothing, and a splashdown on April 17.", "Asked what brought them back, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["This is what the power controllers did, hour by hour, for four days. The number on the loop, whatever it said.", "This happened at several desks. The contractors' engineers were on the phone all night. A different first step in the same place is still a first step.", "This is the adapter, and this is how it was built: from the list of what was on board. A different first step in the same place is still a first step."], "stepOverlapFree": "Their first step, at every desk, was their own system's true number on the loop. A different first step in the same place is still a first step.", "help": {"zero": "You did not answer Kranz on the loop. Every controller in that room did, every hour, for four days, and it is the reason there was a room and not several dozen people guessing. Next time, answer the loop. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You answered Kranz on the loop {n} on this journey. The loop is how a room becomes one mind. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the thing falling on your own screen, as you named it: {ice}", "closing": "The room is preserved in Houston with the consoles as they were. What you carry out of it is not a splashdown, and it is not the crew. It is the evidence that you can work your one problem in a room where everyone is working theirs, and not guess.", "stickerLines": ["Walked with the flight controllers of Apollo 13.", "Houston, April 13, 1970."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The headset\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M110,220 C110,140 150,100 200,100 C250,100 290,140 290,220\" stroke-width=\"4\"/><path d=\"M96,210 L96,270 L130,270 L130,210 Z\" stroke-width=\"4\"/><path d=\"M270,210 L270,270 L304,270 L304,210 Z\" stroke-width=\"4\"/><path d=\"M130,260 L160,290 L200,296\" stroke-width=\"3\"/><circle cx=\"204\" cy=\"298\" r=\"8\" stroke-width=\"3\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
