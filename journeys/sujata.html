<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Siddhartha before Sujata's bowl</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from the traditional accounts of the Buddha's life, paraphrased, and from Unquit: The Oldest Choice. A reader from within the tradition before launch.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "sujata", "title": "Siddhartha before Sujata's bowl", "subtitle": "A riverbank near Gaya. Year six of the search. Too weak to stand.", "object": "The bowl", "sticker": "The bowl.", "footer": "Drawn from the traditional accounts of the Buddha's life, paraphrased, and from Unquit: The Oldest Choice. A reader from within the tradition before launch.", "arrive": {"heading": "You are standing where a searcher sat.", "paragraphs": ["He left a palace at twenty-nine to find the end of suffering. He studied with the great teachers and learned everything they had and it was not the end. So he went further than any of them: six years of austerity in the forest with five companions, eating a grain of rice a day, until his spine could be felt through his stomach and he could no longer stand.", "The path was supposed to lead somewhere. It has led here, to a riverbank, to a body that is nearly finished and a mind no closer than it was in the palace. The extreme has failed. Abandoning it feels like failing too, in front of five men who followed him into it.", "A village girl named Sujata has come down to the river with a bowl of rice cooked in milk, an offering for the spirit of the tree. She has seen him. She is holding it out.", "Now Siddhartha steps aside and you step in. The six years, the five companions, the failed path and the bowl are his. Whether you take it is yours."], "button": "Sit down by the river"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The river is loud. The five companions are watching from the trees to see what you do. The girl is still holding out the bowl. Your hands are too weak to reach for it without deciding to.", "question": "What are you feeling right now?", "placeholder": "Say it as a man who has failed at the hardest path anyone has tried.", "helper": {"who": "Sujata, holding the bowl", "says": "I do not know who you are. I know you are starving, and I have food. Before you decide, tell me what you feel.", "options": ["I feel that six years of the hardest discipline anyone has attempted have brought me to a riverbank unable to stand, and that this is what failure looks like.", "I feel that if I take the bowl, the five men in the trees will say I gave up, and they will be right about the path and wrong about me.", "I feel that the extreme was another palace. Another certainty. I left one for the other and neither was the way."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the bowl, take an inventory. Not of the six years, and not of the searcher. Of yourself.", "question": "What have you already done, in your own life, that proves you can leave a path that is killing you without leaving the purpose?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Sujata", "says": "I can tell you what I see. A man who left everything comfortable for a question, and then left everything comfortable a second time for the same question, and is still asking it with no strength left. Now you tell me what you carry. Finish one of these.", "options": ["A time I left a path that was killing me without leaving the purpose: ", "A time I kept the question after the method failed: ", "A time I accepted help in front of people who would call it weakness: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence on the riverbank is: the path failed, so the search has failed. It sounds like honesty. It is starvation confusing the road with the destination. You do not have to decide whether the search is over. You only have to refuse to let the failure of one extreme decide it.", "question": "What is the one reason you will not decide today?", "placeholder": "Not a new discipline. One reason the extreme does not get the vote.", "helper": {"who": "Sujata", "says": "A road that ends at a river is not the end of walking. Tell me why you will not decide today.", "options": ["Because the question is the same question it was in the palace, and the question has not failed. Only my answer has.", "Because a man who cannot stand cannot think, and I have been trying to think my way to the end of suffering on a grain of rice a day.", "Because there were two extremes, and I have tried both, and the fact that neither worked is information about a third thing."]}}, {"n": 4, "name": "One step", "prompt": "Not enlightenment. Not the tree. One step, small enough to do with hands that can barely lift.", "question": "What is it?", "placeholder": "Something you can do with a bowl held out to you.", "helper": {"who": "Sujata", "says": "It is only rice and milk. What is the smallest thing you can do with it?", "options": ["I will take the bowl and eat, and let the five companions think what they think.", "I will eat, and then I will wash in the river, and then I will sit under a tree with a body that can hold a mind.", "I will thank her first. A man who cannot thank a girl for rice has not learned anything in six years."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The bowl is empty, or you have washed and are sitting under a tree, or a village girl has been thanked. The companions have left, as you knew they would. The question is exactly where it was.", "question": "What has changed in you?", "placeholder": "Compare it to the riverbank.", "helper": {"who": "Sujata, from the path back to the village", "says": "The five men have gone. What is different in you?", "options": ["My body can hold a thought again. It turns out that was required.", "I have lost five companions and gained a middle. It is not the palace and not the forest. It is a place I have not been.", "The question is the same. For the first time in six years I am not trying to starve it into answering."]}}, {"n": 6, "name": "Time passes", "montage": ["The five companions leave in disgust. He eats, bathes, and sits down under a fig tree with a body that can sustain attention. He resolves not to rise until he understands. By the accounts, it takes one night.", "What he finds is not a third extreme. It is the middle way: a discipline sustainable enough to be daily, between indulgence and self-destruction. The first thing he does with it is walk to find the five men who left him and teach it to them. They become the first to hear it.", "The teaching lasted two and a half thousand years and reached a third of the world. It begins with a girl who saw a starving man and held out a bowl. The tradition remembers her name."], "question": "Six years of austerity, then a bowl of rice. Here is the question the tree cannot answer for you: what did he give up at the river?", "choices": [{"label": "The search.", "short": "the search", "reply": "He gave up nothing of the search. The search sat down under a tree that night and did not rise until it was finished."}, {"label": "His discipline.", "short": "his discipline", "reply": "He gave up one discipline for another that could be kept. What he found under the tree was more disciplined than starvation, not less, because it could be done every day for the rest of a life."}, {"label": "The extreme. Not the purpose, only the form that was killing it.", "short": "the extreme, not the purpose but the form that was killing it", "reply": "Yes. He had left one extreme for another and mistaken the second for the way because it was hard. The bowl was the moment he stopped being loyal to the form and stayed loyal to the question. This is the oldest Redirect in the series, and it comes with the helper who always comes: a girl with rice, on a day the seeker could not have gone one more step without her."}, {"label": "His companions.", "short": "his companions", "reply": "He lost them at the river and went back for them after the tree. The first people he taught were the five who had walked away. The Return is inside this story too."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another riverbank, another extreme that has failed, another bowl held out. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Sujata", "says": "One line for the next river. Start with I did.", "options": ["I did take the bowl in front of the people who would call it weakness.", "I did leave the form that was killing the purpose.", "I did thank her first."]}, "ice": {"question": "One more line, and this one is yours. What extreme in your own life has failed, and what bowl is being held out?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, by the river", "sub": "Your sixth year, beside his", "paragraphs": ["A riverbank near Gaya, year six, too weak to stand. You sat where a searcher sat, with five companions watching from the trees and a girl holding out a bowl, and the river asked you what it asked him. You wrote: {1}", "Before the bowl, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was a palace left for a question and a forest entered for the same one.", "You refused to let the failure of one extreme decide the search. Your reason: {3} That refusal is the deferral. Not today. Not from starvation.", "Your first step: {4} {overlap}", "After the step, the companions had gone and the question was where it was. Inside, you noticed this: {5}", "Then a tree did what a tree does when a man sits under it with a body that can hold a mind. One night. A middle way. Five men found and taught. Two and a half thousand years.", "Asked what he gave up at the river, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this. He took the bowl, and the five companions left in disgust, and he let them.", "He did this. Ate, bathed, sat. The tradition puts the three in that order for a reason. A different first step in the same place is still a first step.", "The tradition remembers her name, which suggests he did. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step was to take the bowl and eat. A different first step in the same place is still a first step.", "help": {"zero": "You did not take anything from Sujata on this journey. He did, and the tradition has remembered her name for twenty-five centuries because of it. Next time, take the bowl. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to Sujata {n} on this journey. Her name has been remembered for twenty-five centuries because a starving man accepted rice from her. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the failed extreme in your own life, as you named it: {ice}", "closing": "The river still runs past Gaya. What you carry away from it is not awakening, and it is not him. It is the evidence that you can leave the form that is killing the purpose, and take the bowl.", "stickerLines": ["Walked with Siddhartha.", "A riverbank near Gaya, year six."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The bowl\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M90,190 C90,270 150,300 200,300 C250,300 310,270 310,190 Z\" stroke-width=\"4\"/><path d=\"M90,190 C130,178 270,178 310,190\" stroke-width=\"3\"/><path d=\"M160,300 L160,318 L240,318 L240,300\" stroke-width=\"3\"/><path d=\"M130,200 C170,192 230,192 270,200\" stroke-width=\"1.6\"/><path d=\"M190,150 C182,138 196,128 190,116 M212,150 C204,138 218,128 212,116\" stroke-width=\"2\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
    '1':{text:A[1],red:true},'2':{text:A[2],red:true},'3':{text:A[3],red:true},'4':{text:A[4],red:true},'5':{text:A[5],red:true},
