<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Alexander at Tyre, told by Maiji</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>

<footer>Unquit Journeys. Prototype. The siege of Tyre is drawn from the historical record. The frame is Arjun Sen's grandmother, Maiji, telling him the story on a verandah in Kolkata, as she did, and later on the phone when he needed it most. From Unquit Forever.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "tyre", "title": "Alexander at Tyre, told by Maiji", "subtitle": "A verandah in Kolkata, and a causeway in the sea. 332 BC. Month one of seven.", "object": "The causeway", "sticker": "The causeway.", "footer": "The siege of Tyre is drawn from the historical record. The frame is Arjun Sen's grandmother, Maiji, telling him the story on a verandah in Kolkata, as she did, and later on the phone when he needed it most. From Unquit Forever.", "arrive": {"heading": "You are standing where a young king stood, and a grandmother is telling you about it.", "paragraphs": ["Two things are true at once in this journey. On a verandah in Kolkata, a grandmother called Maiji is telling a boy a story, the way she told him hundreds, with no internet and no idea where she got them, painting the picture with her hands. And on a coast in Phoenicia in 332 BC, a twenty-three-year-old king is looking across half a mile of sea at an island city with walls a hundred and fifty feet high.", "Alexander has just beaten the Persians at Issus. The road to Egypt and the whole empire is open. Tyre is an island fortress that has never been taken. His generals want to go around it. Bigger prizes are ahead and this one could take years. Kings before him have tried and given up.", "He sees it differently. If the army quits at the first wall, every wall after it will have an exit. Quitting will be in the vocabulary. He wants this wall to define what the army is.", "Maiji told the boy this story when he was small. Years later, when he was thirty-two and eight doctors had given him fewer than a hundred days, she said it to him again on the phone: this, Arjun, is your Siege of Tyre.", "Now the young king steps aside and you step in. The half mile of water, the walls, the generals and the seven months you cannot yet see are his. Maiji is on the verandah. Whether the army goes around is yours."], "button": "Sit down on the verandah"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The sea between you and the walls is deep enough to swallow an army. The generals are standing behind you, not speaking, which is how generals disagree. Somewhere a grandmother is saying: and then, Arjun, listen to what he felt.", "question": "What are you feeling right now?", "placeholder": "Say it as a king who has never lost and has never faced a wall in the sea.", "helper": {"who": "Maiji, on the verandah, pausing the story", "says": "Wait. Before I tell you what he did, tell me what you would feel. That is the only part of a story worth anything.", "options": ["I feel that every man behind me is right, and that being right about the road is exactly how an army learns to quit.", "I feel that the sea is the first thing I have met that does not care who I am.", "I feel that this is the wall that will decide every wall after it, and I am the only one who can see that from here."]}, "helpLabel": "Ask Maiji."}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the army decides, take an inventory. Not of the siege engines, and not of the king. Of yourself.", "question": "What have you already done, in your own life, that proves you can stay at a first wall when everyone says go around?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Maiji", "says": "I will tell you what he carried, and then you tell me what you carry, because that is how the stories work. He was twenty-three and had never lost. He had learned from a teacher who taught him to ask why. He had already crossed a river everyone said could not be crossed. Now finish one of these.", "options": ["A time I stayed at the first wall when everyone said go around: ", "A time I refused to let quitting into the vocabulary of the people who followed me: ", "A time I built a road across a thing that had no road: "]}, "fillIn": true, "helpLabel": "Ask her what he carried."}, {"n": 3, "name": "The deferral", "prompt": "The sentence on the shore is: go around, it is not worth it, there are bigger things ahead. It sounds like strategy. It is the first exit an army ever learns. You do not have to take the city this month. You only have to refuse to let the first wall decide what the army becomes.", "question": "What is the one reason you will not go around this week?", "placeholder": "Not a siege plan. One reason the exit does not get the vote.", "helper": {"who": "Maiji", "says": "Arjun, listen. If you go around the first wall, you will go around every wall. Tell me why he did not.", "options": ["Because the wall is not the prize. What the army learns at the wall is the prize.", "Because kings before me gave up after years, and I have been here for a month. A month is not years.", "Because the sea is half a mile wide and the world has stones. That is not a wall. That is a construction problem."]}, "helpLabel": "Let Maiji explain."}, {"n": 4, "name": "One step", "prompt": "Not the city. Not the seven months. One step, small enough to begin this week, that makes the sea smaller.", "question": "What is it?", "placeholder": "Something an army can do with its hands.", "helper": {"who": "Maiji", "says": "He did not attack the walls. He did something else first. Can you guess what?", "options": ["I will begin a causeway. Stone by stone, from the shore toward the island, until the sea is a road.", "I will send to every port on this coast for ships, so that the island is not the only one with a navy.", "I will tell the generals plainly: we are not going around, and here is the first stone, and I will carry it."]}, "helpLabel": "Ask her what he did first."}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The first stones are in the water, or messengers are riding for ships, or the generals have heard the word no and watched you carry a stone. The walls are as high as they were. The sea is a few feet narrower.", "question": "What has changed in you?", "placeholder": "Compare it to the shore this morning.", "helper": {"who": "Maiji", "says": "The wall is the same height. Tell me what changed in him, and in you.", "options": ["The sea is the same sea. It has stopped being the argument.", "The generals are still right about the road. They have stopped being right about the army.", "I have decided the wall is a construction problem. Everything after that is just months."]}, "helpLabel": "Tell Maiji."}, {"n": 6, "name": "Time passes", "montage": ["The causeway takes months. The Tyrians burn the siege towers with a fire ship and the army begins again. Storms wash the mole away and the army begins again. Ships come from Cyprus and Sidon and the island is no longer alone with its navy. In the seventh month, the walls are breached from the sea.", "Tyre falls. What the histories remember is that the city was taken. What Maiji remembered, and told a boy on a verandah, is that the army that walked away from Tyre never again asked whether to go around a wall. The word was gone.", "Years later, on the phone to a hospital room in Denver, she said it to him one more time. This is your Siege of Tyre. Do not go around. He did not."], "question": "Seven months for one city. Here is the question the histories cannot answer for Maiji: what did Alexander win at Tyre?", "choices": [{"label": "The city.", "short": "the city", "reply": "He took it, and then he left it, and moved on to Egypt within weeks. If the city had been the prize, seven months would have been a bad trade. He knew that on the first day."}, {"label": "A port.", "short": "a port", "reply": "Strategically true and Maiji would wave it away. Ports are what the generals wanted. They wanted to go around."}, {"label": "An army with no exit in its vocabulary.", "short": "an army with no exit in its vocabulary", "reply": "Yes. That is what Maiji told the boy, and it is what she told the man. The wall was never the point. What the army learned at the wall was the point: that the first wall decides all the others, and that going around is a habit you catch on the first day or never. He built a road across the sea so that his people would never again ask whether to build one."}, {"label": "Seven months of delay.", "short": "seven months of delay", "reply": "The generals would have said so, and they would have been counting the wrong thing. Delay is measured against a destination. What was built in those months was measured against every wall the army met for the next ten years."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another first wall, and a road around it, and everyone behind you saying take the road. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Maiji, finishing the story", "says": "Now, before you go to sleep, tell me the one thing you will remember from this. Start with I did.", "options": ["I did stay at the first wall so that the word would not enter my vocabulary.", "I did treat the sea as a construction problem and begin with one stone.", "I did carry the first stone myself."]}, "helpLabel": "One more from Maiji.", "ice": {"question": "One more line, and this one is yours. What is the first wall in your own life, and who is telling you to go around it?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, on the shore and the verandah", "sub": "Your first wall, beside his", "paragraphs": ["A verandah in Kolkata, and a shore in Phoenicia in 332 BC. You stood where a young king stood, with half a mile of sea between you and a wall a hundred and fifty feet high, and a grandmother paused the story to ask what you felt. You wrote: {1}", "Before the army decided, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was a river everyone said could not be crossed, and a teacher who taught him to ask why.", "You refused to let the first wall decide what the army would become. Your reason: {3} That refusal is the deferral. Not this week. Not because there is a road around.", "Your first step: {4} {overlap}", "After the step, the walls were as high as ever and the sea a few feet narrower. Inside, you noticed this: {5}", "Then seven months did what seven months do when an army has decided the sea is a construction problem. Fire ships, storms, a causeway rebuilt, a navy borrowed, and a wall breached from the water. And a grandmother who told the story on a verandah and then, years later, on the phone to a hospital room.", "Asked what Alexander won at Tyre, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this. The causeway, the mole, is what the siege is remembered for. Stone by stone across half a mile of sea.", "He did this too. Ships from Cyprus and Sidon broke Tyre's command of its own water. A different first step in the same place is still a first step.", "The histories have him arguing with his generals and winning. Whether he carried a stone, Maiji would say of course he did. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step was a causeway, begun with one stone. A different first step in the same place is still a first step.", "help": {"zero": "You did not ask Maiji on this journey. Arjun did, at eight and at thirty-two, and she told him the same story both times. Next time, ask the one who has the story. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You asked Maiji {n} on this journey. She told this story to a boy on a verandah and to a man in a hospital room, and it was the same story, and it worked both times. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the first wall in your own life, as you named it: {ice}", "closing": "The causeway is still there. Tyre is a peninsula now because of it. What you carry off the shore is not a city, and it is not Alexander, and it is not even Maiji. It is the evidence that you stayed at the first wall so that the word would not enter your vocabulary.", "stickerLines": ["Walked with Alexander, and with Maiji.", "Tyre, 332 BC. A verandah in Kolkata."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The causeway\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M40,240 L360,240\" stroke-width=\"2\"/>\n  <path d=\"M50,240 L62,214 L84,214 L96,240 M96,240 L108,214 L130,214 L142,240 M142,240 L154,214 L176,214 L188,240 M188,240 L200,214 L222,214 L234,240\" stroke-width=\"3\"/>\n  <path d=\"M234,240 L246,214 L268,214 L280,240\" stroke-width=\"3\" stroke-dasharray=\"4 5\"/>\n  <path d=\"M292,200 L292,120 L360,120 L360,240 M292,200 L360,200\" stroke-width=\"4\"/><path d=\"M304,138 L304,150 M322,138 L322,150 M340,138 L340,150\" stroke-width=\"2.4\"/>\n  <path d=\"M40,262 C80,254 120,270 160,262 C200,254 240,270 280,262\" stroke-width=\"1.6\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
    '1':{text:A[1],red:true},'2':{text:A[2],red:true},'3':{text:A[3],red:true},'4':{text:A[4],red:true},'5':{text:A[5],red:true},
    overlap:{text:overlap}, choice:{text:c.short,red:true}, reply:{text:c.reply}, help:{text:help}, ice:{text:state.ice,red:true},
    '1b':{text:A['1b'],red:true},'2b':{text:A['2b'],red:true},'3b':{text:A['3b'],red:true},'4b':{text:A['4b'],red:true},'5b':{text:A['5b'],red:true}
  };
  try{ const key='unquit-ledger'; const cur=JSON.parse(localStorage.getItem(key)||'[]'); cur.push({slug:D.slug,title:D.title,object:D.sticker,lock:A[7]+(A['7b']?('  /  '+A['7b']):''),ice:state.ice||'',day:c.short,date:new Date().toISOString().slice(0,10)}); localStorage.setItem(key,JSON.stringify(cur)); }catch(e){}
  const wrap = el('div',{class:'story'});
  wrap.append(el('h1',{text:S.heading}), el('p',{class:'sub',text:S.sub}));
  S.paragraphs.forEach(t=>wrap.append(render(t,vars)));
  wrap.append(el('p',{class:'stepname',text:S.lockLabel}));
  wrap.append(el('div',{class:'lock you',text:A[7]}));
  if(D.two && A['7b']) wrap.append(el('div',{class:'lock you',style:'margin-top:-20px',text:A['7b']}));
  if(state.ice) wrap.append(render(S.iceLine,vars));
  wrap.append(el('p',{text:S.closing}));
  if(S.personalNote){ wrap.append(el('div',{class:'note'}, el('p',{class:'from',text:S.personalNote.from}), el('p',{text:S.personalNote.text}))); }
  const art = el('div',{html:D.stickerSvg||''}); const st = el('div',{class:'sticker'}, art, el('div',{class:'big',text:D.sticker}), el('div',{class:'small',html:S.stickerLines.join('<br>')}));
  wrap.append(st);
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:'Print or save',onclick:()=>window.print()}), el('button',{class:'link',text:'Walk it again',onclick:()=>{Object.assign(state,{answers:{},help:{},day:null,ice:'',stepMode:{}}); arrive();}}), el('a',{class:'link',href:'../ledger.html',text:'Your evidence',style:'font-size:17px'}), el('a',{class:'link',href:'../index.html',text:'All journeys',style:'font-size:17px'})));
  show(wrap);
}
arrive();
</script>
