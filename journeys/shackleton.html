<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Ernest Shackleton</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>

  <aside id="aside"></aside>

<footer>Unquit Journeys. Prototype. Historical details drawn from Unquit: The Oldest Choice and primary expedition records.</footer>
<script>
const D = {"series": "Unquit Journeys", "title": "Ernest Shackleton", "subtitle": "October 27, 1915. The Weddell Sea, Antarctica.", "object": "The banjo", "sticker": "The banjo.", "arrive": {"heading": "You are standing where Ernest Shackleton stood.", "paragraphs": ["Nine months ago, on January 19, the ice closed around the Endurance. Ernest Shackleton had come to make the first crossing of the Antarctic continent on foot. The ship was less than a hundred miles from where he planned to land when the pack took her. Since then she has drifted with the ice, a ship going nowhere, and his twenty-seven men have lived aboard her like a wooden village.", "This morning the pressure changed. The floes are grinding against her sides. You can hear the beams breaking below deck. Water is coming in faster than the pumps can move it. Before dark the order to abandon ship will be given. The men will carry what they can onto the ice: three lifeboats, the dogs, the sledges, food for weeks, not months.", "The nearest human being is more than a thousand miles away. No one knows where this ship is. No rescue is coming, because no one knows there is anything to rescue.", "Tonight Shackleton steps aside and you step in. The ship, the men, the ice and the promise are his. Every decision from here is yours. The men will call you Boss, because Boss is the job in front of you, not a person you have to become.", "The crossing he promised his sponsors, his wife, his country and himself is over. It has been over since January. He knows it. Now so do you. No one else has said it out loud."], "button": "Step onto the ice"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "It is evening. The ship is still upright, but she is finished, and you know it. The men are pitching tents on a floe that could split under them tonight. They keep looking at you.", "question": "What are you feeling right now?", "placeholder": "Write it plainly. No one else will read this.", "helper": {"who": "Frank Wild, your second in command", "says": "Boss, you don't have to say it to them. Say it to me.", "options": ["I feel I have failed them. I brought every one of them here.", "I feel nothing yet. There is too much to do before dark.", "I feel the crossing dying, and I have not let myself grieve it."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before you decide anything about tomorrow, take an inventory of tonight. Not of the stores, and not of Shackleton. Of yourself.", "question": "What have you already done, in your own life, that proves you know how to continue when the plan is gone?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Frank Wild, who was with Shackleton in 1909", "says": "I can tell you what the Boss carries. In 1909 he stood ninety-seven miles from the Pole and turned four of us around so four of us would live. Once he was sent home as an invalid and came back twice. He was refused money for years and built this ship anyway. Now you tell me what you carry. Finish one of these.", "options": ["A time I changed the goal so the purpose could survive: ", "A time I was told I was finished, and came back: ", "A time I was refused, and continued anyway: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "Tonight one sentence is trying to become true: I have failed. If you let it settle, it becomes who you are, and twenty-seven men will read it on your face at breakfast. You do not have to argue with it. You only have to refuse to decide it tonight.", "question": "What is the one reason you will not let tonight decide anything?", "placeholder": "Not a plan. One reason to wait until the light changes.", "helper": {"who": "Frank Hurley, the expedition photographer", "says": "I am not writing tonight's diary entry yet, Boss. Tomorrow's light will be different.", "options": ["Because the men will look at my face in the morning before they look at the ice.", "Because the floe is still moving north, and a moving floe is not a verdict.", "Because a decision made in the dark on a dying ship is not a decision. It is exhaustion talking."]}}, {"n": 4, "name": "One step", "prompt": "Morning. The ship is still afloat, barely. The men are waiting for something from you. Not a plan for the next year. You do not know how long this will take. One step, small enough that you cannot fail it today.", "question": "What is it?", "placeholder": "Something you can finish before noon.", "helper": {"who": "Leonard Hussey, the meteorologist, twenty-four years old", "says": "They will follow whatever you do first, Boss. What will you do first?", "options": ["I will gather them and say it plainly. Ship and stores have gone, so now we will go home. One sentence. Then I will let them eat.", "I will set the limit at two pounds of personal gear per man, and I will go first. My gold watch and the sovereigns go onto the ice where they can see.", "I will tell Hussey to bring the banjo. Twenty-eight men can live on seal meat. They cannot live without something to sing to."]}}, {"n": 5, "name": "What you feel now", "prompt": "You did it. The sentence is said, or the watch is on the ice, or the banjo is on the sledge. Nothing about your situation has changed. You are still on a floe, more than a thousand miles from anyone.", "question": "What has changed in you?", "placeholder": "Compare it to last night.", "helper": {"who": "Frank Wild", "says": "I watched their faces while you spoke, Boss. Do you want to know what I saw?", "options": ["The weight is the same, but it is shared now. Twenty-eight men are carrying it, not one.", "The crossing is finally dead, and I am surprised how light that feels. I can see the new goal clearly. Every man home.", "I am still afraid. But I am afraid as their leader, not as a failure. That is a different fear."]}}, {"n": 6, "name": "Time passes", "montage": ["The Endurance sinks on November 21, 1915. You watch from the ice. That night Frank Hurley writes two words in his diary: no repining.", "You live on the floe for five more months. Ocean Camp. Patience Camp. The ice carries you north whether you want it or not. On April 9, 1916, the floe breaks under the camp and you put the three boats into open water. Six days later you land on Elephant Island, the first solid ground under your feet in 497 days. It is uninhabited and off every shipping route. No one will find you here.", "So you leave. You take five men and the largest boat, twenty-two feet long, and sail 800 miles toward South Georgia across the worst ocean on earth. Seventeen days. Worsley fixes your position by the sun four times in all that distance. You land on the wrong side of the island and cross its mountains on foot, a day and a half without sleep, to reach the whaling station at Stromness.", "Then you go back for the others. The ice turns you away three times. On August 30, 1916, from the deck of a small Chilean tug, you count the figures on the beach and shout across the water: Are you all well? Frank Wild shouts back: We are all well, Boss.", "Twenty-eight men. Not one lost."], "question": "Success has arrived. Here is the question the rescue cannot answer. On which day was the unquitter made?", "choices": [{"label": "August 30, 1916. The day the rescue came.", "short": "the day the rescue came", "reply": "Look again. The rescue was the last day. Every day before it required the same decision, made in the dark, without knowing this day would come. The rescue did not make an unquitter. It found one."}, {"label": "April 24, 1916. The day you launched the boat toward South Georgia.", "short": "the day you launched the boat", "reply": "A brave day. But the boat was launched because the decision had already been made, months earlier, on the ice. The boat was the decision's consequence, not its beginning."}, {"label": "October 27, 1915. The day you said, so now we will go home.", "short": "the day you said, so now we will go home", "reply": "Yes. The rescue was the evidence arriving. The decision was made 308 days earlier, in one sentence, on a floe that could have split that night. That is where unquitters are made. Not at the finish. At the sentence. Tonight, on the same floe, you made yours."}, {"label": "January 9, 1909. The day you turned back ninety-seven miles from the Pole.", "short": "the day you turned back from the Pole", "reply": "Even earlier. Which means Shackleton was already an unquitter before the Endurance was built. The ice did not make him one. It found one. That is what your own evidence in step two was for. It was there before tonight."}]}, {"n": 7, "name": "Lock it in", "prompt": "You will face ice again. Different ice. Write one sentence you want to be able to read on that day. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Frank Hurley", "says": "I kept the diary so we could read it later, Boss. What should the entry say?", "options": ["I did not spend one day mourning a goal I could no longer reach. I replaced it the same day.", "I did the small human things first, the food, the banjo, the sleeping bag, and the large things became possible.", "I did go back. Reaching safety myself was never the goal."]}, "ice": {"question": "One more line, and this one is yours. Where is the ice in your own life right now?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, on Shackleton's ice", "sub": "Your decisions, beside his", "stepOverlap": ["He made the same choice, in almost the same words, on October 27, 1915. Ship and stores have gone, so now we will go home. Then he let them eat.", "He made the same choice. Two pounds per man. His gold watch and his sovereigns went onto the ice before anyone else's.", "He made the same choice. He called the banjo vital mental medicine and made room for it on the sledge when he would not make room for gold."], "stepOverlapFree": "His first step was different. A single sentence to the men: ship and stores have gone, so now we will go home. Then the two-pound rule. Then the banjo. A different choice on the same ice is still a choice made.", "help": {"zero": "You did not ask for help on this journey. Shackleton did. He sailed 800 miles to find it. Next time, try the door. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You asked for help {n} on this journey. Shackleton asked by sailing 800 miles to find it. Asking is not the opposite of continuing. It is how continuing is done."}, "closing": "The ship is gone. The men are home. What you carry off the ice is not the rescue, and it is not Shackleton. It is the evidence that you decided before the rescue was possible.", "paragraphs": ["October 27, 1915. The Weddell Sea. You stood where Ernest Shackleton stood, and the ice asked you what it asked him. When the ship began to break, you wrote: {1} Frank Hurley's diary from those weeks records the same thing without ornament. Grief, and then work.", "Before you decided anything, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was a January morning in 1909, ninety-seven miles from the Pole, when he turned four men around so that four men would live.", "You refused to let the first night decide. Your reason: {3} That refusal has a name in the Unquit vocabulary. The deferral. Not tonight. Tomorrow's light will be different.", "Your first step: {4} {overlap}", "After the step, nothing outside had changed. Inside, you noticed this: {5}", "Then time did what time does. On August 30, 1916, a small tug found twenty-two men on a beach on Elephant Island, and Frank Wild called across the water: We are all well, Boss. Twenty-eight men. Not one lost.", "Asked on which day the unquitter was made, you chose {choice}. {reply}", "{help}"], "lockLabel": "The evidence you are taking with you", "iceLine": "And the ice in your own life, as you named it tonight: {ice}", "stickerLines": ["Walked with Ernest Shackleton.", "October 27, 1915."]}, "slug": "shackleton", "footer": "Historical details drawn from Unquit: The Oldest Choice and primary expedition records.", "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The banjo\">\n<g transform=\"rotate(-22 200 220)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <circle cx=\"200\" cy=\"270\" r=\"96\" stroke-width=\"4\"/>\n  <circle cx=\"200\" cy=\"270\" r=\"83\" stroke-width=\"1.6\"/>\n  <path d=\"M187,176 L187,42 M213,176 L213,42\" stroke-width=\"2.6\"/>\n  <path d=\"M187,42 L181,42 Q181,8 200,6 Q219,8 219,42 L213,42\" stroke-width=\"2.6\"/>\n  <circle cx=\"171\" cy=\"18\" r=\"4\" stroke-width=\"2\"/><circle cx=\"171\" cy=\"34\" r=\"4\" stroke-width=\"2\"/>\n  <circle cx=\"229\" cy=\"18\" r=\"4\" stroke-width=\"2\"/><circle cx=\"229\" cy=\"34\" r=\"4\" stroke-width=\"2\"/>\n  <circle cx=\"177\" cy=\"118\" r=\"4\" stroke-width=\"2\"/>\n  <path d=\"M188.0, 62 L212,62\" stroke-width=\"1.6\"/><path d=\"M188.0, 80 L212,80\" stroke-width=\"1.6\"/><path d=\"M188.0, 100 L212,100\" stroke-width=\"1.6\"/><path d=\"M188.0, 122 L212,122\" stroke-width=\"1.6\"/><path d=\"M188.0, 146 L212,146\" stroke-width=\"1.6\"/><path d=\"M188.0, 168 L212,168\" stroke-width=\"1.6\"/>\n  <path d=\"M193,22 L193,304\" stroke-width=\"1.1\"/><path d=\"M198,22 L198,304\" stroke-width=\"1.1\"/><path d=\"M202,22 L202,304\" stroke-width=\"1.1\"/><path d=\"M207,22 L207,304\" stroke-width=\"1.1\"/>\n  <path d=\"M186,304 L214,304\" stroke-width=\"3\"/>\n  <path d=\"M190,352 L210,352\" stroke-width=\"2.6\"/>\n  <path d=\"M182,270 a18,18 0 1,0 36,0\" stroke-width=\"0\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
    '1':{text:A[1],red:true},'2':{text:A[2],red:true},'3':{text:A[3],red:true},'4':{text:A[4],red:true},'5':{text:A[5],red:true},
    overlap:{text:overlap}, choice:{text:c.short,red:true}, reply:{text:c.reply}, help:{text:help}, ice:{text:state.ice,red:true},
    '1b':{text:A['1b'],red:true},'2b':{text:A['2b'],red:true},'3b':{text:A['3b'],red:true},'4b':{text:A['4b'],red:true},'5b':{text:A['5b'],red:true}
  };
  try{ const key='unquit-ledger'; const cur=JSON.parse(localStorage.getItem(key)||'[]'); cur.push({slug:D.slug,title:D.title,object:D.sticker,lock:A[7]+(A['7b']?('  /  '+A['7b']):''),ice:state.ice||'',day:c.short,date:new Date().toISOString().slice(0,10)}); localStorage.setItem(key,JSON.stringify(cur)); }catch(e){}
  const wrap = el('div',{class:'story'});
  wrap.append(el('h1',{text:S.heading}), el('p',{class:'sub',text:S.sub}));
  S.paragraphs.forEach(t=>wrap.append(render(t,vars)));
  wrap.append(el('p',{class:'stepname',text:S.lockLabel}));
  wrap.append(el('div',{class:'lock you',text:A[7]}));
  if(D.two && A['7b']) wrap.append(el('div',{class:'lock you',style:'margin-top:-20px',text:A['7b']}));
  if(state.ice) wrap.append(render(S.iceLine,vars));
  wrap.append(el('p',{text:S.closing}));
  if(S.personalNote){ wrap.append(el('div',{class:'note'}, el('p',{class:'from',text:S.personalNote.from}), el('p',{text:S.personalNote.text}))); }
  const art = el('div',{html:D.stickerSvg||''}); const st = el('div',{class:'sticker'}, art, el('div',{class:'big',text:D.sticker}), el('div',{class:'small',html:S.stickerLines.join('<br>')}));
  wrap.append(st);
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:'Print or save',onclick:()=>window.print()}), el('button',{class:'link',text:'Walk it again',onclick:()=>{Object.assign(state,{answers:{},help:{},day:null,ice:'',stepMode:{}}); arrive();}}), el('a',{class:'link',href:'../ledger.html',text:'Your evidence',style:'font-size:17px'}), el('a',{class:'link',href:'../index.html',text:'All journeys',style:'font-size:17px'})));
  show(wrap);
}
arrive();
</script>
