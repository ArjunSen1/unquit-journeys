<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Ruth</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from the Book of Ruth as received in the Hebrew Bible. This is a story held by tradition, not by record, and is presented as such.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "ruth", "title": "Ruth", "subtitle": "The road out of Moab. The time of the judges, by tradition.", "object": "The sheaf", "sticker": "The sheaf.", "footer": "Drawn from the Book of Ruth as received in the Hebrew Bible. This is a story held by tradition, not by record, and is presented as such.", "arrive": {"heading": "You are standing where Ruth stood.", "paragraphs": ["Ruth is a Moabite. She married a foreigner, a young man from Bethlehem whose family had crossed into Moab to escape a famine. His father died. Then he died, and his brother died, within the same few years. Three women are left in a house built for a family: Naomi, the mother, and her two daughters-in-law, Ruth and Orpah. None of them has a son. In this world that is a way of saying none of them has a future.", "Naomi has decided to go home. The famine in Bethlehem is over, she has heard, and she would rather be poor among her own people than poor here. She has told the two younger women to go back to their mothers' houses, marry again if they can, and forget the family that brought them nothing but graves. She is not being cruel. She is telling the truth as she sees it. She says her name should now be Mara, which means bitter.", "They have walked with her to the road. Orpah has wept, kissed her, and turned back toward Moab, toward everything known. Naomi is standing on the road facing Bethlehem, an old woman with nothing. Ruth is standing between them.", "Tonight Ruth steps aside and you step in. The road, the two dead husbands, the mother-in-law who says she is bitter and the country ahead where you will be a stranger without rights are hers. Every decision from here is yours. She is not asking you to become her. She is asking you to stand at a fork in a dirt road with one woman walking away from you and another telling you to go.", "Going back is not shameful. Orpah went back and no one blames her. Going forward means a foreign country, a foreign god, a widow's status in a place where a foreign widow has nothing to stand on. Naomi has released you. The only person holding you to this road is you."], "button": "Step onto the road"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "Orpah is a small figure now, walking back. Naomi has not turned around. She is waiting to hear your feet go one way or the other. The dust of the road is on both your sandals.", "question": "What are you feeling right now?", "placeholder": "Write it plainly. No one else will read this.", "helper": {"who": "Orpah, before she turned back", "says": "You do not have to be brave with me. We buried our husbands in the same month. Tell me.", "options": ["I feel the pull of the known so strongly it is almost a hand on my shoulder.", "I feel that if I let Naomi walk alone I will have decided who I am, and I do not like that person.", "I feel I am choosing between two kinds of loss, and no one has told me which one is smaller."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before you decide anything about the road ahead, take an inventory of where you stand. Not of Naomi. Of yourself.", "question": "What have you already done, in your own life, that proves you know how to continue toward something unknown when going back is allowed?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Naomi, who has not yet turned around", "says": "I know what you carry, daughter. You married into a foreign family when your own people would have kept you. You stayed in our house when the sons were gone and there was nothing to stay for. Now tell me what you carry. Finish one of these.", "options": ["A time I stayed when leaving was permitted and no one would have blamed me: ", "A time I walked into a place where I was a stranger and made it hold me: ", "A time I chose a person over a place: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "On this road one sentence is trying to become true: I have nothing to offer her, so I should go back. It sounds like humility. If you let it settle, it becomes the story of your life in Moab. You do not have to argue with it. You only have to refuse to decide it here, in the dust, with Orpah still in sight.", "question": "What is the one reason you will not let this moment on the road decide everything?", "placeholder": "Not a plan. One reason to walk a little further before deciding.", "helper": {"who": "Naomi", "says": "Walk with me to the next rise, and then tell me. Not here. Why will you wait?", "options": ["Because a decision made while watching someone walk away is grief deciding, not me.", "Because she has said she is bitter, and a bitter woman's account of her own future is not the whole account.", "Because I do not yet know what I have to offer. I only know what I do not have."]}}, {"n": 4, "name": "One step", "prompt": "The next rise. Bethlehem is somewhere ahead, days away. Moab is behind. You need one step. Not a vow for the rest of your life. One step small enough that you cannot fail it today.", "question": "What is it?", "placeholder": "Something you can do before the road bends.", "helper": {"who": "Naomi, who has finally turned to face you", "says": "Whatever you do first, I will believe. What will you do first?", "options": ["I will say it plainly, so she cannot send me back again: where you go, I go. Where you stay, I stay. Your people will be my people. Then I will pick up her bundle.", "I will take the water skin and walk ahead of her, so she is following me for a while and not the other way.", "I will ask her to teach me one thing about Bethlehem before we get there. One word, one custom. So that I arrive knowing something."]}}, {"n": 5, "name": "What you feel now", "prompt": "You did it. The words are said, or the bundle is on your shoulder, or the first word of a new language is in your mouth. Nothing about your situation has changed. You are still a foreign widow on a road to a place that owes you nothing.", "question": "What has changed in you?", "placeholder": "Compare it to the fork in the road.", "helper": {"who": "Naomi", "says": "I heard you say it. Do you want to know what I heard?", "options": ["The two losses are still there. But I have chosen one, and a chosen loss is lighter than an unchosen one.", "I stopped waiting for her to want me. I decided to be wanted later.", "I am afraid of Bethlehem. I find I am not afraid of the road."]}}, {"n": 6, "name": "Time passes", "montage": ["You arrive in Bethlehem at the beginning of the barley harvest. The women of the town say, is this Naomi? Naomi says, do not call me that. Call me bitter. You say nothing. You go out to the fields.", "You glean behind the reapers in a field belonging to a landowner named Boaz, gathering what the harvesters drop, which is the right of the poor and the foreigner under the law of this place. Boaz has heard what you did for your mother-in-law. He tells the reapers to drop more than they need to.", "Naomi, who called herself bitter, begins to plan. She sends you to the threshing floor at night. Boaz, who has a duty to the dead man's family, goes to the town gate in the morning and claims the duty publicly, before ten elders, when a closer relative declines it.", "You marry Boaz. You have a son, and the women of Bethlehem say, a son has been born to Naomi. She holds him. His name is Obed. Obed will be the father of Jesse, and Jesse the father of David, the king.", "Your book is one of the shortest in the scriptures and one of two named for a woman. It is read aloud every year at the harvest festival. The sentence you said on the road is still said at weddings, three thousand years on, by people who have never been to Moab."], "question": "The evidence has arrived, and it has a name. Here is the question the genealogy cannot answer. On which day was the unquitter made?", "choices": [{"label": "The day at the gate, when Boaz claimed you before the elders.", "short": "the day at the gate", "reply": "Look again. The gate was the evidence arriving. It happened because a foreign widow had already chosen the road, weeks earlier, when no gate and no Boaz were in sight. A redemption does not make an unquitter. It finds one."}, {"label": "The first morning in the barley field.", "short": "the first morning in the barley field", "reply": "A hard and honest morning. But gleaning was the consequence of a decision, not the decision itself. You were in that field because of what you said on the road."}, {"label": "The rise in the road, when you said, where you go, I go.", "short": "the rise in the road", "reply": "Yes. There was no field, no Boaz, no son. There was an old woman calling herself bitter, a sister-in-law walking away, and a country ahead that owed you nothing. Unquitters are not made when the harvest is in. They are made at the fork. Tonight, on the same road, you made yours."}, {"label": "The day you married a foreigner when your own people would have kept you.", "short": "the day you married a foreigner", "reply": "Even earlier. Which means Ruth was already an unquitter before the road out of Moab. The fork did not make her one. It found one. That is what your own evidence in step two was for. It was there before tonight."}]}, {"n": 7, "name": "Lock it in", "prompt": "You will stand at a fork again, with going back permitted. Different road. Write one sentence you want to be able to read on that day. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Naomi", "says": "I will tell this to the women of Bethlehem. What should I tell them you said?", "options": ["I did choose the person over the place when the place was all I knew.", "I did keep walking toward a country that owed me nothing.", "I did say it out loud so that I could not be sent back."]}, "ice": {"question": "One more line, and this one is yours. Where is the fork in the road in your own life right now?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, on Ruth's road", "sub": "Your decisions, beside hers", "stepOverlap": ["She made the same choice, in words the tradition has kept almost exactly. Where you go I will go, where you lodge I will lodge, your people will be my people. Then Naomi stopped arguing.", "She made a choice in the same spirit. From the road onward, Ruth is the one who acts and Naomi the one who follows, until Naomi begins to plan again in Bethlehem.", "She made a choice in the same spirit. She arrived at the harvest knowing the law of gleaning, which is to say she arrived knowing something."], "stepOverlapFree": "Her first step was different. She said the words the tradition has kept, and Naomi stopped telling her to go. A different choice on the same road is still a choice made.", "help": {"zero": "You did not ask for help on this journey. Ruth did. She took the help of a bitter woman and a landowner's kindness and a law written for the poor. Next time, try the door. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You asked for help {n} on this journey. Ruth took the help of a bitter woman, a landowner's kindness and a law written for the poor. Asking is not the opposite of continuing. It is how continuing is done."}, "closing": "The road is still there. So is the sentence. What you carry from it is not the genealogy and it is not Ruth. It is the evidence that you chose forward when back was permitted.", "paragraphs": ["The road out of Moab. Orpah walking away, Naomi not turning round. You stood where Ruth stood, and the fork asked you what it asked her. With the dust on your sandals, you wrote: {1} The tradition gives Ruth no inner speech at all. It gives her one sentence, and lets the sentence do the work.", "Before you decided anything, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Hers was a marriage into a foreign family and a house she stayed in after the men were gone.", "You refused to let the fork decide. Your reason: {3} That refusal has a name in the Unquit vocabulary. The deferral. Not here. Walk to the next rise.", "Your first step: {4} {overlap}", "After the step, nothing outside had changed. Inside, you noticed this: {5}", "Then time did what time does. A barley field. A threshing floor. A gate and ten elders. A son named Obed, and a grandson's grandson who became a king.", "Asked on which day the unquitter was made, you chose {choice}. {reply}", "{help}"], "lockLabel": "The evidence you are taking with you", "iceLine": "And the fork in the road in your own life, as you named it tonight: {ice}", "stickerLines": ["Walked with Ruth.", "The road out of Moab."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The sheaf\"><g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M200,350 L200,140 M170,350 Q176,240 196,150 M230,350 Q224,240 204,150 M150,350 Q160,260 190,160 M250,350 Q240,260 210,160\" stroke-width=\"2.4\"/><path d=\"M160,270 Q200,250 240,270 M160,284 Q200,266 240,284\" stroke-width=\"3\"/><path d=\"M200,140 Q186,110 200,70 Q214,110 200,140 Z\" stroke-width=\"2.6\"/><path d=\"M196,150 Q172,128 176,90 Q196,116 196,150 Z\" stroke-width=\"2.6\"/><path d=\"M204,150 Q228,128 224,90 Q204,116 204,150 Z\" stroke-width=\"2.6\"/><path d=\"M190,160 Q160,150 152,116 Q180,132 190,160 Z\" stroke-width=\"2.6\"/><path d=\"M210,160 Q240,150 248,116 Q220,132 210,160 Z\" stroke-width=\"2.6\"/><path d=\"M120,350 L280,350\" stroke-width=\"3\"/></g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
    '1':{text:A[1],red:true},'2':{text:A[2],red:true},'3':{text:A[3],red:true},'4':{text:A[4],red:true},'5':{text:A[5],red:true},
    overlap:{text:overlap}, choice:{text:c.short,red:true}, reply:{text:c.reply}, help:{text:help}, ice:{text:state.ice,red:true},
    '1b':{text:A['1b'],red:true},'2b':{text:A['2b'],red:true},'3b':{text:A['3b'],red:true},'4b':{text:A['4b'],red:true},'5b':{text:A['5b'],red:true}
  };
  try{ const key='unquit-ledger'; const cur=JSON.parse(localStorage.getItem(key)||'[]'); cur.push({slug:D.slug,title:D.title,object:D.sticker,lock:A[7]+(A['7b']?('  /  '+A['7b']):''),ice:state.ice||'',day:c.short,date:new Date().toISOString().slice(0,10)}); localStorage.setItem(key,JSON.stringify(cur)); }catch(e){}
  const wrap = el('div',{class:'story'});
  wrap.append(el('h1',{text:S.heading}), el('p',{class:'sub',text:S.sub}));
  S.paragraphs.forEach(t=>wrap.append(render(t,vars)));
  wrap.append(el('p',{class:'stepname',text:S.lockLabel}));
  wrap.append(el('div',{class:'lock you',text:A[7]}));
  if(D.two && A['7b']) wrap.append(el('div',{class:'lock you',style:'margin-top:-20px',text:A['7b']}));
  if(state.ice) wrap.append(render(S.iceLine,vars));
  wrap.append(el('p',{text:S.closing}));
  if(S.personalNote){ wrap.append(el('div',{class:'note'}, el('p',{class:'from',text:S.personalNote.from}), el('p',{text:S.personalNote.text}))); }
  const art = el('div',{html:D.stickerSvg||''}); const st = el('div',{class:'sticker'}, art, el('div',{class:'big',text:D.sticker}), el('div',{class:'small',html:S.stickerLines.join('<br>')}));
  wrap.append(st);
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:'Print or save',onclick:()=>window.print()}), el('button',{class:'link',text:'Walk it again',onclick:()=>{Object.assign(state,{answers:{},help:{},day:null,ice:'',stepMode:{}}); arrive();}}), el('a',{class:'link',href:'../ledger.html',text:'Your evidence',style:'font-size:17px'}), el('a',{class:'link',href:'../index.html',text:'All journeys',style:'font-size:17px'})));
  show(wrap);
}
arrive();
</script>
