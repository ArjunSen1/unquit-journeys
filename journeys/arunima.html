<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Arunima Sinha, April 2011</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from Arunima Sinha's own account, paraphrased, and from the India list. Consent track: written consent and a reading of this script before launch. Nothing about the attack is described beyond what she has said publicly.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "arunima", "title": "Arunima Sinha, April 2011", "subtitle": "A hospital bed in Delhi. The leg is gone below the knee. The newspapers have a version.", "object": "The ice axe", "sticker": "The ice axe.", "footer": "Drawn from Arunima Sinha's own account, paraphrased, and from the India list. Consent track: written consent and a reading of this script before launch. Nothing about the attack is described beyond what she has said publicly.", "arrive": {"heading": "You are standing where a young athlete lay after a train.", "paragraphs": ["She is twenty-three and a national-level volleyball player from a small town in Uttar Pradesh. In April 2011 she was on a train to Delhi to sit an examination. Thieves tried to take her bag and her chain. She resisted. They threw her from the moving train. She lay on the tracks through the night, and by morning her left leg had to be amputated below the knee.", "She is in a hospital bed in Delhi. The newspapers have printed a version of events that suggests she jumped, and the version is untrue, and it is being read by everyone she knows. She has one leg, a national team she can no longer play for, a public story she did not write, and a hospital ceiling.", "She has begun, in the bed, to think about mountains. She does not know why. She has never climbed one.", "Now Arunima steps aside and you step in. The bed, the leg, the false story and the ceiling are hers. What you do with a body and a story that have both been taken from you is yours."], "button": "Lie in the hospital bed"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The ward is loud. The newspaper is on the chair where someone left it, folded to the page. The bandaged leg ends where it ends.", "question": "What are you feeling right now?", "placeholder": "Say it as a twenty-three-year-old in a bed, not as a woman on a summit.", "helper": {"who": "Your brother-in-law, who has come every day and has read the newspaper too", "says": "I have read what they printed. I know it is not true. Before we talk about anything, tell me what you feel in that bed.", "options": ["I feel a leg that ends and a story that begins with a lie, and I do not know which of them I am angrier about.", "I feel that I was an athlete on Tuesday and a headline on Friday, and neither of those is a person.", "I feel that I have started thinking about mountains from a bed with one leg, and that I should probably not say that out loud."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before anything is decided, take an inventory. Not of the leg, and not of Arunima. Of yourself.", "question": "What have you already done, in your own life, that proves you can refuse a story someone else has written about you?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Your brother-in-law", "says": "I can tell you what the woman in that bed carries. A national team reached from a small town, which is its own kind of climb. A night on the tracks that she survived by staying awake. A refusal, on a moving train, to hand over what was hers. Now you tell me what you carry. Finish one of these.", "options": ["A time I refused a story someone else had written about me: ", "A time I survived a night by staying awake: ", "A time I began thinking about the next thing before anyone thought I should: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the bed is: the leg is gone, the team is gone, the story is theirs, and so is the rest of my life. It sounds like an inventory. It is the newspaper, extended to the future. You do not have to decide what your life is from a hospital bed. You only have to refuse to let the leg and the headline decide it together.", "question": "What is the one reason you will not decide in this bed?", "placeholder": "Not a plan. One reason the ceiling does not get the vote.", "helper": {"who": "Your brother-in-law", "says": "The leg is gone and the paper printed a lie. Tell me why they do not get to decide the rest.", "options": ["Because the leg is a fact about my body and the story is a fact about a newspaper, and neither is a fact about what I do next.", "Because I have been thinking about mountains from this bed, and a woman who is thinking about mountains has not been decided.", "Because the story is untrue and the only answer to an untrue story is a true one, and I have not written mine yet."]}}, {"n": 4, "name": "One step", "prompt": "Not a mountain. Not the highest one, which is two years off and unthinkable. One step, small enough to finish before the ward lights go down.", "question": "What is it?", "placeholder": "Something a woman can do from a hospital bed.", "helper": {"who": "Your brother-in-law", "says": "You cannot walk yet. What is the smallest thing you can do tonight?", "options": ["I will say it out loud to you, once: I am going to climb. And let you think what you think.", "I will write down the true version of the train, in order, so that it exists somewhere that is not a newspaper.", "I will ask the doctor tomorrow not how long the recovery is, but what a prosthetic leg can do at altitude."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The word climb has been said to one person, or the true version exists on paper, or a question about altitude is waiting for a doctor. The leg still ends where it ends. The newspaper is still on the chair.", "question": "What has changed in you?", "placeholder": "Compare it to the ceiling.", "helper": {"who": "Your brother-in-law", "says": "Nothing about the ward changed tonight. What changed in the bed?", "options": ["I said it and he did not laugh. That was the whole of what I needed tonight.", "The true version is on paper. It is one page. It is more than the newspaper had.", "I am going to ask about altitude instead of recovery. The question has changed. Everything after a changed question is different."]}}, {"n": 6, "name": "Time passes", "montage": ["She leaves the hospital with a prosthetic leg and goes, within months, to find the first Indian woman to have climbed Everest, and asks to be trained. She is trained. She climbs smaller peaks first. On May 21, 2013, two years and a month after the train, she stands on the summit of Everest, the first woman amputee to do so.", "She climbs the highest peaks on the other continents in the years after. She founds a sports academy for the disabled and the poor. The newspapers print a different version now.", "She has said that on the tracks that night she decided she would do something that would make people remember her for what she did and not for what was done to her. That is the whole of the arrival, decided before the ambulance came."], "question": "A leg gone in April 2011, a summit in May 2013. Here is the question the summit cannot answer for you: what did she climb toward?", "choices": [{"label": "Everest.", "short": "Everest", "reply": "The summit is the fact, and it is extraordinary, and she would say it is the least of what she was climbing toward."}, {"label": "Recovery.", "short": "recovery", "reply": "Recovery was what the doctors were measuring. She asked a different question in the bed. Altitude is not recovery. It is somewhere else entirely."}, {"label": "A true story, written with her own body, to replace the false one.", "short": "a true story, written with her own body, to replace the false one", "reply": "Yes. Two things were taken on the train: a leg, and the story of what happened. The leg could not be returned. The story could be replaced, and she replaced it with the only instrument she had left, which was the rest of her body, at altitude. Arrival here is not a summit. It is the day the newspapers print a different version because she made them."}, {"label": "Nothing. She was reckless.", "short": "nothing, she was reckless", "reply": "She was trained by the first Indian woman to climb Everest and climbed smaller peaks for two years before the big one. Reckless is what the newspaper would have called it. The newspaper had been wrong before."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another bed, another headline written by someone else. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Your brother-in-law", "says": "One line for the next false story. Start with I did.", "options": ["I did replace the false story with a true one, written with what I had left.", "I did ask about altitude instead of recovery.", "I did say climb out loud from the bed."]}, "ice": {"question": "One more line, and this one is yours. What story has been written about you that you have not yet replaced, and what would you write it with?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the hospital bed", "sub": "Your April, beside hers", "paragraphs": ["A ward in Delhi, April 2011, a leg that ends and a newspaper folded to a lie. You lay where Arunima Sinha lay, thinking about mountains for no reason you could name, and the bed asked you what it asked her. You wrote: {1}", "Before anything was decided, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Hers was a national team from a small town, a night survived awake, and a refusal on a moving train.", "You refused to let the leg and the headline decide the rest together. Your reason: {3} That refusal is the deferral. Not in this bed. Not on a newspaper's account.", "Your first step: {4} {overlap}", "After the step, the leg still ended where it ended. Inside, you noticed this: {5}", "Then two years did what two years do when a question has changed. A prosthetic, a trainer, smaller peaks, and on May 21, 2013, a summit, and newspapers with a different version.", "Asked what she climbed toward, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["She did this, in the hospital, to family, by her own account. Then she went to find the woman who could train her.", "Her own account of the train is the true version, and she has told it publicly since. A different first step in the same place is still a first step.", "She asked a version of this question early, and the answer sent her to Bachendri Pal. A different first step in the same place is still a first step."], "stepOverlapFree": "Her first step was to say climb out loud from a hospital bed. A different first step in the same place is still a first step.", "help": {"zero": "You did not turn to your brother-in-law. Arunima's family was at the bed every day, by her account, and she said the word to them first. Next time, say it to the one at the bedside. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to your brother-in-law {n} on this journey. The word climb was said to family before it was said to a trainer. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the story written about you that you have not yet replaced, as you named it: {ice}", "closing": "The ward in Delhi has other beds and other newspapers. What you carry out of it is not a summit, and it is not her. It is the evidence that you can replace a false story with a true one, written with what you have left.", "stickerLines": ["Walked with Arunima Sinha.", "Delhi, April 2011."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The ice axe\">\n<g transform=\"rotate(28 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M200,60 L200,340\" stroke-width=\"5\"/><path d=\"M200,60 L120,80 L130,100 L200,90 M200,60 L270,70 L262,90 L200,84\" stroke-width=\"4\"/><path d=\"M190,330 L200,352 L210,330\" stroke-width=\"4\"/><path d=\"M188,140 L212,140 M188,160 L212,160 M188,180 L212,180\" stroke-width=\"1.6\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
