<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Karsanbhai Patel, Nirma</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>

</main>
<footer>Unquit Journeys. Prototype. Drawn from the public record of the founding of Nirma, paraphrased, and from the India list. Consent track: the family should see this script before launch.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "karsanbhai", "title": "Karsanbhai Patel, Nirma", "subtitle": "A backyard in Ahmedabad. 1969. A daughter's name on a packet of detergent.", "object": "The bicycle", "sticker": "The bicycle.", "footer": "Drawn from the public record of the founding of Nirma, paraphrased, and from the India list. Consent track: the family should see this script before launch.", "arrive": {"heading": "You are standing where a father stood in a backyard with a bag of powder.", "paragraphs": ["He is a chemist in a government laboratory in Gujarat, earning a modest salary. In his backyard, after work, he has been mixing a detergent powder by hand. It is cheaper than the powders the big companies sell, and it works, and no one has asked him for it.", "His daughter, Nirupama, died young. He has named the powder after her. Nirma. He packs it in bags, puts them on his bicycle, and rides door to door in the evenings selling it for a fraction of the price of the powders in the shops. He gives a money-back guarantee, because he can afford almost nothing else to give.", "It is 1969. He has a salary he cannot risk, a grief he has put into a name, and a bicycle.", "Now Karsanbhai steps aside and you step in. The backyard, the powder, the name and the bicycle are his. What you do with a grief that has been given a name is yours."], "button": "Stand in the backyard"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The powder is in bags on the ground. The bicycle is against the wall. Her name is written on each bag in your own hand.", "question": "What are you feeling right now?", "placeholder": "Say it as a father in a backyard, not as the founder of a company.", "helper": {"who": "Your wife, who packs the bags with you after dinner", "says": "We do not talk about why the name. We both know. Before you ride tonight, tell me what you feel with her name on the bags.", "options": ["I feel that I have put her name on a bag of soap and that this is either the most foolish thing a grieving man has done or the only thing that has made sense since.", "I feel a salary I cannot lose and an evening I can, and I am spending the evening on her.", "I feel that every door I knock on tonight will say her name back to me, and I want them to."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the ride, take an inventory. Not of the powder, and not of Karsanbhai. Of yourself.", "question": "What have you already done, in your own life, that proves you can carry a grief forward rather than only carry it?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Your wife", "says": "I can tell you what the man in this yard carries. A chemistry good enough to make in a backyard what companies make in factories. A salary kept and evenings given. A daughter's name, said out loud every night at every door, by a man who could not say it for months. Now you tell me what you carry. Finish one of these.", "options": ["A time I carried a grief forward instead of only carrying it: ", "A time I made with my hands what others said needed a factory: ", "A time I said a name out loud that I had not been able to say: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the yard is: a chemist on a bicycle cannot compete with companies, and the grief is making a fool of me. It sounds like sense. It is the shops talking, and the shops have not met the price. You do not have to build a company tonight. You only have to refuse to let the size of the companies decide the evening.", "question": "What is the one reason you will not decide tonight?", "placeholder": "Not a business plan. One reason the shops do not get the vote.", "helper": {"who": "Your wife", "says": "The companies are large. Tell me why that does not decide tonight's ride.", "options": ["Because the powder works and costs a third of theirs, and no one at the door has ever asked how large the company is.", "Because I have a salary. The evenings are free. A free evening spent on her is not a risk. It is what I would be doing anyway, differently.", "Because her name is on the bag, and I am not going to be the man who stopped saying it because a company was large."]}}, {"n": 4, "name": "One step", "prompt": "Not a factory. Not a brand the whole country sings. One step, small enough to finish before dark.", "question": "What is it?", "placeholder": "Something a man can do with a bicycle and bags.", "helper": {"who": "Your wife", "says": "You will ride tonight. What is the smallest thing you can do on the way?", "options": ["I will knock on ten doors. Not the neighborhood. Ten. And say her name at each.", "I will tell every person who buys that if it does not work they can have their money back, and mean it, and see who comes back.", "I will ask one woman who buys to tell one neighbor, and come back next week to see if she did."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. Ten doors have heard her name, or ten households have a guarantee they did not expect, or one woman has been asked to tell one more. The companies are still large. The salary is still the salary.", "question": "What has changed in you?", "placeholder": "Compare it to the bags on the ground.", "helper": {"who": "Your wife, when you come back", "says": "The shops did not change. What changed on the ride?", "options": ["Ten people said her name back to me tonight, reading it off a bag. I have not heard it said that many times since.", "No one asked for their money back. I did not think they would. I needed to hear no one ask.", "One woman said she would tell a neighbor. That is how a bag of powder becomes a thing, one neighbor at a time. It is also how grief does."]}}, {"n": 6, "name": "Time passes", "montage": ["He rides for three years, after work, door to door. Then he leaves the laboratory. By the 1980s the powder with his daughter's name on it is outselling the multinationals in India, at a third of the price, with a jingle the whole country knows and a girl in a white frock on every packet. The girl is Nirupama.", "He said very little about the name for decades. He did not need to. A father put his daughter's name on a bag of powder in a backyard and rode it door to door, and a country washed its clothes with it.", "Continuation through grief is the shape of this journey. The grief did not go anywhere. It went on every packet."], "question": "A daughter's name, a bicycle, a country. Here is the question the company cannot answer for you: what did Karsanbhai carry on the bicycle?", "choices": [{"label": "Detergent.", "short": "detergent", "reply": "Bags of it, mixed by hand, a third of the price. That is what the customers bought. It is not what he was carrying."}, {"label": "A business.", "short": "a business", "reply": "Eventually the largest of its kind in the country. In 1969 it was ten doors an evening. A business is what it became. It is not what was on the bicycle."}, {"label": "A grief he had given a name, forward, door to door.", "short": "a grief he had given a name, forward, door to door", "reply": "Yes. Most grief is carried. His was carried forward, in a form that made him say her name at every door and made a country say it after him. Continuation through grief does not mean the grief resolves. It means it goes somewhere. His went on every packet, and a girl in a white frock became the most recognized child in the country, and she was his."}, {"label": "A money-back guarantee.", "short": "a money-back guarantee", "reply": "He carried that too, because it was all he could afford to give, and it was enough. Trust at the door is how a backyard competes with a factory."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another grief and another backyard. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Your wife", "says": "One line for the next ride. Start with I did.", "options": ["I did carry it forward instead of only carrying it.", "I did say her name at every door.", "I did knock on ten doors and not the neighborhood."]}, "ice": {"question": "One more line, and this one is yours. What grief of yours is only being carried, and what would carrying it forward look like?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the backyard", "sub": "Your ride, beside his", "paragraphs": ["A backyard in Ahmedabad, 1969, bags of powder with a name on them. You stood where Karsanbhai Patel stood, with a bicycle against the wall and a salary you could not lose, and the yard asked you what it asked him. You wrote: {1}", "Before the ride, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was a chemistry good enough for a backyard and a daughter's name he had learned to say again.", "You refused to let the size of the companies decide the evening. Your reason: {3} That refusal is the deferral. Not tonight. Not on the shops' terms.", "Your first step: {4} {overlap}", "After the step, the companies were still large. Inside, you noticed this: {5}", "Then three years of evenings did what they do. A laboratory left, a country washing its clothes with a daughter's name, and a girl in a white frock on every packet.", "Asked what he carried on the bicycle, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this, night after night, for three years.", "He did this. The money-back guarantee is documented as the founding promise. A different first step in the same place is still a first step.", "Word of mouth is how it grew, one neighbor at a time. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step was a bicycle, a bag and a door. A different first step in the same place is still a first step.", "help": {"zero": "You did not turn to your wife. The record says little about who packed the bags, and someone did. Next time, turn to the one at the table after dinner. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to your wife {n} on this journey. Backyards are family enterprises before they are companies. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the grief you are only carrying, as you named it: {ice}", "closing": "The backyard is a factory now. What you carry out of it is not a company, and it is not him. It is the evidence that you can give a grief a name and carry it forward, door to door.", "stickerLines": ["Walked with Karsanbhai Patel.", "Ahmedabad, 1969."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The bicycle\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<circle cx=\"110\" cy=\"260\" r=\"60\" stroke-width=\"4\"/><circle cx=\"290\" cy=\"260\" r=\"60\" stroke-width=\"4\"/><path d=\"M110,260 L180,170 L250,170 L290,260 M180,170 L200,260 L110,260 M200,260 L290,260\" stroke-width=\"3\"/><path d=\"M170,150 L190,150 M180,150 L180,170\" stroke-width=\"3\"/><path d=\"M236,150 L264,150 M250,150 L250,170\" stroke-width=\"3\"/><path d=\"M186,180 L214,180 L226,220 L180,220 Z\" stroke-width=\"2.4\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
