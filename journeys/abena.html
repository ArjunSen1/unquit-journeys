<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Abena Mensah</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Abena Mensah and Iris Chambers are composites from Chapter Six of The Unquit Stories.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "abena", "title": "Abena Mensah", "subtitle": "A kitchen table in Chorlton, Manchester. The seventh day.", "object": "The pot", "sticker": "The pot.", "footer": "Abena Mensah and Iris Chambers are composites from Chapter Six of The Unquit Stories.", "arrive": {"heading": "You are standing where Abena Mensah stood.", "paragraphs": ["She has wanted to be a nurse since she was eleven, when she watched her grandmother move through a Ghanaian hospital with too few resources and too many patients and come out the other side with her dignity and their trust intact. Her grandmother was a nurse for thirty-four years. Abena is twenty-nine, Ghanaian British, in a shared house in Chorlton, and she has failed the nursing board exam twice.", "The first time was shame, two weeks of it, and then she rallied. The second time was different. Not shame. A blankness where the determination had been, as if the determination itself had failed the exam.", "She has not told her mother in Accra. She has not told anyone. Her flatmates think she is studying for the retake, and the materials are open on the kitchen table, and she has not studied for six days. On the fifth day she stopped turning on her phone.", "It is the seventh day, nine in the evening. The flatmates are out. Someone has just knocked on the front door.", "Now Abena steps aside and you step in. The table, the unopened book, the silent phone and the knock are hers. Whether the door gets answered is yours."], "button": "Sit at the table"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The knock has come twice. The textbook is open to the same page it was open to on Tuesday. Your grandmother used to say that not answering a knock is a form of lying, because you are pretending to whoever is outside that no one is home.", "question": "What are you feeling right now?", "placeholder": "Say it to the table. The door can wait one more minute.", "helpLabel": "Open the door.", "helper": {"who": "Iris Chambers, eighty-two, from the flat upstairs, holding a covered pot", "says": "I made soup. I made too much. My daughter says I always make too much. Will you have some?", "options": ["I feel nothing where the wanting used to be, and that frightens me more than failing did.", "I feel that I have been pretending to study for six days and pretending to be fine for seven.", "I feel that if I cannot pass a gate, I cannot become the person on the other side of it."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before anything is decided about the retake, take an inventory. Not of the exam, and not of Abena. Of yourself.", "question": "What have you already done, in your own life, that proves you can keep walking toward something you have not yet reached?", "placeholder": "One thing you did. Not one thing you believe.", "fillIn": true, "helpLabel": "Let her serve the soup.", "helper": {"who": "Iris, finding two bowls without asking where they are kept", "says": "I do not know you well, so I will tell you only what I have seen from upstairs. Two years of a young woman coming home late with books. A grandmother's photograph on the fridge. And a girl who answered the door on the second knock, which is more than most people manage. Now you tell me what you carry. Finish one of these.", "options": ["A time I kept walking toward something I had not yet reached: ", "A time I failed a test that was not the thing itself, and kept going toward the thing: ", "A time I answered a door I did not want to answer: "]}}, {"n": 3, "name": "The deferral", "prompt": "The sentence this week is: I cannot pass it. It sounds like a result. It is blankness in the shape of a result. You do not have to schedule a third attempt tonight. You only have to refuse to let the seventh day of not studying decide the thing you have wanted since you were eleven.", "question": "What is the one reason you will not decide this week?", "placeholder": "Not a study plan. One reason to wait.", "helpLabel": "Eat first.", "helper": {"who": "Iris", "says": "You are in some difficulty. Is it the kind that speaking about helps, or the kind that eating helps? Not sure? Then we start with the eating, and see where we get.", "options": ["Because a decision made after six days of a blank table is the blankness talking, not me.", "Because there is soup in front of me, which means someone climbed down a flight of stairs for me, and that is data too.", "Because I have not asked what I am walking toward. I have only asked whether I can pass the gate."]}}, {"n": 4, "name": "One step", "prompt": "The soup is finished. Not a study schedule. Not a third registration. One step, small enough to finish before Iris climbs back upstairs.", "question": "What is it?", "placeholder": "Something you can do at this table tonight.", "helpLabel": "Ask her what she asked.", "helper": {"who": "Iris", "says": "When you close your eyes and you are doing the thing you are trying to become, not the exam, the thing, what do you see?", "options": ["I will close my eyes and answer her. My grandmother, on a ward in Manchester, and the face of the person in the bed.", "I will turn my phone on and call my mother in Accra, and tell her the number of attempts.", "I will open the book to a different page than Tuesday's. One page. Then I will close it."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. You said what you saw, or your mother knows, or one new page has been read. The exam is still failed twice. The retake is still fourteen months away, though you do not know that yet.", "question": "What has changed in you?", "placeholder": "Compare it to the second knock.", "helpLabel": "Tell her.", "helper": {"who": "Iris", "says": "The exam is not the work. The exam is the gate. The gate is not what you are going toward. So tell me, what is different now?", "options": ["The blankness is still here. There is a face in the bed behind it now, and the face is what I am walking toward.", "Two failures measured how much this costs. They did not measure whether I can pay it.", "I answered the door. I had forgotten that I was someone who answers doors."]}}, {"n": 6, "name": "Time passes", "montage": ["She passes the boards on her third attempt, fourteen months later. She is a staff nurse on a Manchester ward before she is thirty-two.", "She keeps the number of attempts private for two years. Then she stops, because she has come to understand that the number was not a measure of failure. It was an accurate measure of how much the work had cost her to reach, and therefore some indication of how much it was worth.", "She still has Iris's phone number. She calls from the ward sometimes, when the shift is long and the soup would help."], "question": "Iris did not tutor her, fund her or fix anything. Here is the question the third attempt cannot answer for you: what did the helper at the door actually bring?", "choices": [{"label": "Soup.", "short": "soup", "reply": "Soup, and it mattered, and it was not the point. The pot was the reason she could come down the stairs without a speech. What was in the pot is not what changed the night."}, {"label": "A rescue.", "short": "a rescue", "reply": "No. Iris pulled no one back from anything. She gave no strategy and no solution and no particularly useful advice. Rescue is the wrong word for what helpers do, and it is the reason we so rarely recognize them."}, {"label": "The right question.", "short": "the right question", "reply": "Yes. Can I pass this exam had quietly become the same question as can I become who I am meant to be. Iris cracked that open with one question and showed what was underneath: a grandmother on a ward, a face in a bed, a calling two failures could not invalidate. The helper does not arrive with answers. The helper gives you back the right question."}, {"label": "Presence. She just sat there.", "short": "presence, she just sat there", "reply": "Also true, and it came first. She sat, and served, and talked about nothing, and let something tightly held loosen before a single question was asked. The question only worked because the presence had already done its work."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another gate, and another week when the determination goes blank. Write one sentence for that table. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helpLabel": "One more thing, before she goes upstairs.", "helper": {"who": "Iris, at the door with the empty pot", "says": "Give me one sentence to carry upstairs. Start it with I did.", "options": ["I did answer the door on the second knock.", "I did not mistake the gate for the thing on the other side of it.", "I did close my eyes and see the face in the bed."]}, "ice": {"question": "One more line, and this one is yours. What gate in your own life have you mistaken for the thing on the other side of it?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, at the kitchen table", "sub": "Your seventh day, beside hers", "paragraphs": ["Chorlton, Manchester, the seventh day, nine in the evening. You sat where Abena Mensah sat, with a book open to Tuesday's page and a knock at the door, and the evening asked you what it asked her. You wrote: {1}", "Before anything was decided, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Hers was two years of coming home late with books, a grandmother who was a nurse for thirty-four years, and a door answered on the second knock.", "You refused to let the seventh day of a blank table decide. Your reason: {3} That refusal is the deferral. Not this week. Not from the blankness.", "Your first step: {4} {overlap}", "After the step, the exam was still failed twice. Inside, you noticed this: {5}", "Then time did what it does when someone keeps walking toward the thing and not the gate. A third attempt, fourteen months later. A ward in Manchester. A number kept private, then not. A phone number still kept.", "Asked what the helper at the door actually brought, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["She did this. She closed her eyes and saw her grandmother transposed onto a Manchester ward, and the face of the person in the bed. It is the moment the chapter turns on.", "She did not do this that night. Her mother in Accra learned later. But the phone was on again by morning, which is its own first step. A different first step at the same table is still a first step.", "She did not open the book that night. She ate soup and answered one question. The book came later, for fourteen months. A different first step at the same table is still a first step."], "stepOverlapFree": "Her first step was to close her eyes when Iris asked what she saw, and to say it out loud. A different first step at the same table is still a first step.", "help": {"zero": "You did not open the door. Abena almost did not either. She answered on the second knock because her grandmother had told her that not answering is a form of lying. Next time, open it. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You opened the door and let Iris in {n} on this journey. Abena answered on the second knock, and she still calls the number from the ward. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the gate in your own life that you mistook for the thing, as you named it: {ice}", "closing": "The pot went back upstairs empty. What you carry away from the table is not a pass mark, and it is not Abena. It is the evidence that on the seventh day you answered the door, and that you know the difference between a gate and what lies beyond it.", "stickerLines": ["Walked with Abena Mensah.", "Chorlton, the seventh day."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The pot\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n\n  <path d=\"M110,212 L116,318 C118,334 134,344 150,344 L250,344 C266,344 282,334 284,318 L290,212\" stroke-width=\"4\"/>\n  <path d=\"M96,212 L304,212\" stroke-width=\"4\"/>\n  <path d=\"M116,212 C120,190 160,178 200,178 C240,178 280,190 284,212\" stroke-width=\"3\"/>\n  <path d=\"M188,178 C188,168 212,168 212,178\" stroke-width=\"3\"/>\n  <path d=\"M96,212 L66,204 C56,202 54,220 64,222 L102,226\" stroke-width=\"4\"/>\n  <path d=\"M304,212 L334,204 C344,202 346,220 336,222 L298,226\" stroke-width=\"4\"/>\n  <path d=\"M170,150 C160,136 176,124 166,106 M200,146 C190,130 206,118 196,98 M230,150 C220,136 236,124 226,106\" stroke-width=\"2.2\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
