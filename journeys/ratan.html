<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Ratan Tata, Detroit</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from the public record and Ratan Tata's own later telling, paraphrased, and from the India list. Consent track: launch requires written consent and a reading of this script.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "ratan", "title": "Ratan Tata, Detroit", "subtitle": "A conference room in Detroit. 1999. A ninety-minute humiliation, and a flight home.", "object": "The Indica key", "sticker": "The key.", "footer": "Drawn from the public record and Ratan Tata's own later telling, paraphrased, and from the India list. Consent track: launch requires written consent and a reading of this script.", "arrive": {"heading": "You are standing where a chairman sat after being told he should not have started.", "paragraphs": ["He is sixty-one and has run the group for eight years. Three years ago the group launched the country's first indigenously designed passenger car, his idea, against advice. It has not sold as hoped. Losses are mounting. The board has suggested selling the car business, and he has come to Detroit to discuss selling it to the largest carmaker in the world.", "The meeting lasts ninety minutes. Executives of the American company tell him, in various ways, that he does not know why he entered the car business, that he should not have, and that they would be doing him a favor by buying it. He is treated, by his own later account, as a man who has failed and come to be rescued.", "On the flight home that evening he says almost nothing. His colleagues remember him staring out of the window.", "Now he steps aside and you step in. The conference room, the ninety minutes, the losses and the flight are his. What you do with a humiliation that was partly deserved is yours."], "button": "Sit down on the plane"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The plane is over the Atlantic. The colleagues have stopped trying to talk. The car's key is in your pocket because you drive one.", "question": "What are you feeling right now?", "placeholder": "Say it as a man who was told for ninety minutes that he should not have tried.", "helper": {"who": "Ravi Kant, who runs the car business and was in the room, in the next seat", "says": "I was in that room too. I am not going to tell you it was fine. Tell me what you feel, and then we will decide what to do with it.", "options": ["I feel that they were partly right and entirely rude, and that I have to hold both of those for eight hours.", "I feel ninety minutes of a favor being done to me, and I have never been on the receiving end of a favor like that.", "I feel that I started something my own board wants to sell, and that the buyer has just told me what they think of the seller."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the decision, take an inventory. Not of the losses, and not of the chairman. Of yourself.", "question": "What have you already done, in your own life, that proves you can be humiliated and go home and keep working?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Ravi Kant", "says": "I can tell you what the man in that seat carries. Eight years of running a group that people said would break up when he took it over, and it did not. A car built from nothing in a country that had never built one, against advice, and delivered. And ninety minutes in a room where he did not once raise his voice. Now you tell me what you carry. Finish one of these.", "options": ["A time I was humiliated and went home and kept working: ", "A time I built a thing against advice and it was harder than the advice said and I finished it anyway: ", "A time I was partly wrong and entirely disrespected, and told them apart: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence on the plane is: they were right, sell it, and be grateful. It sounds like humility. It is the room, still talking, at thirty thousand feet. You do not have to decide the car business tonight. You only have to refuse to let ninety minutes decide it.", "question": "What is the one reason you will not decide on the plane?", "placeholder": "Not a business case. One reason the room does not get the vote.", "helper": {"who": "Ravi Kant", "says": "They said we should never have started. Tell me why that is not the last word.", "options": ["Because a car that has been on the road for three years is not a mistake. It is a first draft, and they were describing it as a verdict.", "Because a decision made after ninety minutes of being talked down to is the room's decision, not mine.", "Because the losses are real and the losses are ours to fix, and the people in that room were not offering to fix them. They were offering to own them."]}}, {"n": 4, "name": "One step", "prompt": "Not the sale. Not the acquisition nine years off that no one is imagining. One step, small enough to finish before the plane lands.", "question": "What is it?", "placeholder": "Something a chairman can do in a seat over the Atlantic.", "helper": {"who": "Ravi Kant", "says": "We land in six hours. What is the smallest thing you can decide before we do?", "options": ["I will not sell. Not tonight. We will go home and fix the car ourselves, whatever that takes.", "I will write down the three things they said that were true, and separate them from the way they were said.", "I will ask you, before we land, what the car needs. Not what the board needs. What the car needs."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The sale is off the table for tonight, or three true things are on a page apart from the tone, or the man who runs the car business has told you what it needs. The losses are the same. Detroit is behind you.", "question": "What has changed in you?", "placeholder": "Compare it to the conference room.", "helper": {"who": "Ravi Kant", "says": "Nothing about the balance sheet changed over the Atlantic. What changed?", "options": ["We are not selling. I do not know yet how to fix it. I know it is ours to fix.", "Three things they said were true. I have written them down without the room around them. They look like a to-do list.", "He told me what the car needs and none of it was a buyer."]}}, {"n": 6, "name": "Time passes", "montage": ["He does not sell. They go home and redesign the car. The second version sells. The car business becomes the most profitable part of the group.", "In 2008, nine years later, the American company that lectured him in Detroit is in trouble and selling its luxury brands. He buys two of them, the most storied names in British motoring, for two billion dollars. An executive of the American company says, at the signing, that he is doing them a big favor.", "He has said he did not buy them for revenge. He has also said he remembers the flight home. Arrival, in this series, is not usually nine years. This one was."], "question": "Ninety minutes in Detroit, nine years, two brands. Here is the question the acquisition cannot answer for you: what did he decide on the flight home?", "choices": [{"label": "To buy them back one day.", "short": "to buy them back one day", "reply": "He has said he did not, and there is no reason to doubt him. No one plans nine years ahead from a humiliation. He decided something smaller and closer."}, {"label": "Revenge.", "short": "revenge", "reply": "The signing in 2008 reads that way from outside, and he has refused the word. The car business did not become profitable to prove a point. It became profitable because the car was fixed."}, {"label": "That a humiliation partly deserved was still theirs to fix, not to sell.", "short": "that a humiliation partly deserved was still theirs to fix, not to sell", "reply": "Yes. The room was partly right about the car and entirely wrong about the man, and the work on the flight was telling those apart. What he decided was not to be rescued. The losses were real and they were his to correct, and he corrected them, and nine years later the company that offered him a favor needed one. Arrival can take nine years. It begins with refusing to let the room decide."}, {"label": "Nothing. He was just quiet.", "short": "nothing, he was just quiet", "reply": "He was quiet for eight hours. What came out of the quiet was a redesigned car, a profitable business and, eventually, two brands. Quiet is not nothing."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another room where the favor is being done to you. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Ravi Kant", "says": "One line for the next Detroit. Start with I did.", "options": ["I did separate what was true from how it was said.", "I did not let ninety minutes decide a business.", "I did take the losses home as mine to fix."]}, "ice": {"question": "One more line, and this one is yours. What room has told you that you should not have started, and what is yours to fix?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, on the flight home", "sub": "Your ninety minutes, beside his", "paragraphs": ["A plane over the Atlantic, 1999, a conference room in Detroit behind you. You sat where a chairman sat, with a car key in your pocket and ninety minutes of a favor in your ears, and the flight asked you what it asked him. You wrote: {1}", "Before the decision, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was a group that did not break up when everyone said it would, and a car built from nothing against advice.", "You refused to let ninety minutes decide the business. Your reason: {3} That refusal is the deferral. Not on the plane. Not in the room's voice.", "Your first step: {4} {overlap}", "After the step, the losses were the same. Inside, you noticed this: {5}", "Then nine years did what nine years do when the losses are taken home. A redesigned car, the most profitable business in the group, and two storied brands bought from a company in trouble, at a signing where someone said he was doing them a favor.", "Asked what he decided on the flight home, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this. The sale was called off and the car redesigned.", "He has said the room contained truths as well as rudeness. Whether he wrote them down, he has not said. A different first step in the same place is still a first step.", "Ravi Kant was in Detroit and led the turnaround. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step was not to sell. A different first step in the same place is still a first step.", "help": {"zero": "You did not turn to Ravi Kant. He was in the room and on the plane and led the redesign. Next time, turn to the one who was in the room with you. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to Ravi Kant {n} on this journey. He was in Detroit and he fixed the car. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the room that told you not to start, as you named it: {ice}", "closing": "The conference room in Detroit belongs to a different company now. What you carry off the plane is not two brands, and it is not him. It is the evidence that you can be partly wrong and entirely disrespected, tell them apart, and take the losses home as yours to fix.", "stickerLines": ["Walked with Ratan Tata.", "Over the Atlantic, 1999."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The key\">\n<g transform=\"rotate(-24 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<circle cx=\"130\" cy=\"200\" r=\"50\" stroke-width=\"4\"/><path d=\"M114,184 L146,184 L146,216 L114,216 Z\" stroke-width=\"2\"/><path d=\"M180,200 L330,200\" stroke-width=\"5\"/><path d=\"M300,200 L300,226 M322,200 L322,220\" stroke-width=\"5\"/><path d=\"M256,200 L256,216\" stroke-width=\"4\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
    '1':{text:A[1],red:true},'2':{text:A[2],red:true},'3':{text:A[3],red:true},'4':{text:A[4],red:true},'5':{text:A[5],red:true},
