<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Arjuna</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from the Bhagavad Gita and the Mahabharata, as read in Unquit: The Oldest Choice. Quotations are paraphrased, not translated.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "arjuna", "title": "Arjuna", "subtitle": "Kurukshetra. Dawn of the first day.", "object": "The bow", "sticker": "The bow.", "footer": "Drawn from the Bhagavad Gita and the Mahabharata, as read in Unquit: The Oldest Choice. Quotations are paraphrased, not translated.", "arrive": {"heading": "You are standing where Arjuna stood.", "paragraphs": ["Thirteen years ago a game of dice took everything. The kingdom, the wealth, the years. Twelve of those years were spent in a forest and the thirteenth in disguise, and at the end of it your cousins refused to return what they had taken. Krishna himself went to ask for five villages. He was told he would not get land enough for the point of a needle. So the armies gathered.", "This morning they face each other on a plain called Kurukshetra. The conches have sounded. Dust hangs over both lines. Arjuna asked his charioteer to drive to the space between the armies so that he could see who he was about to fight. Now he sees.", "Bhishma, the grandfather who raised him. Drona, the teacher who put a bow in his hand at seven. Uncles. Cousins he wrestled as a boy. Every face he has ever loved is on this field, on one side or the other, and the war is between the two.", "His mouth dries. His skin burns. The great bow slips in his hands. He sits down on the seat of the chariot and says he will not fight.", "Now Arjuna steps aside and you step in. The bow, the field, the family and the war are his. The decision is yours. The charioteer holding the reins is Krishna, and he will not tell you what to do. He never does. He will only keep asking who is holding the bow."], "button": "Step into the chariot"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The armies are waiting. There are minutes, not hours. The bow is across your knees and your hands will not close on it. Krishna has turned to look at you.", "question": "What are you feeling right now?", "placeholder": "Say it as it is. Not as it should sound.", "helper": {"who": "Krishna, the charioteer", "says": "You do not have to argue it into sense. Say it plainly.", "options": ["I feel my hands deciding before my mind has decided anything.", "I feel that winning this means destroying the people who made me.", "I feel that if I do this I will not be able to live with who I become."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before anything is decided, take an inventory. Not of the armies, and not of Arjuna. Of yourself.", "question": "What have you already done, in your own life, that proves you can act when the cost is fully visible?", "placeholder": "One thing you did. Not one thing you believe.", "fillIn": true, "helper": {"who": "Krishna", "says": "I can tell you what the archer carries. As a boy he practiced in the dark after everyone slept, because he had learned he could eat without seeing. He spent twelve years in a forest with a kingdom taken from him and did not stop being who he was. He spent a thirteenth year in disguise in another king's court and lost nothing of himself. Now you tell me what you carry. Finish one of these.", "options": ["A time I kept practicing when no one was watching: ", "A time I was stripped of my position and stayed myself anyway: ", "A time I saw the full cost of doing what was right, and did it: "]}}, {"n": 3, "name": "The deferral", "prompt": "There is no tomorrow here. The battle begins when the sun clears the trees. But there is still a deferral available to you. The trembling is real. It is not the judge. You do not have to answer it. You only have to refuse to let it decide.", "question": "What is the one reason you will not let the trembling make this decision?", "placeholder": "Not an argument for fighting. A reason the fear does not get the vote.", "helper": {"who": "Krishna", "says": "The hands are shaking. Are the hands the one who decides?", "options": ["Because the fear is about the next hour. The decision is about who I am for the rest of my life.", "Because I asked to be driven here to see clearly. I did not ask to be ruled by what I saw.", "Because my brothers and Draupadi waited thirteen years for this morning. My hands do not get to cast their vote."]}}, {"n": 4, "name": "One step", "prompt": "The sun is on the trees. Not the whole battle. Not even the first arrow. One step, small enough that you cannot fail it before the light reaches the field.", "question": "What is it?", "placeholder": "Something smaller than the bow.", "helper": {"who": "Krishna", "says": "Do not pick up the bow yet. What is the smallest thing you can do first?", "options": ["I will stand up in the chariot. Only that. Sitting is already a decision, and I have not made it.", "I will look at each face once more and name what I owe to each, so that I am not fighting a blur.", "I will ask the one question I have not asked. Not should I fight. Who am I when I am not afraid."]}}, {"n": 5, "name": "What you feel now", "prompt": "You did it. You are standing, or you have looked, or you have asked. Nothing on the field has changed. Bhishma is still there. Drona is still there. The bow weighs what it weighed.", "question": "What has changed in you?", "placeholder": "Compare it to a minute ago.", "helper": {"who": "Krishna", "says": "Tell me what is different, from the inside.", "options": ["The fear is still here. It has stopped speaking for me.", "I can see the field as a field again, not as a verdict on me.", "The bow is the same weight. My hands are not."]}}, {"n": 6, "name": "Time passes", "montage": ["You raise the bow.", "The battle lasts eighteen days. On the tenth, Bhishma falls, under your arrows, having told you himself how it could be done. On the fifteenth, Drona. When it ends, your side has won. Your hundred cousins are dead. Almost every man you saw from the chariot is dead, on both sides. Your brother is crowned king of a field of widows.", "The victory you were promised arrives, and it tastes like grief. You were told it would. You have a right to the action. You were never given a right to the fruit."], "question": "The war is won and the field is full of your family. Of everything that happened here, which was ever yours?", "choices": [{"label": "The victory.", "short": "the victory", "reply": "The victory belonged to eighteen days, a hundred thousand arrows and a hundred thousand accidents. It was never yours to hold, which is why holding it feels like this."}, {"label": "The kingdom.", "short": "the kingdom", "reply": "Your brother wears it and cannot sleep. A kingdom is an outcome. Outcomes are not owned. They are received, and they can be taken. Nothing that can be taken was ever the point."}, {"label": "The raising of the bow.", "short": "the raising of the bow", "reply": "Yes. That was yours. The one act on the field that no one else could take and nothing could take from you. It is the only thing you carry off Kurukshetra that weighs less than it did at dawn."}, {"label": "The remembering that came before the first arrow.", "short": "the remembering before the first arrow", "reply": "Also yours, and this is the older answer. Before any act was possible, you were returned to who you are. The Gita is eighteen chapters of identity before a single arrow flies. You did the same thing on your own field this morning, in step two. That is Step Zero. It is the only step no war can undo."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another field. Different faces, the same weight in the hands. Write one sentence for that morning. Not what you learned. What you did.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Krishna", "says": "Not what you understood. What you did.", "options": ["I did stand up before I felt ready, because standing was mine and the outcome was not.", "I did not let my hands decide what my life should be.", "I did remember who was holding the bow before I decided what the bow should do."]}, "ice": {"question": "One more line, and this one is yours. Where is the lowered bow in your life right now?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, between the armies", "sub": "Your decisions, beside his", "paragraphs": ["Kurukshetra, the dawn of the first day. You stood where Arjuna stood, between two armies made of your own family, and the field asked you what it asked him. With the bow across your knees, you wrote: {1} The oldest record we have of that morning describes the same thing. A dry mouth. Burning skin. A bow that would not stay in the hands.", "Before anything was decided, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was a boyhood spent practicing in the dark, twelve years in a forest without a kingdom, and a year in disguise in which he lost nothing of himself.", "There was no tomorrow to defer to, so you deferred to something else. You refused to let the trembling cast the vote. Your reason: {3} That refusal is the deferral in its hardest form. Not tonight. Not from this feeling.", "Your first step: {4} {overlap}", "After the step, nothing on the field had changed. Inside, you noticed this: {5}", "Then the war did what wars do. Eighteen days. Bhishma on the tenth, Drona on the fifteenth. A victory that arrived tasting like grief, exactly as you were told it would.", "Asked which of it was ever yours, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this. The first chapter of the Gita ends with him sinking onto the seat of the chariot. The last chapter ends with him saying his doubt is gone and he will act. Everything between is the record of a man getting up.", "He did this too. The first chapter is largely a list of names. He looked at every one before he sat down. He did not fight a blur.", "That was his exact question, and the whole of the Gita is the answer. Not should I fight. Who am I. Eighteen chapters of identity before a single arrow flies."], "stepOverlapFree": "Arjuna's first step was not the bow. It was a question. Not should I fight, but who am I. Eighteen chapters later, he stood. A different first step on the same field is still a first step.", "help": {"zero": "You did not turn to the charioteer on this journey. Arjuna did, eighteen chapters' worth. Next time, ask. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to the charioteer {n} on this journey. Arjuna turned to him for eighteen chapters before he stood. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the lowered bow in your own life, as you named it: {ice}", "closing": "The field is quiet. The kingdom belongs to someone else. What you carry off Kurukshetra is not the victory, and it is not Arjuna. It is the evidence that you stood before the outcome was known.", "stickerLines": ["Walked with Arjuna.", "Kurukshetra, the first day."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The bow\">\n<g transform=\"rotate(16 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M238,48 C176,64 122,132 122,200 C122,268 176,336 238,352\" stroke-width=\"4\"/>\n  <path d=\"M238,48 C244,44 248,38 250,32\" stroke-width=\"3\"/>\n  <path d=\"M238,352 C244,356 248,362 250,368\" stroke-width=\"3\"/>\n  <path d=\"M238,48 L238,352\" stroke-width=\"1.5\"/>\n  <path d=\"M122,182 L122,218\" stroke-width=\"10\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
