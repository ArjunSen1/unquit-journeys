<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Dominic Ferrara, the physics of falling</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>

<footer>Unquit Journeys. Prototype. Dominic Ferrara is a composite from Chapter Five of The Unquit Stories.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "dominic", "title": "Dominic Ferrara, the physics of falling", "subtitle": "A bus home from a surgical center in Hartford. Late October. Forty years of stone.", "object": "The trowel", "sticker": "The trowel.", "footer": "Dominic Ferrara is a composite from Chapter Five of The Unquit Stories.", "arrive": {"heading": "You are standing where Dominic Ferrara sat.", "paragraphs": ["Forty years a stonemason. He has worked in all weather on a hundred buildings across the Northeast, and the stone has never beaten him. He has the hands and the back to show for it, and he does not call the cost damage. He calls it evidence.", "On a Tuesday in late October, on a restoration job at a cathedral in Hartford, the scaffolding was wet and the footing uncertain, and he knew it, and he was working on it anyway because he is sixty-one and no longer makes adjustments for uncertainty. He came down six feet onto a stone ledge. His right wrist took the landing. The sound told him immediately and completely.", "He sat against the cathedral wall for a few minutes before he called for help. Not composing himself. Listening to his body, which was telling him, in the specific language physical catastrophe uses, that the career in the field was over.", "It is evening. He is on a bus home from the surgical center with the wrist in a cast and the specific quality of awareness he associates with permanent change. Now Dominic steps aside and you step in. The wrist, the forty years, the cathedral and the bus are his. What the hands were for is yours."], "button": "Sit down on the bus"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The bus is half empty. The cast is heavy on your knee. Through the window, a building you worked on twenty years ago goes past, and you know which stones are yours.", "question": "What are you feeling right now?", "placeholder": "Say it as a craftsman, not as a patient.", "helper": {"who": "Anthony, the apprentice you trained fifteen years ago, calling to check", "says": "I heard. Do not tell me you are fine. Tell me what you feel with the cast on.", "options": ["I feel that the stone finally beat me, and it did not even do it. The rain did. A ledge did.", "I feel forty years in my hands and I am looking at one of them in a cast and I do not know what the other one is for.", "I feel that I knew the footing was bad and I worked it anyway, because I am sixty-one and I stopped adjusting, and that is the part I cannot put down."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before anything is decided about the work, take an inventory. Not of the wrist, and not of Dominic. Of yourself.", "question": "What have you already done, in your own life, that proves you know something your hands did not have to be holding?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Anthony", "says": "I can tell you what the man on that bus carries. Forty years of reading stone before he touched it. A hundred buildings that are still standing. Every apprentice he trained can hear his voice when they set a course. Now you tell me what you carry. Finish one of these.", "options": ["A time I knew something my hands did not have to be holding: ", "A time I read a thing correctly before I touched it: ", "A time I taught someone to do what I could no longer do myself: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence on the bus is: the work is over. It sounds like a diagnosis. It is a description of the wrist. You do not have to decide what forty years of masonry were for tonight. You only have to refuse to let a bus ride with a cast decide it.", "question": "What is the one reason you will not decide tonight?", "placeholder": "Not a retirement plan. One reason the cast does not get the vote.", "helper": {"who": "Anthony", "says": "The wrist is done. That is a fact about the wrist. Tell me why it is not yet a fact about you.", "options": ["Because the sound told me the field was over. It did not say anything about the eye.", "Because a mason who has worked forty years and never fallen has no idea what he knows without his hands. I am about to find out.", "Because I set stone with my hands and I read it with something else, and only one of those is in a cast."]}}, {"n": 4, "name": "One step", "prompt": "Not a new career. Not a consulting practice. One step, small enough to finish before the bus reaches your stop.", "question": "What is it?", "placeholder": "Something you can do with a cast on and a window.", "helper": {"who": "Anthony", "says": "I am on a job Thursday and I have a course I am not sure about. Before you decide anything, what is the smallest thing you can do?", "options": ["I will look at every building this bus passes and say, silently, what is wrong with the stonework. If I can still see it, the eye is not in the cast.", "I will tell Anthony to send me a photograph of the course he is not sure about, tonight, and I will tell him what I see.", "I will write down, left-handed, the three things I would tell a young mason about wet scaffolding. Starting with the one I did not tell myself."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. Every building went past and you saw what was wrong with all of them, or a photograph is on its way, or three lines are on paper in a hand you have never used. The wrist is the same. The field is still over.", "question": "What has changed in you?", "placeholder": "Compare it to the cast on your knee.", "helper": {"who": "Anthony", "says": "The wrist did not heal on the bus. What changed?", "options": ["I saw the flaw in every course this bus passed. The eye is not in the cast. It was never in the hands.", "The hands were the expression. The knowledge was the thing. I knew that as a sentence. I know it now as a fact.", "The field is over. The forty years are not. They are in the seat next to me."]}}, {"n": 6, "name": "Time passes", "montage": ["Two months later a preservation architect asks him to consult on a restoration. Not to work the stone. To advise a younger mason. He goes. He sees immediately three things the younger man is doing that will cause problems over the next decade, and he says so, specifically and without condescension.", "At the end of the afternoon he understands what the wrist made visible: forty years of masonry live in his eye, in his judgment, in the way he reads stone before he touches it. The hands were how the knowledge got into the wall. The knowledge did not leave with them.", "He consults for years. Younger masons learn to hear his voice when they set a course, the way his apprentices did, only now they hear it in the room."], "question": "Forty years, then a wrist, then an afternoon on someone else's scaffold. Here is the question the cast cannot answer for you: where was the craft?", "choices": [{"label": "In his hands.", "short": "in his hands", "reply": "That is where everyone thought it was, including him, until one of them was in a cast. If the craft had been in the hands, the afternoon two months later would have had nothing in it."}, {"label": "In the buildings.", "short": "in the buildings", "reply": "The buildings are the evidence of the craft, and he could name his stones from a bus. But evidence is not the thing. It is what the thing left behind."}, {"label": "In the eye. In reading the stone before touching it.", "short": "in the eye, in reading the stone before touching it", "reply": "Yes. The hands were the expression. The knowledge was the thing. This is the single thread again, in a different trade: the last part of a craft that survives when the container is taken. Everyone who has been taken from their work by a body knows what Dominic knew on the bus. What the work built in you is not located only in the part that broke."}, {"label": "Nowhere. A mason who cannot set stone is not a mason.", "short": "nowhere, a mason who cannot set stone is not a mason", "reply": "Ask the younger mason whose decade of problems he prevented in one afternoon. Then ask the wall."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another fall, another cast, another bus. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Anthony", "says": "One line for the next wet scaffold. Start with I did.", "options": ["I did find the craft in the eye when the hands were gone.", "I did read every building the bus passed and know what was wrong with them.", "I did teach what I could no longer do."]}, "ice": {"question": "One more line, and this one is yours. Which part of your own craft do you believe lives only in the part that could break?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, on the bus", "sub": "Your ride home, beside his", "paragraphs": ["Hartford, late October, a bus home from the surgical center. You sat where Dominic Ferrara sat, with a cast on your knee and your own stones going past the window, and the ride asked you what it asked him. You wrote: {1}", "Before anything was decided, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was forty years of reading stone before touching it, and a hundred buildings still standing.", "You refused to let a bus ride with a cast decide forty years. Your reason: {3} That refusal is the deferral. Not tonight. Not from the wrist.", "Your first step: {4} {overlap}", "After the step, the wrist was the same. Inside, you noticed this: {5}", "Then two months did what two months do when a man has found where the craft lives. An architect's call, a younger mason, three problems seen in an afternoon, and years of a voice heard in the room.", "Asked where the craft was, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did something like this. The chapter has him understanding, on the bus, that permanent change had come, and two months later understanding what had not changed.", "This is what the consulting was. A younger mason's course, and a man who could see what was wrong with it. A different first step in the same place is still a first step.", "He said so, specifically and without condescension, the chapter says. Whether he wrote it down left-handed, it does not. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step was an afternoon on someone else's scaffold, saying what he saw. A different first step in the same place is still a first step.", "help": {"zero": "You did not pick up for Anthony. Dominic's apprentices are the ones who carried his craft when his hands could not, and one of them would have called. Next time, pick up. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You picked up for Anthony {n} on this journey. Every apprentice Dominic trained can hear his voice when they set a course. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the part of your own craft you believe lives only in what could break, as you named it: {ice}", "closing": "The cathedral in Hartford is restored. What you carry off the bus is not a trowel, and it is not Dominic. It is the evidence that the craft was in the eye, and the eye went home with you.", "stickerLines": ["Walked with Dominic Ferrara.", "Hartford, a bus in late October."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The trowel\">\n<g transform=\"rotate(-8 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M110,160 L230,140 L280,220 L170,260 Z\" stroke-width=\"4\"/><path d=\"M280,220 L302,214\" stroke-width=\"4\"/><path d=\"M302,214 C320,208 340,222 336,240 C332,254 316,258 306,250\" stroke-width=\"4\"/><path d=\"M130,168 L216,154\" stroke-width=\"1.4\"/><path d=\"M60,300 L340,300 M60,312 L340,312\" stroke-width=\"1.6\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
