<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Priya Nakamura, the shoulder</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>

  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Priya Nakamura is a composite from The Unquit Athlete. This is the second Right Quit in the series, placed deliberately far from the first.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "priyan", "title": "Priya Nakamura, the shoulder", "subtitle": "A surgeon's office. Week one of six. Thirty-one years old.", "object": "The goggles", "sticker": "The goggles.", "footer": "Priya Nakamura is a composite from The Unquit Athlete. This is the second Right Quit in the series, placed deliberately far from the first.", "arrive": {"heading": "You are standing where Priya Nakamura stood.", "paragraphs": ["She has swum competitively for sixteen years, the last four on a national team. Her whole adult identity has been built around being a swimmer, in exactly the way the books in this series spend chapters warning against, and she knows it.", "The labrum in her shoulder has torn and been repaired and torn again. This morning her surgeon stopped using the word repair and started using the word preservation. Two paths. Operate again and swim for perhaps two more years at a diminished level, with a shoulder that will not be worth much at fifty. Or stop now, and keep the shoulder for the rest of her life.", "Her coach expects her to fight for the two years. Her sponsors expect it. Until this morning, she expected it of herself.", "Now Priya steps aside and you step in. The shoulder, the sixteen years, the surgeon's changed word and the six weeks she has to decide are hers. Which of the two doors is the continuation is yours."], "button": "Sit down in the office"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The scan is still on the screen. The surgeon has stepped out to give you a minute. Your goggles are in your bag from this morning's session, still damp.", "question": "What are you feeling right now?", "placeholder": "Say it as a swimmer, not as a sponsor's athlete.", "helper": {"who": "Efua, a younger teammate who once hid a failed qualification for nine days until someone knocked", "says": "You told me once that the time is a number and I am not the number. Say what you feel before you decide what it means.", "options": ["I feel that if I am not a swimmer I do not know what I am, and I have known that about myself for years and never done anything about it.", "I feel relief at the word preservation, and I am ashamed of the relief.", "I feel that two more years is a sentence, not a season, and everyone around me is calling it a fight."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the two doors, take an inventory. Not of the shoulder, and not of Priya. Of yourself.", "question": "What have you already done, in your own life, that proves you can tell the thing from the container it came in?", "placeholder": "One thing you did. Not one thing you believe.", "fillIn": true, "helper": {"who": "Efua", "says": "I can tell you what the woman in that chair carries. Sixteen years of getting in the water on days she did not want to. Four years of holding a national standard with a shoulder that was already going. And a habit, which I have watched, of walking down a hallway to knock on the door of anyone who has gone quiet. Now you tell me what you carry. Finish one of these.", "options": ["A time I kept the thing and let go of the container it came in: ", "A time I chose the long version of my life over the loud version: ", "A time I got in the water on a day I had every reason not to: "]}}, {"n": 3, "name": "The deferral", "prompt": "Two sentences are competing in this office. One says: stop now and you are a quitter. The other says: fight, because fighting is who you are. They are both about the same thing, and it is not the shoulder. It is which story you are afraid of. You do not have to sign either consent form today. You only have to refuse to decide before you know which fear is talking.", "question": "What is the one reason you will not decide this week?", "placeholder": "Not an argument for either door. One reason to wait until you can hear yourself.", "helper": {"who": "Efua", "says": "You have six weeks. Everyone else is going to use them to tell you what you are. Tell me why you will wait until you can hear your own voice under theirs.", "options": ["Because I have never once made a decision about this body while a sponsor was in the room, and there are three of them in my head right now.", "Because the question everyone is asking is whether I can. The question I have not asked is what the swimming was for.", "Because the surgeon changed one word and gave me six weeks, and a week is not long enough to learn what the new word means."]}}, {"n": 4, "name": "One step", "prompt": "Not the decision. Not the press release. One step, small enough to finish before the next session, that would tell you which door is the continuation.", "question": "What is it?", "placeholder": "Something that produces information about you, not about the shoulder.", "helper": {"who": "Efua", "says": "Do not decide. Find out. What is the one thing you can do this week that tells you whether the swimming is the thread or the container?", "options": ["I will swim one session with no clock, no coach and no shoulder in mind, and notice what I am actually there for.", "I will write down what I would still have if I never raced again, and see whether the list is empty or only quiet.", "I will ask the surgeon one question I have not asked: what will this shoulder let me do at sixty, on each path?"]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. You swam without a clock, or the list is written, or the surgeon has told you what sixty looks like on each path. The shoulder is the same. The six weeks are down to five.", "question": "What has changed in you?", "placeholder": "Compare it to the scan on the screen.", "helper": {"who": "Efua", "says": "You have something now that you did not have in the office. What is it?", "options": ["I swam without a clock and I still loved the water. I did not love the standard. Those are different things, and only one of them needs a shoulder.", "The list was not empty. It was quieter than I am used to. I could live in a quiet list.", "The sixty-year-old on the second path can lift her grandchildren. I had not thought about her once in sixteen years."]}}, {"n": 6, "name": "Time passes", "montage": ["She retires eleven weeks later. She does not call it giving up. She calls it, first privately and then publicly, the same decision the swimmer in the Indianapolis parking lot made when she put her cap back on, only pointed in a different direction: a decision about who she is going to be on the other side of a loss.", "She chooses to be someone who left the sport with a shoulder she will still have at sixty, on her own terms, before an injury could set the terms for her. The coach is disappointed. The sponsors move on. The water does not go anywhere.", "Rising, it turns out, does not always look like return. Sometimes it is the clarity to know which door has actually closed, and the discipline to walk through the one that is still open."], "question": "She quit swimming at thirty-one with two years left in the shoulder. Here is the question the years cannot answer for you: what did she keep?", "choices": [{"label": "Her shoulder.", "short": "her shoulder", "reply": "She kept it, and at sixty she will be glad. But a shoulder is a body part. People do not build a life around a body part, and she did not make this decision to protect cartilage."}, {"label": "Her record.", "short": "her record", "reply": "Her times stand and no one can take them. They also stopped mattering to her sometime in the second week, which is how she knew they had been the container."}, {"label": "The thread. The swimmer, without the swimming.", "short": "the thread, the swimmer without the swimming", "reply": "Yes. The sport was the container. What sixteen years had built in her, the feel for the water, the discipline of getting in on the bad days, the habit of knocking on quiet doors, did not need a national standard to go on existing. She left the form and kept the content. From outside it looked like giving up. From inside it was the only kind of continuing that would still be true at sixty."}, {"label": "Nothing. Quitting is quitting.", "short": "nothing, quitting is quitting", "reply": "This is the sentence the Right Quit exists to answer. Don't quit is advice, and advice cannot tell a swimmer protecting her purpose from one protecting her ego. She was loyal to the reason and disloyal to the vehicle. That is the whole discipline, and it is harder than another season."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another surgeon who changes one word, or another form of it: a role, a title, a version of yourself that everyone expects you to fight for. Write one sentence for that office. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Efua", "says": "One line for the next changed word. Start with I did.", "options": ["I did tell the thing from the container it came in.", "I did choose the version of my life that would still be true at sixty.", "I did leave on my own terms before the injury could set them."]}, "ice": {"question": "One more line, and this one is yours. Where in your own life is everyone telling you to fight for a container?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the surgeon's office", "sub": "Your six weeks, beside hers", "paragraphs": ["A surgeon's office, week one of six. You sat where Priya Nakamura sat, with a scan on the screen, damp goggles in your bag and one word changed, and the office asked you what it asked her. You wrote: {1}", "Before the two doors, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Hers was sixteen years of getting in on the bad days and a habit of knocking on quiet doors.", "You refused to decide before you could hear your own voice under everyone else's. Your reason: {3} That refusal is the deferral. Not this week. Not with sponsors in the room.", "Your first step: {4} {overlap}", "After the step, the shoulder was the same and the six weeks were five. Inside, you noticed this: {5}", "Then time did what it does when someone leaves for the right reason. Eleven weeks. A retirement that was not a surrender. A coach disappointed, sponsors elsewhere, and water that did not go anywhere.", "Asked what she kept, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["This is close to what she did. She spent six weeks in the water and out of it, finding out what she was there for, before she signed anything.", "She did something like this. The chapter has her asking whether competing was still the thread or had become the container mistaken for it. The list is one way to ask that.", "The surgeon had already answered it, in effect, when he changed the word. She heard him. A different first step in the same office is still a first step."], "stepOverlapFree": "Her first step was six weeks of asking whether the swimming was still the thread. A different first step in the same office is still a first step.", "help": {"zero": "You did not turn to Efua on this journey. Priya had knocked on Efua's door once, when Efua had gone quiet for nine days. The knock works in both directions. Next time, try it. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to Efua {n} on this journey. Priya once knocked on her door when she had gone quiet for nine days, and this is the knock coming back. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the container you are being told to fight for, as you named it: {ice}", "closing": "The pool is still there, and so is the shoulder. What you carry out of the office is not a medal, and it is not Priya. It is the evidence that you can tell the thread from the container, and choose the life that will still be true at sixty.", "stickerLines": ["Walked with Priya Nakamura.", "Week one of six."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The goggles\">\n<g transform=\"rotate(-8 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n\n  <path d=\"M70,200 C70,170 96,160 130,160 C164,160 186,172 186,196 C186,222 160,236 130,236 C96,236 70,228 70,200 Z\" stroke-width=\"4\"/>\n  <path d=\"M214,196 C214,172 236,160 270,160 C304,160 330,170 330,200 C330,228 304,236 270,236 C240,236 214,222 214,196 Z\" stroke-width=\"4\"/>\n  <path d=\"M186,196 C194,186 206,186 214,196\" stroke-width=\"4\"/>\n  <path d=\"M70,200 C40,190 30,176 34,164 M330,200 C360,190 370,176 366,164\" stroke-width=\"3\"/>\n  <path d=\"M34,164 C90,120 310,120 366,164\" stroke-width=\"2.4\"/>\n  <path d=\"M96,176 C110,168 130,166 150,170 M240,176 C254,168 274,166 294,170\" stroke-width=\"1.6\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
