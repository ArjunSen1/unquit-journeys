<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Walt Disney, 1923</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from the documented record of Disney's Kansas City years, paraphrased, and from the world lists. No characters or marks are drawn or named.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "disney", "title": "Walt Disney, 1923", "subtitle": "A train platform in Kansas City. July 1923. Forty dollars and a one-way ticket.", "object": "The suitcase", "sticker": "The suitcase.", "footer": "Drawn from the documented record of Disney's Kansas City years, paraphrased, and from the world lists. No characters or marks are drawn or named.", "arrive": {"heading": "You are standing where a twenty-one-year-old stood with a cardboard suitcase.", "paragraphs": ["He is twenty-one. He started an animation studio in Kansas City called Laugh-O-Gram with money from local investors and a handful of artists he could not afford. The films were good. The distributor went bankrupt without paying. He slept in the office, ate cold beans from cans, bathed once a week at the train station, and kept the studio alive on a contract to make a dental hygiene film for a local dentist. It was not enough.", "This month Laugh-O-Gram went bankrupt. The artists have scattered. He has sold his camera to pay for a ticket. He is on the platform with forty dollars, a suitcase, a suit that is the only good clothes he owns, and one unfinished film about a live girl in a cartoon world that no one has bought.", "His brother Roy is in a veterans' hospital in Los Angeles with tuberculosis. That is the whole of what is waiting on the other end of the ticket.", "Now the young man steps aside and you step in. The platform, the forty dollars, the failed studio and the unfinished reel are his. What you carry onto the train is yours."], "button": "Stand on the platform"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The train is not here yet. The suitcase is light because there is not much in it. The reel of the unfinished film is the heaviest thing you own.", "question": "What are you feeling right now?", "placeholder": "Say it as a bankrupt twenty-one-year-old, not as a name on a castle.", "helper": {"who": "Roy, your brother, by letter from the hospital in Los Angeles, which is where the ticket ends", "says": "You wrote that you are coming. You did not write how you are. Tell me, before you get on the train.", "options": ["I feel that I made good films and it did not matter, because the man who was supposed to pay for them did not, and I did not know that could happen.", "I feel twenty-one and already bankrupt once, and I am told that is a thing people recover from, and I do not know anyone who has.", "I feel the reel in the suitcase. It is the only thing I made that no one has ruined yet."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the train, take an inventory. Not of the studio, and not of Disney. Of yourself.", "question": "What have you already done, in your own life, that proves you can start again in a city where you know one person?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Roy, by letter", "says": "I can tell you what my brother carries. A studio kept alive for a year on cold beans and a dentist's contract. Films good enough that the failure was the distributor's, not his. A reel in his suitcase that he finished when there was no money to finish it. Now you tell me what you carry. Finish one of these.", "options": ["A time I started again in a city where I knew one person: ", "A time the failure was someone else's and I carried it anyway: ", "A time I finished the thing when there was no money to finish it: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence on the platform is: bankrupt at twenty-one, so this is not the business for me. It sounds like a lesson learned. It is the distributor's bankruptcy speaking as if it were yours. You do not have to decide about animation on a platform. You only have to refuse to let Kansas City decide Los Angeles.", "question": "What is the one reason you will not decide today?", "placeholder": "Not a business plan. One reason the bankruptcy does not get the vote.", "helper": {"who": "Roy, by letter", "says": "You went bankrupt because a distributor did. Tell me why that is not a fact about what you can make.", "options": ["Because the films were good. Everyone who saw them said so. The money was the part that failed, and the money was never the part I made.", "Because I have a reel no one has bought and no one has seen, and a thing no one has seen has not failed.", "Because Roy is at the other end of the ticket, and a man with a brother at the other end of a ticket is not finished."]}}, {"n": 4, "name": "One step", "prompt": "Not a studio. Not a company with your name on it. One step, small enough to finish before the train comes.", "question": "What is it?", "placeholder": "Something a man can do on a platform with forty dollars and a reel.", "helper": {"who": "Roy, by letter", "says": "You will be here in three days. What is the smallest thing you can do before you arrive?", "options": ["I will get on the train. That is the whole step. Everything else is Los Angeles.", "I will write, tonight, to every distributor whose address I have, and say the reel is finished and I am moving west, and give Roy's address.", "I will keep the suit on for the whole trip so that I arrive as a man with a suit, not a man with a suitcase."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. You are on the train, or letters are on their way with a hospital's address on them, or you are three days into a suit. Kansas City is behind you. The reel is still unsold.", "question": "What has changed in you?", "placeholder": "Compare it to the platform.", "helper": {"who": "Roy, by letter, waiting", "says": "Nothing about the bankruptcy changed on the train. What changed in you?", "options": ["Kansas City is behind me. I have stopped being someone who failed there and started being someone arriving somewhere.", "The letters are gone. Someone in New York may open one. That is more than was true yesterday.", "I have forty dollars and a reel and a brother. Yesterday it was a list of what I had lost. Today it is a list of what I have."]}}, {"n": 6, "name": "Time passes", "montage": ["A distributor in New York answers one of the letters. In October, three months after the platform, she signs a contract for a series of films about a live girl in a cartoon world. Roy leaves the hospital to handle the money, because someone has to and it cannot be Walt. They set up in the back of a real estate office and then in a garage.", "Five years later he loses his best character to a distributor in a contract dispute, and on the train home from New York draws another one. The company is still there. It employs two hundred thousand people. The cartoon world with a live girl in it was the first thing it sold.", "He said later that he was glad he had a rough time at the start, because it meant he was never afraid of a rough time again."], "question": "Bankrupt at twenty-one, a train west. Here is the question the company cannot answer for you: what was in the suitcase?", "choices": [{"label": "Forty dollars and a suit.", "short": "forty dollars and a suit", "reply": "That is the inventory, and it is the version the company tells. Forty dollars did not make anything. It got a man to a platform."}, {"label": "A brother at the other end.", "short": "a brother at the other end", "reply": "Roy is the least told part of the story and the reason there is one. He handled the money for forty-five years. He was not in the suitcase. He was the address on it."}, {"label": "One finished reel no one had seen yet, and a man who knew the failure was not his.", "short": "one finished reel no one had seen yet, and a man who knew the failure was not his", "reply": "Yes. The distributor went bankrupt, not the films. He knew that, and it is the whole of why he got on the train. Most people who fail carry the wrong failure with them and let it decide the next city. He carried the reel. The reel got a contract in three months, and the company that makes the world's stories began in the back of a real estate office because a twenty-one-year-old could tell whose failure it was."}, {"label": "Nothing yet. He got lucky in Los Angeles.", "short": "nothing yet, he got lucky in Los Angeles", "reply": "A distributor answered one of the letters. That is luck if you did not write the letters. He wrote all of them."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another platform, another bankruptcy that is not yours wearing your name. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Roy, by letter", "says": "One line for the next train west. Start with I did.", "options": ["I did tell whose failure it was and carried the right thing onto the train.", "I did get on the train.", "I did write to every address I had before I arrived."]}, "ice": {"question": "One more line, and this one is yours. What failure are you carrying that was not yours, and what reel is in the suitcase?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, on the platform", "sub": "Your ticket west, beside his", "paragraphs": ["A train platform in Kansas City, July 1923, forty dollars and a cardboard suitcase. You stood where a bankrupt twenty-one-year-old stood, with one unsold reel and a brother in a hospital at the other end of the ticket, and the platform asked you what it asked him. You wrote: {1}", "Before the train, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was a studio kept alive on cold beans and a dentist's contract, and a film finished with no money to finish it.", "You refused to let Kansas City decide Los Angeles. Your reason: {3} That refusal is the deferral. Not today. Not from someone else's bankruptcy.", "Your first step: {4} {overlap}", "After the step, the reel was still unsold. Inside, you noticed this: {5}", "Then three months did what three months do when the letters have been written. A contract from New York, a brother out of the hospital to handle the money, a garage, and a company that tells the world its stories.", "Asked what was in the suitcase, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this. He got on the train in July 1923 with about forty dollars and the reel.", "He did this. The letters to distributors are how the New York contract found him at Roy's address. A different first step in the same place is still a first step.", "He arrived in a suit, by his own account, because it was the only good clothes he had. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step was the train. A different first step in the same place is still a first step.", "help": {"zero": "You did not write to Roy. Walt did, and Roy left a hospital bed to handle the money, and did so for the rest of his life. Next time, write to the one at the other end of the ticket. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You wrote to Roy {n} on this journey. Roy is the least told part of the story and the reason there is one. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the failure you are carrying that was not yours, as you named it: {ice}", "closing": "The platform in Kansas City is still a station. What you carry onto the train is not a company, and it is not him. It is the evidence that you can tell whose failure it was, and carry the reel instead.", "stickerLines": ["Walked with Walt Disney.", "Kansas City, July 1923."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The suitcase\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M80,140 L320,140 L320,300 L80,300 Z\" stroke-width=\"4\"/><path d=\"M160,140 L160,110 L240,110 L240,140\" stroke-width=\"4\"/><path d=\"M80,200 L320,200\" stroke-width=\"2\"/><path d=\"M186,190 L214,190 L214,212 L186,212 Z\" stroke-width=\"2.4\"/><path d=\"M100,140 L100,300 M300,140 L300,300\" stroke-width=\"1.6\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
