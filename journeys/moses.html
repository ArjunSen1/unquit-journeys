<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Moses at the edge of Nebo</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from Deuteronomy, paraphrased, and from Unquit: The Oldest Choice. A reader from a faith tradition before launch.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "moses", "title": "Moses at the edge of Nebo", "subtitle": "A mountain east of the Jordan. Year forty. The land is visible.", "object": "The staff", "sticker": "The staff.", "footer": "Drawn from Deuteronomy, paraphrased, and from Unquit: The Oldest Choice. A reader from a faith tradition before launch.", "arrive": {"heading": "You are standing where an old man stood.", "paragraphs": ["Forty years ago he led a people out of slavery. He did not want the job. He argued with the voice that gave it to him, said he was slow of speech, asked it to send someone else. It sent him.", "Forty years in the desert. Complaints. Rebellions. A golden calf. A generation that died in the sand and a generation born in it that has never seen a house. He has carried them, argued for them, been blamed by them, and once, at a rock, lost his temper in a way that cost him the one thing he had been walking toward.", "He is a hundred and twenty. He is on a mountain called Nebo, and from here he can see the whole of the land. The river. The plain. The hills beyond. He has been told, plainly, that he will not cross. The people will. Joshua will lead them. He will die here, with the destination visible and uncrossed.", "Now Moses steps aside and you step in. The staff, the forty years, the view and the sentence are his. What forty years were for, when you will not arrive, is yours."], "button": "Stand on the mountain"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The wind on Nebo is steady. Below, the camp is packing for a crossing you will not make. The staff in your hand has struck a sea and a rock and is only a stick of wood.", "question": "What are you feeling right now?", "placeholder": "Say it as a man of a hundred and twenty who can see the land and will not touch it.", "helper": {"who": "Joshua, who will cross tomorrow, standing a step behind you", "says": "You have told me everything about leading them except what you feel about not going. Tell me now.", "options": ["I feel that I have walked forty years toward a thing I can see from here, and that seeing it is the whole of what I get.", "I feel that I did not want this at the start and I want it now more than I have ever wanted anything, and that is the cruelest part.", "I feel that they will cross without me and that they will be fine without me, and I do not know which of those hurts more."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the sentence is accepted, take an inventory. Not of the desert, and not of Moses. Of yourself.", "question": "What have you already done, in your own life, that proves you can carry people toward a place you will not reach?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Joshua", "says": "I can tell you what the man on this mountain carries. Forty years of leading people who blamed him for everything and followed him anyway. A sea. A rock. A law carried down a mountain twice because he smashed it the first time. He argued with God for their lives more than once and won. Now you tell me what you carry. Finish one of these.", "options": ["A time I carried people toward a place I would not reach: ", "A time I kept leading people who blamed me for the journey: ", "A time I did the work knowing someone else would finish it: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence on Nebo is: if I do not arrive, the forty years were for nothing. It sounds like grief. It is grief that has confused the destination with the purpose. You do not have to make peace with the sentence tonight. You only have to refuse to let the view decide what the walk was for.", "question": "What is the one reason you will not decide tonight?", "placeholder": "Not a theology. One reason the uncrossed river does not get the vote.", "helper": {"who": "Joshua", "says": "You will not cross. That is decided. Whether the forty years were for nothing is not. Tell me why you will not let the river decide it.", "options": ["Because the people were the point. I was told to bring them out and bring them here. They are here. I did the thing I was sent to do.", "Because a hundred and twenty years is not measured by the last mile of it.", "Because Joshua is standing behind me, and I taught him everything he knows, and he is about to cross with all of it."]}}, {"n": 4, "name": "One step", "prompt": "Not the crossing. Not the land. One step, small enough to finish on a mountain before dark.", "question": "What is it?", "placeholder": "Something a man with a staff and a view can do.", "helper": {"who": "Joshua", "says": "You cannot cross. What is the smallest thing you can do from here?", "options": ["I will put my hands on Joshua and give him what I have, all of it, so that what crosses tomorrow is not less than what walked forty years.", "I will look at the land. All of it. Slowly. That is what I was given, and I will not waste it by looking down.", "I will go down and speak to them one more time. Not instructions. A blessing, tribe by tribe."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. Joshua carries what you gave him, or the land has been looked at properly, or the tribes have been blessed one by one. The river is still between you and it. The sentence stands.", "question": "What has changed in you?", "placeholder": "Compare it to the wind on the mountain.", "helper": {"who": "Joshua", "says": "Nothing about the river changed. What changed on the mountain?", "options": ["I looked at the land and I was not looking at what I lost. I was looking at what they get.", "I gave Joshua everything. It weighs less in him than it did in me. That is what it was for.", "I am still not crossing. I have stopped needing to, which I did not expect."]}}, {"n": 6, "name": "Time passes", "montage": ["He dies on the mountain. The text says his eye was not dim nor his strength gone. No one knows where he is buried. The people mourn thirty days and then cross, under Joshua, into a land that a man who never entered it had walked them forty years to reach.", "The Desert Fathers, centuries later, reduced the whole of it to one instruction: stay in your cell and your cell will teach you everything. The primary temptation of the Long Middle is not to do something terrible. It is to leave. To find somewhere more comfortable. He did not leave. He walked until he was told to stop, and then he looked.", "Every leader who builds a thing they will not see finished is standing on Nebo. Most of them do not get the view."], "question": "Forty years, and he did not cross. Here is the question the view cannot answer for you: what did Moses arrive at?", "choices": [{"label": "Nothing. That is the tragedy.", "short": "nothing, that is the tragedy", "reply": "It is a tragedy, and the text does not pretend otherwise. He wanted to cross. He was told no. But a man who arrived at nothing would not have had a people to bless."}, {"label": "The view.", "short": "the view", "reply": "He was given the view, and the journey has him use it properly, and it is not the answer. A view is what you get instead of arriving. It is not what you arrive at."}, {"label": "The people, at the edge. That was the assignment.", "short": "the people, at the edge, that was the assignment", "reply": "Yes. He was told to bring them out and bring them here. They are here. He confused, for forty years, the destination with the purpose, and on the mountain the two came apart. The purpose was them. He arrived at it. This is the Long Middle for others: a continuation whose whole value lands on people you will not accompany. Every parent knows a version. Every founder who builds for a successor knows another."}, {"label": "Joshua.", "short": "Joshua", "reply": "Also true. He arrived at the man who would finish it, and gave him everything, and the crossing was not less for his absence. Building the carrier is arriving, of a kind that the one who did it rarely gets to see."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another mountain from which you can see the thing you will not reach. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Joshua", "says": "One line for the next Nebo. Start with I did.", "options": ["I did bring them to the edge, which was the assignment.", "I did give the carrier everything before he crossed.", "I did look at the land properly instead of at what I lost."]}, "ice": {"question": "One more line, and this one is yours. What are you carrying people toward that you may not reach yourself?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, on the mountain", "sub": "Your view, beside his", "paragraphs": ["Nebo, year forty, the land visible and uncrossed. You stood where an old man stood, with a staff that was now only wood and a camp packing below for a crossing you would not make, and the mountain asked you what it asked him. You wrote: {1}", "Before the sentence was accepted, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was forty years of leading people who blamed him and followed him, and a law carried down a mountain twice.", "You refused to let the uncrossed river decide what the walk was for. Your reason: {3} That refusal is the deferral. Not tonight. Not from the view.", "Your first step: {4} {overlap}", "After the step, the river was still between you and the land. Inside, you noticed this: {5}", "Then the text did what the text does. A death on the mountain with eyes undimmed, an unmarked grave, thirty days of mourning, and a crossing led by the man he had taught.", "Asked what Moses arrived at, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this. Deuteronomy has him laying hands on Joshua and commissioning him before the people.", "He did this. The text says he was shown the whole land, region by region, from Nebo. A different first step in the same place is still a first step.", "He did this. The blessing of the tribes, one by one, is the chapter before his death. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step was to give Joshua everything and look at the land. A different first step in the same place is still a first step.", "help": {"zero": "You did not turn to Joshua. Moses did, for forty years, and made him the reason the crossing happened without him. Next time, turn to the one who will finish it. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to Joshua {n} on this journey. Moses spent forty years making sure there was a Joshua. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the thing you are carrying people toward that you may not reach, as you named it: {ice}", "closing": "Nebo is a hill in Jordan with a view of the river. What you carry down from it is not the land, and it is not Moses. It is the evidence that you can bring people to the edge of a thing you will not enter, and call that arriving.", "stickerLines": ["Walked with Moses.", "Nebo, year forty."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The staff\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M200,60 L200,340\" stroke-width=\"5\"/><path d=\"M200,60 C184,52 176,70 190,80 C204,90 214,76 204,66\" stroke-width=\"3\"/><path d=\"M60,340 C110,326 290,326 340,340\" stroke-width=\"2\"/><path d=\"M80,300 C120,270 170,260 210,280 C250,300 300,290 340,266\" stroke-width=\"1.6\" stroke-dasharray=\"3 6\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
