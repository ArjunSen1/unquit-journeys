<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Daniel Osei, forty dollars</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Daniel Osei is a composite from Chapter Sixteen of The Unquit Stories.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "osei", "title": "Daniel Osei, forty dollars", "subtitle": "A lobby in Minneapolis. A Tuesday in February. Three hours off the plane.", "object": "The coat", "sticker": "The coat.", "footer": "Daniel Osei is a composite from Chapter Sixteen of The Unquit Stories.", "arrive": {"heading": "You are standing where Daniel Osei stood.", "paragraphs": ["He left Accra with a student visa, a duffel bag, forty dollars, a piece of paper with an address on it, and what his mother called too much confidence and he privately knew was controlled terror. He is twenty-six. He spent three years applying to the accounting program that begins in thirty-six hours.", "His cousin was supposed to meet him at the airport. His cousin did not come, for reasons that will never be fully explained. The address on the paper took three hours, a bus and the pity of a woman at a convenience store who noticed his coat was too thin for a Minneapolis February. The building at the address has no record of his cousin. The manager, a man named Walt with kind eyes and no patience for confusion, has let him sit in the lobby.", "It is getting dark. It is nine degrees outside. He has forty dollars, no bed, and a certainty that he has made a mistake.", "Now Daniel steps aside and you step in. The duffel, the forty dollars, the wrong address and the lobby are his. Whether you are in a classroom in thirty-six hours is yours."], "button": "Sit down in the lobby"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The radiator under the lobby window clanks. Walt is on the phone behind the desk, not looking at you, which is a kindness. Your bag is between your feet.", "question": "What are you feeling right now?", "placeholder": "Say it in the language you think in.", "helper": {"who": "Walt, the building manager, hanging up the phone", "says": "I do not know your cousin. I know it is nine degrees and you have nowhere to be. Talk to me for a minute before you decide anything.", "options": ["I feel that I have made a mistake three years in the making, and I am the last to find out.", "I feel that everyone who told me not to come was right, and I would rather freeze than call and tell them.", "I feel like a number on a form. Forty dollars, one bag, no address. That is all this city knows about me."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before anything is decided about tomorrow, take an inventory. Not of the bag, and not of Daniel. Of yourself.", "question": "What have you already done, in your own life, that proves you can arrive somewhere with almost nothing and stay?", "placeholder": "One thing you did. Not one thing you believe.", "fillIn": true, "helper": {"who": "Walt", "says": "I can tell you what the young man on my bench carries. He applied to one program for three years and got in. He found this building in three hours in a city he has never seen, in a coat that is not a coat, with a bus map he could not read. He has not asked me for a thing. Now you tell me what you carry. Finish one of these.", "options": ["A time I arrived somewhere with almost nothing and stayed: ", "A time I kept applying after the first no, and the second: ", "A time I found my way in a place where I could not read the map: "]}}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the lobby is: this was a mistake. It sounds like a conclusion. It is nine degrees and a missing cousin drawing a conclusion. You do not have to decide whether to stay in America tonight. You only have to refuse to let the first night decide three years.", "question": "What is the one reason you will not decide tonight?", "placeholder": "Not a plan for the city. One reason to wait for the morning.", "helper": {"who": "Walt", "says": "Nobody decides a country in a lobby at nine degrees. Tell me why you will wait.", "options": ["Because the class is in thirty-six hours and I did not fly across an ocean to miss it by one night.", "Because my cousin not coming is a fact about my cousin. It is not a fact about me.", "Because a decision made in a strange lobby in the cold is the cold talking, and I have heard the cold before."]}}, {"n": 4, "name": "One step", "prompt": "Walt has to lock the lobby at ten. Not a plan for the year. Not a way to reach your cousin. One step, small enough to finish before ten.", "question": "What is it?", "placeholder": "Something you can do with forty dollars and a bus map.", "helper": {"who": "Walt", "says": "There is a Red Cross shelter two buses from here. It is warm and it is free. What is the smallest thing you can do tonight?", "options": ["I will take the two buses to the shelter and sleep. Tomorrow is a different problem.", "I will ask Walt to write down the address of this building and his phone number, so that tomorrow I have one person in this city.", "I will put the forty dollars in two pockets, twenty and twenty, so that tomorrow cannot take all of it at once."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. You are on the second bus, or Walt's number is in your pocket, or the money is split. It is still nine degrees. Your cousin is still gone.", "question": "What has changed in you?", "placeholder": "Compare it to the bench.", "helper": {"who": "Walt, at the door", "says": "Nothing about tonight changed. What changed in you?", "options": ["The city is the same. I am not sitting in it anymore. I am moving through it.", "I have one name and one phone number. Yesterday I had a cousin. Tonight I have Walt. It is not less.", "I am still terrified. I am terrified on a bus going somewhere warm, which is a different kind."]}}, {"n": 6, "name": "Time passes", "montage": ["He sleeps at the Red Cross shelter. He attends his first university class thirty-six hours after landing, in the clothes he wore from Accra. He borrows a pen from a classmate named Sarah. The next day, having noticed how he shivered, she brings him a coat one of her brothers had left behind. He does not know how to accept it. He accepts it anyway.", "The first year is the hardest of his life and he does not go home. The identity that changes is not the one on the visa. It is the one that says: I am someone who accepts the coat.", "He is still in Minnesota. He still has the coat."], "question": "He arrived with forty dollars and a wrong address. Here is the question the years cannot answer for you: on which day did the identity change?", "choices": [{"label": "The day he landed.", "short": "the day he landed", "reply": "He landed as a man who was sure he had made a mistake. Landing changes your address. It does not change who you think you are."}, {"label": "The day of the first class.", "short": "the day of the first class", "reply": "He walked in wearing clothes from Accra thirty-six hours after landing, and that is a first step, and a brave one. But he was still a man who would not ask for anything."}, {"label": "The day he accepted the coat.", "short": "the day he accepted the coat", "reply": "Yes. He did not know how to accept it and he accepted it anyway. That is the day the man who would rather freeze than ask became the man who could be helped, and everything that came after in that city came through that door. Identity does not change on the day you arrive. It changes on the day you let someone hand you something."}, {"label": "It did not change. He was always this person.", "short": "it did not change, he was always this person", "reply": "Also true, and it is what Step Zero says. He was always someone who could cross an ocean and stay. What changed was that he saw it. The coat was the mirror."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another lobby, another wrong address, another night when the sensible thing is to go home. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Walt", "says": "One line for the next cold lobby. Start with I did.", "options": ["I did not let the first night decide three years.", "I did take the bus to somewhere warm and solve tomorrow tomorrow.", "I did accept the coat."]}, "ice": {"question": "One more line, and this one is yours. Where in your own life are you sitting in a lobby, sure you made a mistake?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the lobby", "sub": "Your first night, beside his", "paragraphs": ["Minneapolis, a Tuesday in February, three hours off the plane. You sat where Daniel Osei sat, with forty dollars, a duffel and a cousin who did not come, and the lobby asked you what it asked him. You wrote: {1}", "Before anything was decided, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was three years of applications, an address found in a city he could not read, and not one favor asked.", "You refused to let the first night decide. Your reason: {3} That refusal is the deferral. Not tonight. Not at nine degrees.", "Your first step: {4} {overlap}", "After the step, it was still nine degrees and the cousin was still gone. Inside, you noticed this: {5}", "Then time did what it does when a man stays one more night. A shelter, a first class in yesterday's clothes, a borrowed pen, and a coat he did not know how to accept.", "Asked on which day the identity changed, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this. The Red Cross shelter that night, and the university thirty-six hours after landing.", "The chapter does not say whether he took Walt's number. It says Walt let him sit for two hours, which is its own kind of number. A different first step in the same lobby is still a first step.", "The chapter does not say. It says the forty dollars lasted, which suggests someone was careful with it. A different first step in the same lobby is still a first step."], "stepOverlapFree": "His first step was two buses to a shelter and a class the next morning. A different first step in the same lobby is still a first step.", "help": {"zero": "You did not talk to Walt. Daniel barely did either, and it took a classmate with a coat to teach him. Next time, try the desk. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You talked to Walt {n} on this journey. Daniel had Walt, then a woman at a convenience store, then Sarah with a coat. None of them was the cousin. All of them were the help. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the lobby in your own life, as you named it: {ice}", "closing": "The lobby has a different manager now. The coat is still in a closet in Minnesota. What you carry out is not a degree, and it is not Daniel. It is the evidence that in a cold city with a wrong address you stayed one more night and let someone hand you something.", "stickerLines": ["Walked with Daniel Osei.", "Minneapolis, a Tuesday in February."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The coat\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n\n  <path d=\"M160,80 L120,100 L92,190 L124,200 L130,180 L130,330 L200,330 L200,110 M240,80 L280,100 L308,190 L276,200 L270,180 L270,330 L200,330\" stroke-width=\"4\"/>\n  <path d=\"M160,80 C170,100 200,110 200,110 C200,110 230,100 240,80\" stroke-width=\"3\"/>\n  <path d=\"M160,80 L200,60 L240,80\" stroke-width=\"3\"/>\n  <path d=\"M170,150 L184,150 M170,200 L184,200 M170,250 L184,250\" stroke-width=\"2.4\"/>\n  <path d=\"M140,240 L164,240 L164,280 L140,280 Z M236,240 L260,240 L260,280 L236,280 Z\" stroke-width=\"2\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
