<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Solomon Adeyemi, the belief architecture</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>

<script>
const D = {"series": "Unquit Journeys", "slug": "solomon", "title": "Solomon Adeyemi, the belief architecture", "subtitle": "An empty church in Baltimore. A Thursday afternoon in February. The lights have been cut off.", "object": "The pew", "sticker": "The pew.", "footer": "Solomon Adeyemi is a composite from Chapter Fifteen of The Unquit Stories.", "arrive": {"heading": "You are standing where a pastor sat in his own dark church.", "paragraphs": ["He lost his congregation, then his marriage, then his faith, in that order, over three years in his fifties. The congregation was easiest to understand: the church grew past the building, the money got complicated, some people left unhappy and what they said spread. Sunday mornings drew eleven, then seven. Then the lights were cut off because the bill was not paid.", "The marriage was harder. Diane, his partner in the work for twenty-two years, found that when the work fell apart she had built her life so entirely around his that nothing was left that was purely hers. She did not leave in anger. She left in grief.", "The faith is the hardest. Not doctrine, which comes and goes like tide. What he has lost is the felt conviction that any of it mattered. The preaching, the visiting, the funerals, the weddings, the Sunday mornings.", "He is sitting in the empty church on a Thursday afternoon in February and feels nothing. Not crisis. Nothing. Now Solomon steps aside and you step in. The dark sanctuary, the seven, the empty house and the nothing are his. What belief is made of is yours."], "button": "Sit down in the pew"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The church is cold because the heat went with the lights. The pews are the same pews. The pulpit is fifteen feet away and might as well be in another building.", "question": "What are you feeling right now?", "placeholder": "Say it in the church, where you have said everything else.", "helper": {"who": "Diane, by phone, who left in grief and still calls", "says": "I am not calling to come back. I am calling because I know where you are sitting. Tell me what you feel in that room.", "options": ["I feel nothing, and I have preached about the dark night for thirty years, and it turns out nothing is not dark. It is just nothing.", "I feel that twenty-two years of Sundays were built on a feeling and the feeling left and took the twenty-two years with it.", "I feel that I lost three things in order and I can name the order and I cannot feel any of them."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before another Sunday, take an inventory. Not of the church, and not of Solomon. Of yourself.", "question": "What have you already done, in your own life, that proves you can build a thing rather than wait to feel it?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Diane", "says": "I can tell you what the man in that pew carries. Twenty-two years of funerals and weddings and hospital rooms, done well, on the days the feeling was there and the days it was not. A congregation that grew past its building because of him. A wife who left in grief, not anger, which is a fact about what he built. Now you tell me what you carry. Finish one of these.", "options": ["A time I built a thing rather than waited to feel it: ", "A time I did the work on the days the conviction was not there: ", "A time I lost the feeling and found out what was underneath it: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the pew is: the feeling is gone, so the faith is gone, so the years were for nothing. It sounds like honesty. It is a man who built on feeling discovering that feeling is not a foundation. You do not have to decide what you believe on a Thursday in February. You only have to refuse to let the absence of the feeling decide the presence of the thing.", "question": "What is the one reason you will not decide today?", "placeholder": "Not a theology. One reason the nothing does not get the vote.", "helper": {"who": "Diane", "says": "The feeling left. Tell me why that is not the same as the thing leaving.", "options": ["Because I treated the feeling as the thing itself for thirty years, and the feeling has left before, in my forties, and I did not notice because it came back.", "Because the funerals were still funerals on the days I felt nothing, and the people at them were still comforted, and that was not the feeling doing it.", "Because I do not yet know what I actually believe, as opposed to what I was taught to and what felt true in moments. I should find out before I decide it is gone."]}}, {"n": 4, "name": "One step", "prompt": "Not the pulpit. Not a new congregation. One step, small enough to finish before the church gets dark.", "question": "What is it?", "placeholder": "Something a man can do in a cold pew.", "helper": {"who": "Diane", "says": "You do not have to preach. What is the smallest thing you can do this afternoon?", "options": ["I will write down what I actually believe. Not what I was taught. Not what felt true. What I would build on if I had to.", "I will go and sit in the back of someone else's church on Sunday, and listen, and not preach.", "I will get a job that has nothing pastoral in it, where no one needs me to explain their life, and find out whether I want the pulpit at all."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. A short list exists of what you actually believe, or a Sunday is planned in someone else's back pew, or an application is in at a hardware store. The lights are still off. Diane is still gone.", "question": "What has changed in you?", "placeholder": "Compare it to the nothing.", "helper": {"who": "Diane", "says": "The church is still dark. What changed in the pew?", "options": ["The list is short. Everything on it is something I would build on. I never once checked before.", "I am going to sit in the back of a church I did not build and see what I hear when I am not the one speaking.", "I am going to work with my hands for a year and find out if the pulpit is something I want or something I was."]}}, {"n": 6, "name": "Time passes", "montage": ["He spends a year doing nothing pastoral. He works at a hardware store and likes it: the physical specificity, the clear transactions, customers who come in with a problem and leave with a solution. He needs the distance to discover whether he still wants the pulpit at all.", "He sits in the back of four churches in four months. In the fifth, a Presbyterian congregation meeting in a building that used to be a bank, the pastor says something he writes down: belief is not something you arrive at. It is something you build, the way you build anything, by deciding what materials you trust, understanding the load they must carry, checking the structure and reinforcing what is weakening.", "He had built his faith on feeling. When the feeling left, there was nothing to return to. What he begins to build in his fifties is different: from what he actually believes, checked, load-bearing, and reinforced where it weakens. It is slower and smaller and it does not leave when the feeling does."], "question": "Three things lost in order, and a year in a hardware store. Here is the question the empty church cannot answer for you: what had he built his faith on?", "choices": [{"label": "God.", "short": "God", "reply": "He would say so, and the chapter is careful not to argue. But the thing that left him in February was not God. It was the feeling of God, and he had not known those were different."}, {"label": "Twenty-two years of work.", "short": "twenty-two years of work", "reply": "The work stood. The funerals comforted people on the days he felt nothing. The work was never the problem, and it was not the foundation either."}, {"label": "Feeling. Which is not a foundation.", "short": "feeling, which is not a foundation", "reply": "Yes. Belief built on feeling is a house built on weather. He had treated the experience of conviction as the thing itself, and when the experience left, in his fifties, on a Thursday, there was nothing underneath. What he built afterward was architecture: materials he actually trusted, checked for load, reinforced where they weakened. It does not leave when the feeling does. That is the whole of what the year in the hardware store taught him."}, {"label": "Other people's belief in him.", "short": "other people's belief in him", "reply": "Also true, and Diane's leaving proved it. When the congregation went, the reflection went with it. A faith you can lose by losing your audience was an audience's faith."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another Thursday in February when the feeling is gone. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Diane", "says": "One line for the next dark church. Start with I did.", "options": ["I did write down what I would actually build on.", "I did not let the absence of the feeling decide the presence of the thing.", "I did sit in the back of someone else's church and listen."]}, "ice": {"question": "One more line, and this one is yours. What in your own life is built on feeling, and what would you build on instead?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the pew", "sub": "Your Thursday, beside his", "paragraphs": ["An empty church in Baltimore, a Thursday in February, the lights cut off. You sat where Solomon Adeyemi sat, with seven Sundays behind you and nothing where the conviction had been, and the church asked you what it asked him. You wrote: {1}", "Before another Sunday, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was twenty-two years of funerals done well on the days the feeling was not there.", "You refused to let the absence of the feeling decide the presence of the thing. Your reason: {3} That refusal is the deferral. Not today. Not on a Thursday in February.", "Your first step: {4} {overlap}", "After the step, the lights were still off. Inside, you noticed this: {5}", "Then a year did what a year does in a hardware store and the back of five churches. A sentence written down in a building that used to be a bank, and a faith rebuilt as architecture.", "Asked what he had built his faith on, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this, slowly, over the following years. The chapter calls it starting with what he actually believed. A different first step in the same place is still a first step.", "He did this. Four churches in four months, and the fifth had the sentence. A different first step in the same place is still a first step.", "He did this. The hardware store year is the chapter's turning point, and he liked the work. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step was a year away from anything pastoral, and the back pew of other people's churches. A different first step in the same place is still a first step.", "help": {"zero": "You did not pick up for Diane. The chapter has her leave in grief, and does not say whether she called. The help box is what she might have said. Next time, pick up for whoever calls. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You picked up for Diane {n} on this journey. She left in grief, not anger, which is a fact about what they built together. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the thing in your own life built on feeling, as you named it: {ice}", "closing": "The church has its lights on again, under another name. What you carry out of the pew is not a congregation, and it is not Solomon. It is the evidence that you know the difference between a feeling and a foundation, and can build on the second.", "stickerLines": ["Walked with Solomon Adeyemi.", "Baltimore, a Thursday in February."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The pew\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M70,180 L330,180 L330,200 L70,200 Z\" stroke-width=\"4\"/><path d=\"M70,120 L70,300 M330,120 L330,300\" stroke-width=\"4\"/><path d=\"M70,120 L330,120\" stroke-width=\"3\"/><path d=\"M90,200 L90,290 M310,200 L310,290\" stroke-width=\"1.6\"/><path d=\"M110,150 L290,150\" stroke-width=\"1.2\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
