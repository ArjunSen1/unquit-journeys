<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Confucius, the fourteen years</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from the Analects and the Records of the Grand Historian, paraphrased, and from Unquit: The Oldest Choice. The episode between Chen and Cai is one of the most retold in the tradition.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "confucius", "title": "Confucius, the fourteen years", "subtitle": "A roadside between Chen and Cai. The seventh day without food.", "object": "The zither", "sticker": "The zither.", "footer": "Drawn from the Analects and the Records of the Grand Historian, paraphrased, and from Unquit: The Oldest Choice. The episode between Chen and Cai is one of the most retold in the tradition.", "arrive": {"heading": "You are standing where an old teacher stood.", "paragraphs": ["He is past sixty. Eight years ago he left the state of Lu, where he had briefly held office and lost it, and set out with a handful of students to find a ruler who would govern the way he taught. He has been to Wei, to Song, to Chen. He has been mocked, followed by spies, nearly killed by a mob that mistook him for someone else, and turned away by every court that flattered him first. No ruler has taken his counsel. He has no position, no state, and a growing reputation for being right about things no one wants to hear.", "Now, on the road between Chen and Cai, soldiers have surrounded the camp. The students cannot go forward or back. The food ran out on the first day. It is the seventh. Several of the students are too weak to stand. Zilu, the oldest and bluntest of them, has come to the teacher's tent with a question he can no longer keep behind his teeth: does the gentleman also come to this?", "The teacher has been doing what he does every day. Reciting. Teaching whoever can sit up. Playing the zither and singing.", "Now the old man steps aside and you step in. The road, the soldiers, the seventh day and the students are his. What you do with Zilu's question is yours."], "button": "Sit down in the tent"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The zither is across your knees. Zilu is standing in the tent flap, angry because he is frightened. Beyond him, Yan Hui is sitting up against a wheel, too weak to walk and still listening.", "question": "What are you feeling right now?", "placeholder": "Say it as an old man on a road, not as a sage.", "helper": {"who": "Yan Hui, your favorite student, from where he sits against the wheel", "says": "Zilu asks in anger. I ask because I want to know. Teacher, what do you feel?", "options": ["I feel that I have spent my life teaching a way of governing and not one ruler has governed by it, and now the students who believed me are starving for it.", "I feel sixty and hungry and surrounded, and I notice that I am still playing the zither, and I do not fully understand why.", "I feel that Zilu's question is fair, and that the answer I am about to give him will decide whether any of them follows me another mile."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before Zilu is answered, take an inventory. Not of the food, and not of the teacher. Of yourself.", "question": "What have you already done, in your own life, that proves you can keep doing the work when no one has taken it up?", "placeholder": "One thing you did. Not one thing you believe.", "fillIn": true, "helper": {"who": "Yan Hui", "says": "I can tell you what the teacher carries. He lost his father at three and his mother young, and taught himself from whatever books he could find. He held office in Lu and gave it up rather than serve a court that would not listen. He has been refused by five states and has not once changed what he teaches to be accepted by a sixth. Now you tell me what you carry. Finish one of these.", "options": ["A time I kept doing the work when no one had taken it up: ", "A time I gave up a position rather than change what I believed to keep it: ", "A time I was refused and did not change the thing I was offering: "]}}, {"n": 3, "name": "The deferral", "prompt": "The sentence on the seventh day is: the Way has failed, because no one has taken it. It sounds like a conclusion drawn from evidence. It is hunger drawing conclusions. You do not have to answer whether your life's work has succeeded on a road with no food. You only have to refuse to let the seventh day decide it.", "question": "What is the one reason you will not decide today?", "placeholder": "Not an argument for the Way. One reason hunger does not get the vote.", "helper": {"who": "Yan Hui", "says": "The Master's Way is so large that the world cannot yet hold it. What shame is there in that? It is in not being held that a gentleman shows what he is. Tell me why you will not decide today.", "options": ["Because whether a ruler takes the Way is his to decide, and whether I keep teaching it is mine, and only one of those is on this road.", "Because a teaching is not measured by who adopts it in the year it is taught. I do not know what it is measured by. I know it is not this.", "Because Yan Hui is against that wheel, still listening, and while one student listens the question is not settled."]}}, {"n": 4, "name": "One step", "prompt": "Zilu is still waiting. Not a plan to break the siege. Not an answer to whether the Way has failed. One step, small enough to finish before he leaves the tent.", "question": "What is it?", "placeholder": "Something that can be done with a zither, a voice and a tent of students.", "helper": {"who": "Yan Hui", "says": "Zilu does not need an argument. He needs to see what you do next. What is it?", "options": ["I will answer him in one sentence: the gentleman holds firm in hardship; the small man is swept away by it. And then I will pick up the zither again.", "I will teach today's lesson to whoever can sit up, as if the soldiers were not there, because the lesson is not for the soldiers.", "I will ask Zilu to sit down and tell me what he is afraid of, before I tell him anything."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The sentence is said and the zither is in your hands again, or the lesson has been taught to four students who could sit up, or Zilu has spoken and you have listened. The soldiers are still there. There is still no food.", "question": "What has changed in you?", "placeholder": "Compare it to Zilu's question.", "helper": {"who": "Yan Hui", "says": "The siege is the same. What is different in the tent?", "options": ["The hunger is the same. It has stopped arguing.", "I have spent eight years asking whether a ruler will take the Way. Today I stopped asking, and taught it.", "I do not know whether any of this will outlast the week. I know what I do on the seventh day. That is the only part I was ever given."]}}, {"n": 6, "name": "Time passes", "montage": ["Help comes from the state of Chu and the siege lifts. He walks on for six more years. No ruler ever takes his counsel. At sixty-eight he returns to Lu, where he began, and teaches until he dies at seventy-two. Yan Hui dies before him, and he weeps as he has never wept. He is buried by his students. He believed, by every account, that he had failed.", "His students write down what he said. Their students copy it. The book they make is read by every literate person in China for two thousand years, and shapes the governing of a fifth of humanity, the examinations of an empire, and the family life of hundreds of millions of people who have never heard the word Analects.", "He wanted one ruler in his lifetime. He got none. He got everything after."], "question": "He died believing he had failed. Here is the question the two and a half thousand years cannot answer for him: what did he build?", "choices": [{"label": "A philosophy.", "short": "a philosophy", "reply": "He would not have used the word. He said he was only passing on what the ancients knew. What he built was not the ideas. Ideas are cheap. It was something that carried them."}, {"label": "Nothing, in his lifetime. That is the point of the story.", "short": "nothing in his lifetime", "reply": "Nothing a ruler would sign. But the tent between Chen and Cai was not empty. It had students in it, and one of them was writing down what he said while starving. That was the building. It did not look like one."}, {"label": "The people who would carry it after him.", "short": "the people who would carry it after him", "reply": "Yes. Every court refused him, so he taught the only people who could not: the ones walking with him. He built the carriers, not the building. This is continuation that outlives the continuer, and it is the shape most real continuation has. You will not see where it lands. You teach the people who will."}, {"label": "A habit: teaching on the seventh day as on the first.", "short": "a habit, teaching on the seventh day as on the first", "reply": "Also true, and it is what Zilu saw. Not an argument. A man doing the same thing on a road with no food that he did in a court with a salary. That consistency is what the students carried away, before they carried away a single sentence."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another seventh day, when the work has been refused everywhere and the people who believed you are hungry for it. Write one sentence for that tent. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Yan Hui", "says": "One line for the next road, Teacher. Start with I did.", "options": ["I did the same work on the seventh day that I did on the first.", "I did not let the ones who refused decide the value of what they refused.", "I did teach the people in the tent when the courts would not listen."]}, "ice": {"question": "One more line, and this one is yours. What work of yours has been refused everywhere, and who is still in the tent?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, in the tent", "sub": "Your seventh day, beside his", "paragraphs": ["A road between Chen and Cai, the seventh day without food. You sat where an old teacher sat, with a zither across your knees and a student in the tent flap asking whether a gentleman also comes to this, and the day asked you what it asked him. You wrote: {1}", "Before Zilu was answered, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was an office given up rather than kept dishonestly, and five states that refused him without once changing what he taught.", "You refused to let hunger draw the conclusion. Your reason: {3} That refusal is the deferral. Not today. Not from this.", "Your first step: {4} {overlap}", "After the step, the soldiers were still there and there was still no food. Inside, you noticed this: {5}", "Then time did what time does when the carriers outlive the carrier. Six more years of walking, a return to Lu, a death believed to be a failure, and two and a half thousand years of a book his students wrote down.", "Asked what he built, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["This is what the record says he did. One sentence to Zilu, the gentleman holds firm in hardship, and then the zither again. The sentence is in the Analects. The zither is in the Records.", "He did this too. The Records say he continued to recite, to teach and to sing throughout the siege, as if the soldiers were an inconvenience rather than an argument.", "He asked his students questions more often than he answered them. The Analects are mostly questions. A different first step in the same tent is still a first step."], "stepOverlapFree": "His first step was one sentence to Zilu and the zither picked up again. A different first step in the same tent is still a first step.", "help": {"zero": "You did not turn to Yan Hui on this journey. The teacher did, more than to anyone, and when Yan Hui died he said heaven had destroyed him. Next time, look at the one against the wheel. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You turned to Yan Hui {n} on this journey. The teacher called him the one student who never stopped listening, and mourned him past what his other students thought proper. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the refused work in your own life, as you named it: {ice}", "closing": "The road between Chen and Cai is not marked. The book is everywhere. What you carry off the road is not a following, and it is not the teacher. It is the evidence that on the seventh day you did the work of the first, for the people who were still in the tent.", "stickerLines": ["Walked with Confucius.", "Between Chen and Cai, the seventh day."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The zither\">\n<g transform=\"rotate(-10 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M50,236 C110,224 290,196 350,182 L354,230 C294,244 114,272 54,284 Z\" stroke-width=\"4\"/>\n  <path d=\"M64,246 C124,234 290,206 342,194 M68,254 C128,242 292,214 344,202 M72,262 C132,250 294,222 346,210 M76,270 C136,258 296,230 348,218 M60,238 C120,226 288,198 340,186\" stroke-width=\"1\"/>\n  <path d=\"M118,230 L124,268 M176,222 L182,260 M234,212 L240,250 M292,202 L298,240\" stroke-width=\"2.4\"/>\n  <circle cx=\"106\" cy=\"278\" r=\"2.4\" fill=\"#8e1b1b\" stroke=\"none\"/><circle cx=\"160\" cy=\"270\" r=\"2.4\" fill=\"#8e1b1b\" stroke=\"none\"/><circle cx=\"214\" cy=\"261\" r=\"2.4\" fill=\"#8e1b1b\" stroke=\"none\"/><circle cx=\"268\" cy=\"252\" r=\"2.4\" fill=\"#8e1b1b\" stroke=\"none\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
    '1':{text:A[1],red:true},'2':{text:A[2],red:true},'3':{text:A[3],red:true},'4':{text:A[4],red:true},'5':{text:A[5],red:true},
    overlap:{text:overlap}, choice:{text:c.short,red:true}, reply:{text:c.reply}, help:{text:help}, ice:{text:state.ice,red:true},
    '1b':{text:A['1b'],red:true},'2b':{text:A['2b'],red:true},'3b':{text:A['3b'],red:true},'4b':{text:A['4b'],red:true},'5b':{text:A['5b'],red:true}
  };
  try{ const key='unquit-ledger'; const cur=JSON.parse(localStorage.getItem(key)||'[]'); cur.push({slug:D.slug,title:D.title,object:D.sticker,lock:A[7]+(A['7b']?('  /  '+A['7b']):''),ice:state.ice||'',day:c.short,date:new Date().toISOString().slice(0,10)}); localStorage.setItem(key,JSON.stringify(cur)); }catch(e){}
  const wrap = el('div',{class:'story'});
  wrap.append(el('h1',{text:S.heading}), el('p',{class:'sub',text:S.sub}));
  S.paragraphs.forEach(t=>wrap.append(render(t,vars)));
  wrap.append(el('p',{class:'stepname',text:S.lockLabel}));
  wrap.append(el('div',{class:'lock you',text:A[7]}));
  if(D.two && A['7b']) wrap.append(el('div',{class:'lock you',style:'margin-top:-20px',text:A['7b']}));
  if(state.ice) wrap.append(render(S.iceLine,vars));
  wrap.append(el('p',{text:S.closing}));
  if(S.personalNote){ wrap.append(el('div',{class:'note'}, el('p',{class:'from',text:S.personalNote.from}), el('p',{text:S.personalNote.text}))); }
  const art = el('div',{html:D.stickerSvg||''}); const st = el('div',{class:'sticker'}, art, el('div',{class:'big',text:D.sticker}), el('div',{class:'small',html:S.stickerLines.join('<br>')}));
  wrap.append(st);
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:'Print or save',onclick:()=>window.print()}), el('button',{class:'link',text:'Walk it again',onclick:()=>{Object.assign(state,{answers:{},help:{},day:null,ice:'',stepMode:{}}); arrive();}}), el('a',{class:'link',href:'../ledger.html',text:'Your evidence',style:'font-size:17px'}), el('a',{class:'link',href:'../index.html',text:'All journeys',style:'font-size:17px'})));
  show(wrap);
}
arrive();
</script>
