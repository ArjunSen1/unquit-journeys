<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Arjun Sen, June 1, 2008</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>

  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. From Unquit Forever and Arjun Sen's own tellings. The marathon was a promise made from a hospital bed in New York. His daughter is unnamed here, consistent with the website rule.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "marathon", "title": "Arjun Sen, June 1, 2008", "subtitle": "A start line in Steamboat Springs. Four thirty in the morning. Sixty-five thousand five hundred steps.", "object": "The bib", "sticker": "The bib.", "footer": "From Unquit Forever and Arjun Sen's own tellings. The marathon was a promise made from a hospital bed in New York. His daughter is unnamed here, consistent with the website rule.", "arrive": {"heading": "You are standing where Arjun Sen stood.", "paragraphs": ["Years ago, on a hospital balcony in New York, a nurse asked him what he would do when they gave him his life back. He said he would run a race. She asked how far. He said five kilometers, and she laughed until she nearly choked and asked if his life was only worth five kilometers. He upgraded to a half marathon. She introduced him to the doctors that afternoon as a future half marathoner, and they closed his folder and looked at him.", "Since then: surgeries, a jaw rebuilt, twenty-two days without being able to drink water. Last night, over pasta, his fifteen-year-old daughter argued that nobody eats half a cookie or half a pizza, so why run half a marathon. Run the whole thing, she said, and if you reach mile 22.4, I will get you across the finish. He has never run more than 10.7 miles. He said yes, because when your child wants something that badly, you say yes. He changed his registration this morning.", "It is 4:30 a.m. His name is written on the front and back of his vest in large letters, because someone told him strangers will cheer you by name and he will need every stranger. He has just done the arithmetic. He takes about 2,500 steps a mile. Sixty-five thousand five hundred steps. A billboard in his mind says impossible, go back to bed.", "Now Arjun steps aside and you step in. The vest, the promise, the 10.7 miles and the number are his. The first step is yours."], "button": "Walk to the start line"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The music is loud. Runners are stretching around you. The number in your head has five digits and you keep re-checking it as if it might get smaller.", "question": "What are you feeling right now?", "placeholder": "Say it to the start line, not to the nurse who is not here.", "helper": {"who": "Nancy, in your head, the way she sounded on the balcony", "says": "\"Your life is only worth five kilometers?\" I am not there. I am in your head, and I am still asking.", "options": ["I feel that I promised a half and my daughter turned it into a whole, and I am about to find out which of them I believe in.", "I feel sixty-five thousand five hundred steps, and I feel the 10.7 miles I have actually run, and the gap between them is where I am standing.", "I feel that everyone here has a reason on their shirt, and mine is a nurse who is not here and a girl who will be at mile 22.4."]}, "helpLabel": "Hear Nancy."}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the gun, take an inventory. Not of the miles, and not of the man in the vest. Of yourself.", "question": "What have you already done, in your own life, that proves you can take one step when the whole distance is impossible?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Nancy, in your head", "says": "I can tell you what the man at this start line carries. He could not drink water for twenty-two days and promised his first glass would have a slice of lime in it, and it did. He was told fewer than a hundred days and has run out of ways to count the days since. He has never once been less than one step from the next step. Now you tell me what you carry. Finish one of these.", "options": ["A time I took one step when the whole distance was impossible: ", "A time I kept a promise made to someone who was no longer there to see it kept: ", "A time I said yes because someone I love wanted it that badly: "]}, "fillIn": true, "helpLabel": "Let her remind you."}, {"n": 3, "name": "The deferral", "prompt": "The sentence at the line is: sixty-five thousand five hundred, go back to bed. It sounds like arithmetic. It is fear doing multiplication. You do not have to decide whether you can run a marathon. You only have to refuse to let the total decide the first step.", "question": "What is the one reason you will not decide about the whole distance this morning?", "placeholder": "Not a race plan. One reason the number does not get the vote.", "helper": {"who": "Nancy", "says": "Nobody runs sixty-five thousand steps. People run one, and then the next. Tell me why you will not decide about the total.", "options": ["Because a marathon is not one decision. It is the same decision sixty-five thousand times, and only the next one is mine.", "Because the total is a fact about the course. It is not a fact about me. I have never met the total. I have only ever met the next step.", "Because there will be ninety-nine reasons not to take the next step, and I have locked onto the one that makes me smile, and she is at mile 22.4."]}, "helpLabel": "Let her finish."}, {"n": 4, "name": "One step", "prompt": "The gun has gone. The crowd is surging. Not the race. Not mile 22.4. One step, small enough to take right now.", "question": "What is it?", "placeholder": "Something you can do with your feet in the next ten seconds.", "helper": {"who": "Nancy", "says": "You made me a promise on a balcony. Do not run the race. Take the step. Which one?", "options": ["I will let the crowd pass and start on my own terms, at the back, and touch the road with my hand before I cross the line.", "I will take one step, and then decide about the next one when I get there.", "I will say her name and Trey's name out loud, and then go."]}, "helpLabel": "Ask her."}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The road has been touched, or the first step taken, or two names said into the morning. The distance is exactly what it was. Sixty-five thousand four hundred and ninety-nine.", "question": "What has changed in you?", "placeholder": "Compare it to the arithmetic.", "helper": {"who": "Nancy", "says": "The course did not get shorter. What changed?", "options": ["I am in the race. Yesterday I was a man who might run one. That is the whole difference.", "The number is the same. I have stopped carrying it. I am carrying the next step, and it is light.", "I am running toward a girl at mile 22.4, not away from a hospital bed. It is the same road and a different direction."]}, "helpLabel": "Tell her."}, {"n": 6, "name": "Time passes", "montage": ["Strangers cheer his name from the vest. A little girl named Emily reads it off him and shouts you can do it, and he sees his daughter in her. At about mile 18 his body is finished and a police officer orders him off the course. He tells her that for every day since the diagnosis he has seen this race end only two ways, finishing or an ambulance, nothing in between. She asks if he is really that stubborn, then drives ahead of him as an escort and tells him to bang on the car if he feels anything. Finished runners come back for him. Fifteen or twenty strangers form what he calls a human bubble and carry him four miles at a pace he has never run.", "At mile 22.4 his daughter is waiting with a backpack. She sits him on the curb, takes off his shoes and socks, checks his feet for blisters, puts on fresh socks, gives him a snack. When he says he is done, she tells him that in his entire life he has never been, and will never be, less than four miles from the finish of a marathon. Then she pulls him up and lies to him that the finish is just past the next turn.", "He crosses the line on his knees, in tears, in a little over six hours. The winner finished in two. Twenty strangers stayed for him. His daughter tells him to go and thank them."], "question": "Twenty-six point two miles. Here is the question the finish line cannot answer for you: who ran the marathon?", "choices": [{"label": "He did. It is his time on the sheet.", "short": "he did, it is his time on the sheet", "reply": "It is his name on the sheet and his knees on the line, and he would correct you before you finished the sentence. He says he was the baton, not the runner."}, {"label": "A nurse on a balcony, years before.", "short": "a nurse on a balcony", "reply": "She started it, with a laugh about five kilometers. She was not there at the end. Promises made to people who are not there to see them kept are the heaviest and the most carried."}, {"label": "A police officer, twenty strangers, and a fifteen-year-old with a backpack.", "short": "a police officer, twenty strangers, and a fifteen-year-old", "reply": "Yes. The Sherpa principle made literal. A man who could not take another step at mile 18 was carried four miles by people whose names he never learned, and pulled the last four by a girl who lied about where the finish was. No one runs the whole race. You run your leg, and the rest of the distance is other people. He calls himself the baton, and he means it."}, {"label": "Nobody ran it. He walked, crawled and was carried.", "short": "nobody ran it", "reply": "And crossed the line, which is what a marathon is. The pace does not appear on the medal. Neither does the crawling. The line does."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another start line with an impossible number on it. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Nancy", "says": "One line for the next impossible number. Start with I did.", "options": ["I did take one step and let the total take care of itself.", "I did lock onto the one reason that made me smile and let the ninety-nine go.", "I did let strangers carry me when my legs were done."]}, "helpLabel": "One more from Nancy.", "ice": {"question": "One more line, and this one is yours. What is the sixty-five-thousand-step number in your own life right now, and what is the next step?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, at the start line", "sub": "Your first step, beside his", "paragraphs": ["Steamboat Springs, June 1, 2008, half past four in the morning. You stood where Arjun Sen stood, with a name on your vest and a five-digit number in your head, and the line asked you what it asked him. You wrote: {1}", "Before the gun, you did what every unquitter does first. You looked for evidence, and it was your own: {2} His was a glass of water with a slice of lime after twenty-two days, and a promise made on a balcony to someone who was no longer there.", "You refused to let the total decide the first step. Your reason: {3} That refusal is the deferral. Not the whole distance. Only the next step.", "Your first step: {4} {overlap}", "After the step, the distance was exactly one step shorter. Inside, you noticed this: {5}", "Then the road did what roads do to a man who keeps taking the next step. Strangers who knew his name from the vest, a police officer who became an escort, a human bubble, a curb at mile 22.4, fresh socks, a lie about the next turn, and a finish line on his knees.", "Asked who ran the marathon, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this. He let the crowd go, walked to the line alone, bent down and touched the road, and asked Nancy and Trey to guide him home.", "He did this too. The whole race was one step and then the decision about the next one. He said it was the only way to run sixty-five thousand of them.", "He did this. He said their names at the line. A different first step in the same place is still a first step."], "stepOverlapFree": "His first step was to let everyone pass, touch the road and say two names. A different first step in the same place is still a first step.", "help": {"zero": "You did not let Nancy into your head. He did, at the start line and every mile after. The whole race was a promise to her. Next time, let the one who is not there speak. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You let Nancy into your head {n} on this journey. He ran every mile with her voice in it. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the impossible number in your own life, as you named it: {ice}", "closing": "The course is run every year by people with their own reasons on their shirts. What you carry off it is not a medal, and it is not Arjun. It is the evidence that with an impossible number in your head you took one step, and then the next.", "stickerLines": ["Walked with Arjun Sen.", "Steamboat Springs, June 1, 2008."], "personalNote": {"from": "A note from Arjun", "text": "This one is mine. I was the man doing arithmetic at the start line, and I lost the argument with the number and started anyway. What I learned by mile 18 is that I never ran it. A nurse started it, a police officer refused to let me stop, twenty strangers carried me, and a fifteen-year-old lied to me about where the finish was. I was the baton. You just carried me one more leg. Thank you for showing me again that there is always a way, and that it is almost never mine alone. I wish I had had you in my Unquit Circle at mile 18. Now, in a way, I do."}}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The bib\">\n<g transform=\"rotate(-4 200 200)\" fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M110,110 L290,110 L290,300 L110,300 Z\" stroke-width=\"4\"/>\n  <text x=\"200\" y=\"232\" text-anchor=\"middle\" font-family=\"Calibri, Carlito, Arial, sans-serif\" font-weight=\"700\" font-size=\"74\" fill=\"#8e1b1b\" stroke=\"none\">786</text>\n  <path d=\"M130,136 L166,136 M234,136 L270,136 M130,276 L270,276\" stroke-width=\"2\"/>\n  <circle cx=\"122\" cy=\"122\" r=\"3\" fill=\"#8e1b1b\" stroke=\"none\"/><circle cx=\"278\" cy=\"122\" r=\"3\" fill=\"#8e1b1b\" stroke=\"none\"/><circle cx=\"122\" cy=\"288\" r=\"3\" fill=\"#8e1b1b\" stroke=\"none\"/><circle cx=\"278\" cy=\"288\" r=\"3\" fill=\"#8e1b1b\" stroke=\"none\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
  const words = ['','once','twice','three times','four times','five times','six times'];
  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
    '1':{text:A[1],red:true},'2':{text:A[2],red:true},'3':{text:A[3],red:true},'4':{text:A[4],red:true},'5':{text:A[5],red:true},
    overlap:{text:overlap}, choice:{text:c.short,red:true}, reply:{text:c.reply}, help:{text:help}, ice:{text:state.ice,red:true},
    '1b':{text:A['1b'],red:true},'2b':{text:A['2b'],red:true},'3b':{text:A['3b'],red:true},'4b':{text:A['4b'],red:true},'5b':{text:A['5b'],red:true}
  };
  try{ const key='unquit-ledger'; const cur=JSON.parse(localStorage.getItem(key)||'[]'); cur.push({slug:D.slug,title:D.title,object:D.sticker,lock:A[7]+(A['7b']?('  /  '+A['7b']):''),ice:state.ice||'',day:c.short,date:new Date().toISOString().slice(0,10)}); localStorage.setItem(key,JSON.stringify(cur)); }catch(e){}
  const wrap = el('div',{class:'story'});
  wrap.append(el('h1',{text:S.heading}), el('p',{class:'sub',text:S.sub}));
  S.paragraphs.forEach(t=>wrap.append(render(t,vars)));
  wrap.append(el('p',{class:'stepname',text:S.lockLabel}));
  wrap.append(el('div',{class:'lock you',text:A[7]}));
  if(D.two && A['7b']) wrap.append(el('div',{class:'lock you',style:'margin-top:-20px',text:A['7b']}));
  if(state.ice) wrap.append(render(S.iceLine,vars));
  wrap.append(el('p',{text:S.closing}));
  if(S.personalNote){ wrap.append(el('div',{class:'note'}, el('p',{class:'from',text:S.personalNote.from}), el('p',{text:S.personalNote.text}))); }
  const art = el('div',{html:D.stickerSvg||''}); const st = el('div',{class:'sticker'}, art, el('div',{class:'big',text:D.sticker}), el('div',{class:'small',html:S.stickerLines.join('<br>')}));
  wrap.append(st);
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:'Print or save',onclick:()=>window.print()}), el('button',{class:'link',text:'Walk it again',onclick:()=>{Object.assign(state,{answers:{},help:{},day:null,ice:'',stepMode:{}}); arrive();}}), el('a',{class:'link',href:'../ledger.html',text:'Your evidence',style:'font-size:17px'}), el('a',{class:'link',href:'../index.html',text:'All journeys',style:'font-size:17px'})));
  show(wrap);
}
arrive();
</script>
