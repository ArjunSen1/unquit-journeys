<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Job on the ash heap</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>
<body>
<header><b><a href="../index.html" style="color:inherit;text-decoration:none">UNQUIT<span>®</span> JOURNEYS</a></b><span id="progress"></span></header>
<main>
  <section class="screen" id="screen"></section>
  <aside id="aside"></aside>
</main>
<footer>Unquit Journeys. Prototype. Drawn from the Book of Job, paraphrased, and from Unquit: The Oldest Choice. This is the only journey in the series in which no one comes when you ask for help. That is the design.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "job", "title": "Job on the ash heap", "subtitle": "Outside the town. After the seventh day of silence.", "object": "The shard", "sticker": "The shard.", "footer": "Drawn from the Book of Job, paraphrased, and from Unquit: The Oldest Choice. This is the only journey in the series in which no one comes when you ask for help. That is the design.", "arrive": {"heading": "You are standing where Job sat.", "paragraphs": ["He had everything, and the story is careful to say he had done nothing wrong. Then, in a single day, messengers arrived one after another. The herds taken. The servants killed. The house fallen on his children. Then his own body broke out in sores from head to foot, and he went to sit on the ash heap outside the town, scraping himself with a piece of broken pottery.", "Three friends came. For seven days they sat with him in silence, which was the best thing they did. Then they spoke, and every word they said was an explanation. He must have sinned. He must repent. The universe is fair, therefore this is deserved. He answered them, and the answering went on for chapters, and none of it helped, because he knew the explanations were false and he would not say they were true to make the pain make sense.", "His wife has told him to curse and die. He has not. He has said the one sentence the story turns on: though I am slain, yet will I hope. He has not said why. He does not know why.", "Now Job steps aside and you step in. The ash, the shard, the silence and the friends who mean well and make it worse are his. Whether you continue without an explanation is yours."], "button": "Sit down on the ash"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The ash is warm from the sun. The shard is in your hand. The three friends have gone quiet again, which is a mercy. The town is behind you and it does not come out.", "question": "What are you feeling right now?", "placeholder": "Say it without making it make sense.", "helpLabel": "Ask for help.", "helper": {"who": "No one comes.", "says": "The box opened onto silence. The friends said the wrong things. The town stays behind its wall. There is no one at this door but you. Here are three sentences a person alone on the ash might say to himself.", "options": ["I feel that everything has been taken and I have been given three men explaining why I deserved it, and the explanations hurt more than the loss.", "I feel that I would rather sit here without a reason than accept a false one.", "I feel that I am still here, and I do not know why that is, and the not knowing is the only honest thing left."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before anyone speaks again, take an inventory. Not of what was lost, and not of Job. Of yourself.", "question": "What have you already done, in your own life, that proves you can continue without being told why?", "placeholder": "One thing you did. Not one thing you believe.", "fillIn": true, "helpLabel": "Ask again.", "helper": {"who": "Still no one.", "says": "There is no helper on the ash heap. There is only what you have already done. The story says only this about Job: he was upright, and when everything was taken he tore his robe and fell to the ground and did not curse. Now you tell yourself what you carry. Finish one of these.", "options": ["A time I continued without being told why: ", "A time I refused a false explanation because a true one was not available: ", "A time I sat with someone in silence when there was nothing to say: "]}}, {"n": 3, "name": "The deferral", "prompt": "The sentence on the ash is: this must mean something, so tell me what it means or I stop. It sounds like a demand for justice. It is pain demanding a story. You do not have to understand why tonight. You only have to refuse to let the absence of a reason become a reason to stop.", "question": "What is the one reason you will not decide tonight?", "placeholder": "Not an explanation. One reason the silence does not get the vote.", "helpLabel": "Listen for anyone.", "helper": {"who": "The silence.", "says": "Nothing answers. The friends are asleep. The wind moves the ash. Here are three reasons a person might give the silence.", "options": ["Because an explanation that fits would have to be false, and I have refused false things all my life. I will not start now.", "Because the friends have a reason and they are miserable with it. I have none and I am still sitting up.", "Because I said yet will I hope, and I do not know why I said it, and I want to find out what I meant."]}}, {"n": 4, "name": "One step", "prompt": "Morning. The friends will wake and start again. Not an answer. Not a restoration. One step, small enough to take on an ash heap with a shard in your hand.", "question": "What is it?", "placeholder": "Something a person can do alone, without a reason.", "helpLabel": "Ask once more.", "helper": {"who": "No one. But the morning has come, which is something.", "says": "No one will tell you what to do here. Here are three things a person on the ash has done.", "options": ["I will say out loud what happened, all of it, in order, without adding what it means. Naming it is not explaining it.", "I will stop answering the friends. Their explanations are theirs. I will keep my question.", "I will wash the ash from my hands and eat something. The body did not do anything wrong either."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. The losses are named without a moral, or the friends are talking to each other now, or you have eaten. Nothing has been returned. Nothing has been explained.", "question": "What has changed in you?", "placeholder": "Compare it to the shard in your hand.", "helpLabel": "Anyone?", "helper": {"who": "Still the silence. But you are answering it now.", "says": "Nothing outside has changed. Here are three things that might have changed inside.", "options": ["The pain is the same. It has stopped demanding a story.", "I gave up the explanation and kept the question. I am lighter by one lie.", "I am still here without knowing why. It turns out that is a place a person can sit."]}}, {"n": 6, "name": "Time passes", "montage": ["In the end, a voice speaks out of a storm. It does not explain. It asks questions: where were you when the foundations were laid, who shut the sea behind doors, out of whose womb came the ice. Forty chapters of Job's questions are answered with more questions, larger ones, and no reason for the losses is ever given.", "Job says: I had heard of you, and now I have seen. He is not told why. He is answered anyway. The story gives him back herds and children and years, and the book is honest enough to know that this is not the same as giving back what was taken.", "The friends who explained everything are rebuked. The man who refused to explain is the one who is spoken to."], "question": "He was never told why. Here is the question the storm did not answer either: what did Job get at the end?", "choices": [{"label": "His wealth and his family back.", "short": "his wealth and his family back", "reply": "The story gives him new herds and new children, and does not pretend they are the old ones. Whoever wrote the ending knew that restoration is not return."}, {"label": "An explanation.", "short": "an explanation", "reply": "He did not. Forty chapters of asking why, and the answer is a list of questions about the sea and the stars and the ice. The book refuses to give what the friends gave so easily. That refusal is the book."}, {"label": "A presence, without an explanation.", "short": "a presence, without an explanation", "reply": "Yes. He was not told why. He was answered. Those are different things, and most of human suffering lives in the gap between them. Continuation without explanation is the hardest and most honest shape Unquit takes, because you keep going not because it makes sense but because the false sense on offer costs more than the silence. Job would not pay. And then the silence spoke."}, {"label": "Nothing. The book is about loss.", "short": "nothing, the book is about loss", "reply": "It is about loss, and it is also about the one thing loss could not take, which was his refusal to lie about it. That is not nothing. It is the only possession the story shows him keeping from the first chapter to the last."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another ash heap, and other friends with explanations. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helpLabel": "One last time.", "helper": {"who": "No one. You write this one alone, as he did.", "says": "There is no one to carry the line. Carry it yourself. Start with I did.", "options": ["I did not accept a false reason to make the pain make sense.", "I did keep the question and let go of the explanation.", "I did stay on the ash without knowing why, and I was still here in the morning."]}, "ice": {"question": "One more line, and this one is yours. Where in your own life are you being handed an explanation that does not fit?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, on the ash heap", "sub": "Your silence, beside his", "paragraphs": ["Outside the town, after the seventh day of silence. You sat where Job sat, with a shard in your hand and three friends full of reasons, and the ash asked you what it asked him. You wrote: {1}", "Before anyone spoke again, you did what every unquitter does first. You looked for evidence, and it had to be your own, because no one came to offer any: {2} His was a life the story calls upright, and a robe torn without a curse.", "You refused to let the absence of a reason become a reason to stop. Your reason: {3} That refusal is the deferral. Not tonight. Not because it does not make sense.", "Your first step: {4} {overlap}", "After the step, nothing had been returned and nothing explained. Inside, you noticed this: {5}", "Then the storm did what storms do in that book. It spoke, and it did not explain, and a man who had refused every false answer was given a true one that was not an answer at all.", "Asked what Job got at the end, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["He did this, for chapters. He named every loss and refused every moral the friends attached to it.", "He did this too. By the end he is no longer answering the friends. He is addressing someone else.", "The story does not say. It says he sat, and it says he was still there. A different first step on the same ash is still a first step."], "stepOverlapFree": "His first step was to name what happened and refuse what it was said to mean. A different first step on the same ash is still a first step.", "help": {"zero": "You did not ask for help on this journey, and it would not have mattered. No one comes to the ash heap. That is why this journey exists: to show that continuing is sometimes done alone, without a reason, and that it is still continuing. Everywhere else in this series, ask. Here, you already know what the silence says.", "some": "You asked for help {n} on this journey, and no one came, and you kept going anyway. That is the whole of what Job did. Everywhere else in this series the door opens. Here it did not, and you continued. Remember that on the days when it does not."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the explanation that does not fit in your own life, as you named it: {ice}", "closing": "The ash heap has no plaque and no address. What you carry away from it is not a restoration, and it is not Job. It is the evidence that you can sit without a reason, refuse a false one, and still be there in the morning.", "stickerLines": ["Walked with Job.", "Outside the town, after the seventh day."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The shard\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n\n  <path d=\"M120,160 L200,110 L292,150 L260,250 L170,272 L130,220 Z\" stroke-width=\"4\"/>\n  <path d=\"M136,162 C176,180 226,176 280,154\" stroke-width=\"1.6\"/>\n  <path d=\"M150,210 C190,224 240,220 264,204\" stroke-width=\"1.6\"/>\n  <path d=\"M60,310 C100,296 300,296 340,310\" stroke-width=\"2\" stroke-dasharray=\"2 6\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];
  const n = Object.keys(state.help).length;
