<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unquit Journeys. Camille Broussard, love as infrastructure</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6b6b6b; --red:#8e1b1b; --rule:#e6e6e6;
    --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px 0;font-size:15px;color:var(--muted)}
  header b{color:var(--ink);font-weight:600;letter-spacing:.01em}
  header b span{color:var(--red)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,640px) minmax(0,320px);gap:56px;padding:72px 40px 96px;max-width:1120px;width:100%;margin:0 auto;align-items:start}
  @media (max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:32px;padding:48px 24px 72px}header{padding:20px 24px 0}}
  .screen{opacity:1}
  @media (prefers-reduced-motion:no-preference){.screen.enter{animation:fade .35s ease-out}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:44px;line-height:1.1;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--red);font-size:19px;margin:0 0 40px}
  p{margin:0 0 20px;max-width:34em}
  .prompt{margin-bottom:24px}
  .question{font-size:26px;line-height:1.3;font-weight:600;margin:0 0 28px;letter-spacing:-.005em}
  .stepname{font-size:15px;color:var(--muted);margin:0 0 20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:12px 0;font:inherit;font-size:20px;line-height:1.5;color:var(--ink);background:transparent;outline:none}
  textarea::placeholder{color:#9a9a9a}
  textarea:focus{border-bottom:2px solid var(--red)}
  .actions{display:flex;gap:16px;align-items:center;margin-top:36px;flex-wrap:wrap}
  button{font:inherit;font-size:17px;cursor:pointer;border-radius:0}
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 28px}
  .btn:disabled{background:#bdbdbd;border-color:#bdbdbd;cursor:default}
  .btn:focus-visible,.link:focus-visible,.opt:focus-visible,.choice:focus-visible,.help-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .link{background:none;border:0;color:var(--muted);padding:12px 0;text-decoration:underline;text-underline-offset:4px}
  aside{padding-top:2px}
  .help-btn{width:100%;text-align:left;background:none;border:1px solid var(--ink);padding:16px 18px;font-size:17px}
  .help-btn:hover{border-color:var(--red);color:var(--red)}
  .helper{border-left:2px solid var(--red);padding:4px 0 4px 18px}
  .helper .who{font-size:15px;color:var(--muted);margin:0 0 6px}
  .helper .says{font-size:19px;margin:0 0 22px}
  .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 0;font-size:17px;line-height:1.45;color:var(--ink)}
  .opt:last-child{border-bottom:1px solid var(--rule)}
  .opt:hover{color:var(--red)}
  .hint{font-size:15px;color:var(--muted);margin-top:14px}
  .montage p{margin-bottom:22px}
  .choices{margin-top:8px}
  .choice{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:16px 0;font-size:19px;color:var(--ink)}
  .choice:last-of-type{border-bottom:1px solid var(--rule)}
  .choice:hover{color:var(--red)}
  .choice.picked{color:var(--red);font-weight:600}
  .choice[disabled]{cursor:default;color:var(--muted)}
  .choice.picked[disabled]{color:var(--red)}
  .reply{margin-top:28px;padding-top:20px;border-top:1px solid var(--ink);max-width:34em}
  .story p{max-width:36em}
  .story .you{color:var(--red)}
  .story .lock{font-size:24px;line-height:1.35;font-weight:600;margin:36px 0;padding:24px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);max-width:30em}
  .note{border-left:2px solid var(--red);padding:6px 0 6px 20px;margin:36px 0 32px;max-width:34em}
  .note .from{font-size:15px;color:var(--muted);margin:0 0 8px}
  .note p{margin:0}
  .sticker{width:300px;border:3px solid var(--red);display:flex;flex-direction:column;padding:22px 26px 26px;margin:8px 0 0}
  .sticker svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .sticker .big{font-size:26px;line-height:1.2;font-weight:600;color:var(--red)}
  .sticker .small{font-size:14px;color:var(--muted);margin-top:18px;line-height:1.4}
  .ice-block{margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
  .ice-block .question{font-size:21px}
  footer{padding:0 40px 28px;font-size:14px;color:var(--muted)}
  @media (max-width:900px){footer{padding:0 24px 24px}}
  @media print{header,aside,.actions,footer,.noprint{display:none !important}main{display:block;padding:0}body{font-size:12pt}.sticker{break-inside:avoid}}
</style>
</head>

<footer>Unquit Journeys. Prototype. Camille Broussard is a composite from Chapter Ten of The Unquit Stories. Her uncle is from the chapter's opening; the rest of the helper's lines are drawn from the chapter's argument.</footer>
<script>
const D = {"series": "Unquit Journeys", "slug": "camille", "title": "Camille Broussard, love as infrastructure", "subtitle": "An apartment in Treme, New Orleans. A January morning. The sound is muffled.", "object": "The trumpet", "sticker": "The trumpet.", "footer": "Camille Broussard is a composite from Chapter Ten of The Unquit Stories. Her uncle is from the chapter's opening; the rest of the helper's lines are drawn from the chapter's argument.", "arrive": {"heading": "You are standing where Camille Broussard stood.", "paragraphs": ["She has played the trumpet since she was seven, when her uncle brought one to the house in Treme and showed her that it could make something that felt like emotional weather. She was the child who did not need to be told to practice. She played through school and college and into the years when New Orleans rewarded exactly her combination of technique and feeling. Clubs, festivals, weddings, funerals. She is twenty-eight and working on her second album.", "This morning she woke and the sound in the room was muffled. She thought it was a cold. She took medication and rested two days. It deepened. Her doctor sent her to a specialist, and the specialist sent her to two more, and the diagnosis is sudden sensorineural hearing loss. Rare. Poorly understood. The hair cells in the cochlea are damaged, and no one can promise they will recover.", "The trumpet is on its stand by the window. She has not picked it up in nine days, because she is afraid of what she will not hear.", "Now Camille steps aside and you step in. The trumpet, the muffled room, the second album and the diagnosis are hers. What holds you up when the thing you were built on goes quiet is yours."], "button": "Sit down by the window"}, "steps": [{"n": 1, "name": "What you feel", "prompt": "The room sounds like it is underwater. Outside, a brass band is passing three streets away, and you know that because you know the route, not because you can hear it properly. The trumpet has dust on the bell.", "question": "What are you feeling right now?", "placeholder": "Say it in the register you play in, not the one you talk in.", "helper": {"who": "Your uncle, who brought the trumpet to the house twenty-one years ago, on the phone", "says": "I gave you that horn. I am not calling to tell you it will be fine. I am calling to hear what you feel. Say it.", "options": ["I feel that the one sense my whole life was built on is going quiet, and I do not know what a musician is without it.", "I feel that I have not touched the horn in nine days because I am afraid of the first note, and I have never been afraid of a first note in my life.", "I feel twenty-one years of practice in my hands and a diagnosis in my ears and they are not speaking to each other."]}}, {"n": 2, "name": "The evidence you already carry", "prompt": "Before the horn is picked up, take an inventory. Not of the cochlea, and not of Camille. Of yourself.", "question": "What have you already done, in your own life, that proves you can be held up by other people when you cannot hold yourself?", "placeholder": "One thing you did. Not one thing you believe.", "helper": {"who": "Your uncle", "says": "I can tell you what my niece carries. Twenty-one years of playing without being told to. Every funeral and wedding in this neighborhood that needed a horn. An ear so good she has been hearing the band three streets away by the route alone. And a family that has never once let her practice in an empty house. Now you tell me what you carry. Finish one of these.", "options": ["A time I was held up by other people when I could not hold myself: ", "A time I kept a practice going through a thing that should have ended it: ", "A time I knew something by its route when I could not perceive it directly: "]}, "fillIn": true}, {"n": 3, "name": "The deferral", "prompt": "The sentence in the apartment is: without the ear there is no musician. It sounds like anatomy. It is nine days of fear drawing anatomical conclusions. You do not have to decide what you are without your hearing. You only have to refuse to let nine days of not touching the horn decide twenty-one years.", "question": "What is the one reason you will not decide this week?", "placeholder": "Not a medical plan. One reason the diagnosis does not get the vote.", "helper": {"who": "Your uncle", "says": "Three specialists said poorly understood. Poorly understood is not a sentence. Tell me why you will wait.", "options": ["Because the ear is the instrument I hear with and not the one I play with, and I have not yet found out how much of the playing was the hands.", "Because no one has told me it will not come back. They have told me they do not know. I do not know either, which means I am not entitled to decide.", "Because the band went past three streets away and I knew where it was. Something in me still knows this music by heart. I want to find out how much."]}}, {"n": 4, "name": "One step", "prompt": "Not the second album. Not a career decision. One step, small enough to finish before the light changes in the window.", "question": "What is it?", "placeholder": "Something you can do with a horn and a dusty bell.", "helper": {"who": "Your uncle", "says": "You do not have to play a song. What is the smallest thing you can do with the horn today?", "options": ["I will pick it up, wipe the bell, and play one long tone with my eyes closed, and pay attention to what my lips and lungs know, whatever my ears do.", "I will call two people from the band and ask them to come and play with me on Saturday, so that the first notes are not in an empty room.", "I will put my hand on the wall while the next band passes and find out what the body hears that the ears do not."]}}, {"n": 5, "name": "What you feel now", "prompt": "It is done. One long tone has been played into a muffled room, or Saturday has two people in it, or your hand has felt a band through a wall. The diagnosis is the same. The room is still underwater.", "question": "What has changed in you?", "placeholder": "Compare it to nine days of dust on the bell.", "helper": {"who": "Your uncle", "says": "The ear did not change this morning. What did?", "options": ["The tone was muffled. My lips knew exactly where it was. Twenty-one years are not stored in the cochlea.", "Saturday has two people in it. I did not know how much of my playing was other people until I had to ask them to come.", "I felt the band through the wall. The music is coming in by a different door. I do not know yet what I can do with that. I know the door exists."]}}, {"n": 6, "name": "Time passes", "montage": ["The hearing does not fully return. The chapter is honest about that. What returns is something else: the people. The bandmates who come on Saturday and keep coming. The uncle who does not promise it will be fine and calls anyway. A family that had never let her practice in an empty house and does not start now.", "She learns to play with what she has, which is more than the ear. Vibration through the floor, the feel of the horn against her face, twenty-one years in her hands and lungs. She finishes the second album differently than she began it. It is not the album she planned. It is the one she could make.", "The chapter's argument is in its title. Other people's belief is not optional support. It is load-bearing. She did not carry herself through the year the sound went quiet. She was carried, and she let herself be, and that letting was the whole of the work."], "question": "The sound went quiet and did not fully come back. Here is the question the diagnosis cannot answer for you: what held her up?", "choices": [{"label": "Her talent.", "short": "her talent", "reply": "Twenty-one years of it, and it mattered, and it was in her hands and lungs and not only in her ear. But talent does not come to the apartment on Saturday. People do."}, {"label": "Medicine.", "short": "medicine", "reply": "Three specialists and a diagnosis that ended in the words poorly understood. Medicine was honest with her. It did not hold her up."}, {"label": "Other people. Load-bearing, not optional.", "short": "other people, load-bearing, not optional", "reply": "Yes. We speak of support as if it were a cushion. The chapter calls it infrastructure, and means it: the daily, unglamorous presence of people who do not rescue you and do not leave, and without whom the structure does not stand. She did not carry herself through that year. She was carried, and she let herself be, and the letting was the work."}, {"label": "Nothing. She adapted alone.", "short": "nothing, she adapted alone", "reply": "She adapted. Alone is the word the chapter exists to argue with. The bandmates on Saturday were the adaptation."}]}, {"n": 7, "name": "Lock it in", "prompt": "There will be another January morning when the thing you were built on goes quiet. Write one sentence for it. Not advice. Evidence.", "question": "Begin with the words I did.", "placeholder": "I did...", "helper": {"who": "Your uncle", "says": "One line for the next muffled room. Start with I did.", "options": ["I did let myself be held up by the people who came.", "I did pick up the horn before I knew what I would hear.", "I did find the music coming in by a different door."]}, "ice": {"question": "One more line, and this one is yours. What in your own life is going quiet, and who is load-bearing?", "placeholder": "Optional. It stays with you.", "skip": "Skip this"}}], "story": {"heading": "You, by the window", "sub": "Your January, beside hers", "paragraphs": ["Treme, a January morning, the room underwater. You sat where Camille Broussard sat, with dust on the bell of a horn you had not touched in nine days, and the morning asked you what it asked her. You wrote: {1}", "Before the horn was picked up, you did what every unquitter does first. You looked for evidence, and it was your own: {2} Hers was twenty-one years of playing without being told, and a family that never let her practice in an empty house.", "You refused to let nine days of fear decide twenty-one years. Your reason: {3} That refusal is the deferral. Not this week. Not from a diagnosis that ended in poorly understood.", "Your first step: {4} {overlap}", "After the step, the room was still underwater. Inside, you noticed this: {5}", "Then a year did what a year does when people keep coming on Saturdays. A different second album, a band felt through a floor, and a woman who let herself be carried.", "Asked what held her up, you chose {choice}. {reply}", "{help}"], "stepOverlap": ["She did this, eventually. The first tone into a muffled room is the chapter's turning point, though it does not say which day.", "This is the chapter's whole argument, made into an action. The people came. They kept coming. A different first step in the same place is still a first step.", "She learned to play by vibration and feel. Whether it began with a hand on a wall, the chapter does not say. A different first step in the same place is still a first step."], "stepOverlapFree": "Her first step was to let people into the room before she played. A different first step in the same place is still a first step.", "help": {"zero": "You did not pick up for your uncle. Camille did, and he was the first of many, and the chapter is about the many. Next time, pick up. Asking is not the opposite of continuing. It is how continuing is done.", "some": "You picked up for your uncle {n} on this journey. He gave her the horn at seven and called her at twenty-eight, and the chapter says people like him are not support. They are infrastructure. Asking is not the opposite of continuing. It is how continuing is done."}, "lockLabel": "The evidence you are taking with you", "iceLine": "And the thing going quiet in your own life, as you named it: {ice}", "closing": "The trumpet is on its stand and the bell is clean. What you carry out of the apartment is not your hearing, and it is not Camille. It is the evidence that when the thing you were built on went quiet, you let the people who came hold the weight.", "stickerLines": ["Walked with Camille Broussard.", "Treme, a January morning."]}, "stickerSvg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"The trumpet\">\n<g fill=\"none\" stroke=\"#8e1b1b\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M70,200 L230,200\" stroke-width=\"4\"/><path d=\"M230,200 C260,200 300,170 330,150 L330,250 C300,230 260,200 230,200\" stroke-width=\"4\"/><path d=\"M110,186 L110,214 M130,186 L130,214 M150,186 L150,214\" stroke-width=\"3\"/><path d=\"M110,186 L110,170 M130,186 L130,170 M150,186 L150,170\" stroke-width=\"2.4\"/><path d=\"M100,200 C100,236 170,236 170,200\" stroke-width=\"2.4\"/><path d=\"M70,200 C60,200 56,194 62,190 M70,200 C60,200 56,206 62,210\" stroke-width=\"2.4\"/>\n</g></svg>"};
const state = {answers:{}, help:{}, day:null, ice:'', idx:-1, stepMode:{}};
const screen = document.getElementById('screen');
const aside = document.getElementById('aside');
const progress = document.getElementById('progress');

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function show(node, sideNode){
  screen.classList.remove('enter'); void screen.offsetWidth;
  screen.replaceChildren(node); aside.replaceChildren(); if(sideNode) aside.append(sideNode);
  screen.classList.add('enter'); window.scrollTo({top:0,behavior:'auto'});
}

function arrive(){
  progress.textContent = 'Before the game begins';
  const a = D.arrive;
  const wrap = el('div');
  wrap.append(el('h1',{text:a.heading}), el('p',{class:'sub',text:D.subtitle}));
  a.paragraphs.forEach(t=>wrap.append(el('p',{text:t})));
  wrap.append(el('div',{class:'actions'}, el('button',{class:'btn',text:a.button,onclick:()=>step(0)})));
  show(wrap);
}

function step(i){
  const s = D.steps[i];
  progress.textContent = 'Step '+s.n+' of 7';
  if(s.n===6) return timePasses(i);
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  wrap.append(el('p',{class:'prompt',text:s.prompt}));
  wrap.append(el('p',{class:'question',text:s.question}));
  if(D.two) wrap.append(el('p',{class:'stepname',text:D.two.a}));
  const ta = el('textarea',{placeholder:s.placeholder,'aria-label':s.question});
  ta.value = state.answers[s.n]||'';
  wrap.append(ta);
  let tb=null;
  if(D.two){ wrap.append(el('p',{class:'stepname',style:'margin-top:28px',text:D.two.b})); tb = el('textarea',{placeholder:s.placeholder,'aria-label':s.question+' ('+D.two.b+')'}); tb.value = state.answers[s.n+'b']||''; wrap.append(tb); }
  let iceTa=null;
  if(s.ice){
    const ib = el('div',{class:'ice-block'});
    ib.append(el('p',{class:'question',text:s.ice.question}));
    iceTa = el('textarea',{placeholder:s.ice.placeholder,'aria-label':s.ice.question,style:'min-height:80px'});
    iceTa.value = state.ice||'';
    ib.append(iceTa);
    wrap.append(ib);
  }
  const cont = el('button',{class:'btn',text: s.n===7 ? 'See your journey' : 'Continue', disabled:'true', onclick:()=>{
    state.answers[s.n]=ta.value.trim();
    if(tb) state.answers[s.n+'b']=tb.value.trim();
    if(iceTa) state.ice=iceTa.value.trim();
    if(i+1<D.steps.length) step(i+1); else story();
  }});
  const opts = s.helper.options || [].concat(s.helper.optionsA||[], s.helper.optionsB||[]);
  const check=()=>{ const v=ta.value.trim(); const bare = s.fillIn && opts.some(o=>o.trim()===v); let ok = v.length>2 && !bare; if(tb){ const w=tb.value.trim(); ok = ok && w.length>2 && !(s.fillIn && opts.some(o=>o.trim()===w)); } if(ok) cont.removeAttribute('disabled'); else cont.setAttribute('disabled','true'); };
  ta.addEventListener('input',check); if(tb) tb.addEventListener('input',check); check();
  const actions = el('div',{class:'actions'}, cont);
  if(i>0) actions.append(el('button',{class:'link',text:'Back',onclick:()=>{state.answers[s.n]=ta.value.trim(); i===0?arrive():step(i-1);}}));
  wrap.append(actions);

  // helper box on the right
  const side = el('div');
  const btn = el('button',{class:'help-btn',text:s.helpLabel||'Ask for help'});
  const openHelper=()=>{
    state.help[s.n]=true;
    const h = el('div',{class:'helper'});
    h.append(el('p',{class:'who',text:s.helper.who}));
    h.append(el('p',{class:'says',text:s.helper.says}));
    if(D.two){
      h.append(el('p',{class:'who',text:D.two.a}));
      (s.helper.optionsA||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus();}})); });
      h.append(el('p',{class:'who',style:'margin-top:18px',text:D.two.b}));
      (s.helper.optionsB||[]).forEach((o,k)=>{ h.append(el('button',{class:'opt',text:o,onclick:()=>{tb.value=o; state.stepMode[s.n+'b']= s.fillIn ? 'free' : k; check(); tb.focus();}})); });
    } else {
    s.helper.options.forEach((o,k)=>{
      h.append(el('button',{class:'opt',text:o,onclick:()=>{ta.value=o; state.stepMode[s.n]= s.fillIn ? 'free' : k; check(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}}));
    });
    }
    h.append(el('p',{class:'hint',text:'Choose one to continue, or use it as a start and write your own.'}));
    side.replaceChildren(h);
  };
  btn.addEventListener('click',openHelper);
  side.append(btn);
  if(state.help[s.n]) openHelper();
  ta.addEventListener('input',()=>{ const o=(s.helper.options||s.helper.optionsA||[]); if(typeof state.stepMode[s.n]==='number' && ta.value.trim()!==o[state.stepMode[s.n]]) state.stepMode[s.n]='free'; });
  show(wrap, side);
  ta.focus({preventScroll:true});
}

function timePasses(i){
  const s = D.steps[i];
  const wrap = el('div');
  wrap.append(el('p',{class:'stepname',text:s.name}));
  const m = el('div',{class:'montage'});
  s.montage.forEach(t=>m.append(el('p',{text:t})));
  wrap.append(m);
  wrap.append(el('p',{class:'question',text:s.question}));
  const ch = el('div',{class:'choices'});
  const replyBox = el('div');
  const cont = el('button',{class:'btn',text:'Continue',disabled:'true',onclick:()=>step(i+1)});
  s.choices.forEach((c,k)=>{
    const b = el('button',{class:'choice',text:c.label,onclick:()=>{
      state.day=k;
      [...ch.children].forEach((x,j)=>{x.classList.toggle('picked',j===k); x.setAttribute('disabled','true');});
      replyBox.replaceChildren(el('div',{class:'reply'}, el('p',{text:c.reply})));
      cont.removeAttribute('disabled');
    }});
    if(state.day===k) b.classList.add('picked');
    ch.append(b);
  });
  wrap.append(ch, replyBox);
  if(state.day!=null){ replyBox.append(el('div',{class:'reply'}, el('p',{text:s.choices[state.day].reply}))); cont.removeAttribute('disabled'); [...ch.children].forEach(x=>x.setAttribute('disabled','true')); }
  wrap.append(el('div',{class:'actions'}, cont, el('button',{class:'link',text:'Back',onclick:()=>step(i-1)})));
  show(wrap);
}

function you(t){ return el('span',{class:'you',text:t}); }
function render(tpl, vars){
  const p=el('p');
  tpl.split(/(\{[a-z0-9]+\})/).forEach(part=>{
    const m=part.match(/^\{([a-z0-9]+)\}$/);
    if(!m){ if(part) p.append(document.createTextNode(part)); return; }
    const v=vars[m[1]]; if(v==null) return;
    if(v.red) p.append(you(v.text)); else p.append(document.createTextNode(v.text));
  });
  return p;
}
function story(){
  progress.textContent = 'Your journey';
  const A = state.answers, S = D.story;
  const mode = D.two ? state.stepMode['4b'] : state.stepMode[4];
  const overlap = (typeof mode==='number') ? S.stepOverlap[mode] : S.stepOverlapFree;
  const c = D.steps[5].choices[state.day];

  const help = n===0 ? S.help.zero : S.help.some.replace('{n}', words[n]||(n+' times'));
  const vars = {
    '1':{text:A[1],red:true},'2':{text:A[2],red:true},'3':{text:A[3],red:true},'4':{text:A[4],red:true},'5':{text:A[5],red:true},
    overlap:{text:overlap}, choice:{text:c.short,red:true}, reply:{text:c.reply}, help:{text:help}, ice:{text:state.ice,red:true},
    '1b':{text:A['1b'],red:true},'2b':{text:A['2b'],red:true},'3b':{text:A['3b'],red:true},'4b':{text:A['4b'],red:true},'5b':{text:A['5b'],red:true}

</script>
